<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>0h h1</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #d8edd8;
    --surface: #e8f5e8;
    --surface2: #f2faf2;
    --shadow-light: #ffffff;
    --shadow-dark: #b8d4b8;
    --accent: #6b9e6b;
    --accent2: #4a7c4a;
    --text: #3a5c3a;
    --text2: #6b8f6b;
    --red: #d32f2f;
    --red-light: #ffebee;
    --blue: #1565c0;
    --blue-light: #e3f2fd;
    --cell-empty: #e8f2e8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden; touch-action: none; user-select: none;
  }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    height: 100dvh; overflow: hidden; position: relative;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.3) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.2) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  /* HEADER */
  .header {
    flex-shrink: 0;
    position: relative; z-index: 10;
    width: 100%; max-width: 440px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 8px;
    height: 76px;
  }

  .nav-btn {
    width: 48px; height: 48px; border-radius: 16px; border: none;
    background: var(--surface);
    box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
    color: var(--text2); flex-direction: column; gap: 1px; line-height: 1;
    flex-shrink: 0;
  }
  .nav-btn:active {
    box-shadow: 2px 2px 4px var(--shadow-dark), -1px -1px 3px var(--shadow-light);
    transform: scale(0.96);
  }
  .nav-btn .arrow { font-size: 18px; line-height: 1; }
  .nav-btn .size-label { font-size: 11px; font-weight: 500; color: var(--text2); }
  .nav-btn.disabled { opacity: 0.35; pointer-events: none; }

  .title-wrap { text-align: center; }
  .title-wrap h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px; color: var(--text); letter-spacing: -0.5px; line-height: 1;
  }
  .title-wrap .subtitle { font-size: 12px; color: var(--text2); margin-top: 3px; }

  /* BOARD */
  .board-section {
    flex: 1; min-height: 0;
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 4px 16px;
  }

  .board-outer {
    background: var(--surface); border-radius: 28px; padding: 14px;
    box-shadow:
      8px 8px 20px var(--shadow-dark),
      -8px -8px 20px var(--shadow-light),
      inset 1px 1px 2px rgba(255,255,255,0.8);
    position: relative;
  }

  #board { display: grid; }

  .cell {
    border-radius: 12px;
    background: var(--cell-empty);
    box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
    position: relative;
  }
  .cell:active { transform: scale(0.91); }

  /* 힌트 셀: 고정, 클릭 불가 */
  .cell.hint {
    cursor: default;
    opacity: 1;
  }
  .cell.hint::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 7px;
    background: rgba(255,255,255,0.25);
    pointer-events: none;
  }
  .cell.hint:active { transform: none; }

  .cell[data-state="1"] {
    background: var(--red);
    box-shadow: 3px 3px 8px rgba(211,47,47,0.4), -2px -2px 6px rgba(255,255,255,0.3);
  }
  .cell[data-state="2"] {
    background: var(--blue);
    box-shadow: 3px 3px 8px rgba(21,101,192,0.4), -2px -2px 6px rgba(255,255,255,0.3);
  }

  /* CONTROLS */
  .controls {
    flex-shrink: 0;
    position: relative; z-index: 10;
    width: 100%; max-width: 440px;
    padding: 10px 16px 20px;
    display: flex; flex-direction: column; gap: 10px;
    height: 100px;
  }

  .status-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; font-size: 13px; color: var(--text2);
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #a0b8a0; transition: background 0.3s;
  }
  .status-dot.ok  { background: var(--accent); }
  .status-dot.err { background: var(--red); }
  .status-dot.warn { background: #e8a020; }

  .btn-row { display: flex; gap: 10px; }

  .btn {
    flex: 1; height: 50px; border-radius: 16px; border: none;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500; transition: all 0.15s;
  }
  .btn:active { transform: scale(0.96); }

  .btn-reset {
    background: var(--surface); color: var(--text2);
    box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
  }
  .btn-confirm {
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    box-shadow: 4px 4px 12px rgba(74,124,74,0.5), -2px -2px 8px rgba(255,255,255,0.6);
  }

  /* TOAST */
  .toast {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    background: var(--surface); border-radius: 24px;
    padding: 28px 36px; text-align: center;
    box-shadow: 12px 12px 30px var(--shadow-dark), -12px -12px 30px var(--shadow-light);
    z-index: 100; opacity: 0; pointer-events: none;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  .toast .toast-icon { font-size: 48px; margin-bottom: 10px; }
  .toast h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px; color: var(--text); margin-bottom: 6px;
  }
  .toast p { font-size: 14px; color: var(--text2); margin-bottom: 18px; }
  .toast .toast-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 14px; padding: 12px 32px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
    cursor: pointer;
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(180,210,180,0.4); backdrop-filter: blur(4px);
    z-index: 99; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<div class="header">
  <button class="nav-btn" id="btn-prev" onclick="changeSize(-1)">
    <span class="arrow">‹</span>
    <span class="size-label" id="prev-label"></span>
  </button>
  <div class="title-wrap">
    <h1>0h h1</h1>
    <div class="subtitle" id="size-subtitle">4 × 4</div>
  </div>
  <button class="nav-btn" id="btn-next" onclick="changeSize(1)">
    <span class="arrow">›</span>
    <span class="size-label" id="next-label"></span>
  </button>
</div>

<div class="board-section">
  <div class="board-outer" id="board-outer">
    <div id="board"></div>
  </div>
</div>

<div class="controls">
  <div class="status-bar">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">빈칸을 터치해 채워보세요</span>
  </div>
  <div class="btn-row">
    <button class="btn btn-reset" onclick="playClick(); resetBoard()">초기화</button>
    <button class="btn btn-confirm" onclick="playClick(); checkWin()">확인</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeToast()"></div>
<div class="toast" id="toast">
  <div class="toast-icon">🎉</div>
  <h2>완성!</h2>
  <p>모든 조건을 충족했어요</p>
  <button class="toast-btn" onclick="playClick(); closeToast(); newBoard()">새 판 하기</button>
</div>

<script>
const sfxClick = new Audio('effect 19.mp3');
const sfxClear = new Audio('effect 1.mp3');
function playClick() { sfxClick.currentTime = 0; sfxClick.play().catch(()=>{}); }
function playClear() { sfxClear.currentTime = 0; sfxClear.play().catch(()=>{}); }

const SIZES = [4, 6, 8, 10];
let sizeIdx = 0;
let N = 4;
let board = [];    // 현재 보드 상태 (0=빈칸, 1=빨강, 2=파랑)
let hints = [];    // 힌트(고정) 셀 여부
const GAP = 6;
const PAD = 14;

// ─── Layout ───────────────────────────────────────────────
function computeCellSize() {
  const vh = window.innerHeight;
  const vw = Math.min(window.innerWidth, 440);
  const boardAreaH = vh - 76 - 100 - 12;
  const boardAreaW = vw - 32;
  const maxH = Math.floor((boardAreaH - PAD*2 - (N-1)*GAP) / N);
  const maxW = Math.floor((boardAreaW - PAD*2 - (N-1)*GAP) / N);
  return Math.max(24, Math.min(maxH, maxW));
}

function applyLayout() {
  const cs = computeCellSize();
  const boardPx = N * cs + (N-1) * GAP;
  const outerPx = boardPx + PAD * 2;
  const boardEl = document.getElementById('board');
  boardEl.style.gridTemplateColumns = `repeat(${N}, ${cs}px)`;
  boardEl.style.gap = GAP + 'px';
  const outer = document.getElementById('board-outer');
  outer.style.width = outerPx + 'px';
  outer.style.height = outerPx + 'px';
  document.querySelectorAll('.cell').forEach(c => {
    c.style.width = cs + 'px';
    c.style.height = cs + 'px';
  });
}

// ─── 퍼즐 생성 ────────────────────────────────────────────
// Step 1: 규칙을 만족하는 완성 보드 생성 (백트래킹)
function generateSolution(n) {
  const sol = Array.from({length: n}, () => Array(n).fill(0));

  function validSoFar(sol, r, c) {
    const row = sol[r].slice(0, c + 1);
    const reds  = row.filter(v => v === 1).length;
    const blues = row.filter(v => v === 2).length;
    if (reds  > n/2) return false;
    if (blues > n/2) return false;
    // 연속 3개 체크 (행)
    if (c >= 2 && row[c] !== 0 && row[c] === row[c-1] && row[c] === row[c-2]) return false;
    // 열 체크
    const colVals = [];
    for (let rr = 0; rr <= r; rr++) colVals.push(sol[rr][c]);
    const cr = colVals.filter(v => v === 1).length;
    const cb = colVals.filter(v => v === 2).length;
    if (cr > n/2) return false;
    if (cb > n/2) return false;
    if (r >= 2 && colVals[r] !== 0 && colVals[r] === colVals[r-1] && colVals[r] === colVals[r-2]) return false;
    return true;
  }

  function bt(pos) {
    if (pos === n * n) {
      // 중복 행/열 체크
      const rowStrs = sol.map(r => r.join(''));
      if (new Set(rowStrs).size !== n) return false;
      const colStrs = Array.from({length: n}, (_, c) => sol.map(r => r[c]).join(''));
      if (new Set(colStrs).size !== n) return false;
      return true;
    }
    const r = Math.floor(pos / n), c = pos % n;
    const vals = Math.random() < 0.5 ? [1, 2] : [2, 1]; // 랜덤 순서
    for (const v of vals) {
      sol[r][c] = v;
      if (validSoFar(sol, r, c) && bt(pos + 1)) return true;
      sol[r][c] = 0;
    }
    return false;
  }

  return bt(0) ? sol.map(r => [...r]) : null;
}

// Step 2: 완성 보드에서 일부 셀만 힌트로 남기기
// 힌트 비율: 약 30~40%
function generatePuzzle(n) {
  // 완성 보드 생성 (최대 30회 시도)
  let solution = null;
  for (let i = 0; i < 30; i++) {
    solution = generateSolution(n);
    if (solution) break;
  }
  if (!solution) return null;

  const hintRate = n <= 4 ? 0.40 : n <= 6 ? 0.35 : 0.30;
  const totalCells = n * n;
  const hintCount  = Math.round(totalCells * hintRate);

  // 셀 인덱스를 랜덤하게 섞어 힌트로 선택
  const indices = Array.from({length: totalCells}, (_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  const hintSet = new Set(indices.slice(0, hintCount));

  const puzzle = Array.from({length: n}, () => Array(n).fill(0));
  const hintMap = Array.from({length: n}, () => Array(n).fill(false));
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (hintSet.has(r * n + c)) {
        puzzle[r][c] = solution[r][c];
        hintMap[r][c] = true;
      }
    }
  }
  return { puzzle, hintMap };
}

// ─── Board Build ──────────────────────────────────────────
function newBoard() {
  closeToast();
  N = SIZES[sizeIdx];

  const result = generatePuzzle(N);
  if (!result) { newBoard(); return; } // 실패 시 재시도
  const { puzzle, hintMap } = result;

  board = puzzle.map(r => [...r]);
  hints = hintMap.map(r => [...r]);

  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.state = board[r][c];

      if (hints[r][c]) {
        cell.classList.add('hint');
        // 힌트 셀: 클릭 불가
      } else {
        cell.addEventListener('pointerdown', e => {
          e.preventDefault();
          playClick();
          board[r][c] = (board[r][c] + 1) % 3;
          cell.dataset.state = board[r][c];
          updateStatus();
        });
      }
      boardEl.appendChild(cell);
    }
  }

  applyLayout();
  updateStatus();
  updateNavButtons();
}

// ─── Reset: 힌트 유지, 나머지만 클리어 ───────────────────
function resetBoard() {
  closeToast();
  const cells = document.querySelectorAll('.cell');
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (!hints[r][c]) {
        board[r][c] = 0;
        cells[r * N + c].dataset.state = 0;
      }
    }
  }
  updateStatus();
}

// ─── 검증 로직 (checkWin과 동일 기준) ─────────────────────
function checkLine(line) {
  const reds  = line.filter(v => v === 1).length;
  const blues = line.filter(v => v === 2).length;
  if (reds !== N/2 || blues !== N/2) return false;
  for (let i = 0; i < line.length - 2; i++) {
    if (line[i] !== 0 && line[i] === line[i+1] && line[i] === line[i+2]) return false;
  }
  return true;
}

// 부분 완성 보드용: 채워진 셀 내에서의 위반만 체크
function checkPartialLine(line) {
  // 연속 3개 체크
  for (let i = 0; i < line.length - 2; i++) {
    if (line[i] !== 0 && line[i] === line[i+1] && line[i] === line[i+2]) return 'triple';
  }
  // 개수 초과 체크 (N/2 초과)
  const reds  = line.filter(v => v === 1).length;
  const blues = line.filter(v => v === 2).length;
  if (reds  > N/2) return 'count';
  if (blues > N/2) return 'count';
  return null;
}

// ─── 실시간 상태 업데이트 (checkWin과 동일 기준) ──────────
function updateStatus() {
  const flat = board.flat();
  const total  = N * N;
  const filled = flat.filter(v => v !== 0).length;
  const dot  = document.getElementById('status-dot');
  const txt  = document.getElementById('status-text');

  // 1. 연속 3개 / 개수 초과 위반 체크 (부분 완성 포함)
  let violation = null;
  for (let i = 0; i < N; i++) {
    const row = board[i];
    const col = board.map(r => r[i]);
    const rv = checkPartialLine(row);
    const cv = checkPartialLine(col);
    if (rv || cv) { violation = rv || cv; break; }
  }

  if (violation === 'triple') {
    dot.className = 'status-dot err';
    txt.textContent = '같은 색 3개가 연속되어 있어요';
    return;
  }
  if (violation === 'count') {
    dot.className = 'status-dot err';
    txt.textContent = '한 색이 너무 많아요';
    return;
  }

  if (filled < total) {
    dot.className = 'status-dot';
    txt.textContent = `${filled} / ${total} 칸 입력됨`;
    return;
  }

  // 모두 채워진 경우: 중복 행/열까지 체크
  const rowStrings = board.map(r => r.join(''));
  const colStrings = Array.from({length: N}, (_, c) => board.map(r => r[c]).join(''));
  const hasDupRow = new Set(rowStrings).size !== N;
  const hasDupCol = new Set(colStrings).size !== N;

  if (hasDupRow || hasDupCol) {
    dot.className = 'status-dot warn';
    txt.textContent = hasDupRow ? '같은 패턴의 행이 있어요' : '같은 패턴의 열이 있어요';
    return;
  }

  dot.className = 'status-dot ok';
  txt.textContent = '모든 칸이 채워졌어요!';
}

// ─── 최종 승리 판정 ───────────────────────────────────────
function checkWin() {
  if (board.flat().includes(0)) { shakeBoard(); return; }

  const rowStrings = [], colStrings = [];
  for (let i = 0; i < N; i++) {
    const row = board[i];
    const col = board.map(r => r[i]);
    if (!checkLine(row) || !checkLine(col)) { shakeBoard(); return; }
    rowStrings.push(row.join(''));
    colStrings.push(col.join(''));
  }
  if (new Set(rowStrings).size !== N || new Set(colStrings).size !== N) { shakeBoard(); return; }

  playClear();
  setTimeout(() => {
    document.getElementById('overlay').classList.add('show');
    document.getElementById('toast').classList.add('show');
  }, 300);
}

// ─── Shake ────────────────────────────────────────────────
function shakeBoard() {
  const outer = document.getElementById('board-outer');
  const frames = [0, -8, 8, -6, 6, -4, 4, 0];
  frames.forEach((x, i) => setTimeout(() => outer.style.transform = `translateX(${x}px)`, i * 55));
  setTimeout(() => outer.style.transform = '', frames.length * 55);
}

// ─── Nav ──────────────────────────────────────────────────
function changeSize(delta) {
  const newIdx = sizeIdx + delta;
  if (newIdx < 0 || newIdx >= SIZES.length) return;
  sizeIdx = newIdx; playClick(); newBoard();
}

function updateNavButtons() {
  const prev = document.getElementById('btn-prev');
  const next = document.getElementById('btn-next');
  document.getElementById('size-subtitle').textContent = `${N} × ${N}`;
  if (sizeIdx === 0) { prev.classList.add('disabled'); }
  else { prev.classList.remove('disabled'); document.getElementById('prev-label').textContent = `${SIZES[sizeIdx-1]}×${SIZES[sizeIdx-1]}`; }
  if (sizeIdx === SIZES.length-1) { next.classList.add('disabled'); }
  else { next.classList.remove('disabled'); document.getElementById('next-label').textContent = `${SIZES[sizeIdx+1]}×${SIZES[sizeIdx+1]}`; }
}

function closeToast() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('toast').classList.remove('show');
}

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
window.addEventListener('resize', applyLayout);

newBoard();
</script>
</body>
</html>
