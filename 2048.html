<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neumorphic 2048</title>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --text-color: #37474f;
            --shadow-dark: rgba(163, 177, 198, 0.7);
            --shadow-light: rgba(255, 255, 255, 0.9);
            
            --tile-2-bg: #e0e5ec; --tile-2-text: #78909c;
            --tile-4-bg: #dce1e9; --tile-4-text: #546e7a;
            --tile-8-bg: #ffb74d; --tile-8-text: white;
            --tile-16-bg: #ff9800; --tile-16-text: white;
            --tile-32-bg: #e57373; --tile-32-text: white;
            --tile-64-bg: #ef5350; --tile-64-text: white;
            --tile-128-bg: #fff176; --tile-128-text: #546e7a;
            --tile-256-bg: #ffee58; --tile-256-text: #546e7a;
            --tile-512-bg: #81d4fa; --tile-512-text: white;
            --tile-1024-bg: #29b6f6; --tile-1024-text: white;
            --tile-2048-bg: #66bb6a; --tile-2048-text: white;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        body { display: flex; flex-direction: column; align-items: center; }

        .header {
            height: 22%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            width: 100%;
        }

        h1 { margin: 0; font-size: 1.8rem; font-weight: 800; }

        .score-container {
            display: flex; gap: 20px; margin-top: 10px;
        }

        .score-box {
            padding: 8px 25px; border-radius: 12px;
            background: var(--bg-color); text-align: center;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            min-width: 85px;
        }

        .score-label { font-size: 0.65rem; color: #78909c; font-weight: 500; text-transform: uppercase; }
        .score-value { font-size: 1.1rem; font-weight: 700; margin-top: 1px; }

        .game-area {
            height: 53%; width: 100%;
            display: flex; justify-content: center; align-items: center;
        }

        #grid-container {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
            width: 85vw; max-width: 340px; aspect-ratio: 1 / 1;
            padding: 15px; background: var(--bg-color); border-radius: 20px;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            position: relative;
        }

        .grid-cell {
            background-color: var(--bg-color); border-radius: 10px;
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        .tile {
            position: absolute; display: flex;
            justify-content: center; align-items: center;
            font-size: 1.8rem; font-weight: 800; border-radius: 10px;
            transition: transform 0.12s ease-in-out, background-color 0.1s ease-in-out;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.1);
            width: calc((100% - 30px - 36px) / 4); 
            height: calc((100% - 30px - 36px) / 4);
        }

        .tile-2 { background-color: var(--tile-2-bg); color: var(--tile-2-text); font-size: 2rem;}
        .tile-4 { background-color: var(--tile-4-bg); color: var(--tile-4-text); font-size: 2rem;}
        .tile-8 { background-color: var(--tile-8-bg); color: var(--tile-8-text); }
        .tile-16 { background-color: var(--tile-16-bg); color: var(--tile-16-text); }
        .tile-32 { background-color: var(--tile-32-bg); color: var(--tile-32-text); }
        .tile-64 { background-color: var(--tile-64-bg); color: var(--tile-64-text); }
        .tile-128 { background-color: var(--tile-128-bg); color: var(--tile-128-text); font-size: 1.4rem; }
        .tile-256 { background-color: var(--tile-256-bg); color: var(--tile-256-text); font-size: 1.4rem; }
        .tile-512 { background-color: var(--tile-512-bg); color: var(--tile-512-text); font-size: 1.4rem; }
        .tile-1024 { background-color: var(--tile-1024-bg); color: var(--tile-1024-text); font-size: 1.1rem; }
        .tile-2048 { background-color: var(--tile-2048-bg); color: var(--tile-2048-text); font-size: 1.1rem; box-shadow: 0 0 15px rgba(102, 187, 106, 0.5); }

        @keyframes neumorphicPop {
            0% { opacity: 0; transform: scale(0.8) translate(var(--pos-x), var(--pos-y)); box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light); }
            50% { opacity: 1; transform: scale(1.1) translate(var(--pos-x), var(--pos-y)); box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); }
            100% { opacity: 1; transform: scale(1) translate(var(--pos-x), var(--pos-y)); box-shadow: 3px 3px 6px rgba(0,0,0,0.1); }
        }
        
        .tile-new { animation: neumorphicPop 0.3s ease-out; animation-fill-mode: both; }

        .footer {
            height: 25%; width: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding-bottom: 20px;
        }

        #status { margin-bottom: 10px; margin-top: 8px; font-size: 0.9rem; color: #78909c; height: 1.2rem; font-weight: 500; }

        .controls { display: flex; justify-content: center; gap: 10px; width: 85vw; max-width: 340px; margin-top: 6px; }

        .action-btn {
            flex: 1; padding: 16px 0; border: none; border-radius: 15px;
            font-size: 0.82rem; font-weight: 700;
            background: var(--bg-color); color: var(--text-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            cursor: pointer; transition: transform 0.1s;
        }

        #restart-btn { background: linear-gradient(145deg, #ff9800, #f57c00); color: white; box-shadow: 4px 4px 10px rgba(245, 124, 0, 0.3); }
        #save-game-btn { background: linear-gradient(145deg, #5c9bd6, #3a7fc1); color: white; box-shadow: 4px 4px 10px rgba(58, 127, 193, 0.3); }
        #load-game-btn { background: linear-gradient(145deg, #66bb6a, #43a047); color: white; box-shadow: 4px 4px 10px rgba(67, 160, 71, 0.3); }
        .action-btn:active { opacity: 0.85; transform: translateY(2px); }

        /* 이어하기 슬롯 팝업 */
        #slot-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(163, 177, 198, 0.55);
            backdrop-filter: blur(4px);
            z-index: 150;
            justify-content: center; align-items: flex-end;
            padding-bottom: 30px;
        }
        #slot-overlay.active { display: flex; }
        #slot-panel {
            background: var(--bg-color);
            border-radius: 24px 24px 24px 24px;
            padding: 20px 16px 16px;
            width: 85vw; max-width: 340px;
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            animation: modalPop 0.25s ease-out;
        }
        #slot-panel .slot-title {
            font-size: 0.8rem; font-weight: 700; color: #78909c;
            text-align: center; margin-bottom: 12px; letter-spacing: 0.05em; text-transform: uppercase;
        }
        .slot-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; border-radius: 12px; margin-bottom: 8px;
            background: var(--bg-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            cursor: pointer; transition: transform 0.1s;
        }
        .slot-item:active { transform: scale(0.98); }
        .slot-item .slot-time { font-size: 0.78rem; color: #78909c; }
        .slot-item .slot-best { font-size: 0.9rem; font-weight: 700; color: var(--text-color); }
        .slot-empty {
            padding: 12px 16px; border-radius: 12px; margin-bottom: 8px;
            background: var(--bg-color); color: #b0bec5;
            font-size: 0.82rem; text-align: center;
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }
        #slot-cancel-btn {
            width: 100%; padding: 13px 0; border: none; border-radius: 12px;
            font-size: 0.9rem; font-weight: 700; margin-top: 4px;
            background: var(--bg-color); color: #78909c;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            cursor: pointer;
        }
        #slot-cancel-btn:active { transform: scale(0.98); }

        /* 저장 완료 토스트 */
        #save-toast {
            position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #37474f; color: white; padding: 10px 24px;
            border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 200;
        }
        #save-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* 2048 달성 모달 */
        #modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(163, 177, 198, 0.55);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center; align-items: center;
        }
        #modal-overlay.active { display: flex; }

        #modal-box {
            background: var(--bg-color);
            border-radius: 24px;
            padding: 36px 40px;
            text-align: center;
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            animation: modalPop 0.3s ease-out;
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            60% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        #modal-box .modal-emoji { font-size: 2.8rem; margin-bottom: 10px; }
        #modal-box .modal-title { font-size: 1.4rem; font-weight: 800; color: var(--text-color); margin-bottom: 6px; }
        #modal-box .modal-sub { font-size: 0.85rem; color: #78909c; margin-bottom: 24px; }

        #modal-continue-btn {
            padding: 14px 48px; border: none; border-radius: 14px;
            font-size: 1rem; font-weight: 700;
            background: linear-gradient(145deg, #66bb6a, #43a047);
            color: white;
            box-shadow: 4px 4px 10px rgba(67, 160, 71, 0.35);
            cursor: pointer;
        }
        #modal-continue-btn:active { transform: translateY(2px); }
    </style>
</head>
<body>

    <audio id="merge-sound" src="effect 19.mp3" preload="auto"></audio>
    <audio id="achieve-sound" src="effect 1.mp3" preload="auto"></audio>

    <div class="header">
        <div class="title-wrapper"><h1>2048</h1></div>
        <div class="score-container">
            <div class="score-box"><div class="score-label">Score</div><div id="score" class="score-value">0</div></div>
            <div class="score-box"><div class="score-label">Best</div><div id="best-score" class="score-value">0</div></div>
        </div>
    </div>
    
    <div class="game-area">
        <div id="grid-container">
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
    </div>

    <div class="footer">
        <div id="status">2048 달성횟수 : 0</div>
        <div class="controls">
            <button id="restart-btn" class="action-btn" onclick="startGame()">새 게임</button>
            <button id="save-game-btn" class="action-btn" onclick="saveGame()">저장하기</button>
            <button id="load-game-btn" class="action-btn" onclick="openSlotPanelWithHistory()">이어하기</button>
        </div>
    </div>

    <div id="save-toast">저장되었습니다 ✓</div>

    <!-- 이어하기 슬롯 팝업 -->
    <div id="slot-overlay">
        <div id="slot-panel">
            <div class="slot-title">이어하기 — 저장 슬롯</div>
            <div id="slot-list"></div>
            <button id="slot-cancel-btn" onclick="closeSlotPanel()">취소</button>
        </div>
    </div>

    <!-- 2048 달성 모달 -->
    <div id="modal-overlay">
        <div id="modal-box">
            <div class="modal-emoji">🎉</div>
            <div class="modal-title">2048을 달성하셨습니다!</div>
            <div class="modal-sub">계속해서 더 높은 숫자에 도전해보세요.</div>
            <button id="modal-continue-btn" onclick="closeModal()">계속</button>
        </div>
    </div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        const scoreElement = document.getElementById('score');
        const bestScoreElement = document.getElementById('best-score');
        const statusElement = document.getElementById('status');
        const modalOverlay = document.getElementById('modal-overlay');

        let board = [];
        let score = 0;
        let bestScore = localStorage.getItem('bestScore2048') || 0;
        let isGameOver = false;
        let achieved2048 = false; // 현재 게임에서 이미 모달을 띄웠는지 여부

        let achieveCount = parseInt(localStorage.getItem('achieveCount2048') || '0');

        bestScoreElement.innerText = bestScore;
        updateAchieveStatus();

        function updateAchieveStatus() {
            statusElement.innerText = `2048 달성횟수 : ${achieveCount}`;
            statusElement.style.color = "#78909c";
        }

        function openModal() {
            modalOverlay.classList.add('active');
            const sound = document.getElementById('achieve-sound');
            sound.currentTime = 0;
            sound.play().catch(() => {});
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // ── 저장 슬롯 시스템 (최대 5개, FIFO) ──
        const SLOT_KEY = 'saveSlots2048';
        const MAX_SLOTS = 5;

        function getSaveSlots() {
            try { return JSON.parse(localStorage.getItem(SLOT_KEY)) || []; }
            catch(e) { return []; }
        }

        function saveGame() {
            if (isGameOver) {
                showToast('게임 오버 상태는 저장할 수 없어요');
                return;
            }
            const now = new Date();
            const pad = n => String(n).padStart(2,'0');
            const timeStr = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
            const entry = {
                time: timeStr,
                savedScore: score,
                board: board,
                score: score,
                achieved2048: achieved2048
            };
            let slots = getSaveSlots();
            slots.push(entry);
            if (slots.length > MAX_SLOTS) slots = slots.slice(slots.length - MAX_SLOTS);
            localStorage.setItem(SLOT_KEY, JSON.stringify(slots));
            showToast('저장되었습니다 ✓');
        }

        function openSlotPanel() {
            const slots = getSaveSlots();
            const list = document.getElementById('slot-list');
            list.innerHTML = '';
            if (slots.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'slot-empty';
                empty.innerText = '없음';
                list.appendChild(empty);
            } else {
                [...slots].reverse().forEach((slot, i) => {
                    const realIndex = slots.length - 1 - i;
                    const item = document.createElement('div');
                    item.className = 'slot-item';
                    item.innerHTML = `<span class="slot-time">${slot.time}</span><span class="slot-best">점수 ${slot.savedScore ?? slot.score ?? 0}</span>`;
                    item.onclick = () => loadSlot(realIndex);
                    list.appendChild(item);
                });
            }
            document.getElementById('slot-overlay').classList.add('active');
        }

        function closeSlotPanel() {
            document.getElementById('slot-overlay').classList.remove('active');
        }

        function loadSlot(index) {
            const slots = getSaveSlots();
            const data = slots[index];
            if (!data || !data.board) return;
            board = data.board;
            achieved2048 = data.achieved2048 || false;
            isGameOver = false;
            closeModal();
            closeSlotPanel();
            updateScore(data.score || 0);
            updateAchieveStatus();
            gridContainer.querySelectorAll('.tile').forEach(tile => tile.remove());
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (board[r][c] !== 0) drawTile(r, c, board[r][c]);
                }
            }
            showToast('이어하기 ✓');
        }

        document.getElementById('slot-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeSlotPanel();
        });

        // 뒤로가기 버튼으로 슬롯 팝업만 닫기
        function openSlotPanelWithHistory() {
            history.pushState({ slotOpen: true }, '');
            openSlotPanel();
        }
        window.addEventListener('popstate', function(e) {
            const overlay = document.getElementById('slot-overlay');
            if (overlay.classList.contains('active')) {
                closeSlotPanel();
            }
        });

        function showToast(msg) {
            const toast = document.getElementById('save-toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 1800);
        }

        function startGame() {
            gridContainer.querySelectorAll('.tile').forEach(tile => tile.remove());
            board = Array(4).fill().map(() => Array(4).fill(0));
            score = 0; updateScore(0);
            isGameOver = false;
            achieved2048 = false;
            closeModal();
            updateAchieveStatus();
            addRandomTile(); addRandomTile();
        }

        function addRandomTile() {
            let cells = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (board[r][c] === 0) cells.push({r, c});
                }
            }
            if (cells.length > 0) {
                let {r, c} = cells[Math.floor(Math.random() * cells.length)];
                board[r][c] = Math.random() < 0.9 ? 2 : 4;
                setTimeout(() => drawTile(r, c, board[r][c], true), 100);
            }
        }

        function drawTile(r, c, value, isNew = false) {
            const tile = document.createElement('div');
            tile.className = `tile tile-${value}`;
            tile.innerText = value;
            const gap = 12, padding = 15;
            const x = `calc(${padding}px + ${c * 100}% + ${c * gap}px)`;
            const y = `calc(${padding}px + ${r * 100}% + ${r * gap}px)`;
            tile.style.transform = `translate(${x}, ${y})`;
            if (isNew) {
                tile.style.setProperty('--pos-x', x);
                tile.style.setProperty('--pos-y', y);
                tile.classList.add('tile-new');
            }
            gridContainer.appendChild(tile);
        }

        function updateScore(newScore) {
            score = newScore;
            scoreElement.innerText = score;
            if (score > bestScore) {
                bestScore = score;
                bestScoreElement.innerText = bestScore;
                localStorage.setItem('bestScore2048', bestScore);
            }
        }

        function slide(row) {
            let filteredRow = row.filter(num => num !== 0);
            
            for (let i = 0; i < filteredRow.length - 1; i++) {
                if (filteredRow[i] === filteredRow[i + 1]) {
                    filteredRow[i] *= 2;
                    updateScore(score + filteredRow[i]);

                    // 2048 달성 체크 (이번 게임에서 처음일 때만)
                    if (filteredRow[i] === 2048 && !achieved2048) {
                        achieved2048 = true;
                        achieveCount++;
                        localStorage.setItem('achieveCount2048', achieveCount);
                        updateAchieveStatus();
                        setTimeout(openModal, 300);
                    }

                    filteredRow[i + 1] = 0;
                }
            }

            let result = filteredRow.filter(num => num !== 0);
            while (result.length < 4) result.push(0);
            return result;
        }

        function handleMove(direction) {
            if (isGameOver) return;
            let oldBoard = JSON.stringify(board);

            if (direction === 'left' || direction === 'right') {
                for (let r = 0; r < 4; r++) {
                    let row = [...board[r]];
                    if (direction === 'right') row.reverse();
                    let newRow = slide(row);
                    if (direction === 'right') newRow.reverse();
                    board[r] = newRow;
                }
            } else {
                for (let c = 0; c < 4; c++) {
                    let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
                    if (direction === 'down') col.reverse();
                    let newCol = slide(col);
                    if (direction === 'down') newCol.reverse();
                    for (let r = 0; r < 4; r++) board[r][c] = newCol[r];
                }
            }

            if (oldBoard !== JSON.stringify(board)) {
                const sound = document.getElementById('merge-sound');
                sound.currentTime = 0;
                sound.play();
                
                gridContainer.querySelectorAll('.tile').forEach(tile => tile.remove());
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (board[r][c] !== 0) drawTile(r, c, board[r][c]);
                    }
                }
                addRandomTile();
                setTimeout(checkGameOver, 300);
            }
        }

        function checkGameOver() {
            if (board.flat().includes(0)) return;
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (c < 3 && board[r][c] === board[r][c+1]) return;
                    if (r < 3 && board[r][c] === board[r+1][c]) return;
                }
            }
            isGameOver = true;
            statusElement.innerText = "게임 오버! 다시 시작해보세요.";
            statusElement.style.color = "#d32f2f";
        }

        let touchStartX, touchStartY;
        window.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        window.addEventListener('touchmove', e => {
            if (touchStartX && touchStartY) e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', e => {
            if (!touchStartX || !touchStartY) return;
            let dx = e.changedTouches[0].clientX - touchStartX;
            let dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > 25 || Math.abs(dy) > 25) {
                if (Math.abs(dx) > Math.abs(dy)) handleMove(dx > 0 ? 'right' : 'left');
                else handleMove(dy > 0 ? 'down' : 'up');
            }
            touchStartX = null; touchStartY = null;
        });

        startGame();

        document.addEventListener('touchstart', function unlock() {
            const sound = document.getElementById('merge-sound');
            sound.play().then(() => {
                sound.pause();
                sound.currentTime = 0;
            }).catch(() => {});
        }, { once: true });
        
    </script>
