<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Akari - Healing Games</title>
    <style>
        :root {
            --bg-color: #f0ede5;
            --text-color: #5d5a52;
            --shadow-dark: rgba(188, 185, 178, 0.8);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --accent-color: #8e9775;
            --bulb-glow: #fff59d;
            --wall-color: #4a473e;
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', sans-serif;
            overflow: hidden; 
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            display: flex; flex-direction: column; align-items: center; justify-content: start;
            padding-top: 5vh;
        }

        .header {
            display: flex; flex-direction: column; align-items: center;
            gap: 8px; margin-bottom: 25px;
        }

        .title-row { display: flex; align-items: center; gap: 15px; }

        .size-btn {
            width: 50px; height: 50px; border: none; border-radius: 12px;
            background: var(--bg-color); color: var(--text-color); font-weight: 800;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            cursor: pointer;
        }

        .size-btn:active {
            box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
        }

        h1 { margin: 0; font-size: 1.5rem; font-weight: 800; }
        #status { font-size: 0.9rem; color: var(--text-color); font-weight: 600; height: 1.2rem; }

        .grid-container {
            width: 88vw; height: 88vw;
            max-width: 380px; max-height: 380px;
            background: var(--bg-color);
            border-radius: 25px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
            padding: 10px; box-sizing: border-box;
            display: grid; gap: 4px;
        }

        .cell {
            aspect-ratio: 1 / 1; border-radius: 8px;
            background: var(--bg-color);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            display: flex; justify-content: center; align-items: center;
            font-weight: 800; font-size: 1.1rem;
            transition: background-color 0.15s;
            cursor: pointer; position: relative;
        }

        .cell.lit { 
            background-color: var(--bulb-glow) !important;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.05);
        }

        .cell.wall {
            background-color: var(--wall-color); color: white;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 2;
        }

        .cell.bulb { color: #fbc02d; font-size: 1.4rem; z-index: 3; }

        .footer {
            margin-top: 40px; display: flex; flex-direction: column; gap: 15px;
        }

        .btn {
            padding: 15px 40px; border: none; border-radius: 20px;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            font-weight: 700; color: var(--text-color); font-size: 1rem;
            cursor: pointer;
        }

        .btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
    </style>
</head>
<body onclick="unlockAudio()">

    <audio id="click-sound" src="effect 19.mp3" preload="auto"></audio>
    <audio id="clear-sound" src="effect 1.mp3" preload="auto"></audio>

    <div class="header">
        <div class="title-row">
            <button class="size-btn" onclick="changeLevel(6)">6x6</button>
            <h1>Akari</h1>
            <button class="size-btn" onclick="changeLevel(8)">8x8</button>
        </div>
        <div id="status">5X5 모드 시작!</div>
    </div>

    <div id="grid" class="grid-container"></div>

    <div class="footer">
        <button class="btn" onclick="regenerate()">새 판 깔기</button>
    </div>

    <script>
        let currentSize = 5;
        let boardState = []; 
        let isLit = [];      
        let audioUnlocked = false;
        let isGameOver = false; // 게임 종료 상태 추가

        function unlockAudio() {
            if (audioUnlocked) return;
            const clickSound = document.getElementById('click-sound');
            const clearSound = document.getElementById('clear-sound');
            
            // 두 소리 모두 해금
            Promise.all([clickSound.play(), clearSound.play()]).then(() => {
                audioUnlocked = true;
                clickSound.pause(); clickSound.currentTime = 0;
                clearSound.pause(); clearSound.currentTime = 0;
            }).catch(e => {});
        }

        function playClickSound() {
            if (!audioUnlocked) return;
            const sound = document.getElementById('click-sound');
            sound.currentTime = 0;
            sound.play();
        }

        function playClearSound() {
            if (!audioUnlocked) return;
            const sound = document.getElementById('clear-sound');
            sound.currentTime = 0;
            sound.play();
        }

        function changeLevel(size) {
            playClickSound();
            currentSize = size;
            document.getElementById('status').innerText = `${size}x${size} 모드 시작!`;
            regenerate(false);
        }

        function regenerate(shouldPlaySound = true) {
            if (shouldPlaySound) playClickSound();
            isGameOver = false;
            document.getElementById('status').innerText = `${currentSize}x${currentSize} 진행 중...`;
            document.getElementById('status').style.color = "var(--text-color)";
            createSolvableBoard();
            render();
        }

        function createSolvableBoard() {
            boardState = Array.from({length: currentSize * currentSize}, () => 0);
            let tempSolution = Array.from({length: currentSize * currentSize}, () => 0);
            let remaining = tempSolution.map((_, i) => i);

            while(remaining.length > 0) {
                let rIdx = remaining[Math.floor(Math.random() * remaining.length)];
                tempSolution[rIdx] = 5;
                let r = Math.floor(rIdx / currentSize); let c = rIdx % currentSize;
                const ds = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                remaining = remaining.filter(i => i !== rIdx);
                for (let [dr, dc] of ds) {
                    let nr = r + dr; let nc = c + dc;
                    while (nr >= 0 && nr < currentSize && nc >= 0 && nc < currentSize) {
                        remaining = remaining.filter(i => i !== (nr * currentSize + nc));
                        nr += dr; nc += dc;
                    }
                }
            }

            for(let i = 0; i < boardState.length; i++) {
                if (tempSolution[i] === 0 && Math.random() < 0.28) {
                    let r = Math.floor(i / currentSize); let c = i % currentSize;
                    let count = 0;
                    const ds = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (let [dr, dc] of ds) {
                        let nr = r + dr; let nc = c + dc;
                        if (nr >= 0 && nr < currentSize && nc >= 0 && nc < currentSize && tempSolution[nr * currentSize + nc] === 5) count++;
                    }
                    boardState[i] = -(count + 1);
                } else {
                    boardState[i] = 0;
                }
            }
        }

        function updateLighting() {
            isLit = Array.from({length: boardState.length}, () => false);
            boardState.forEach((val, idx) => {
                if (val === 5) {
                    isLit[idx] = true;
                    let r = Math.floor(idx / currentSize); let c = idx % currentSize;
                    const ds = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (let [dr, dc] of ds) {
                        let nr = r + dr; let nc = c + dc;
                        while (nr >= 0 && nr < currentSize && nc >= 0 && nc < currentSize && boardState[nr * currentSize + nc] >= 0) {
                            isLit[nr * currentSize + nc] = true;
                            nr += dr; nc += dc;
                        }
                    }
                }
            });
        }

        function render() {
            updateLighting();
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
            
            boardState.forEach((val, idx) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (val < 0) {
                    cell.classList.add('wall');
                    let n = -(val + 1);
                    cell.innerText = n >= 0 ? n : '';
                } else {
                    if (isLit[idx]) cell.classList.add('lit');
                    if (val === 5) {
                        cell.innerText = '💡';
                        cell.classList.add('bulb');
                    }
                    cell.onclick = () => handleSelect(idx);
                }
                grid.appendChild(cell);
            });
            if (!isGameOver) checkWin();
        }

        function handleSelect(idx) {
            if (isGameOver) return;
            playClickSound();
            boardState[idx] = (boardState[idx] === 5) ? 0 : 5;
            render();
        }

        function checkWin() {
            const allLit = boardState.every((val, idx) => val < 0 || isLit[idx]);
            if (!allLit) return;

            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] === 5) {
                    let r = Math.floor(i / currentSize); let c = i % currentSize;
                    const ds = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (let [dr, dc] of ds) {
                        let nr = r + dr; let nc = c + dc;
                        while (nr >= 0 && nr < currentSize && nc >= 0 && nc < currentSize) {
                            if (boardState[nr * currentSize + nc] < 0) break;
                            if (boardState[nr * currentSize + nc] === 5) return;
                            nr += dr; nc += dc;
                        }
                    }
                }
            }

            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] < -1) {
                    let targetCount = -(boardState[i] + 1);
                    let currentCount = 0;
                    let r = Math.floor(i / currentSize); let c = i % currentSize;
                    const ds = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (let [dr, dc] of ds) {
                        let nr = r + dr; let nc = c + dc;
                        if (nr >= 0 && nr < currentSize && nc >= 0 && nc < currentSize && boardState[nr * currentSize + nc] === 5) {
                            currentCount++;
                        }
                    }
                    if (targetCount !== currentCount) return;
                }
            }

            // 승리 시 처리
            isGameOver = true;
            playClearSound(); // effect 1.mp3 재생
            document.getElementById('status').innerText = "🎉 미션 클리어!";
            document.getElementById('status').style.color = "var(--accent-color)";
        }

        window.onload = () => {
            document.getElementById('grid').innerHTML = 
                `<div style="grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-color); font-weight: 600;">
                    '새 판 깔기'를 누르고 시작하세요.
                </div>`;
        }
    </script>
</body>
</html>
