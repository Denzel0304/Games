<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Akari</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #d8edd8;
    --surface: #e8f5e8;
    --surface2: #f2faf2;
    --shadow-light: #ffffff;
    --shadow-dark: #b8d4b8;
    --accent: #6b9e6b;
    --accent2: #4a7c4a;
    --text: #3a5c3a;
    --text2: #6b8f6b;
    --danger: #c86060;
    --wall-bg: #4a5c4a;
    --wall-text: #e8f5e8;
    --bulb-color: #f5c518;
    --lit-color: #fffde7;
    --lit-border: #fff59d;
    --conflict-color: #fde8e8;
    --cell-size: 52px;
    --gap: 3px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.3) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.2) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  /* HEADER */
  .header {
    position: relative; z-index: 10;
    width: 100%; max-width: 420px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 16px 10px;
  }

  .nav-btn {
    width: 48px; height: 48px;
    border-radius: 16px; border: none;
    background: var(--surface);
    box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
    color: var(--text2); flex-direction: column; gap: 1px; line-height: 1;
  }
  .nav-btn:active {
    box-shadow: 2px 2px 4px var(--shadow-dark), -1px -1px 3px var(--shadow-light);
    transform: scale(0.96);
  }
  .nav-btn .arrow { font-size: 18px; line-height: 1; }
  .nav-btn .size-label { font-size: 11px; font-weight: 500; color: var(--text2); }
  .nav-btn.disabled { opacity: 0.35; pointer-events: none; }

  .title-wrap { text-align: center; }
  .title-wrap h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px; color: var(--text);
    letter-spacing: -0.5px; line-height: 1;
  }
  .title-wrap .subtitle {
    font-size: 12px; color: var(--text2);
    margin-top: 3px; letter-spacing: 0.5px;
  }

  /* BOARD */
  .board-section {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    flex: 1; width: 100%; padding: 8px 16px;
  }

  .board-outer {
    background: var(--surface);
    border-radius: 28px; padding: 16px;
    box-shadow:
      8px 8px 20px var(--shadow-dark),
      -8px -8px 20px var(--shadow-light),
      inset 1px 1px 2px rgba(255,255,255,0.8);
  }

  #board {
    display: grid;
    gap: var(--gap);
  }

  .cell {
    width: var(--cell-size); height: var(--cell-size);
    border-radius: 12px;
    background: var(--surface2);
    box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    transition: background 0.15s, transform 0.1s;
    font-size: calc(var(--cell-size) * 0.42);
    font-weight: 700; line-height: 1;
    flex-shrink: 0;
  }
  .cell:active { transform: scale(0.92); }

  /* Lit cell */
  .cell.lit {
    background: var(--lit-color);
    box-shadow: inset 2px 2px 5px rgba(220,200,100,0.3), inset -1px -1px 3px rgba(255,255,255,0.8);
  }

  /* Bulb */
  .cell.bulb {
    background: linear-gradient(135deg, #fffde7, #fff9c4);
  }
  .cell .bulb-icon {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: calc(var(--cell-size) * 0.52);
    line-height: 1;
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
  }
  .cell.bulb .bulb-icon { transform: translate(-50%, -50%) scale(1); }

  /* Conflict bulb (two bulbs see each other) */
  .cell.conflict {
    background: var(--conflict-color) !important;
  }

  /* Wall */
  .cell.wall {
    background: var(--wall-bg);
    box-shadow: inset 3px 3px 8px rgba(0,0,0,0.4), inset -1px -1px 3px rgba(255,255,255,0.05);
    color: var(--wall-text);
    cursor: default;
    border-radius: 12px;
    font-size: calc(var(--cell-size) * 0.4);
    font-weight: 800;
  }
  .cell.wall:active { transform: none; }
  /* Wall with satisfied clue */
  .cell.wall.satisfied { color: #a8d4a8; }
  /* Wall with violated clue */
  .cell.wall.violated { color: #f08080; }

  /* CONTROLS */
  .controls {
    position: relative; z-index: 10;
    width: 100%; max-width: 420px;
    padding: 10px 16px 20px;
    display: flex; flex-direction: column; gap: 12px;
  }

  .status-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; font-size: 13px; color: var(--text2);
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #a0b8a0; transition: background 0.3s;
  }
  .status-dot.ok { background: var(--accent); }
  .status-text { font-weight: 500; }

  .btn-row { display: flex; gap: 10px; }

  .btn {
    flex: 1; height: 52px; border-radius: 16px; border: none;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    transition: all 0.15s; letter-spacing: 0.3px;
  }
  .btn:active { transform: scale(0.96); }

  .btn-reset {
    background: var(--surface); color: var(--text2);
    box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
  }
  .btn-reset:active {
    box-shadow: 2px 2px 5px var(--shadow-dark), -1px -1px 3px var(--shadow-light);
  }

  .btn-new {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 4px 4px 12px rgba(74,124,74,0.5), -2px -2px 8px rgba(255,255,255,0.6);
  }
  .btn-new:active { box-shadow: 2px 2px 6px rgba(74,124,74,0.4); }

  /* TOAST */
  .toast {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    background: var(--surface); border-radius: 24px;
    padding: 28px 36px; text-align: center;
    box-shadow: 12px 12px 30px var(--shadow-dark), -12px -12px 30px var(--shadow-light);
    z-index: 100; opacity: 0; pointer-events: none;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  .toast .toast-icon { font-size: 48px; margin-bottom: 10px; }
  .toast h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px; color: var(--text); margin-bottom: 6px;
  }
  .toast p { font-size: 14px; color: var(--text2); margin-bottom: 18px; }
  .toast .toast-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 14px;
    padding: 12px 32px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
    cursor: pointer; box-shadow: 3px 3px 10px rgba(74,124,74,0.4);
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(180,210,180,0.4);
    backdrop-filter: blur(4px);
    z-index: 99; opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <button class="nav-btn" id="btn-prev" onclick="changeSize(-1)">
    <span class="arrow">‹</span>
    <span class="size-label" id="prev-label"></span>
  </button>
  <div class="title-wrap">
    <h1>Akari</h1>
    <div class="subtitle" id="size-subtitle">5 × 5</div>
  </div>
  <button class="nav-btn" id="btn-next" onclick="changeSize(1)">
    <span class="arrow">›</span>
    <span class="size-label" id="next-label"></span>
  </button>
</div>

<!-- BOARD -->
<div class="board-section">
  <div class="board-outer">
    <div id="board"></div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="status-bar">
    <span class="status-dot" id="status-dot"></span>
    <span class="status-text" id="status-text">전구를 눌러 배치하세요</span>
  </div>
  <div class="btn-row">
    <button class="btn btn-reset" onclick="playClick(); resetBoard()">초기화</button>
    <button class="btn btn-new" onclick="playClick(); newBoard()">새 판</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeToast()"></div>
<div class="toast" id="toast">
  <div class="toast-icon">💡</div>
  <h2>완성!</h2>
  <p>모든 칸을 빛으로 채웠어요</p>
  <button class="toast-btn" onclick="playClick(); closeToast(); newBoard()">새 판 하기</button>
</div>

<script>
// ─── Audio ────────────────────────────────────────────────
const sfxClick = new Audio('effect 19.mp3');
const sfxClear = new Audio('effect 1.mp3');
function playClick() { sfxClick.currentTime = 0; sfxClick.play().catch(()=>{}); }
function playClear() { sfxClear.currentTime = 0; sfxClear.play().catch(()=>{}); }

// ─── State ────────────────────────────────────────────────
const SIZES = [5, 6, 8, 10];
let sizeIdx = 0; // default 5x5
let N = 5;

// Cell values:
// negative: wall  (-1 = no-number wall, -2~-6 = wall with clue 0~4)
// 0: empty
// 1: bulb
const WALL_NO_NUM = -1;
const wallClue = (n) => -(n + 2); // clue 0 → -2, clue 1 → -3, ... clue 4 → -6
const getClue = (v) => -(v + 2);  // wall value → clue number

let board = [];      // puzzle definition (walls fixed)
let userBoard = [];  // player's bulb placements (0 or 1, walls copied)
let isGameOver = false;

// ─── Puzzle Generator ─────────────────────────────────────
// Generates a valid, uniquely-solvable Akari puzzle
function generatePuzzle(n) {
  // Step 1: place bulbs on blank grid to create a solution
  let solution = Array(n * n).fill(0);
  let litMap = Array(n * n).fill(false);
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];

  function idx(r,c) { return r*n+c; }
  function inBounds(r,c) { return r>=0&&r<n&&c>=0&&c<n; }

  // Place bulbs greedily: pick unlit cells and place bulbs
  let unlit = Array.from({length:n*n},(_,i)=>i);
  // shuffle
  for(let i=unlit.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [unlit[i],unlit[j]]=[unlit[j],unlit[i]];
  }

  function placeBulb(pos) {
    solution[pos] = 1;
    litMap[pos] = true;
    const r=Math.floor(pos/n), c=pos%n;
    for(const [dr,dc] of dirs){
      let nr=r+dr,nc=c+dc;
      while(inBounds(nr,nc)){
        litMap[idx(nr,nc)]=true;
        nr+=dr; nc+=dc;
      }
    }
  }

  // Place bulbs until all cells lit
  for(const pos of unlit){
    if(!litMap[pos]) placeBulb(pos);
  }

  // Step 2: place walls strategically (not on bulbs, ~20-30% of cells)
  let wallSet = new Set();
  const wallCount = Math.floor(n*n * 0.22);
  let attempts = 0;
  while(wallSet.size < wallCount && attempts < 1000){
    attempts++;
    const pos = Math.floor(Math.random()*n*n);
    if(solution[pos]===0 && !wallSet.has(pos)) wallSet.add(pos);
  }

  // Step 3: for each wall, count adjacent bulbs in solution → assign clue
  // Only assign numbered clues sometimes (50%), rest are blank walls
  let puzzle = Array(n*n).fill(0);
  for(let i=0;i<n*n;i++){
    if(wallSet.has(i)){
      const r=Math.floor(i/n),c=i%n;
      let adjBulbs=0;
      for(const [dr,dc] of dirs){
        const nr=r+dr,nc=c+dc;
        if(inBounds(nr,nc) && solution[idx(nr,nc)]===1) adjBulbs++;
      }
      // Assign numbered clue with 55% probability, blank wall otherwise
      if(Math.random()<0.55){
        puzzle[i] = wallClue(adjBulbs); // numbered wall
      } else {
        puzzle[i] = WALL_NO_NUM; // blank wall
      }
    } else {
      puzzle[i] = 0; // empty cell (may have bulb in solution)
    }
  }

  // Step 4: verify the puzzle is solvable (has at least one valid solution)
  // For simplicity, we verify our generated solution still satisfies all wall clues
  // (walls don't block the solution bulbs since walls are only placed on non-bulb cells)
  // Recheck: walls shouldn't be adjacent to bulbs they'd conflict with
  // Actually walls are placed only where solution[pos]===0, bulbs are solution[pos]===1
  // so our solution is valid for numbered walls

  return { puzzle, solution };
}

// ─── Build Board ──────────────────────────────────────────
function newBoard() {
  closeToast();
  isGameOver = false;
  N = SIZES[sizeIdx];

  const { puzzle, solution } = generatePuzzle(N);
  board = puzzle;
  userBoard = board.map(v => v); // copy walls; 0 cells start empty

  setCellSize();
  renderBoard();
  updateStatus();
  updateNavButtons();
}

function resetBoard() {
  closeToast();
  isGameOver = false;
  // Clear only bulbs, keep walls
  userBoard = board.map(v => v);
  renderBoard();
  updateStatus();
}

function setCellSize() {
  const vw = Math.min(window.innerWidth, 420);
  const available = vw - 32 - 32 - (N-1)*3;
  const cs = Math.max(28, Math.floor(available / N));
  document.documentElement.style.setProperty('--cell-size', cs+'px');
}

// ─── Lighting Calculation ─────────────────────────────────
function calcLit() {
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  const lit = Array(N*N).fill(false);
  const conflict = Array(N*N).fill(false); // bulbs that see each other

  function inBounds(r,c){return r>=0&&r<N&&c>=0&&c<N;}
  function idx(r,c){return r*N+c;}

  for(let i=0;i<N*N;i++){
    if(userBoard[i]===1){
      lit[i]=true;
      const r=Math.floor(i/N),c=i%N;
      for(const [dr,dc] of dirs){
        let nr=r+dr,nc=c+dc;
        while(inBounds(nr,nc)){
          const ni=idx(nr,nc);
          if(userBoard[ni]<0) break; // wall blocks
          if(userBoard[ni]===1){ conflict[i]=true; conflict[ni]=true; break; }
          lit[ni]=true;
          nr+=dr; nc+=dc;
        }
      }
    }
  }
  return { lit, conflict };
}

// ─── Render ───────────────────────────────────────────────
function renderBoard() {
  const { lit, conflict } = calcLit();
  const boardEl = document.getElementById('board');
  boardEl.style.gridTemplateColumns = `repeat(${N}, var(--cell-size))`;
  boardEl.innerHTML = '';

  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  function inBounds(r,c){return r>=0&&r<N&&c>=0&&c<N;}

  for(let i=0;i<N*N;i++){
    const r=Math.floor(i/N),c=i%N;
    const cell = document.createElement('div');
    cell.className = 'cell';
    const v = userBoard[i];

    if(v<0){
      // WALL
      cell.classList.add('wall');
      if(v===WALL_NO_NUM){
        cell.textContent = ''; // blank wall
      } else {
        const clue = getClue(v);
        cell.textContent = clue;
        // Check if wall clue is satisfied
        let adjBulbs=0;
        for(const [dr,dc] of dirs){
          const nr=r+dr,nc=c+dc;
          if(inBounds(nr,nc)&&userBoard[nr*N+nc]===1) adjBulbs++;
        }
        if(adjBulbs===clue) cell.classList.add('satisfied');
        else if(adjBulbs>clue) cell.classList.add('violated');
      }
    } else {
      // EMPTY or BULB
      if(conflict[i]){
        cell.classList.add('conflict');
      } else if(v===1){
        cell.classList.add('bulb');
      } else if(lit[i]){
        cell.classList.add('lit');
      }

      // Bulb icon
      const icon = document.createElement('span');
      icon.className = 'bulb-icon';
      icon.textContent = '💡';
      cell.appendChild(icon);

      cell.addEventListener('click', ()=>onCellClick(i));
    }

    boardEl.appendChild(cell);
  }

  checkWin(lit, conflict);
}

// ─── Cell Click ───────────────────────────────────────────
function onCellClick(i) {
  if(isGameOver) return;
  if(userBoard[i]<0) return; // wall
  playClick();
  userBoard[i] = userBoard[i]===1 ? 0 : 1;
  renderBoard();
  updateStatus();
}

// ─── Win Check ────────────────────────────────────────────
function checkWin(lit, conflict) {
  if(isGameOver) return;

  // All non-wall cells must be lit
  for(let i=0;i<N*N;i++){
    if(userBoard[i]>=0 && !lit[i]) return;
  }
  // No conflicting bulbs
  for(let i=0;i<N*N;i++){
    if(conflict[i]) return;
  }
  // All numbered wall clues satisfied
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  function inBounds(r,c){return r>=0&&r<N&&c>=0&&c<N;}
  for(let i=0;i<N*N;i++){
    const v=userBoard[i];
    if(v<=-2){
      const clue=getClue(v);
      const r=Math.floor(i/N),c=i%N;
      let adj=0;
      for(const [dr,dc] of dirs){
        const nr=r+dr,nc=c+dc;
        if(inBounds(nr,nc)&&userBoard[nr*N+nc]===1) adj++;
      }
      if(adj!==clue) return;
    }
  }

  // WIN
  isGameOver = true;
  playClear();
  setTimeout(()=>{
    document.getElementById('overlay').classList.add('show');
    document.getElementById('toast').classList.add('show');
  }, 350);
}

// ─── Status Bar ───────────────────────────────────────────
function updateStatus() {
  const { lit, conflict } = calcLit();
  const totalEmpty = userBoard.filter(v=>v>=0).length;
  const litCount = lit.filter(Boolean).length;
  const bulbCount = userBoard.filter(v=>v===1).length;
  const conflictCount = conflict.filter(Boolean).length;

  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');

  if(conflictCount>0){
    dot.className='status-dot';
    txt.textContent = `⚠ 전구 ${conflictCount/2|0}쌍이 겹칩니다`;
    return;
  }
  if(litCount===totalEmpty && bulbCount>0){
    dot.className='status-dot ok';
    txt.textContent='모든 칸이 밝혀졌어요!';
  } else {
    dot.className='status-dot';
    txt.textContent=`전구 ${bulbCount}개 · ${litCount}/${totalEmpty}칸 밝힘`;
  }
}

// ─── Nav ──────────────────────────────────────────────────
function changeSize(delta){
  const newIdx = sizeIdx+delta;
  if(newIdx<0||newIdx>=SIZES.length) return;
  sizeIdx=newIdx;
  playClick();
  newBoard();
}

function updateNavButtons(){
  const prevBtn=document.getElementById('btn-prev');
  const nextBtn=document.getElementById('btn-next');
  document.getElementById('size-subtitle').textContent=`${N} × ${N}`;

  if(sizeIdx===0){
    prevBtn.classList.add('disabled');
  } else {
    prevBtn.classList.remove('disabled');
    document.getElementById('prev-label').textContent=`${SIZES[sizeIdx-1]}×${SIZES[sizeIdx-1]}`;
  }
  if(sizeIdx===SIZES.length-1){
    nextBtn.classList.add('disabled');
  } else {
    nextBtn.classList.remove('disabled');
    document.getElementById('next-label').textContent=`${SIZES[sizeIdx+1]}×${SIZES[sizeIdx+1]}`;
  }
}

// ─── Toast ────────────────────────────────────────────────
function closeToast(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('toast').classList.remove('show');
}

function shakeBoard(){
  const outer=document.querySelector('.board-outer');
  const frames=[0,-8,8,-6,6,-4,4,0];
  frames.forEach((x,i)=>setTimeout(()=>outer.style.transform=`translateX(${x}px)`,i*55));
  setTimeout(()=>outer.style.transform='',frames.length*55);
}

// ─── Prevent scroll ───────────────────────────────────────
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ─── Init ─────────────────────────────────────────────────
newBoard();
</script>
</body>
</html>
