<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Akari - Healing Games</title>
    <style>
        :root {
            --bg-color: #f0ede5;
            --text-color: #5d5a52;
            --shadow-dark: rgba(188, 185, 178, 0.8);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --accent-color: #8e9775;
            --bulb-glow: rgba(255, 235, 59, 0.4);
            --wall-color: #4a473e;
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', sans-serif;
            overflow: hidden; 
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            display: flex; flex-direction: column; align-items: center; justify-content: start;
            padding-top: 5vh; /* 1. 전체적으로 조금 위로 올림 */
        }

        .header {
            display: flex; flex-direction: column; align-items: center;
            gap: 8px; margin-bottom: 25px; /* 간격 미세 조정 */
        }

        .title-row { display: flex; align-items: center; gap: 15px; }

        .size-btn {
            width: 50px; height: 50px; border: none; border-radius: 12px;
            background: var(--bg-color); color: var(--text-color); font-weight: 800;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            cursor: pointer;
        }

        .size-btn:active {
            box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
        }

        h1 { margin: 0; font-size: 1.5rem; font-weight: 800; }
        #status { font-size: 0.9rem; color: var(--text-color); font-weight: 600; height: 1.2rem; }

        .grid-container {
            width: 88vw; height: 88vw;
            max-width: 380px; max-height: 380px;
            background: var(--bg-color);
            border-radius: 25px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
            padding: 10px; box-sizing: border-box;
            display: grid; gap: 4px;
        }

        .cell {
            aspect-ratio: 1 / 1; border-radius: 8px;
            background: var(--bg-color);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            display: flex; justify-content: center; align-items: center;
            font-weight: 800; font-size: 1.1rem;
            transition: background-color 0.2s;
            cursor: pointer; position: relative;
        }

        .cell.lit { background-color: var(--bulb-glow); }
        .cell.wall {
            background-color: var(--wall-color); color: white;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .cell.bulb { color: #fbc02d; font-size: 1.4rem; }

        .footer {
            margin-top: 40px; display: flex; flex-direction: column; gap: 15px;
        }

        .btn {
            padding: 15px 40px; border: none; border-radius: 20px;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            font-weight: 700; color: var(--text-color); font-size: 1rem;
            cursor: pointer;
        }

        .btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
    </style>
</head>
<body onclick="unlockAudio()">

    <audio id="click-sound" src="effect 19.mp3" preload="auto"></audio>

    <div class="header">
        <div class="title-row">
            <button class="size-btn" onclick="changeLevel(6)">6x6</button>
            <h1>Akari</h1>
            <button class="size-btn" onclick="changeLevel(8)">8x8</button>
        </div>
        <div id="status">5X5 모드 시작!</div>
    </div>

    <div id="grid" class="grid-container"></div>

    <div class="footer">
        <button class="btn" onclick="regenerate()">새 판 깔기</button>
    </div>

    <script>
        let currentSize = 5; // 2. 기본 크기 5로 설정
        let numbers = []; 
        let audioUnlocked = false;

        function unlockAudio() {
            if (audioUnlocked) return;
            const sound = document.getElementById('click-sound');
            sound.play().then(() => {
                audioUnlocked = true;
                sound.pause(); sound.currentTime = 0;
            }).catch(e => console.log("Audio waiting..."));
        }

        function playClickSound() {
            if (!audioUnlocked) return;
            const sound = document.getElementById('click-sound');
            sound.currentTime = 0;
            sound.play();
        }

        function changeLevel(size) {
            playClickSound();
            currentSize = size;
            document.getElementById('status').innerText = `${size}x${size} 모드 시작!`;
            regenerate(false);
        }

        function regenerate(shouldPlaySound = true) {
            if (shouldPlaySound) playClickSound();
            numbers = Array.from({length: currentSize * currentSize}, () => 0);
            createSolvableBoard();
            render();
        }

        function createSolvableBoard() {
            let tempSolution = Array.from({length: currentSize * currentSize}, () => 0);
            let remainingCells = tempSolution.map((_, i) => i);

            function getLitPaths(idx, s) {
                let paths = []; let r = Math.floor(idx / currentSize); let c = idx % currentSize;
                const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                for (let [dr, dc] of directions) {
                    let nr = r + dr; let nc = c + dc;
                    while (nr >= 0 && nr < currentSize && nc >= 0 && nc < currentSize && s[nr * currentSize + nc] >= 0) {
                        paths.push(nr * currentSize + nc); nr += dr; nc += dc;
                    }
                }
                return paths;
            }

            // 모든 칸 비추는 전구 배치
            while(remainingCells.length > 0) {
                let randomIdx = remainingCells[Math.floor(Math.random() * remainingCells.length)];
                tempSolution[randomIdx] = 5;
                let paths = getLitPaths(randomIdx, tempSolution);
                paths.forEach(p => remainingCells = remainingCells.filter(c => c !== p));
                remainingCells = remainingCells.filter(c => c !== randomIdx);
            }

            // 무작위 벽 생성
            for(let i = 0; i < tempSolution.length; i++) {
                if (tempSolution[i] === 0 && Math.random() < 0.2) tempSolution[i] = -1;
            }

            // 벽 숫자 생성
            const problem = tempSolution.slice();
            for(let i = 0; i < problem.length; i++) {
                if (problem[i] === -1) {
                    let r = Math.floor(i / currentSize); let c = i % currentSize;
                    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    let count = 0;
                    for (let [dr, dc] of dirs) {
                        let nr = r + dr; let nc = c + dc;
                        if (nr >= 0 && nr < currentSize && nc >= 0 && nc < currentSize && tempSolution[nr * currentSize + nc] === 5) count++;
                    }
                    if (Math.random() < 0.85) problem[i] = -(count + 1);
                    else problem[i] = -1;
                } else if (problem[i] === 5) {
                    problem[i] = 0;
                }
            }
            numbers = problem;
        }

        function updateLighting() {
            for(let i=0; i<numbers.length; i++) if(numbers[i] > 0 && numbers[i] !== 5) numbers[i] = 0;
            const bulbs = [];
            numbers.forEach((num, idx) => { if (num === 5) bulbs.push(idx); });
            bulbs.forEach(idx => {
                let r = Math.floor(idx / currentSize); let c = idx % currentSize;
                const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                for (let [dr, dc] of directions) {
                    let nr = r + dr; let nc = c + dc;
                    while (nr >= 0 && nr < currentSize && nc >= 0 && nc < currentSize) {
                        let currentIdx = nr * currentSize + nc;
                        if (numbers[currentIdx] < 0) break;
                        if (numbers[currentIdx] === 0) numbers[currentIdx] = 1;
                        nr += dr; nc += dc;
                    }
                }
            });
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
            
            numbers.forEach((num, idx) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (num < 0) {
                    cell.classList.add('wall');
                    let wallNum = -(num + 1);
                    cell.innerText = wallNum >= 0 ? wallNum : '';
                } else {
                    cell.onclick = () => handleSelect(idx);
                    if (num === 5) { cell.innerText = '💡'; cell.classList.add('bulb'); }
                    else if (num === 1) cell.classList.add('lit');
                }
                grid.appendChild(cell);
            });
            updateLighting();
            checkWin();
        }

        function handleSelect(idx) {
            playClickSound();
            if (numbers[idx] === 5) numbers[idx] = 0;
            else if (numbers[idx] === 0 || numbers[idx] === 1) numbers[idx] = 5;
            render();
        }

        function checkWin() {
            if (numbers.some(n => n < 0) && numbers.every(n => n >= 0)) return; 
            if (numbers.some(n => n === 0)) return;
            // 승리 시 상태 업데이트
            const status = document.getElementById('status');
            if(numbers.length > 0 && !numbers.some(n => n === 0)) {
                status.innerText = "🎉 미션 클리어!";
                status.style.color = "var(--accent-color)";
            }
        }

        // 3. 안내 메시지 수정
        window.onload = () => {
            currentSize = 5;
            document.getElementById('grid').innerHTML = 
                `<div style="grid-column: 1 / span ${currentSize}; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-color); font-weight: 600; font-size: 0.95rem; line-height: 1.6;">
                    '새 판 깔기'를 누르고 시작하세요.
                </div>`;
        }
    </script>
</body>
</html>
