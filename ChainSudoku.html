<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chain Sudoku - Master</title>
    <style>
        :root {
            --bg-color: #f0ede5;
            --text-color: #5d5a52;
            --shadow-dark: rgba(188, 185, 178, 0.8);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --accent-color: #8e9775;
            --chain-color: #4a473f; /* 짙은 색 체인 */
            --selected-bg: #e8e4da;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body { display: flex; flex-direction: column; align-items: center; }

        .header {
            height: 20%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .size-btn {
            width: 55px;
            height: 55px;
            border: none;
            border-radius: 15px;
            background: var(--bg-color);
            color: var(--text-color);
            font-weight: 800;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            cursor: pointer;
        }

        .size-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        h1 { margin: 0; font-size: 1.6rem; font-weight: 800; }
        #status { margin-top: 10px; font-size: 0.9rem; color: var(--accent-color); font-weight: 600; height: 1.2rem; }

        .game-area {
            height: 50%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid-container {
            position: relative;
            width: 85vw;
            height: 85vw;
            max-width: 360px;
            max-height: 360px;
            background: var(--bg-color);
            border-radius: 30px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
            padding: 15px;
            box-sizing: border-box;
        }

        #grid {
            display: grid;
            width: 100%;
            height: 100%;
            gap: 8px;
            position: relative;
            z-index: 2;
        }

        #chain-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .cell {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            border-radius: 50%;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            transition: all 0.1s;
            box-sizing: border-box;
        }

        .cell.active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            background-color: var(--selected-bg);
        }

        .footer {
            height: 30%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        #num-pad {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 90%;
        }

        .num-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 12px;
            background: var(--bg-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .num-btn:active {
            box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
        }

        .action-btns { display: flex; gap: 15px; }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 18px;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            font-weight: 700;
            color: var(--text-color);
        }
        .btn-check { background-color: var(--accent-color); color: white; }
    </style>
</head>
<body>

    <audio id="click-sound" src="effect 19.mp3" preload="auto"></audio>

    <div class="header">
        <div class="title-row">
            <button class="size-btn" onclick="changeLevel(6)">6x6</button>
            <h1>Chain Sudoku</h1>
            <button class="size-btn" onclick="changeLevel(8)">8x8</button>
        </div>
        <div id="status">판을 완성해보세요!</div>
    </div>

    <div class="game-area">
        <div class="grid-container" id="container">
            <svg id="chain-svg"></svg>
            <div id="grid"></div>
        </div>
    </div>

    <div class="footer">
        <div id="num-pad"></div>
        <div class="action-btns">
            <button class="btn" onclick="handleManualReset()">초기화</button>
            <button class="btn btn-check" onclick="checkWin()">확인</button>
        </div>
    </div>

    <script>
        let currentSize = 5;
        let selectedCell = null;
        let chains = [];
        let audioUnlocked = false;

        function playClickSound() {
            const sound = document.getElementById('click-sound');
            if (!audioUnlocked) {
                sound.play().then(() => {
                    audioUnlocked = true;
                    sound.currentTime = 0;
                }).catch(e => console.log("Audio unlock waiting..."));
            } else {
                sound.currentTime = 0;
                sound.play();
            }
        }

        function changeLevel(size) {
            playClickSound(); // 사용자가 버튼을 눌렀으므로 소리 재생
            currentSize = size;
            document.getElementById('status').innerText = `${size}x${size} 모드 시작!`;
            initGame(false); // 내부 생성 시에는 소리 안 나게 false 전달
        }

        function handleManualReset() {
            playClickSound(); // "초기화" 버튼 클릭 시 소리 재생
            initGame(false); // 이미 여기서 소리를 냈으므로 initGame 내부 중복 방지 위해 false
        }

        function initGame(shouldPlaySound = false) {
            if (shouldPlaySound) playClickSound();
            
            const grid = document.getElementById('grid');
            const numPad = document.getElementById('num-pad');
            grid.innerHTML = '';
            numPad.innerHTML = '';
            selectedCell = null;

            const fontSize = currentSize > 7 ? '0.9rem' : '1.2rem';
            grid.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${currentSize}, 1fr)`;
            
            for (let i = 0; i < currentSize * currentSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                cell.style.fontSize = fontSize;
                cell.onclick = () => {
                    playClickSound(); // 세포 클릭 시 소리 재생
                    if(selectedCell !== null) document.getElementById(`cell-${selectedCell}`).classList.remove('active');
                    selectedCell = i;
                    cell.classList.add('active');
                };
                grid.appendChild(cell);
            }

            for (let i = 1; i <= currentSize; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.innerText = i;
                btn.onclick = () => { 
                    playClickSound(); // 숫자 버튼 클릭 시 소리 재생
                    if(selectedCell !== null) document.getElementById(`cell-${selectedCell}`).innerText = i; 
                };
                numPad.appendChild(btn);
            }
            const clearBtn = document.createElement('button');
            clearBtn.className = 'num-btn';
            clearBtn.innerText = 'C';
            clearBtn.onclick = () => { 
                playClickSound(); // C 버튼 클릭 시 소리 재생
                if(selectedCell !== null) document.getElementById(`cell-${selectedCell}`).innerText = ''; 
            };
            numPad.appendChild(clearBtn);

            generateChains();
            setTimeout(drawChains, 150);
        }

        function generateChains() {
            chains = [];
            let visited = new Set();
            let allIndices = Array.from({length: currentSize * currentSize}, (_, i) => i).sort(() => Math.random() - 0.5);

            for (let i of allIndices) {
                if (visited.has(i)) continue;
                let chain = [i];
                visited.add(i);
                let curr = i;
                let maxLen = Math.floor(Math.random() * (currentSize - 1)) + 2; 

                for (let j = 0; j < maxLen - 1; j++) {
                    let neighbors = getNeighbors(curr).filter(n => !visited.has(n));
                    if (neighbors.length === 0) break;
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    chain.push(next);
                    visited.add(next);
                    curr = next;
                }
                if (chain.length > 1) chains.push(chain);
            }
        }

        function getNeighbors(idx) {
            let res = [];
            let r = Math.floor(idx / currentSize);
            let c = idx % currentSize;
            if (r > 0) res.push(idx - currentSize);
            if (r < currentSize - 1) res.push(idx + currentSize);
            if (c > 0) res.push(idx - 1);
            if (c < currentSize - 1) res.push(idx + 1);
            return res;
        }

        function drawChains() {
            const svg = document.getElementById('chain-svg');
            const container = document.getElementById('container');
            const containerRect = container.getBoundingClientRect();
            svg.innerHTML = '';

            chains.forEach(chain => {
                for (let i = 0; i < chain.length - 1; i++) {
                    const c1 = document.getElementById(`cell-${chain[i]}`);
                    const c2 = document.getElementById(`cell-${chain[i+1]}`);
                    
                    const r1 = c1.getBoundingClientRect();
                    const r2 = c2.getBoundingClientRect();

                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    
                    line.setAttribute("x1", (r1.left + r1.width / 2) - containerRect.left);
                    line.setAttribute("y1", (r1.top + r1.height / 2) - containerRect.top);
                    line.setAttribute("x2", (r2.left + r2.width / 2) - containerRect.left);
                    line.setAttribute("y2", (r2.top + r2.height / 2) - containerRect.top);
                    
                    line.setAttribute("stroke", "var(--chain-color)");
                    line.setAttribute("stroke-width", "10");
                    line.setAttribute("stroke-linecap", "round");
                    line.setAttribute("opacity", "0.8");
                    svg.appendChild(line);
                }
            });
        }

        function checkWin() {
            playClickSound();
            let board = [];
            for(let i=0; i<currentSize*currentSize; i++) {
                const val = document.getElementById(`cell-${i}`).innerText;
                if(!val) { alert("모든 칸을 채워주세요!"); return; }
                board.push(parseInt(val));
            }

            if (validate(board)) {
                document.getElementById('status').innerText = "🎉 미션 클리어!";
                document.getElementById('status').style.color = "#27ae60";
            } else {
                document.getElementById('status').innerText = "규칙 오류가 있습니다!";
                document.getElementById('status').style.color = "#d32f2f";
            }
        }

        function validate(board) {
            for (let r = 0; r < currentSize; r++) {
                let row = board.slice(r * currentSize, (r + 1) * currentSize);
                if (new Set(row).size !== currentSize) return false;
            }
            for (let c = 0; c < currentSize; c++) {
                let col = [];
                for (let r = 0; r < currentSize; r++) col.push(board[r * currentSize + c]);
                if (new Set(col).size !== currentSize) return false;
            }
            for (let chain of chains) {
                let vals = chain.map(idx => board[idx]);
                if (new Set(vals).size !== vals.length) return false;
            }
            return true;
        }

        // 페이지 로드 시에는 소리 없이 초기화만 진행
        window.onload = () => initGame(false);
        window.onresize = drawChains;
    </script>
</body>
</html>
