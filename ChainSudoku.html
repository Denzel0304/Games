<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chain Sudoku</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #d8edd8;
    --surface: #e8f5e8;
    --surface2: #f2faf2;
    --shadow-light: #ffffff;
    --shadow-dark: #b8d4b8;
    --accent: #6b9e6b;
    --accent2: #4a7c4a;
    --text: #3a5c3a;
    --text2: #6b8f6b;
    --danger: #c86060;
    --selected-bg: #c8e6c8;
    --error-bg: #fde8e8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden; touch-action: none; user-select: none;
  }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    height: 100dvh; overflow: hidden; position: relative;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.3) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.2) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  /* ── HEADER (고정 높이) ── */
  .header {
    flex-shrink: 0;
    position: relative; z-index: 10;
    width: 100%; max-width: 440px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 8px;
    height: 76px;
  }

  .nav-btn {
    width: 48px; height: 48px; border-radius: 16px; border: none;
    background: var(--surface);
    box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
    color: var(--text2); flex-direction: column; gap: 1px; line-height: 1;
    flex-shrink: 0;
  }
  .nav-btn:active {
    box-shadow: 2px 2px 4px var(--shadow-dark), -1px -1px 3px var(--shadow-light);
    transform: scale(0.96);
  }
  .nav-btn .arrow { font-size: 18px; line-height: 1; }
  .nav-btn .size-label { font-size: 11px; font-weight: 500; color: var(--text2); }
  .nav-btn.disabled { opacity: 0.35; pointer-events: none; }

  .title-wrap { text-align: center; }
  .title-wrap h1 {
    font-family: 'Playfair Display', serif;
    font-size: 22px; color: var(--text); letter-spacing: -0.5px; line-height: 1;
  }
  .title-wrap .subtitle { font-size: 12px; color: var(--text2); margin-top: 3px; }

  /* ── BOARD SECTION (flex:1 → 남은 공간 차지) ── */
  .board-section {
    flex: 1; min-height: 0;
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 4px 16px;
  }

  .board-outer {
    background: var(--surface); border-radius: 28px; padding: 14px;
    box-shadow:
      8px 8px 20px var(--shadow-dark),
      -8px -8px 20px var(--shadow-light),
      inset 1px 1px 2px rgba(255,255,255,0.8);
    position: relative;
    /* 크기는 JS에서 명시적으로 설정 */
  }

  #chain-svg {
    position: absolute;
    top: 14px; left: 14px;
    pointer-events: none; z-index: 1;
  }

  #board {
    display: grid;
    position: relative; z-index: 2;
  }

  .cell {
    border-radius: 50%;
    background: var(--surface2);
    box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    transition: all 0.15s;
    font-family: 'Playfair Display', serif;
    font-weight: 700; color: var(--text);
    line-height: 1; flex-shrink: 0;
    /* width/height/font-size set by JS */
  }
  .cell:active { transform: scale(0.92); }

  .cell.selected {
    background: var(--selected-bg);
    box-shadow: inset 3px 3px 7px rgba(90,138,90,0.3), inset -2px -2px 5px rgba(255,255,255,0.8);
    color: var(--accent2);
  }
  .cell.error { background: var(--error-bg); color: var(--danger); }
  .cell.filled { background: linear-gradient(135deg, #e8f5e8, #d4ecca); }

  /* ── NUMPAD (고정 높이) ── */
  .numpad-section {
    flex-shrink: 0;
    position: relative; z-index: 10;
    width: 100%; max-width: 440px;
    padding: 6px 16px 4px;
    height: 62px;
    display: flex; align-items: center; justify-content: center;
  }

  .numpad {
    display: flex; flex-wrap: nowrap;
    justify-content: center; gap: 4px;
  }

  .num-btn {
    height: 42px; border-radius: 14px; border: none;
    background: var(--surface); color: var(--text);
    box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    flex-shrink: 0;
  }
  .num-btn:active {
    box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -1px -1px 3px var(--shadow-light);
    transform: scale(0.94);
  }
  .num-btn.clear-btn {
    font-family: 'DM Sans', sans-serif;
    font-weight: 600; color: var(--text2);
  }

  /* ── CONTROLS (고정 높이) ── */
  .controls {
    flex-shrink: 0;
    position: relative; z-index: 10;
    width: 100%; max-width: 440px;
    padding: 6px 16px 18px;
    display: flex; flex-direction: column; gap: 8px;
    height: 90px;
  }

  .status-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; font-size: 13px; color: var(--text2);
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #a0b8a0; transition: background 0.3s;
  }
  .status-dot.ok { background: var(--accent); }
  .status-dot.err { background: var(--danger); }

  .btn-row { display: flex; gap: 10px; }

  .btn {
    flex: 1; height: 46px; border-radius: 16px; border: none;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    transition: all 0.15s;
  }
  .btn:active { transform: scale(0.96); }

  .btn-reset {
    background: var(--surface); color: var(--text2);
    box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
  }
  .btn-confirm {
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    box-shadow: 4px 4px 12px rgba(74,124,74,0.5), -2px -2px 8px rgba(255,255,255,0.6);
  }

  /* TOAST */
  .toast {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    background: var(--surface); border-radius: 24px;
    padding: 28px 36px; text-align: center;
    box-shadow: 12px 12px 30px var(--shadow-dark), -12px -12px 30px var(--shadow-light);
    z-index: 100; opacity: 0; pointer-events: none;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  .toast .toast-icon { font-size: 48px; margin-bottom: 10px; }
  .toast h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px; color: var(--text); margin-bottom: 6px;
  }
  .toast p { font-size: 14px; color: var(--text2); margin-bottom: 18px; }
  .toast .toast-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 14px; padding: 12px 32px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
    cursor: pointer;
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(180,210,180,0.4); backdrop-filter: blur(4px);
    z-index: 99; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<div class="header">
  <button class="nav-btn" id="btn-prev" onclick="changeSize(-1)">
    <span class="arrow">‹</span>
    <span class="size-label" id="prev-label"></span>
  </button>
  <div class="title-wrap">
    <h1>Chain Sudoku</h1>
    <div class="subtitle" id="size-subtitle">5 × 5</div>
  </div>
  <button class="nav-btn" id="btn-next" onclick="changeSize(1)">
    <span class="arrow">›</span>
    <span class="size-label" id="next-label"></span>
  </button>
</div>

<div class="board-section">
  <div class="board-outer" id="board-outer">
    <svg id="chain-svg"></svg>
    <div id="board"></div>
  </div>
</div>

<div class="numpad-section">
  <div class="numpad" id="numpad"></div>
</div>

<div class="controls">
  <div class="status-bar">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">셀을 선택하고 숫자를 입력하세요</span>
  </div>
  <div class="btn-row">
    <button class="btn btn-reset" onclick="playClick(); resetBoard()">초기화</button>
    <button class="btn btn-confirm" onclick="playClick(); checkWin()">확인</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeToast()"></div>
<div class="toast" id="toast">
  <div class="toast-icon">🔗</div>
  <h2>완성!</h2>
  <p>모든 조건을 충족했어요</p>
  <button class="toast-btn" onclick="playClick(); closeToast(); newBoard()">새 판 하기</button>
</div>

<script>
const sfxClick = new Audio('effect 19.mp3');
const sfxClear = new Audio('effect 1.mp3');
function playClick() { sfxClick.currentTime = 0; sfxClick.play().catch(()=>{}); }
function playClear() { sfxClear.currentTime = 0; sfxClear.play().catch(()=>{}); }

const SIZES = [5, 6, 8, 10];
let sizeIdx = 0;
let N = 5;
let chains = [];
let solution = [];
let userBoard = [];
let selectedCell = -1;
let CELL_SIZE = 48; // computed
const GAP = 5;
const PAD = 14;

// ── Chain colors (dark, clearly visible) ──
const CHAIN_COLORS = [
  '#2e7d32','#c62828','#1565c0','#6a1b9a',
  '#e65100','#00695c','#4e342e','#283593',
  '#558b2f','#ad1457'
];

function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function generateSolution(n) {
  const sol = [];
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++)
      sol.push(((r + c) % n) + 1);
  const rowP = shuffle([...Array(n).keys()]);
  const colP = shuffle([...Array(n).keys()]);
  const result = Array(n*n).fill(0);
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++)
      result[rowP[r]*n + colP[c]] = sol[r*n+c];
  const valP = shuffle([...Array(n).keys()].map(i=>i+1));
  return result.map(v => valP[v-1]);
}

function generateChains(n) {
  const visited = new Set();
  const result = [];
  const allCells = shuffle([...Array(n*n).keys()]);
  function getNeighbors(idx) {
    const r=Math.floor(idx/n), c=idx%n, nb=[];
    if(r>0) nb.push(idx-n);
    if(r<n-1) nb.push(idx+n);
    if(c>0) nb.push(idx-1);
    if(c<n-1) nb.push(idx+1);
    return nb;
  }
  for (const start of allCells) {
    if (visited.has(start)) continue;
    const chain=[start]; visited.add(start);
    const usedVals=new Set([solution[start]]);
    let curr=start;
    const maxLen=Math.min(n, Math.floor(Math.random()*(n-1))+2);
    for (let step=1; step<maxLen; step++) {
      const nb=shuffle(getNeighbors(curr).filter(nb=>!visited.has(nb)&&!usedVals.has(solution[nb])));
      if(!nb.length) break;
      chain.push(nb[0]); visited.add(nb[0]); usedVals.add(solution[nb[0]]); curr=nb[0];
    }
    if(chain.length>=2) result.push(chain);
  }
  for (let i=0; i<n*n; i++) if(!visited.has(i)) result.push([i]);
  return result;
}

// ── Compute cell size from available space ──
function computeCellSize() {
  // Fixed zones: header=76, numpad=62, controls=90, board padding=PAD*2
  const vh = window.innerHeight;
  const vw = Math.min(window.innerWidth, 440);
  const boardAreaH = vh - 76 - 62 - 90 - 16; // 16 = board-section padding
  const boardAreaW = vw - 32; // 16px each side
  // board grid size: N*cs + (N-1)*GAP + PAD*2
  const maxFromH = Math.floor((boardAreaH - PAD*2 - (N-1)*GAP) / N);
  const maxFromW = Math.floor((boardAreaW - PAD*2 - (N-1)*GAP) / N);
  return Math.max(24, Math.min(maxFromH, maxFromW));
}

function applyLayout() {
  CELL_SIZE = computeCellSize();
  const boardPx = N * CELL_SIZE + (N-1) * GAP;
  const outerPx = boardPx + PAD * 2;

  // Set board grid gap & columns
  const boardEl = document.getElementById('board');
  boardEl.style.gridTemplateColumns = `repeat(${N}, ${CELL_SIZE}px)`;
  boardEl.style.gap = GAP + 'px';

  // Fix board-outer size
  const outer = document.getElementById('board-outer');
  outer.style.width = outerPx + 'px';
  outer.style.height = outerPx + 'px';

  // Apply cell sizes
  document.querySelectorAll('.cell').forEach(c => {
    c.style.width = CELL_SIZE + 'px';
    c.style.height = CELL_SIZE + 'px';
    c.style.fontSize = Math.round(CELL_SIZE * 0.58) + 'px';
  });
}

function newBoard() {
  closeToast();
  N = SIZES[sizeIdx];
  solution = generateSolution(N);
  chains = generateChains(N);
  userBoard = Array(N*N).fill(0);
  selectedCell = -1;
  buildNumpad();
  renderBoard();
  applyLayout();
  setTimeout(drawChains, 60);
  updateStatus();
  updateNavButtons();
}

function resetBoard() {
  closeToast();
  userBoard = Array(N*N).fill(0);
  selectedCell = -1;
  renderBoard();
  applyLayout();
  setTimeout(drawChains, 60);
  updateStatus();
}

function buildNumpad() {
  const pad = document.getElementById('numpad');
  pad.innerHTML = '';

  // 버튼 개수: N개 숫자 + C = N+1
  // 가용 너비: 화면너비 - 양쪽패딩(32) - 갭(4 * N개)
  const totalBtns = N + 1;
  const availW = Math.min(window.innerWidth, 440) - 36;
  const totalGap = 4 * (totalBtns - 1);
  const btnW = Math.max(26, Math.floor((availW - totalGap) / totalBtns));
  const btnFont = Math.max(12, Math.floor(btnW * 0.62));

  for (let i = 1; i <= N; i++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.textContent = i;
    btn.style.width = btnW + 'px';
    btn.style.fontSize = btnFont + 'px';
    btn.addEventListener('click', ()=>{ playClick(); inputNumber(i); });
    pad.appendChild(btn);
  }
  const clr = document.createElement('button');
  clr.className = 'num-btn clear-btn';
  clr.textContent = 'C';
  clr.style.width = btnW + 'px';
  clr.style.fontSize = btnFont + 'px';
  clr.addEventListener('click', ()=>{ playClick(); inputNumber(0); });
  pad.appendChild(clr);
}

function getErrors() {
  const errors = new Set();
  function checkGroup(indices) {
    const seen={}, dups=new Set();
    for (const i of indices) {
      const v=userBoard[i]; if(!v) continue;
      if(seen[v]!==undefined){dups.add(seen[v]);dups.add(i);}
      else seen[v]=i;
    }
    dups.forEach(i=>errors.add(i));
  }
  for (let r=0;r<N;r++) checkGroup([...Array(N).keys()].map(c=>r*N+c));
  for (let c=0;c<N;c++) checkGroup([...Array(N).keys()].map(r=>r*N+c));
  for (const chain of chains) if(chain.length>=2) checkGroup(chain);
  return errors;
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  const errors = getErrors();
  for (let i=0; i<N*N; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.width = CELL_SIZE + 'px';
    cell.style.height = CELL_SIZE + 'px';
    cell.style.fontSize = Math.round(CELL_SIZE * 0.58) + 'px';
    if (i===selectedCell) cell.classList.add('selected');
    if (userBoard[i]>0) {
      cell.textContent = userBoard[i];
      cell.classList.add(errors.has(i) ? 'error' : 'filled');
    }
    cell.addEventListener('click', ()=>{
      playClick(); selectedCell=i;
      renderBoard(); applyLayout(); setTimeout(drawChains,20);
    });
    boardEl.appendChild(cell);
  }
}

function drawChains() {
  const svg = document.getElementById('chain-svg');
  const boardPx = N * CELL_SIZE + (N-1) * GAP;
  svg.setAttribute('width', boardPx);
  svg.setAttribute('height', boardPx);
  svg.innerHTML = '';

  chains.forEach((chain, ci) => {
    if (chain.length < 2) return;
    const color = CHAIN_COLORS[ci % CHAIN_COLORS.length];
    const sw = Math.max(6, Math.round(CELL_SIZE * 0.32));

    for (let k=0; k<chain.length-1; k++) {
      const i1=chain[k], i2=chain[k+1];
      const r1=Math.floor(i1/N), c1=i1%N;
      const r2=Math.floor(i2/N), c2=i2%N;
      const x1=c1*(CELL_SIZE+GAP)+CELL_SIZE/2;
      const y1=r1*(CELL_SIZE+GAP)+CELL_SIZE/2;
      const x2=c2*(CELL_SIZE+GAP)+CELL_SIZE/2;
      const y2=r2*(CELL_SIZE+GAP)+CELL_SIZE/2;

      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1);
      line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      line.setAttribute('stroke', color);
      line.setAttribute('stroke-width', sw);
      line.setAttribute('stroke-linecap','round');
      line.setAttribute('opacity','0.9');
      svg.appendChild(line);
    }
  });
}

function inputNumber(val) {
  if (selectedCell<0) return;
  userBoard[selectedCell]=val;
  renderBoard(); applyLayout(); setTimeout(drawChains,20);
  updateStatus();
}

function updateStatus() {
  const filled=userBoard.filter(v=>v>0).length;
  const errors=getErrors();
  const dot=document.getElementById('status-dot');
  const txt=document.getElementById('status-text');
  if (errors.size>0){ dot.className='status-dot err'; txt.textContent=`오류 ${errors.size}개 발견`; }
  else if (filled===N*N){ dot.className='status-dot ok'; txt.textContent='모든 칸이 채워졌어요!'; }
  else { dot.className='status-dot'; txt.textContent=`${filled} / ${N*N} 칸 입력됨`; }
}

function checkWin() {
  if (userBoard.some(v=>v===0)){ shakeBoard(); return; }
  if (getErrors().size>0){ shakeBoard(); return; }
  playClear();
  setTimeout(()=>{
    document.getElementById('overlay').classList.add('show');
    document.getElementById('toast').classList.add('show');
  },300);
}

function shakeBoard() {
  const outer=document.getElementById('board-outer');
  const frames=[0,-8,8,-6,6,-4,4,0];
  frames.forEach((x,i)=>setTimeout(()=>outer.style.transform=`translateX(${x}px)`,i*55));
  setTimeout(()=>outer.style.transform='',frames.length*55);
}

function changeSize(delta) {
  const newIdx=sizeIdx+delta;
  if(newIdx<0||newIdx>=SIZES.length) return;
  sizeIdx=newIdx; playClick(); newBoard();
}

function updateNavButtons() {
  const prev=document.getElementById('btn-prev');
  const next=document.getElementById('btn-next');
  document.getElementById('size-subtitle').textContent=`${N} × ${N}`;
  if(sizeIdx===0){ prev.classList.add('disabled'); }
  else { prev.classList.remove('disabled'); document.getElementById('prev-label').textContent=`${SIZES[sizeIdx-1]}×${SIZES[sizeIdx-1]}`; }
  if(sizeIdx===SIZES.length-1){ next.classList.add('disabled'); }
  else { next.classList.remove('disabled'); document.getElementById('next-label').textContent=`${SIZES[sizeIdx+1]}×${SIZES[sizeIdx+1]}`; }
}

function closeToast() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('toast').classList.remove('show');
}

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('resize',()=>{ applyLayout(); setTimeout(drawChains,80); });

newBoard();
</script>
</body>
</html>
