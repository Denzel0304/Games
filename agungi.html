<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>아궁이</title>
<style>
  :root{
    --bg-deep:#120d0a;
    --bg-room:#1c140f;
    --stone-1:#3a2f28;
    --stone-2:#2a221c;
    --stone-3:#171210;
    --mouth-dark:#0a0706;
    --wood-fresh:#7a5230;
    --wood-fresh-end:#5c3e22;
    --wood-mid:#5c3a1f;
    --wood-mid-end:#3f2614;
    --wood-charred:#2a1d14;
    --wood-ash:#4a4540;
    --wood-ash-end:#2e2b28;
    --ember:#e8742a;
    --flame-out:#e8581f;
    --flame-mid:#f5933a;
    --flame-in:#ffd571;
    --text-warm:#d8c4a8;
    --text-dim:#8a7762;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;
    background:var(--bg-deep);
    overflow:hidden;
    touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo',sans-serif;
  }
  #stage{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    background:
      radial-gradient(ellipse 140% 90% at 50% 78%, rgba(232,116,42,0.10) 0%, rgba(232,116,42,0) 55%),
      linear-gradient(to bottom, var(--bg-deep) 0%, var(--bg-room) 100%);
  }

  /* ---------- header ---------- */
  #header{
    flex:0 0 auto;
    padding:max(18px, env(safe-area-inset-top)) 20px 10px;
    text-align:center;
  }
  #title{
    font-size:15px;
    color:var(--text-warm);
    letter-spacing:0.08em;
    font-weight:500;
    opacity:0.85;
  }
  #subtitle{
    font-size:12px;
    color:var(--text-dim);
    margin-top:4px;
    letter-spacing:0.02em;
    height:16px;
    transition:opacity 0.4s;
  }

  /* ---------- ember glow counter ---------- */
  #stats{
    flex:0 0 auto;
    display:flex;
    justify-content:center;
    gap:28px;
    padding:4px 20px 8px;
  }
  .stat{
    text-align:center;
  }
  .stat-num{
    font-size:20px;
    font-weight:500;
    color:var(--text-warm);
    font-variant-numeric:tabular-nums;
  }
  .stat-label{
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:0.05em;
    margin-top:1px;
  }

  /* ---------- scene ---------- */
  #scene{
    flex:1 1 auto;
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
  }

  #firelight{
    position:absolute;
    left:50%;top:38%;
    width:520px;height:520px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(245,147,58,0.16) 0%, rgba(245,147,58,0.05) 40%, rgba(245,147,58,0) 70%);
    pointer-events:none;
    transition:opacity 0.6s, transform 0.6s;
  }

  /* the hearth structure */
  #hearth{
    position:relative;
    width:100%;
    max-width:480px;
    height:62vh;
    margin:0 auto;
  }

  svg#hearth-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  /* particle layer above everything, clipped to flame chamber */
  #particles{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .particle{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    will-change:transform,opacity;
  }

  /* ---------- bottom controls ---------- */
  #controls{
    flex:0 0 auto;
    padding:14px 20px max(18px, env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  #add-wood-btn{
    width:100%;
    max-width:340px;
    padding:16px 0;
    border-radius:999px;
    border:1px solid rgba(216,196,168,0.22);
    background:linear-gradient(to bottom, rgba(58,47,40,0.6), rgba(42,34,28,0.6));
    color:var(--text-warm);
    font-size:15px;
    font-weight:500;
    letter-spacing:0.03em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform 0.12s, background 0.2s, opacity 0.3s;
  }
  #add-wood-btn:active{
    transform:scale(0.96);
    background:linear-gradient(to bottom, rgba(70,56,46,0.7), rgba(50,40,32,0.7));
  }
  #add-wood-btn.disabled{
    opacity:0.35;
    pointer-events:none;
  }
  .btn-icon{
    width:16px;height:16px;
    flex:0 0 auto;
  }
  #clear-ash-btn{
    font-size:12px;
    color:var(--text-dim);
    padding:6px 14px;
    letter-spacing:0.02em;
    opacity:0;
    transition:opacity 0.4s;
    pointer-events:none;
  }
  #clear-ash-btn.visible{
    opacity:0.7;
    pointer-events:auto;
  }
  #clear-ash-btn:active{
    opacity:1;
  }

  @keyframes flicker-a{
    0%,100%{ transform:scaleY(1) scaleX(1) skewX(0deg) translateY(0); }
    20%{ transform:scaleY(1.06) scaleX(0.97) skewX(1.5deg) translateY(-1px); }
    45%{ transform:scaleY(0.94) scaleX(1.03) skewX(-1deg) translateY(0px); }
    70%{ transform:scaleY(1.08) scaleX(0.95) skewX(2deg) translateY(-2px); }
    85%{ transform:scaleY(0.97) scaleX(1.02) skewX(-1.5deg) translateY(0); }
  }
  @keyframes flicker-b{
    0%,100%{ transform:scaleY(1) skewX(0deg); opacity:0.95; }
    30%{ transform:scaleY(1.12) skewX(-2deg); opacity:1; }
    60%{ transform:scaleY(0.9) skewX(2.5deg); opacity:0.85; }
  }
  @keyframes flicker-c{
    0%,100%{ transform:scaleY(1) skewX(0deg) translateX(0); opacity:0.9;}
    40%{ transform:scaleY(1.15) skewX(-3deg) translateX(2px); opacity:1;}
    75%{ transform:scaleY(0.92) skewX(1.5deg) translateX(-1px); opacity:0.8;}
  }
  @keyframes glow-pulse{
    0%,100%{ opacity:0.85; }
    50%{ opacity:1; }
  }
  @keyframes rise-fade{
    0%{ opacity:0.9; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(-90px) scale(0.25); }
  }
  @keyframes log-drop{
    0%{ transform:translateY(-26px); opacity:0; }
    60%{ transform:translateY(2px); opacity:1; }
    100%{ transform:translateY(0); opacity:1; }
  }

  .flame-outer{ animation:flicker-a 2.1s ease-in-out infinite; transform-origin:50% 100%; }
  .flame-mid{ animation:flicker-b 1.5s ease-in-out infinite; transform-origin:50% 100%; }
  .flame-inner{ animation:flicker-c 1.1s ease-in-out infinite; transform-origin:50% 100%; }
  .ember-glow{ animation:glow-pulse 1.8s ease-in-out infinite; }
  .log-enter{ animation:log-drop 0.45s cubic-bezier(0.34,1.56,0.64,1) both; }

  @media (prefers-reduced-motion: reduce){
    .flame-outer,.flame-mid,.flame-inner,.ember-glow{ animation:none !important; }
  }
</style>
</head>
<body>

<div id="stage">

  <div id="header">
    <div id="title">아궁이</div>
    <div id="subtitle">장작을 넣고 불을 지켜보세요</div>
  </div>

  <div id="stats">
    <div class="stat">
      <div class="stat-num" id="stat-burning">0</div>
      <div class="stat-label">타는 중</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">넣은 장작</div>
    </div>
  </div>

  <div id="scene">
    <div id="firelight"></div>
    <div id="hearth">
      <svg id="hearth-svg" viewBox="0 0 320 380" preserveAspectRatio="xMidYMax meet">
        <defs>
          <radialGradient id="mouthGlow" cx="50%" cy="55%" r="60%">
            <stop offset="0%" stop-color="#3a1c08" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#0a0706" stop-opacity="1"/>
          </radialGradient>
          <clipPath id="chamberClip">
            <path d="M48 360 L48 175 Q48 105 160 95 Q272 105 272 175 L272 360 Z"/>
          </clipPath>
        </defs>

        <!-- outer stone hearth body -->
        <path d="M10 380
                 L10 220
                 Q10 70 160 55
                 Q310 70 310 220
                 L310 380 Z"
              fill="var(--stone-2)"/>
        <path d="M10 380 L10 220 Q10 70 160 55 Q310 70 310 220 L310 380"
              fill="none" stroke="var(--stone-1)" stroke-width="3" opacity="0.5"/>

        <!-- inner mouth opening (dark chamber) -->
        <path d="M48 360 L48 175 Q48 105 160 95 Q272 105 272 175 L272 360 Z"
              fill="url(#mouthGlow)"/>

        <!-- chamber contents, clipped -->
        <g clip-path="url(#chamberClip)">
          <g id="ash-layer"></g>
          <g id="log-layer"></g>
          <g id="flame-layer"></g>
        </g>

        <!-- mouth rim, in front of chamber contents for depth -->
        <path d="M48 360 L48 175 Q48 105 160 95 Q272 105 272 175 L272 360"
              fill="none" stroke="var(--mouth-dark)" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

        <!-- stone texture lines (front face) -->
        <g stroke="var(--stone-1)" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round">
          <path d="M22 360 L22 240 Q24 130 95 90"/>
          <path d="M298 360 L298 240 Q296 130 225 90"/>
          <path d="M40 200 Q35 150 70 110"/>
          <path d="M280 200 Q285 150 250 110"/>
        </g>
        <g stroke="var(--stone-3)" stroke-width="1.5" fill="none" opacity="0.5">
          <path d="M65 70 Q160 40 255 70"/>
          <path d="M30 250 L10 250"/>
          <path d="M310 250 L290 250"/>
        </g>

        <!-- front lip / hearth floor ledge -->
        <path d="M10 358 Q160 372 310 358 L310 380 L10 380 Z" fill="var(--stone-3)"/>
        <ellipse cx="160" cy="360" rx="118" ry="9" fill="#000" opacity="0.35"/>
      </svg>

      <div id="particles"></div>
    </div>
  </div>

  <div id="controls">
    <button id="add-wood-btn">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span id="btn-label">장작 넣기</span>
    </button>
    <div id="clear-ash-btn">재 정리하기</div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------- state ----------
  // each log: {id, row, col, axis:'h'|'v', state:'fresh'|'burning'|'ash', progress, bornAt}
  var logs = [];
  var totalAdded = 0;
  var nextId = 1;
  var maxLogsVisible = 14; // chamber capacity before we start retiring oldest ash
  var rowHeight = 30;      // vertical spacing per stacked layer
  var baseY = 345;         // y of bottom-most log center in svg coords
  var burnDurationRange = [9000, 14000]; // ms fresh->ash per log, randomized

  var logLayer = document.getElementById('log-layer');
  var flameLayer = document.getElementById('flame-layer');
  var ashLayer = document.getElementById('ash-layer');
  var particlesEl = document.getElementById('particles');
  var firelight = document.getElementById('firelight');
  var addBtn = document.getElementById('add-wood-btn');
  var btnLabel = document.getElementById('btn-label');
  var clearAshBtn = document.getElementById('clear-ash-btn');
  var subtitleEl = document.getElementById('subtitle');
  var statBurning = document.getElementById('stat-burning');
  var statTotal = document.getElementById('stat-total');

  var subtitles = [
    "장작을 넣고 불을 지켜보세요",
    "불씨가 살아납니다",
    "타닥타닥 소리가 들리는 듯해요",
    "재가 되어가는 장작",
    "따뜻한 시간이에요"
  ];

  function setSubtitle(text){
    subtitleEl.style.opacity = 0;
    setTimeout(function(){
      subtitleEl.textContent = text;
      subtitleEl.style.opacity = 1;
    }, 250);
  }

  // ---------- layout helpers ----------
  // Logs stack like a 우물정자 (#) crib: alternating layers of parallel logs,
  // each layer rotated 90deg from the one below, with slight random jitter.
  function layerForIndex(idx){
    return Math.floor(idx / 2); // 2 logs per layer (left/right of center)
  }

  function computeLogTransform(log){
    var layer = layerForIndex(log.slot);
    var axis = (layer % 2 === 0) ? 'h' : 'v';
    var y = baseY - layer * rowHeight;
    var sideSign = (log.slot % 2 === 0) ? -1 : 1;
    var jitterX = log.jitter.x;
    var jitterY = log.jitter.y;
    var jitterRot = log.jitter.rot;

    if (axis === 'h'){
      var cx = 160 + sideSign * 14 + jitterX;
      return { x: cx, y: y + jitterY, rot: jitterRot, axis: 'h' };
    } else {
      var cy = y + jitterY;
      var cx2 = 160 + sideSign * 30 + jitterX * 0.6;
      return { x: cx2, y: cy, rot: 90 + jitterRot, axis: 'v' };
    }
  }

  function woodColorFor(state, progress){
    if (state === 'fresh') return { fill: 'var(--wood-fresh)', end:'var(--wood-fresh-end)' };
    if (state === 'ash') return { fill: 'var(--wood-ash)', end:'var(--wood-ash-end)' };
    // burning: interpolate fresh -> charred via mid
    if (progress < 0.5) return { fill: 'var(--wood-mid)', end:'var(--wood-mid-end)' };
    return { fill: 'var(--wood-charred)', end:'#190f0a' };
  }

  function logSvgGroup(log){
    var t = computeLogTransform(log);
    var length = 92;
    var thickness = 17;
    var colors = woodColorFor(log.state, log.progress);

    var g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('data-id', log.id);
    g.setAttribute('transform', 'translate(' + t.x + ',' + t.y + ') rotate(' + t.rot + ')');
    if (log.isNew){ g.classList.add('log-enter'); }

    var rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', -length/2);
    rect.setAttribute('y', -thickness/2);
    rect.setAttribute('width', length);
    rect.setAttribute('height', thickness);
    rect.setAttribute('rx', thickness/2);
    rect.setAttribute('fill', colors.fill);
    g.appendChild(rect);

    // end cap (cut face) - lighter ring to suggest cross-section
    var cap = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    cap.setAttribute('cx', length/2 - 3);
    cap.setAttribute('cy', 0);
    cap.setAttribute('rx', 3.2);
    cap.setAttribute('ry', thickness/2);
    cap.setAttribute('fill', colors.end);
    cap.setAttribute('opacity', '0.85');
    g.appendChild(cap);

    // bark texture lines
    var line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', -length/2 + 6);
    line.setAttribute('y1', -2);
    line.setAttribute('x2', length/2 - 8);
    line.setAttribute('y2', -2);
    line.setAttribute('stroke', 'rgba(0,0,0,0.18)');
    line.setAttribute('stroke-width', '1.4');
    g.appendChild(line);

    // embers on charred/ash surface
    if (log.state === 'burning' && log.progress > 0.35){
      var glowOpacity = Math.min(1, (log.progress - 0.35) * 1.6);
      for (var i=0;i<3;i++){
        var ec = document.createElementNS('http://www.w3.org/2000/svg','circle');
        var ex = -length/2 + 14 + i * (length-28)/2 + (log.jitter.emberOffsets ? log.jitter.emberOffsets[i] : 0);
        ec.setAttribute('cx', ex);
        ec.setAttribute('cy', (i%2===0)? -3 : 3);
        ec.setAttribute('r', 2.2);
        ec.setAttribute('fill', 'var(--ember)');
        ec.setAttribute('opacity', (0.5 + 0.5*glowOpacity).toFixed(2));
        ec.classList.add('ember-glow');
        g.appendChild(ec);
      }
    }
    if (log.state === 'ash'){
      for (var j=0;j<4;j++){
        var dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
        dot.setAttribute('cx', -length/2 + 10 + j * (length-20)/3);
        dot.setAttribute('cy', (j%2===0? -3.5 : 3.5));
        dot.setAttribute('r', 1.4);
        dot.setAttribute('fill', '#1c1a18');
        dot.setAttribute('opacity', '0.5');
        g.appendChild(dot);
      }
    }

    return g;
  }

  // ---------- render ----------
  function render(){
    // sort: ash first (bottom-most, less relevant) then burning then fresh,
    // but actual stacking order should follow slot index for visual crib structure.
    var sorted = logs.slice().sort(function(a,b){ return a.slot - b.slot; });

    logLayer.innerHTML = '';
    flameLayer.innerHTML = '';
    ashLayer.innerHTML = '';

    var burningCount = 0;
    var maxProgressBurning = 0;
    var anyBurning = false;

    sorted.forEach(function(log){
      var g = logSvgGroup(log);
      logLayer.appendChild(g);
      if (log.state === 'burning'){
        burningCount++;
        anyBurning = true;
        maxProgressBurning = Math.max(maxProgressBurning, log.progress);
      }
      log.isNew = false;
    });

    renderFlames(burningCount, sorted);

    statBurning.textContent = burningCount;
    statTotal.textContent = totalAdded;

    // firelight intensity follows burning count
    var intensity = Math.min(1, burningCount / 4);
    firelight.style.opacity = (0.35 + intensity * 0.85).toFixed(2);
    firelight.style.transform = 'translate(-50%,-50%) scale(' + (0.85 + intensity*0.35).toFixed(2) + ')';

    updateButtonState();
  }

  function renderFlames(burningCount, sortedLogs){
    if (burningCount === 0) return;

    // flame base sits at the height of the highest burning log layer
    var burningSlots = sortedLogs.filter(function(l){ return l.state==='burning'; });
    var maxLayer = 0;
    burningSlots.forEach(function(l){ maxLayer = Math.max(maxLayer, layerForIndex(l.slot)); });
    var baseFlameY = baseY - maxLayer * rowHeight - 6;

    var scale = Math.min(1.5, 0.7 + burningCount * 0.18);
    var cx = 160;

    var outer = flamePath(cx, baseFlameY, scale * 1.15, 'var(--flame-out)');
    outer.classList.add('flame-outer');
    flameLayer.appendChild(outer);

    var mid = flamePath(cx - 4, baseFlameY, scale * 0.82, 'var(--flame-mid)');
    mid.classList.add('flame-mid');
    flameLayer.appendChild(mid);

    var inner = flamePath(cx + 3, baseFlameY, scale * 0.5, 'var(--flame-in)');
    inner.classList.add('flame-inner');
    flameLayer.appendChild(inner);
  }

  function flamePath(cx, baseY, scale, color){
    var path = document.createElementNS('http://www.w3.org/2000/svg','path');
    var h = 95 * scale;
    var w = 38 * scale;
    var d = 'M ' + cx + ' ' + baseY + ' ' +
      'C ' + (cx - w*0.6) + ' ' + (baseY - h*0.35) + ', ' + (cx - w*0.3) + ' ' + (baseY - h*0.6) + ', ' + cx + ' ' + (baseY - h) + ' ' +
      'C ' + (cx + w*0.35) + ' ' + (baseY - h*0.65) + ', ' + (cx + w*0.65) + ' ' + (baseY - h*0.3) + ', ' + cx + ' ' + baseY + ' Z';
    path.setAttribute('d', d);
    path.setAttribute('fill', color);
    path.setAttribute('transform-origin', cx + 'px ' + baseY + 'px');
    return path;
  }

  function updateButtonState(){
    var activeLayers = logs.filter(function(l){ return l.state !== 'ash'; }).length;
    if (activeLayers >= maxLogsVisible){
      addBtn.classList.add('disabled');
      btnLabel.textContent = '아궁이가 가득 찼어요';
    } else {
      addBtn.classList.remove('disabled');
      btnLabel.textContent = '장작 넣기';
    }
    var ashCount = logs.filter(function(l){ return l.state === 'ash'; }).length;
    if (ashCount >= 3){
      clearAshBtn.classList.add('visible');
    } else {
      clearAshBtn.classList.remove('visible');
    }
  }

  // ---------- particles (sparks/smoke rising) ----------
  function spawnParticle(){
    var anyBurning = logs.some(function(l){ return l.state === 'burning'; });
    if (!anyBurning) return;
    var burningLayers = logs.filter(function(l){return l.state==='burning';})
                             .map(function(l){return layerForIndex(l.slot);});
    if (burningLayers.length === 0) return;
    var maxLayer = Math.max.apply(null, burningLayers);
    var approxYpct = ( (baseY - maxLayer*rowHeight) / 380 ) * 100;

    var el = document.createElement('div');
    el.className = 'particle';
    var isSpark = Math.random() < 0.6;
    var size = isSpark ? (2 + Math.random()*2) : (3 + Math.random()*4);
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.background = isSpark ? '#f5933a' : 'rgba(180,170,160,0.35)';
    el.style.left = (44 + Math.random()*22) + '%';
    el.style.top = approxYpct + '%';
    var duration = 1.6 + Math.random()*1.4;
    el.style.animation = 'rise-fade ' + duration + 's ease-out forwards';
    particlesEl.appendChild(el);
    setTimeout(function(){ el.remove(); }, duration*1000 + 100);
  }

  // ---------- log lifecycle ----------
  function randomJitter(){
    return {
      x: (Math.random()-0.5) * 6,
      y: (Math.random()-0.5) * 4,
      rot: (Math.random()-0.5) * 7,
      emberOffsets: [(Math.random()-0.5)*6, (Math.random()-0.5)*6, (Math.random()-0.5)*6]
    };
  }

  function addLog(){
    var activeLayers = logs.filter(function(l){ return l.state !== 'ash'; }).length;
    if (activeLayers >= maxLogsVisible) return;

    var slot = logs.length; // simple incremental slot; ash logs keep their slot until cleared
    var log = {
      id: nextId++,
      slot: slot,
      state: 'fresh',
      progress: 0,
      bornAt: Date.now(),
      duration: burnDurationRange[0] + Math.random()*(burnDurationRange[1]-burnDurationRange[0]),
      jitter: randomJitter(),
      isNew: true
    };
    logs.push(log);
    totalAdded++;

    // fresh -> burning shortly after being placed (catches fire from neighbors)
    setTimeout(function(){
      if (log.state === 'fresh'){
        log.state = 'burning';
        log.progress = 0;
        log.burnStart = Date.now();
        render();
      }
    }, 550 + Math.random()*400);

    render();
    setSubtitle(subtitles[Math.floor(Math.random()*subtitles.length)]);
  }

  function tick(){
    var changed = false;
    logs.forEach(function(log){
      if (log.state === 'burning'){
        var elapsed = Date.now() - log.burnStart;
        log.progress = Math.min(1, elapsed / log.duration);
        if (log.progress >= 1){
          log.state = 'ash';
          log.progress = 1;
        }
        changed = true;
      }
    });
    if (changed) render();

    // retire oldest ash if capacity pressure
    var ashLogs = logs.filter(function(l){ return l.state === 'ash'; });
    if (ashLogs.length > 6){
      var oldest = ashLogs.sort(function(a,b){return a.slot-b.slot;})[0];
      logs = logs.filter(function(l){ return l.id !== oldest.id; });
      render();
    }
  }

  function clearAsh(){
    var hadAsh = logs.some(function(l){ return l.state==='ash'; });
    if (!hadAsh) return;
    logs = logs.filter(function(l){ return l.state !== 'ash'; });
    // re-pack slots so remaining logs sit at the bottom of the crib again
    logs.sort(function(a,b){ return a.slot - b.slot; });
    logs.forEach(function(l, i){ l.slot = i; });
    render();
    setSubtitle('재를 깨끗이 정리했어요');
  }

  // ---------- events ----------
  addBtn.addEventListener('click', function(e){
    e.preventDefault();
    addLog();
  });
  clearAshBtn.addEventListener('click', function(e){
    e.preventDefault();
    clearAsh();
  });

  setInterval(tick, 400);
  setInterval(spawnParticle, 420);

  // seed with one log already gently smoldering for visual interest on load
  setTimeout(function(){
    addLog();
  }, 400);

  render();
})();
</script>
</body>
</html>
