<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>아궁이</title>
<style>
  :root{
    --bg-deep:#120d0a;
    --bg-room:#1c140f;
    --stone-1:#7a7872;
    --stone-2:#5c5a56;
    --stone-3:#3e3d3a;
    --stone-4:#4a4845;
    --stone-5:#6a6864;
    --mouth-dark:#0a0706;
    --iron-1:#2a2a2a;
    --iron-2:#1a1a1a;
    --iron-3:#383838;
    --wood-fresh:#7a5230;
    --wood-fresh-end:#5c3e22;
    --wood-mid:#5c3a1f;
    --wood-mid-end:#3f2614;
    --wood-charred:#2a1d14;
    --wood-ash:#4a4540;
    --wood-ash-end:#2e2b28;
    --ember:#e8742a;
    --flame-out:#e8581f;
    --flame-mid:#f5933a;
    --flame-in:#ffd571;
    --text-warm:#d8c4a8;
    --text-dim:#8a7762;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;
    background:var(--bg-deep);
    overflow:hidden;
    touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo',sans-serif;
  }
  #stage{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    background:
      radial-gradient(ellipse 140% 90% at 50% 78%, rgba(232,116,42,0.10) 0%, rgba(232,116,42,0) 55%),
      linear-gradient(to bottom, var(--bg-deep) 0%, var(--bg-room) 100%);
  }

  /* ---------- header ---------- */
  #header{
    flex:0 0 auto;
    padding:max(6px, env(safe-area-inset-top)) 16px 0px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  #title{
    font-size:11px;
    color:var(--text-warm);
    letter-spacing:0.06em;
    font-weight:400;
    opacity:0.65;
  }
  #subtitle{
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:0.02em;
    transition:opacity 0.4s;
    opacity:0.55;
  }

  /* ---------- ember glow counter ---------- */
  #stats{
    flex:0 0 auto;
    display:flex;
    justify-content:center;
    gap:18px;
    padding:1px 16px 1px;
  }
  .stat{
    display:flex;
    align-items:baseline;
    gap:3px;
  }
  .stat-num{
    font-size:11px;
    font-weight:400;
    color:var(--text-warm);
    font-variant-numeric:tabular-nums;
    opacity:0.75;
  }
  .stat-label{
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:0.02em;
    opacity:0.6;
  }

  /* ---------- scene ---------- */
  #scene{
    flex:1 1 auto;
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
  }

  #firelight{
    position:absolute;
    left:50%;top:38%;
    width:520px;height:520px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(245,147,58,0.16) 0%, rgba(245,147,58,0.05) 40%, rgba(245,147,58,0) 70%);
    pointer-events:none;
    transition:opacity 0.6s, transform 0.6s;
  }

  /* the hearth structure */
  #hearth{
    position:relative;
    width:100%;
    max-width:480px;
    height:62vh;
    margin:0 auto;
  }

  svg#hearth-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  /* particle layer above everything, clipped to flame chamber */
  #particles{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .particle{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    will-change:transform,opacity;
  }

  /* ---------- bottom controls ---------- */
  #controls{
    flex:0 0 auto;
    padding:14px 20px max(18px, env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  #add-wood-btn{
    width:100%;
    max-width:340px;
    padding:16px 0;
    border-radius:999px;
    border:1px solid rgba(216,196,168,0.22);
    background:linear-gradient(to bottom, rgba(58,47,40,0.6), rgba(42,34,28,0.6));
    color:var(--text-warm);
    font-size:15px;
    font-weight:500;
    letter-spacing:0.03em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform 0.12s, background 0.2s, opacity 0.3s;
  }
  #add-wood-btn:active{
    transform:scale(0.96);
    background:linear-gradient(to bottom, rgba(70,56,46,0.7), rgba(50,40,32,0.7));
  }
  #add-wood-btn.disabled{
    opacity:0.35;
    pointer-events:none;
  }
  .btn-icon{
    width:16px;height:16px;
    flex:0 0 auto;
  }
  #clear-ash-btn{
    font-size:12px;
    color:var(--text-dim);
    padding:6px 14px;
    letter-spacing:0.02em;
    opacity:0;
    transition:opacity 0.4s;
    pointer-events:none;
  }
  #clear-ash-btn.visible{
    opacity:0.7;
    pointer-events:auto;
  }
  #clear-ash-btn:active{
    opacity:1;
  }

  /* 불꽃 깜빡임 — 훨씬 느리게 */
  @keyframes flicker-a{
    0%,100%{ transform:scaleY(1) scaleX(1) skewX(0deg) translateY(0); }
    20%{ transform:scaleY(1.04) scaleX(0.98) skewX(1deg) translateY(-1px); }
    45%{ transform:scaleY(0.97) scaleX(1.02) skewX(-0.8deg) translateY(0px); }
    70%{ transform:scaleY(1.06) scaleX(0.97) skewX(1.5deg) translateY(-2px); }
    85%{ transform:scaleY(0.98) scaleX(1.01) skewX(-1deg) translateY(0); }
  }
  @keyframes flicker-b{
    0%,100%{ transform:scaleY(1) skewX(0deg); opacity:0.95; }
    30%{ transform:scaleY(1.08) skewX(-1.5deg); opacity:1; }
    60%{ transform:scaleY(0.94) skewX(1.8deg); opacity:0.88; }
  }
  @keyframes flicker-c{
    0%,100%{ transform:scaleY(1) skewX(0deg) translateX(0); opacity:0.9;}
    40%{ transform:scaleY(1.10) skewX(-2deg) translateX(1.5px); opacity:1;}
    75%{ transform:scaleY(0.95) skewX(1deg) translateX(-1px); opacity:0.82;}
  }
  @keyframes glow-pulse{
    0%,100%{ opacity:0.7; }
    50%{ opacity:1; }
  }
  @keyframes rise-fade{
    0%{ opacity:0.9; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(-90px) scale(0.25); }
  }
  @keyframes log-drop{
    0%{ transform:translateY(-26px); opacity:0; }
    60%{ transform:translateY(2px); opacity:1; }
    100%{ transform:translateY(0); opacity:1; }
  }
  @keyframes ember-surface{
    0%,100%{ opacity:0.55; }
    50%{ opacity:1; }
  }

  /* 불꽃 애니메이션 — 훨씬 느린 속도 */
  .flame-outer{ animation:flicker-a 4.2s ease-in-out infinite; transform-origin:50% 100%; }
  .flame-mid{ animation:flicker-b 3.1s ease-in-out infinite; transform-origin:50% 100%; }
  .flame-inner{ animation:flicker-c 2.3s ease-in-out infinite; transform-origin:50% 100%; }
  .ember-glow{ animation:glow-pulse 3.6s ease-in-out infinite; }
  .log-enter{ animation:log-drop 0.55s cubic-bezier(0.34,1.56,0.64,1) both; }

  @media (prefers-reduced-motion: reduce){
    .flame-outer,.flame-mid,.flame-inner,.ember-glow{ animation:none !important; }
  }
</style>
</head>
<body>

<audio id="bgm" src="/agungi.mp3" loop preload="auto"></audio>

<div id="stage">

  <div id="header">
    <div id="title">아궁이</div>
    <div id="subtitle">장작을 넣고 불을 지켜보세요</div>
  </div>

  <div id="stats">
    <div class="stat">
      <div class="stat-num" id="stat-burning">0</div>
      <div class="stat-label">타는 중</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">넣은 장작</div>
    </div>
  </div>

  <div id="scene">
    <div id="firelight"></div>
    <div id="hearth">
      <svg id="hearth-svg" viewBox="0 0 320 420" preserveAspectRatio="xMidYMax meet">
        <defs>
          <radialGradient id="mouthGlow" cx="50%" cy="60%" r="60%">
            <stop offset="0%" stop-color="#3a1c08" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#0a0706" stop-opacity="1"/>
          </radialGradient>
          <!-- 아궁이 내부 클립 영역 (직사각형) -->
          <clipPath id="chamberClip">
            <rect x="62" y="170" width="196" height="190"/>
          </clipPath>
          <!-- 불씨 표면 그라디언트 -->
          <radialGradient id="emberGrad1" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ffcc44" stop-opacity="1"/>
            <stop offset="40%" stop-color="#ff6600" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#cc2200" stop-opacity="0.3"/>
          </radialGradient>
          <radialGradient id="emberGrad2" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ff8800" stop-opacity="1"/>
            <stop offset="50%" stop-color="#cc3300" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#880000" stop-opacity="0.2"/>
          </radialGradient>
          <filter id="emberBlur">
            <feGaussianBlur stdDeviation="1.2"/>
          </filter>
          <filter id="flameSoftBlur">
            <feGaussianBlur stdDeviation="2.5"/>
          </filter>
          <!-- 솥 그라디언트 -->
          <radialGradient id="potGrad" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#484848" stop-opacity="1"/>
            <stop offset="60%" stop-color="#222222" stop-opacity="1"/>
            <stop offset="100%" stop-color="#111111" stop-opacity="1"/>
          </radialGradient>
          <radialGradient id="potSheen" cx="30%" cy="25%" r="50%">
            <stop offset="0%" stop-color="#666" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#111" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="stoneBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3e3d3a"/>
            <stop offset="30%" stop-color="#5c5a56"/>
            <stop offset="70%" stop-color="#5c5a56"/>
            <stop offset="100%" stop-color="#3e3d3a"/>
          </linearGradient>
          <linearGradient id="stoneFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#6a6864"/>
            <stop offset="100%" stop-color="#4a4845"/>
          </linearGradient>
        </defs>

        <!-- ===== 아궁이 몸체 (한국 전통 직사각형) ===== -->

        <!-- 뒷벽 / 몸체 전체 직사각형 (회색 돌) -->
        <rect x="20" y="130" width="280" height="260" rx="4" fill="url(#stoneBodyGrad)"/>

        <!-- 돌 질감 — 수평 줄눈 -->
        <g stroke="#3a3937" stroke-width="1.5" fill="none" opacity="0.7">
          <line x1="20" y1="175" x2="300" y2="175"/>
          <line x1="20" y1="220" x2="300" y2="220"/>
          <line x1="20" y1="265" x2="300" y2="265"/>
          <line x1="20" y1="310" x2="300" y2="310"/>
          <line x1="20" y1="355" x2="300" y2="355"/>
        </g>
        <!-- 수직 줄눈 (벽돌 패턴) -->
        <g stroke="#3a3937" stroke-width="1" fill="none" opacity="0.5">
          <line x1="80" y1="130" x2="80" y2="175"/>
          <line x1="160" y1="130" x2="160" y2="175"/>
          <line x1="240" y1="130" x2="240" y2="175"/>
          <line x1="50" y1="175" x2="50" y2="220"/>
          <line x1="120" y1="175" x2="120" y2="220"/>
          <line x1="200" y1="175" x2="200" y2="220"/>
          <line x1="270" y1="175" x2="270" y2="220"/>
          <line x1="80" y1="265" x2="80" y2="310"/>
          <line x1="200" y1="265" x2="200" y2="310"/>
          <line x1="50" y1="310" x2="50" y2="355"/>
          <line x1="160" y1="310" x2="160" y2="355"/>
          <line x1="270" y1="310" x2="270" y2="355"/>
        </g>

        <!-- 아궁이 입구 — 직사각형 구멍 -->
        <rect x="62" y="170" width="196" height="190" fill="url(#mouthGlow)"/>

        <!-- 아궁이 내부 내용물 (클립) -->
        <g clip-path="url(#chamberClip)">
          <g id="ash-layer"></g>
          <g id="log-layer"></g>
          <g id="flame-layer"></g>
        </g>

        <!-- 입구 테두리 (두꺼운 돌 테 — 전통 아궁이 느낌) -->
        <!-- 위 가로 테 -->
        <rect x="55" y="158" width="210" height="18" rx="2" fill="url(#stoneFaceGrad)"/>
        <rect x="55" y="158" width="210" height="4" fill="#7a7872" opacity="0.5"/>
        <!-- 왼쪽 세로 테 -->
        <rect x="48" y="158" width="18" height="202" rx="2" fill="url(#stoneFaceGrad)"/>
        <rect x="48" y="158" width="4" height="202" fill="#7a7872" opacity="0.4"/>
        <!-- 오른쪽 세로 테 -->
        <rect x="254" y="158" width="18" height="202" rx="2" fill="url(#stoneFaceGrad)"/>
        <rect x="268" y="158" width="4" height="202" fill="#3a3937" opacity="0.6"/>

        <!-- 아궁이 아랫바닥 덮개 (바닥 테 + 앞 선반) -->
        <rect x="20" y="358" width="280" height="32" rx="3" fill="#4a4845"/>
        <rect x="20" y="358" width="280" height="6" fill="#6a6864" opacity="0.6"/>
        <!-- 바닥 그림자 -->
        <ellipse cx="160" cy="388" rx="130" ry="8" fill="#000" opacity="0.4"/>

        <!-- 전면 하이라이트 (돌 앞면 질감) -->
        <rect x="48" y="158" width="224" height="200" fill="none" stroke="#5c5a56" stroke-width="1.5" rx="1" opacity="0.4"/>

        <!-- ===== 무쇠솥 — 아궁이에 매립, 뚜껑만 노출 ===== -->
        <!--
          솥 구조:
          - 아궁이 상단 y=130 라인에 솥이 얹혀 있음
          - 솥 몸체(하단 반구)는 아궁이 안으로 들어가 보이지 않음
          - 보이는 것: 솥 림(테두리) + 뚜껑(위로 볼록한 돔) + 꼭지
        -->

        <!-- 솥 림 그림자 (아궁이 위면에 드리우는 그림자) -->
        <ellipse cx="160" cy="133" rx="116" ry="10" fill="#000" opacity="0.5"/>

        <!-- 솥 림 (솥이 아궁이 위에 얹히는 넓적한 테두리) -->
        <ellipse cx="160" cy="128" rx="114" ry="13" fill="#1a1a1a"/>
        <ellipse cx="160" cy="126" rx="112" ry="11" fill="#252525"/>
        <!-- 림 하이라이트 (앞쪽 광택) -->
        <ellipse cx="160" cy="124" rx="108" ry="7" fill="none" stroke="#383838" stroke-width="2" opacity="0.8"/>



        <!-- 뚜껑 본체 (위로 볼록한 돔형, 실제 참조사진처럼 납작한 반원) -->
        <path d="M 52 126 Q 54 52 160 42 Q 266 52 268 126 Z" fill="url(#potGrad)"/>
        <!-- 뚜껑 측면 광택 (왼쪽 상단) -->
        <path d="M 70 118 Q 76 68 145 50 Q 110 58 80 95" fill="rgba(255,255,255,0.04)"/>
        <!-- 뚜껑 테두리 선 -->
        <path d="M 52 126 Q 54 52 160 42 Q 266 52 268 126" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>

        <!-- 뚜껑 꼭지 손잡이 -->
        <ellipse cx="160" cy="44" rx="20" ry="7" fill="#1a1a1a"/>
        <ellipse cx="160" cy="40" rx="16" ry="9" fill="#252525"/>
        <ellipse cx="160" cy="37" rx="11" ry="6" fill="#303030"/>
        <ellipse cx="160" cy="35" rx="7" ry="4" fill="#3c3c3c"/>
        <!-- 꼭지 하이라이트 -->
        <ellipse cx="157" cy="33" rx="4" ry="2" fill="#505050" opacity="0.6"/>

        <!-- 뚜껑 하단 림 접합선 (뚜껑이 솥 본체에 얹히는 선) -->
        <ellipse cx="160" cy="126" rx="108" ry="8" fill="#111111"/>
        <ellipse cx="160" cy="124" rx="106" ry="6" fill="#1e1e1e"/>
      </svg>

      <div id="particles"></div>
    </div>
  </div>

  <div id="controls">
    <button id="add-wood-btn">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span id="btn-label">장작 넣기</span>
    </button>
    <div id="clear-ash-btn">재 정리하기</div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var logs = [];
  var totalAdded = 0;
  var nextId = 1;
  var maxLogsVisible = 12;
  var rowHeight = 28;
  var baseY = 348;

  // ★ 1. 훨씬 긴 연소 시간 — 불멍답게 천천히
  var burnDurationRange = [90000, 150000]; // 1.5분~2.5분

  var logLayer = document.getElementById('log-layer');
  var flameLayer = document.getElementById('flame-layer');
  var ashLayer = document.getElementById('ash-layer');
  var particlesEl = document.getElementById('particles');
  var firelight = document.getElementById('firelight');
  var addBtn = document.getElementById('add-wood-btn');
  var btnLabel = document.getElementById('btn-label');
  var clearAshBtn = document.getElementById('clear-ash-btn');
  var subtitleEl = document.getElementById('subtitle');
  var statBurning = document.getElementById('stat-burning');
  var statTotal = document.getElementById('stat-total');

  var subtitles = [
    "장작을 넣고 불을 지켜보세요",
    "불씨가 살아납니다",
    "타닥타닥 소리가 들리는 듯해요",
    "재가 되어가는 장작",
    "따뜻한 시간이에요"
  ];

  function setSubtitle(text){
    subtitleEl.style.opacity = 0;
    setTimeout(function(){
      subtitleEl.textContent = text;
      subtitleEl.style.opacity = 1;
    }, 250);
  }

  var logsPerLayer = 3;
  function layerForIndex(idx){
    return Math.floor(idx / logsPerLayer);
  }

  // ★ 2. 자연스러운 장작 배치 — 가로로 가득, 사선, 랜덤 각도, 길이 변형
  function computeLogTransform(log){
    var layer = layerForIndex(log.slot);
    var posInLayer = log.slot % logsPerLayer;
    var y = baseY - layer * rowHeight;
    var jy = log.jitter.y;

    // 직사각형 아궁이: 폭이 일정 (196px, 62~258), 층마다 거의 동일한 폭 허용
    var layerNarrow = Math.min(1, layer * 0.02);
    var maxSpread = 55 * (1 - layerNarrow * 0.3);

    // 같은 층 안에서 좌/중/우로 고르게 분산시키고, 그 안에서 랜덤 지터를 더함
    var slotCenters = [-maxSpread, 0, maxSpread];
    var slotBase = slotCenters[posInLayer] || 0;
    var cx_offset = slotBase + log.jitter.cx_offset * (1 - layerNarrow * 0.5);

    var baseRot = log.jitter.baseRot; // 미리 계산된 랜덤 기본 각도
    var cx = 160 + cx_offset;
    return { x: cx, y: y + jy, rot: baseRot, length: log.jitter.logLength };
  }

  function woodColorFor(state, progress){
    if (state === 'fresh') return { fill: 'var(--wood-fresh)', end:'var(--wood-fresh-end)' };
    if (state === 'ash') return { fill: 'var(--wood-ash)', end:'var(--wood-ash-end)' };
    if (progress < 0.5) return { fill: 'var(--wood-mid)', end:'var(--wood-mid-end)' };
    return { fill: 'var(--wood-charred)', end:'#190f0a' };
  }

  // ★ 3+4. 장작 표면에 불씨가 자연스럽게 번짐 — 빨간 면적으로
  function drawEmberSurface(g, log, length, thickness){
    if (log.state !== 'burning') return;
    var progress = log.progress;

    // 불이 서서히 번지는 영역 (progress 0.1부터 시작, 전체로 퍼짐)
    var coverRatio = Math.max(0, Math.min(1, (progress - 0.08) / 0.7));
    if (coverRatio <= 0) return;

    var halfLen = length / 2;
    var coverLen = halfLen * 2 * coverRatio;
    var startX = -halfLen + (halfLen * 2 - coverLen) * 0.5 + log.jitter.emberSeed * 10 - 5;

    // 불씨 바닥 글로우 (번진 영역을 붉게)
    var glowRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    glowRect.setAttribute('x', startX);
    glowRect.setAttribute('y', -thickness/2 + 1);
    glowRect.setAttribute('width', Math.min(coverLen, length - 2));
    glowRect.setAttribute('height', thickness - 3);
    glowRect.setAttribute('rx', (thickness-3)/2);

    // 연소 단계별 색상
    var alpha, fillColor;
    if (progress < 0.35){
      alpha = 0.45 + coverRatio * 0.3;
      fillColor = 'rgba(200,60,10,' + alpha + ')';
    } else if (progress < 0.65){
      alpha = 0.55 + (progress - 0.35) * 0.6;
      fillColor = 'rgba(180,40,0,' + alpha + ')';
    } else {
      alpha = 0.4 + (1 - progress) * 0.4;
      fillColor = 'rgba(140,30,0,' + alpha + ')';
    }
    glowRect.setAttribute('fill', fillColor);
    glowRect.setAttribute('filter', 'url(#emberBlur)');
    g.appendChild(glowRect);

    // 불씨 반짝이는 핫스팟들 (장작 여러 곳에 분산)
    var numHotspots = Math.floor(3 + coverRatio * 5);
    var seed = log.jitter.emberSeed;
    for (var i = 0; i < numHotspots; i++){
      // 결정론적 랜덤 (jitter seed 기반)
      var frac = (seed * 13.7 + i * 7.3 + i * i * 0.9) % 1;
      var frac2 = (seed * 5.1 + i * 11.2 + 0.3) % 1;
      if (frac < 0) frac += 1;
      if (frac2 < 0) frac2 += 1;

      var hx = -halfLen * 0.85 + frac * (length * 0.85);
      // 불씨 영역 내에 배치
      if (hx < startX - 4 || hx > startX + coverLen + 4) continue;

      var hy = (frac2 - 0.5) * (thickness * 0.55);
      var hr = 2.5 + frac * 3.5;

      var brightGlow = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
      brightGlow.setAttribute('cx', hx);
      brightGlow.setAttribute('cy', hy);
      brightGlow.setAttribute('rx', hr);
      brightGlow.setAttribute('ry', hr * 0.7);

      var hAlpha;
      if (progress < 0.5) hAlpha = 0.6 + frac * 0.35;
      else hAlpha = Math.max(0.2, 0.8 - (progress - 0.5) * 1.2) + frac * 0.2;

      // 중심은 밝고 가장자리는 붉게
      var hColor = progress < 0.4
        ? 'rgba(255,' + Math.floor(140 + frac*80) + ',20,' + hAlpha + ')'
        : 'rgba(220,' + Math.floor(60 + frac*50) + ',0,' + hAlpha + ')';

      brightGlow.setAttribute('fill', hColor);
      brightGlow.classList.add('ember-glow');
      brightGlow.style.animationDuration = (2.5 + frac * 2) + 's';
      brightGlow.style.animationDelay = (frac2 * 2) + 's';
      g.appendChild(brightGlow);
    }
  }

  function logSvgGroup(log){
    var t = computeLogTransform(log);
    var length = t.length || 92;
    var thickness = 17;
    var colors = woodColorFor(log.state, log.progress);

    var g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('data-id', log.id);
    g.setAttribute('transform', 'translate(' + t.x + ',' + t.y + ') rotate(' + t.rot + ')');
    if (log.isNew){ g.classList.add('log-enter'); }

    // 장작 몸체
    var rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', -length/2);
    rect.setAttribute('y', -thickness/2);
    rect.setAttribute('width', length);
    rect.setAttribute('height', thickness);
    rect.setAttribute('rx', thickness/2);
    rect.setAttribute('fill', colors.fill);
    g.appendChild(rect);

    // 껍질 질감
    var bark1 = document.createElementNS('http://www.w3.org/2000/svg','rect');
    bark1.setAttribute('x', -length/2 + 4);
    bark1.setAttribute('y', -thickness/2 + 2);
    bark1.setAttribute('width', length - 8);
    bark1.setAttribute('height', thickness - 4);
    bark1.setAttribute('rx', (thickness-4)/2);
    bark1.setAttribute('fill', 'rgba(0,0,0,0.12)');
    g.appendChild(bark1);

    // ★ 3. 불씨 표면 (빨갛게 번지는 영역)
    drawEmberSurface(g, log, length, thickness);

    // 단면 캡
    var cap = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    cap.setAttribute('cx', length/2 - 3);
    cap.setAttribute('cy', 0);
    cap.setAttribute('rx', 3.2);
    cap.setAttribute('ry', thickness/2);
    cap.setAttribute('fill', colors.end);
    cap.setAttribute('opacity', '0.85');
    g.appendChild(cap);

    // 나이테 선 (단면)
    var ringOuter = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    ringOuter.setAttribute('cx', length/2 - 3);
    ringOuter.setAttribute('cy', 0);
    ringOuter.setAttribute('rx', 2);
    ringOuter.setAttribute('ry', thickness/2 - 3);
    ringOuter.setAttribute('fill', 'none');
    ringOuter.setAttribute('stroke', 'rgba(255,255,255,0.07)');
    ringOuter.setAttribute('stroke-width', '1');
    g.appendChild(ringOuter);

    // 나무결 선
    var line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', -length/2 + 6);
    line.setAttribute('y1', -2.5);
    line.setAttribute('x2', length/2 - 8);
    line.setAttribute('y2', -2.5);
    line.setAttribute('stroke', 'rgba(0,0,0,0.15)');
    line.setAttribute('stroke-width', '1.2');
    g.appendChild(line);
    var line2 = document.createElementNS('http://www.w3.org/2000/svg','line');
    line2.setAttribute('x1', -length/2 + 8);
    line2.setAttribute('y1', 2);
    line2.setAttribute('x2', length/2 - 10);
    line2.setAttribute('y2', 2);
    line2.setAttribute('stroke', 'rgba(0,0,0,0.10)');
    line2.setAttribute('stroke-width', '0.8');
    g.appendChild(line2);

    // 재 상태의 어두운 점들
    if (log.state === 'ash'){
      for (var j=0;j<5;j++){
        var dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
        dot.setAttribute('cx', -length/2 + 10 + j * (length-20)/4);
        dot.setAttribute('cy', (j%2===0? -3 : 3));
        dot.setAttribute('r', 1.4);
        dot.setAttribute('fill', '#1c1a18');
        dot.setAttribute('opacity', '0.5');
        g.appendChild(dot);
      }
    }

    return g;
  }

  // ---------- render ----------
  function render(){
    var sorted = logs.slice().sort(function(a,b){ return a.slot - b.slot; });

    logLayer.innerHTML = '';
    flameLayer.innerHTML = '';
    ashLayer.innerHTML = '';

    var burningCount = 0;
    var maxProgressBurning = 0;
    var anyBurning = false;

    sorted.forEach(function(log){
      var g = logSvgGroup(log);
      logLayer.appendChild(g);
      if (log.state === 'burning'){
        burningCount++;
        anyBurning = true;
        maxProgressBurning = Math.max(maxProgressBurning, log.progress);
      }
      log.isNew = false;
    });

    renderFlames(burningCount, sorted);

    statBurning.textContent = burningCount;
    statTotal.textContent = totalAdded;

    var intensity = Math.min(1, burningCount / 4);
    firelight.style.opacity = (0.35 + intensity * 0.85).toFixed(2);
    firelight.style.transform = 'translate(-50%,-50%) scale(' + (0.85 + intensity*0.35).toFixed(2) + ')';

    updateButtonState();
  }

  // ★ 4. 불꽃이 장작 여러 곳에서 자연스럽게 피어오름
  function renderFlames(burningCount, sortedLogs){
    if (burningCount === 0) return;

    var burningSlots = sortedLogs.filter(function(l){ return l.state==='burning'; });
    var maxLayer = 0;
    burningSlots.forEach(function(l){ maxLayer = Math.max(maxLayer, layerForIndex(l.slot)); });
    var baseFlameY = baseY - maxLayer * rowHeight - 6;

    var scale = Math.min(1.5, 0.5 + burningCount * 0.14);
    // 적정 크기 임계값: scale >= 0.7 이면 3겹 불꽃 + 애니메이션
    var isLargeFlame = scale >= 0.7;

    // 메인 불꽃 (중앙) — 항상 3겹
    var cx = 160;
    var outer = flamePath(cx, baseFlameY, scale * 1.1, 'var(--flame-out)', 0);
    outer.classList.add('flame-outer');
    flameLayer.appendChild(outer);

    var mid = flamePath(cx - 3, baseFlameY, scale * 0.78, 'var(--flame-mid)', 0.3);
    mid.classList.add('flame-mid');
    flameLayer.appendChild(mid);

    var inner = flamePath(cx + 2, baseFlameY, scale * 0.48, 'var(--flame-in)', 0.6);
    inner.classList.add('flame-inner');
    flameLayer.appendChild(inner);

    // ★ 장작 위 여러 위치에서 작은 불꽃들 (jitter 기반으로 분산)
    burningSlots.forEach(function(log, idx){
      var t = computeLogTransform(log);
      var offsets = log.jitter.flameOffsets;
      offsets.forEach(function(off, fi){
        var flameProgress = log.progress;
        var flameIntensity;
        if (flameProgress < 0.2) flameIntensity = flameProgress / 0.2;
        else if (flameProgress > 0.75) flameIntensity = (1 - flameProgress) / 0.25;
        else flameIntensity = 0.8 + Math.sin(flameProgress * Math.PI) * 0.2;

        if (flameIntensity < 0.05) return;

        var flameX = t.x + off.dx;
        var flameY = t.y + off.dy - 4;
        var flameScale = (0.32 + off.sz * 0.34) * scale * flameIntensity;

        if (isLargeFlame) {
          // 적정 크기 이상: 3겹으로 겹쳐서 실제 불 같은 효과 + 모두 애니메이션
          var animClasses = ['flame-outer', 'flame-mid', 'flame-inner'];
          var colors = ['var(--flame-out)', 'var(--flame-mid)', 'var(--flame-in)'];
          var scaleFactors = [1.0, 0.72, 0.44];
          var offsets3 = [0, -1.5, 1];
          for (var li = 0; li < 3; li++) {
            var lf = smallFlamePathColored(flameX + offsets3[li], flameY, flameScale * scaleFactors[li], colors[li]);
            lf.classList.add(animClasses[li]);
            lf.style.animationDuration = (2.0 + off.sz * 2.5 + li * 0.8) + 's';
            lf.style.animationDelay = (off.delay + li * 0.25) + 's';
            flameLayer.appendChild(lf);
          }
        } else {
          // 작은 불꽃: 단색 (기존 방식)
          var sf = smallFlamePath(flameX, flameY, flameScale, off.color);
          sf.style.animationDuration = (2.0 + off.sz * 2.5) + 's';
          sf.style.animationDelay = (off.delay) + 's';
          flameLayer.appendChild(sf);
        }
      });
    });
  }

  function flamePath(cx, baseY, scale, color, delay){
    var path = document.createElementNS('http://www.w3.org/2000/svg','path');
    var h = 95 * scale;
    var w = 38 * scale;
    var d = 'M ' + cx + ' ' + baseY + ' ' +
      'C ' + (cx - w*0.6) + ' ' + (baseY - h*0.35) + ', ' + (cx - w*0.3) + ' ' + (baseY - h*0.6) + ', ' + cx + ' ' + (baseY - h) + ' ' +
      'C ' + (cx + w*0.35) + ' ' + (baseY - h*0.65) + ', ' + (cx + w*0.65) + ' ' + (baseY - h*0.3) + ', ' + cx + ' ' + baseY + ' Z';
    path.setAttribute('d', d);
    path.setAttribute('fill', color);
    path.setAttribute('transform-origin', cx + 'px ' + baseY + 'px');
    if (delay) path.style.animationDelay = delay + 's';
    return path;
  }

  function smallFlamePath(cx, baseY, scale, colorIdx){
    var path = document.createElementNS('http://www.w3.org/2000/svg','path');
    var h = 95 * scale;
    var w = 30 * scale;
    var d = 'M ' + cx + ' ' + baseY + ' ' +
      'C ' + (cx - w*0.55) + ' ' + (baseY - h*0.35) + ', ' + (cx - w*0.25) + ' ' + (baseY - h*0.65) + ', ' + cx + ' ' + (baseY - h) + ' ' +
      'C ' + (cx + w*0.3) + ' ' + (baseY - h*0.65) + ', ' + (cx + w*0.6) + ' ' + (baseY - h*0.3) + ', ' + cx + ' ' + baseY + ' Z';
    path.setAttribute('d', d);
    var colors = ['var(--flame-out)','var(--flame-mid)','var(--flame-in)'];
    path.setAttribute('fill', colors[colorIdx % 3]);
    path.setAttribute('transform-origin', cx + 'px ' + baseY + 'px');
    path.setAttribute('opacity', '0.72');
    var anims = ['flicker-a','flicker-b','flicker-c'];
    path.classList.add(anims[colorIdx % 3]);
    return path;
  }

  // 3겹 불꽃용: 특정 색상 지정 가능한 버전
  function smallFlamePathColored(cx, baseY, scale, color){
    var path = document.createElementNS('http://www.w3.org/2000/svg','path');
    var h = 95 * scale;
    var w = 30 * scale;
    var d = 'M ' + cx + ' ' + baseY + ' ' +
      'C ' + (cx - w*0.55) + ' ' + (baseY - h*0.35) + ', ' + (cx - w*0.25) + ' ' + (baseY - h*0.65) + ', ' + cx + ' ' + (baseY - h) + ' ' +
      'C ' + (cx + w*0.3) + ' ' + (baseY - h*0.65) + ', ' + (cx + w*0.6) + ' ' + (baseY - h*0.3) + ', ' + cx + ' ' + baseY + ' Z';
    path.setAttribute('d', d);
    path.setAttribute('fill', color);
    path.setAttribute('transform-origin', cx + 'px ' + baseY + 'px');
    path.setAttribute('opacity', '0.75');
    return path;
  }

  function updateButtonState(){
    var activeLayers = logs.filter(function(l){ return l.state !== 'ash'; }).length;
    if (activeLayers >= maxLogsVisible){
      addBtn.classList.add('disabled');
      btnLabel.textContent = '아궁이가 가득 찼어요';
    } else {
      addBtn.classList.remove('disabled');
      btnLabel.textContent = '장작 넣기';
    }
    var ashCount = logs.filter(function(l){ return l.state === 'ash'; }).length;
    if (ashCount >= 3){
      clearAshBtn.classList.add('visible');
    } else {
      clearAshBtn.classList.remove('visible');
    }
  }

  // ---------- particles ----------
  function spawnParticle(){
    var anyBurning = logs.some(function(l){ return l.state === 'burning'; });
    if (!anyBurning) return;
    var burningLayers = logs.filter(function(l){return l.state==='burning';})
                             .map(function(l){return layerForIndex(l.slot);});
    if (burningLayers.length === 0) return;
    var maxLayer = Math.max.apply(null, burningLayers);
    var approxYpct = ( (baseY - maxLayer*rowHeight) / 420 ) * 100;

    var el = document.createElement('div');
    el.className = 'particle';
    var isSpark = Math.random() < 0.5;
    var size = isSpark ? (1.5 + Math.random()*2) : (3 + Math.random()*4);
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.background = isSpark ? '#f5933a' : 'rgba(180,170,160,0.30)';
    // ★ 파티클도 가운데만 아니라 넓게 분산
    el.style.left = (38 + Math.random()*34) + '%';
    el.style.top = approxYpct + '%';
    // ★ 더 느리게 올라감
    var duration = 3.0 + Math.random()*3.5;
    el.style.animation = 'rise-fade ' + duration + 's ease-out forwards';
    particlesEl.appendChild(el);
    setTimeout(function(){ el.remove(); }, duration*1000 + 100);
  }

  // ★ 2. randomJitter — 자연스러운 장작 배치
  function randomJitter(){
    // 기본 각도: 가로 놓인 장작 (±15도 내외) 혹은 사선 (30~60도)
    var rotVariants = [
      (Math.random()-0.5) * 22,           // 거의 수평
      (Math.random()-0.5) * 22,           // 거의 수평
      30 + (Math.random()-0.5) * 20,      // 오른쪽 사선
      -30 + (Math.random()-0.5) * 20,     // 왼쪽 사선
      15 + (Math.random()-0.5) * 12,      // 약간 사선
      -15 + (Math.random()-0.5) * 12,
    ];
    var baseRot = rotVariants[Math.floor(Math.random() * rotVariants.length)];
    var cx_offset = (Math.random()-0.5) * 22; // 슬롯 내 추가 지터(좌/중/우 배치는 별도 처리)
    var logLength = 70 + Math.random() * 32;  // 70~102 사이 길이
    var emberSeed = Math.random();

    // 장작 위에 불꽃 1~2곳만 분산 위치 (너무 많지 않게, 크게)
    var flameOffsets = [];
    var numFlames = 1 + Math.floor(Math.random() * 2); // 1~2개
    for (var f = 0; f < numFlames; f++){
      flameOffsets.push({
        dx: (Math.random()-0.5) * (logLength * 0.55),
        dy: -(Math.random() * 6 + 2),
        sz: Math.random(),
        color: Math.floor(Math.random() * 3),
        delay: Math.random() * 2.5
      });
    }

    return {
      x: (Math.random()-0.5) * 10,
      y: (Math.random()-0.5) * 5,
      rot: (Math.random()-0.5) * 8,
      baseRot: baseRot,
      cx_offset: cx_offset,
      logLength: logLength,
      emberSeed: emberSeed,
      flameOffsets: flameOffsets,
      emberOffsets: [(Math.random()-0.5)*8, (Math.random()-0.5)*8, (Math.random()-0.5)*8]
    };
  }

  function addLog(){
    var activeLayers = logs.filter(function(l){ return l.state !== 'ash'; }).length;
    if (activeLayers >= maxLogsVisible) return;

    var slot = logs.length;
    var log = {
      id: nextId++,
      slot: slot,
      state: 'fresh',
      progress: 0,
      bornAt: Date.now(),
      duration: burnDurationRange[0] + Math.random()*(burnDurationRange[1]-burnDurationRange[0]),
      jitter: randomJitter(),
      isNew: true
    };
    logs.push(log);
    totalAdded++;

    // ★ 5. 불붙는 시간도 천천히 — 5~12초 뒤에 불 붙음
    var igniteDelay = 5000 + Math.random() * 7000;
    setTimeout(function(){
      if (log.state === 'fresh'){
        log.state = 'burning';
        log.progress = 0;
        log.burnStart = Date.now();
        render();
      }
    }, igniteDelay);

    render();
    setSubtitle(subtitles[Math.floor(Math.random()*subtitles.length)]);
  }

  function tick(){
    var changed = false;
    logs.forEach(function(log){
      if (log.state === 'burning'){
        var elapsed = Date.now() - log.burnStart;
        log.progress = Math.min(1, elapsed / log.duration);
        if (log.progress >= 1){
          log.state = 'ash';
          log.progress = 1;
        }
        changed = true;
      }
    });
    if (changed) render();

    var ashLogs = logs.filter(function(l){ return l.state === 'ash'; });
    if (ashLogs.length > 6){
      var oldest = ashLogs.sort(function(a,b){return a.slot-b.slot;})[0];
      logs = logs.filter(function(l){ return l.id !== oldest.id; });
      render();
    }
  }

  function clearAsh(){
    var hadAsh = logs.some(function(l){ return l.state==='ash'; });
    if (!hadAsh) return;
    logs = logs.filter(function(l){ return l.state !== 'ash'; });
    logs.sort(function(a,b){ return a.slot - b.slot; });
    logs.forEach(function(l, i){ l.slot = i; });
    render();
    setSubtitle('재를 깨끗이 정리했어요');
  }

  addBtn.addEventListener('click', function(e){
    e.preventDefault();
    addLog();
  });
  clearAshBtn.addEventListener('click', function(e){
    e.preventDefault();
    clearAsh();
  });

  // ★ tick을 더 자주 돌려서 불씨 표면이 부드럽게 갱신됨
  setInterval(tick, 600);
  // ★ 파티클 더 적게, 더 천천히
  setInterval(spawnParticle, 800);

  render();

  // BGM 자동 재생 (브라우저 정책상 첫 인터랙션 후 시작)
  var bgm = document.getElementById('bgm');
  bgm.volume = 0.55;
  function startBgm(){
    bgm.play().catch(function(){});
    document.removeEventListener('click', startBgm);
    document.removeEventListener('touchstart', startBgm);
  }
  // 바로 재생 시도 (자동재생 허용된 경우)
  bgm.play().catch(function(){
    // 차단된 경우 첫 터치/클릭 때 재생
    document.addEventListener('click', startBgm);
    document.addEventListener('touchstart', startBgm);
  });
})();
</script>
