<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Aqua Healing</title>

<style>
* {
    margin: 0;
    padding: 0;
    overflow: hidden;
    box-sizing: border-box;
}

body {
    background: #001020;
}

canvas {
    display: block;
}

#text {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 24px;
    font-family: Arial;
    text-shadow: 0 0 10px white;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="text">🐠 Aqua Healing - 클릭하면 먹이를 줍니다</div>
<canvas id="aqua"></canvas>

<script>

const canvas = document.getElementById("aqua");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


let fishes = [];
let foods = [];
let bubbles = [];


// ================= 물고기 =================

class Fish {

    constructor() {

        this.x = Math.random() * canvas.width;
        this.y = 100 + Math.random() * (canvas.height - 250);

        this.size = 18 + Math.random() * 25;

        this.angle = Math.random() * Math.PI * 2;


        // 물고기마다 성격
        this.baseSpeed = 0.2 + Math.random() * 0.7;  // 전체 속도 낮춤
        this.speed = this.baseSpeed;

        this.turnSpeed = 0.015 + Math.random() * 0.04;

        this.tailSpeed = 150 + Math.random() * 250;  // 꼬리도 느리게

        // 속도 변화 타이머
        this.speedChangeTimer = Math.random() * 300;
        this.speedChangePeriod = 150 + Math.random() * 300;


        this.color =
            `hsl(${Math.random()*360},85%,60%)`;
    }


    update() {

        // 주기적으로 유영 속도를 랜덤하게 변화
        this.speedChangeTimer++;
        if(this.speedChangeTimer >= this.speedChangePeriod){
            this.baseSpeed = 0.15 + Math.random() * 0.75;
            this.speedChangeTimer = 0;
            this.speedChangePeriod = 150 + Math.random() * 300;
        }

        let target = null;
        let shortest = Infinity;


        // 가장 가까운 먹이 탐색
        for(let food of foods){

            let dx = food.x - this.x;
            let dy = food.y - this.y;

            let distance = Math.hypot(dx,dy);

            if(distance < shortest){
                shortest = distance;
                target = food;
            }
        }


        let targetAngle;


        if(target){

            // 먹이를 발견하면 조금 빨라짐
            this.speed =
                this.baseSpeed * 1.35;


            targetAngle = Math.atan2(
                target.y - this.y,
                target.x - this.x
            );


            // 먹이 먹기
            if(shortest < this.size){

                let index = foods.indexOf(target);

                if(index !== -1){
                    foods.splice(index,1);
                }
            }

        } else {

            // 자유 유영
            this.speed = this.baseSpeed;


            targetAngle =
                this.angle +
                (Math.random()-0.5)*0.25;
        }


        // 부드러운 회전
        let diff =
            targetAngle - this.angle;


        while(diff > Math.PI)
            diff -= Math.PI * 2;

        while(diff < -Math.PI)
            diff += Math.PI * 2;


        this.angle += diff * this.turnSpeed;


        // 이동
        this.x +=
            Math.cos(this.angle) * this.speed;

        this.y +=
            Math.sin(this.angle) * this.speed;


        // 화면 경계 처리
        if(this.x < -60)
            this.x = canvas.width + 60;

        if(this.x > canvas.width + 60)
            this.x = -60;


        if(this.y < 80)
            this.y = 80;

        if(this.y > canvas.height - 80)
            this.y = canvas.height - 80;
    }



    draw(){

        ctx.save();

        ctx.translate(this.x,this.y);
        ctx.rotate(this.angle);


        // 꼬리 움직임
        let tail =
            Math.sin(
                Date.now()/this.tailSpeed + this.x
            ) * 10;


        // 몸통
        ctx.fillStyle = this.color;

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            this.size,
            this.size/2,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        // 꼬리
        ctx.beginPath();

        ctx.moveTo(-this.size,0);

        ctx.lineTo(
            -this.size-25,
            -15 + tail
        );

        ctx.lineTo(
            -this.size-25,
            15 + tail
        );

        ctx.closePath();

        ctx.fill();


        // 눈
        ctx.fillStyle = "white";

        ctx.beginPath();

        ctx.arc(
            this.size/2,
            -4,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.restore();
    }
}


// 물고기 생성
for(let i=0;i<8;i++){
    fishes.push(new Fish());
}


// ================= 먹이 =================

canvas.addEventListener("click", e=>{

    foods.push({
        x:e.clientX,
        y:e.clientY
    });

});


// ================= 기포 =================

setInterval(()=>{

    bubbles.push({
        x: Math.random()*canvas.width,
        y: canvas.height+20,
        r: 3 + Math.random()*8,
        speed: 0.5 + Math.random()*2
    });

},300);


// ================= 배경 =================

function drawBackground(){

    let g =
    ctx.createLinearGradient(
        0,0,0,canvas.height
    );

    g.addColorStop(0,"#0b5fa5");
    g.addColorStop(1,"#001018");

    ctx.fillStyle = g;

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    // 햇살
    ctx.fillStyle =
        "rgba(255,255,255,0.03)";


    for(let i=0;i<7;i++){

        ctx.beginPath();

        ctx.moveTo(i*250,0);

        ctx.lineTo(
            i*250+100,
            canvas.height
        );

        ctx.lineTo(
            i*250+180,
            canvas.height
        );

        ctx.fill();
    }


    // 해초
    for(let i=0;i<25;i++){

        let x = i*70;

        ctx.strokeStyle = "#00aa55";
        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(
            x,
            canvas.height
        );

        ctx.quadraticCurveTo(
            x + Math.sin(Date.now()/800+i)*25,
            canvas.height-120,
            x,
            canvas.height-220
        );

        ctx.stroke();
    }
}


// ================= 애니메이션 =================

function animate(){

    drawBackground();


    // 기포
    for(let i=bubbles.length-1;i>=0;i--){

        let b = bubbles[i];

        b.y -= b.speed;


        ctx.strokeStyle =
            "rgba(255,255,255,0.5)";

        ctx.beginPath();

        ctx.arc(
            b.x,b.y,b.r,
            0,Math.PI*2
        );

        ctx.stroke();


        if(b.y < -20){
            bubbles.splice(i,1);
        }
    }


    // 먹이 표시
    for(let f of foods){

        ctx.fillStyle = "gold";

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    // 물고기 움직임
    for(let fish of fishes){

        fish.update();
        fish.draw();

    }


    requestAnimationFrame(animate);
}


animate();

</script>

</body>
</html>
