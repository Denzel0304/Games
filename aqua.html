<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Aqua Healing</title>

<style>
* {
    margin: 0;
    padding: 0;
    overflow: hidden;
    box-sizing: border-box;
    touch-action: manipulation;
}

body {
    background: #001020;
}

canvas {
    display: block;
}

#text {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 24px;
    font-family: Arial;
    text-shadow: 0 0 10px white;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="aqua"></canvas>

<script>

const canvas = document.getElementById("aqua");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


let fishes = [];
let foods = [];
let bubbles = [];


// ================= 물고기 =================

// 종류 정의
const FISH_TYPES = ["clownfish","butterfly","angelfish","tang","puffer","wrasse"];

class Fish {

    constructor(typeOverride) {

        this.x = Math.random() * canvas.width;
        this.y = 100 + Math.random() * (canvas.height - 250);

        this.type = typeOverride || FISH_TYPES[Math.floor(Math.random()*FISH_TYPES.length)];

        // 종류별 크기
        const sizeMap = {
            clownfish:  22 + Math.random()*8,
            butterfly:  24 + Math.random()*10,
            angelfish:  28 + Math.random()*12,
            tang:       26 + Math.random()*10,
            puffer:     20 + Math.random()*8,
            wrasse:     18 + Math.random()*8
        };
        this.size = sizeMap[this.type];
        this.baseSize = this.size;
        this.eatenCount = 0;

        this.angle = Math.random() * Math.PI * 2;
        // 왼쪽 방향으로도 출발하도록
        if(Math.random() < 0.5) this.angle = Math.PI + (Math.random()-0.5)*0.5;

        this.baseSpeed = 0.2 + Math.random() * 0.6;
        this.speed = this.baseSpeed;
        this.turnSpeed = 0.012 + Math.random() * 0.035;
        this.tailSpeed = 160 + Math.random() * 220;

        this.speedChangeTimer = Math.random() * 300;
        this.speedChangePeriod = 180 + Math.random() * 320;

        // 개체별 색상 미세변화
        this.hueShift = (Math.random()-0.5) * 18;
    }


    update() {

        this.speedChangeTimer++;
        if(this.speedChangeTimer >= this.speedChangePeriod){
            this.baseSpeed = 0.15 + Math.random() * 0.65;
            this.speedChangeTimer = 0;
            this.speedChangePeriod = 180 + Math.random() * 320;
        }

        let target = null;
        let shortest = Infinity;

        for(let food of foods){
            let d = Math.hypot(food.x - this.x, food.y - this.y);
            if(d < shortest){ shortest = d; target = food; }
        }

        let targetAngle;

        if(target){
            this.speed = this.baseSpeed * 1.4;
            targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
            if(shortest < this.size){
                let idx = foods.indexOf(target);
                if(idx !== -1){
                    foods.splice(idx,1);
                    this.eatenCount++;
                    let growthStep = Math.min(10, Math.floor(this.eatenCount / 10));
                    let growthFactor = 1 + (growthStep / 10) * 2; // 10개당 0.2배씩, 100개에서 3배
                    this.size = this.baseSize * growthFactor;
                }
            }
        } else {
            this.speed = this.baseSpeed;
            targetAngle = this.angle + (Math.random()-0.5)*0.22;
        }

        let diff = targetAngle - this.angle;
        while(diff >  Math.PI) diff -= Math.PI*2;
        while(diff < -Math.PI) diff += Math.PI*2;
        this.angle += diff * this.turnSpeed;

        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        if(this.x < -80)  this.x = canvas.width + 80;
        if(this.x > canvas.width + 80)  this.x = -80;
        if(this.y < 80)   this.y = 80;
        if(this.y > canvas.height - 80) this.y = canvas.height - 80;
    }


    draw(){
        ctx.save();
        ctx.translate(this.x, this.y);

        // 왼쪽을 향하면 Y축 반전
        const facingLeft = Math.cos(this.angle) < 0;
        if(facingLeft){
            ctx.scale(-1,1);
            ctx.rotate(Math.PI - this.angle);
        } else {
            ctx.rotate(this.angle);
        }

        const t  = Date.now();
        const s  = this.size;
        const tw = Math.sin(t / this.tailSpeed) * 0.28; // 꼬리 진동 (라디안)

        switch(this.type){
            case "clownfish":   this._drawClownfish(s, tw);   break;
            case "butterfly":   this._drawButterfly(s, tw);   break;
            case "angelfish":   this._drawAngelfish(s, tw);   break;
            case "tang":        this._drawTang(s, tw);        break;
            case "puffer":      this._drawPuffer(s, tw);      break;
            case "wrasse":      this._drawWrasse(s, tw);      break;
        }

        ctx.restore();
    }


    // ── 흰동가리 (니모) ──────────────────────────
    _drawClownfish(s, tw){
        const h = this.hueShift;

        // 꼬리
        ctx.save();
        ctx.translate(-s, 0);
        ctx.rotate(tw * 1.4);
        ctx.fillStyle = `hsl(${25+h},90%,55%)`;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.bezierCurveTo(-s*.5,-s*.55, -s*.9,-s*.5, -s*.85,0);
        ctx.bezierCurveTo(-s*.9, s*.5,  -s*.5, s*.55, 0,0);
        ctx.fill();
        // 꼬리 흰 줄
        ctx.strokeStyle="rgba(255,255,255,0.7)";
        ctx.lineWidth=s*0.07;
        ctx.beginPath();
        ctx.moveTo(-s*.2,-s*.4);
        ctx.lineTo(-s*.6, 0);
        ctx.lineTo(-s*.2, s*.4);
        ctx.stroke();
        ctx.restore();

        // 등지느러미
        ctx.fillStyle=`hsl(${25+h},85%,45%)`;
        ctx.beginPath();
        ctx.moveTo(-s*.3,-s*.45);
        ctx.bezierCurveTo(-s*.1,-s*.9, s*.4,-s*.85, s*.5,-s*.45);
        ctx.lineTo(-s*.3,-s*.45);
        ctx.fill();

        // 몸통 그라디언트
        let bg = ctx.createRadialGradient(0,-s*.1,s*.05, 0,-s*.1,s*.6);
        bg.addColorStop(0,`hsl(${28+h},100%,68%)`);
        bg.addColorStop(1,`hsl(${20+h},90%,42%)`);
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.ellipse(0,0, s, s*.58, 0, 0, Math.PI*2);
        ctx.fill();

        // 흰 줄 3개
        ctx.fillStyle = "rgba(255,255,255,0.88)";
        // 줄1 (머리 뒤)
        ctx.beginPath();
        ctx.ellipse(s*.42, 0, s*.09, s*.5, 0, 0, Math.PI*2);
        ctx.fill();
        // 줄2 (중간)
        ctx.beginPath();
        ctx.ellipse(0, 0, s*.09, s*.5, 0, 0, Math.PI*2);
        ctx.fill();
        // 줄3 (꼬리 앞)
        ctx.beginPath();
        ctx.ellipse(-s*.4, 0, s*.07, s*.42, 0, 0, Math.PI*2);
        ctx.fill();

        // 검은 테두리 효과
        ctx.strokeStyle="rgba(0,0,0,0.35)";
        ctx.lineWidth=s*0.06;
        ctx.beginPath();
        ctx.ellipse(0,0, s, s*.58, 0, 0, Math.PI*2);
        ctx.stroke();

        // 배지느러미
        ctx.fillStyle=`hsl(${25+h},80%,40%)`;
        ctx.beginPath();
        ctx.moveTo(s*.1, s*.52);
        ctx.lineTo(-s*.2, s*.85);
        ctx.lineTo(-s*.45, s*.55);
        ctx.fill();

        this._drawEye(s*.6, -s*.12, s*.1);
    }


    // ── 나비고기 ────────────────────────────────
    _drawButterfly(s, tw){
        const h = this.hueShift;

        // 꼬리
        ctx.save();
        ctx.translate(-s*.75, 0);
        ctx.rotate(tw * 1.2);
        ctx.fillStyle=`hsl(${48+h},95%,62%)`;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.bezierCurveTo(-s*.4,-s*.5, -s*.7,-s*.4, -s*.65,0);
        ctx.bezierCurveTo(-s*.7, s*.4, -s*.4, s*.5, 0,0);
        ctx.fill();
        ctx.restore();

        // 등지느러미 (긴 필라멘트)
        ctx.strokeStyle=`hsl(${48+h},90%,55%)`;
        ctx.lineWidth=s*0.06;
        ctx.beginPath();
        ctx.moveTo(s*.3,-s*.5);
        ctx.bezierCurveTo(s*.1,-s*1.2, -s*.3,-s*1.1, -s*.5,-s*.5);
        ctx.stroke();

        // 등지느러미 막
        ctx.fillStyle=`hsl(${48+h},85%,58%)`;
        ctx.beginPath();
        ctx.moveTo(s*.3,-s*.45);
        ctx.bezierCurveTo(s*.1,-s*.9, -s*.3,-s*.85, -s*.5,-s*.45);
        ctx.lineTo(-s*.5,-s*.45);
        ctx.fill();

        // 몸통
        let bg = ctx.createRadialGradient(0,0,s*.05, 0,0,s*.65);
        bg.addColorStop(0,`hsl(${52+h},100%,75%)`);
        bg.addColorStop(1,`hsl(${44+h},90%,50%)`);
        ctx.fillStyle=bg;
        ctx.beginPath();
        ctx.ellipse(0,0, s*.85, s*.55, 0, 0, Math.PI*2);
        ctx.fill();

        // 검은 눈 주변 마스크
        ctx.fillStyle="rgba(0,0,0,0.7)";
        ctx.beginPath();
        ctx.ellipse(s*.55, -s*.08, s*.18, s*.28, -0.3, 0, Math.PI*2);
        ctx.fill();

        // 세로 검은 줄들
        ctx.strokeStyle="rgba(0,0,0,0.45)";
        ctx.lineWidth=s*0.09;
        for(let xi of [-s*.35, -s*.05, s*.25]){
            ctx.beginPath();
            ctx.moveTo(xi, -s*.5);
            ctx.lineTo(xi,  s*.5);
            ctx.stroke();
        }

        ctx.strokeStyle="rgba(0,0,0,0.3)";
        ctx.lineWidth=s*0.055;
        ctx.beginPath();
        ctx.ellipse(0,0, s*.85, s*.55, 0, 0, Math.PI*2);
        ctx.stroke();

        this._drawEye(s*.58, -s*.08, s*.09);
    }


    // ── 엔젤피시 ────────────────────────────────
    _drawAngelfish(s, tw){
        const h = this.hueShift;

        // 꼬리 (부채형)
        ctx.save();
        ctx.translate(-s*.7, 0);
        ctx.rotate(tw);
        ctx.fillStyle=`hsl(${210+h},80%,55%)`;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.bezierCurveTo(-s*.3,-s*.7, -s*.7,-s*.65, -s*.75,0);
        ctx.bezierCurveTo(-s*.7, s*.65, -s*.3, s*.7, 0,0);
        ctx.fill();
        ctx.restore();

        // 아래 지느러미 (길고 흐르는 형태)
        ctx.fillStyle=`hsl(${210+h},75%,48%)`;
        ctx.beginPath();
        ctx.moveTo(-s*.1, s*.5);
        ctx.bezierCurveTo(-s*.2, s*1.1, -s*.5, s*1.2, -s*.7, s*.9);
        ctx.bezierCurveTo(-s*.6, s*.6, -s*.3, s*.55, -s*.1, s*.5);
        ctx.fill();

        // 등지느러미 (세로로 높은)
        ctx.fillStyle=`hsl(${215+h},80%,52%)`;
        ctx.beginPath();
        ctx.moveTo(-s*.1,-s*.5);
        ctx.bezierCurveTo(-s*.1,-s*1.15, s*.2,-s*1.2, s*.4,-s*.9);
        ctx.bezierCurveTo(s*.5,-s*.7, s*.4,-s*.5, s*.3,-s*.5);
        ctx.closePath();
        ctx.fill();

        // 몸통 (세로로 긴 마름모꼴)
        let bg = ctx.createRadialGradient(0,-s*.1,s*.05, 0,0,s*.75);
        bg.addColorStop(0,`hsl(${218+h},90%,72%)`);
        bg.addColorStop(0.6,`hsl(${212+h},85%,52%)`);
        bg.addColorStop(1,`hsl(${205+h},80%,38%)`);
        ctx.fillStyle=bg;
        ctx.beginPath();
        ctx.ellipse(0,0, s*.7, s*.62, 0, 0, Math.PI*2);
        ctx.fill();

        // 세로 줄무늬
        ctx.strokeStyle="rgba(255,255,255,0.25)";
        ctx.lineWidth=s*.08;
        for(let xi of [-s*.25, 0, s*.25]){
            ctx.beginPath();
            ctx.moveTo(xi,-s*.55);
            ctx.lineTo(xi, s*.55);
            ctx.stroke();
        }

        ctx.strokeStyle="rgba(0,0,0,0.2)";
        ctx.lineWidth=s*.05;
        ctx.beginPath();
        ctx.ellipse(0,0, s*.7, s*.62, 0, 0, Math.PI*2);
        ctx.stroke();

        this._drawEye(s*.52, -s*.1, s*.11);
    }


    // ── 블루탱 (도리) ───────────────────────────
    _drawTang(s, tw){
        const h = this.hueShift;

        // 꼬리 (초승달형)
        ctx.save();
        ctx.translate(-s*.8, 0);
        ctx.rotate(tw * 1.1);
        ctx.fillStyle=`hsl(${215+h},85%,55%)`;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.bezierCurveTo(-s*.2,-s*.6, -s*.6,-s*.55, -s*.7, -s*.1);
        ctx.bezierCurveTo(-s*.6, s*.55, -s*.2, s*.6, 0,0);
        // 초승달 안쪽 패임
        ctx.bezierCurveTo(-s*.3, s*.35, -s*.3,-s*.35, 0,0);
        ctx.fill();
        ctx.restore();

        // 등지느러미
        ctx.fillStyle=`hsl(${210+h},80%,48%)`;
        ctx.beginPath();
        ctx.moveTo(-s*.4,-s*.48);
        ctx.bezierCurveTo(-s*.2,-s*.85, s*.3,-s*.8, s*.45,-s*.48);
        ctx.lineTo(-s*.4,-s*.48);
        ctx.fill();

        // 몸통
        let bg = ctx.createRadialGradient(s*.1,-s*.1,s*.04, 0,0,s*.65);
        bg.addColorStop(0,`hsl(${220+h},95%,72%)`);
        bg.addColorStop(0.5,`hsl(${218+h},90%,55%)`);
        bg.addColorStop(1,`hsl(${210+h},85%,35%)`);
        ctx.fillStyle=bg;
        ctx.beginPath();
        ctx.ellipse(0,0, s, s*.62, 0, 0, Math.PI*2);
        ctx.fill();

        // 노란 꼬리자루 점
        ctx.fillStyle=`hsl(${55+h},100%,60%)`;
        ctx.beginPath();
        ctx.ellipse(-s*.72, 0, s*.12, s*.18, 0, 0, Math.PI*2);
        ctx.fill();

        // 검은 눈 라인
        ctx.strokeStyle="rgba(0,0,0,0.5)";
        ctx.lineWidth=s*.06;
        ctx.beginPath();
        ctx.moveTo(s*.55,-s*.35);
        ctx.lineTo(s*.55, s*.25);
        ctx.stroke();

        ctx.strokeStyle="rgba(0,0,0,0.18)";
        ctx.lineWidth=s*.05;
        ctx.beginPath();
        ctx.ellipse(0,0, s, s*.62, 0, 0, Math.PI*2);
        ctx.stroke();

        this._drawEye(s*.62, -s*.1, s*.11);
    }


    // ── 복어 ────────────────────────────────────
    _drawPuffer(s, tw){
        const h = this.hueShift;

        // 꼬리 (작고 둥근)
        ctx.save();
        ctx.translate(-s*.75, 0);
        ctx.rotate(tw * 0.9);
        ctx.fillStyle=`hsl(${45+h},80%,52%)`;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.bezierCurveTo(-s*.25,-s*.4, -s*.5,-s*.35, -s*.48,0);
        ctx.bezierCurveTo(-s*.5, s*.35, -s*.25, s*.4, 0,0);
        ctx.fill();
        ctx.restore();

        // 지느러미들 (작은 삼각형들)
        ctx.fillStyle=`hsl(${42+h},75%,50%)`;
        // 등
        ctx.beginPath();
        ctx.moveTo(-s*.1,-s*.58); ctx.lineTo(s*.25,-s*.9); ctx.lineTo(s*.4,-s*.58);
        ctx.fill();
        // 배
        ctx.beginPath();
        ctx.moveTo(-s*.1, s*.58); ctx.lineTo(s*.2, s*.85); ctx.lineTo(s*.4, s*.58);
        ctx.fill();

        // 몸통 (둥글둥글)
        let bg = ctx.createRadialGradient(-s*.05,-s*.1,s*.04, 0,0,s*.72);
        bg.addColorStop(0,`hsl(${50+h},95%,78%)`);
        bg.addColorStop(0.5,`hsl(${45+h},88%,58%)`);
        bg.addColorStop(1,`hsl(${38+h},80%,40%)`);
        ctx.fillStyle=bg;
        ctx.beginPath();
        ctx.ellipse(0,0, s*.92, s*.78, 0, 0, Math.PI*2);
        ctx.fill();

        // 가시 패턴 (점선)
        ctx.fillStyle="rgba(0,0,0,0.2)";
        for(let px=-s*.5;px<s*.6;px+=s*.22){
            for(let py=-s*.4;py<s*.45;py+=s*.22){
                if(Math.hypot(px,py) < s*.75){
                    ctx.beginPath();
                    ctx.arc(px,py, s*.04, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        // 배 흰색 부분
        ctx.fillStyle="rgba(255,255,255,0.18)";
        ctx.beginPath();
        ctx.ellipse(s*.05, s*.2, s*.6, s*.35, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.strokeStyle="rgba(0,0,0,0.2)";
        ctx.lineWidth=s*.05;
        ctx.beginPath();
        ctx.ellipse(0,0, s*.92, s*.78, 0, 0, Math.PI*2);
        ctx.stroke();

        this._drawEye(s*.55, -s*.08, s*.13);
    }


    // ── 놀래기 (Wrasse) ─────────────────────────
    _drawWrasse(s, tw){
        const h = this.hueShift;

        // 꼬리 (둥근 부채)
        ctx.save();
        ctx.translate(-s*.8, 0);
        ctx.rotate(tw * 1.3);
        ctx.fillStyle=`hsl(${145+h},70%,45%)`;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.bezierCurveTo(-s*.3,-s*.52, -s*.65,-s*.48, -s*.68,0);
        ctx.bezierCurveTo(-s*.65, s*.48, -s*.3, s*.52, 0,0);
        ctx.fill();
        ctx.restore();

        // 등지느러미 (긴 줄기형)
        ctx.fillStyle=`hsl(${150+h},65%,42%)`;
        ctx.beginPath();
        ctx.moveTo(-s*.5,-s*.45);
        ctx.bezierCurveTo(-s*.3,-s*.78, s*.3,-s*.75, s*.5,-s*.45);
        ctx.fill();

        // 몸통
        let bg = ctx.createLinearGradient(-s, -s*.3, s, s*.3);
        bg.addColorStop(0,`hsl(${152+h},80%,58%)`);
        bg.addColorStop(0.4,`hsl(${145+h},75%,48%)`);
        bg.addColorStop(1,`hsl(${135+h},70%,38%)`);
        ctx.fillStyle=bg;
        ctx.beginPath();
        ctx.ellipse(0,0, s, s*.5, 0, 0, Math.PI*2);
        ctx.fill();

        // 가로 줄무늬
        ctx.strokeStyle="rgba(255,255,255,0.22)";
        ctx.lineWidth=s*.06;
        for(let yi of [-s*.18, 0, s*.18]){
            ctx.beginPath();
            ctx.moveTo(-s*.8, yi);
            ctx.lineTo(s*.8,  yi);
            ctx.stroke();
        }

        // 머리 색 구분
        ctx.fillStyle=`hsl(${155+h},78%,35%)`;
        ctx.beginPath();
        ctx.ellipse(s*.6, 0, s*.38, s*.46, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.strokeStyle="rgba(0,0,0,0.18)";
        ctx.lineWidth=s*.05;
        ctx.beginPath();
        ctx.ellipse(0,0, s, s*.5, 0, 0, Math.PI*2);
        ctx.stroke();

        this._drawEye(s*.68, -s*.1, s*.1);
    }


    // ── 공통: 눈 ────────────────────────────────
    _drawEye(ex, ey, r){
        // 공막
        ctx.fillStyle="#fff";
        ctx.beginPath();
        ctx.arc(ex, ey, r, 0, Math.PI*2);
        ctx.fill();
        // 홍채
        ctx.fillStyle="rgba(0,0,0,0.85)";
        ctx.beginPath();
        ctx.arc(ex+r*0.15, ey, r*0.6, 0, Math.PI*2);
        ctx.fill();
        // 하이라이트
        ctx.fillStyle="rgba(255,255,255,0.9)";
        ctx.beginPath();
        ctx.arc(ex+r*0.25, ey-r*0.25, r*0.25, 0, Math.PI*2);
        ctx.fill();
    }
}


// 물고기 생성 (종류별 최소 1마리씩 보장)
for(let i=0;i<FISH_TYPES.length;i++){
    fishes.push(new Fish(FISH_TYPES[i]));
}
// 나머지 랜덤으로 추가
for(let i=0;i<3;i++){
    fishes.push(new Fish());
}


// ================= 먹이 =================

canvas.addEventListener("click", e=>{

    foods.push({
        x:e.clientX,
        y:e.clientY
    });

});


// ================= 기포 =================

setInterval(()=>{

    bubbles.push({
        x: Math.random()*canvas.width,
        y: canvas.height+20,
        r: 3 + Math.random()*8,
        speed: 0.3 + Math.random()*1.2
    });

},600);


// ================= 배경 =================

function drawBackground(){

    let g =
    ctx.createLinearGradient(
        0,0,0,canvas.height
    );

    g.addColorStop(0,"#0b5fa5");
    g.addColorStop(1,"#001018");

    ctx.fillStyle = g;

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    // 햇살
    ctx.fillStyle =
        "rgba(255,255,255,0.03)";


    for(let i=0;i<7;i++){

        ctx.beginPath();

        ctx.moveTo(i*250,0);

        ctx.lineTo(
            i*250+100,
            canvas.height
        );

        ctx.lineTo(
            i*250+180,
            canvas.height
        );

        ctx.fill();
    }


    // 해초
    for(let i=0;i<25;i++){

        let x = i*70;

        ctx.strokeStyle = "#00aa55";
        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(
            x,
            canvas.height
        );

        ctx.quadraticCurveTo(
            x + Math.sin(Date.now()/800+i)*25,
            canvas.height-120,
            x,
            canvas.height-220
        );

        ctx.stroke();
    }
}


// ================= 애니메이션 =================

function animate(){

    drawBackground();


    // 기포
    for(let i=bubbles.length-1;i>=0;i--){

        let b = bubbles[i];

        b.y -= b.speed;


        ctx.strokeStyle =
            "rgba(255,255,255,0.5)";
        ctx.lineWidth = 1;

        ctx.beginPath();

        ctx.arc(
            b.x,b.y,b.r,
            0,Math.PI*2
        );

        ctx.stroke();


        if(b.y < -20){
            bubbles.splice(i,1);
        }
    }


    // 먹이 표시
    for(let f of foods){

        ctx.fillStyle = "gold";

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    // 물고기 움직임
    for(let fish of fishes){

        fish.update();
        fish.draw();

    }


    requestAnimationFrame(animate);
}


animate();

</script>
