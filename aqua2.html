function drawPreviewFish(cvs, type){
    const c = cvs.getContext("2d");
    const W = cvs.width, H = cvs.height;
    c.clearRect(0,0,W,H);

    // 배경 (어항 느낌)
    const bg = c.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#0d4a8a"); bg.addColorStop(1,"#001a30");
    c.fillStyle=bg; c.fillRect(0,0,W,H);

    // 해초 장식
    c.strokeStyle="rgba(0,180,90,0.5)"; c.lineWidth=2;
    for(let i=0;i<3;i++){
        const x = W*0.12 + i*W*0.38;
        c.beginPath();
        c.moveTo(x,H);
        c.quadraticCurveTo(x+8, H*0.55, x, H*0.3);
        c.stroke();
    }

    // 물고기 크기: 캔버스에 맞게 (가로 기준)
    const s = W * 0.28;
    const h = 0; // hueShift

    c.save();
    c.translate(W*0.54, H*0.5);
    // 오른쪽 방향(기본)으로 그림
    _previewDrawFish(c, type, s, h);
    c.restore();
}

function _previewEye(c, s, ex, ey, r){
    c.fillStyle="#fff"; c.beginPath(); c.arc(ex,ey,r,0,Math.PI*2); c.fill();
    c.fillStyle="rgba(0,0,0,0.85)"; c.beginPath(); c.arc(ex+r*0.15,ey,r*0.6,0,Math.PI*2); c.fill();
    c.fillStyle="rgba(255,255,255,0.9)"; c.beginPath(); c.arc(ex+r*0.25,ey-r*0.25,r*0.25,0,Math.PI*2); c.fill();
}

function _previewDrawFish(c, type, s, h){
    const tw = Math.sin(Date.now()/180)*0.22;
    switch(type){
        case "clownfish": _pClownfish(c,s,tw,h); break;
        case "butterfly": _pButterfly(c,s,tw,h); break;
        case "angelfish": _pAngelfish(c,s,tw,h); break;
        case "tang":      _pTang(c,s,tw,h);      break;
        case "puffer":    _pPuffer(c,s,tw,h);    break;
        case "wrasse":    _pWrasse(c,s,tw,h);    break;
        case "turtle":    _pTurtle(c,s,tw,h);    break;
        case "whale":     _pWhale(c,s,tw,h);     break;
        case "ray":       _pRay(c,s,tw,h);       break;
    }
}

function _pClownfish(c,s,tw,h){
    c.save(); c.translate(-s,0); c.rotate(tw*1.4);
    c.fillStyle=`hsl(${25+h},90%,55%)`;
    c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-s*.5,-s*.55,-s*.9,-s*.5,-s*.85,0); c.bezierCurveTo(-s*.9,s*.5,-s*.5,s*.55,0,0); c.fill();
    c.strokeStyle="rgba(255,255,255,0.7)"; c.lineWidth=s*0.07;
    c.beginPath(); c.moveTo(-s*.2,-s*.4); c.lineTo(-s*.6,0); c.lineTo(-s*.2,s*.4); c.stroke();
    c.restore();
    c.fillStyle=`hsl(${25+h},85%,45%)`;
    c.beginPath(); c.moveTo(-s*.3,-s*.45); c.bezierCurveTo(-s*.1,-s*.9,s*.4,-s*.85,s*.5,-s*.45); c.lineTo(-s*.3,-s*.45); c.fill();
    let bg=c.createRadialGradient(0,-s*.1,s*.05,0,-s*.1,s*.6);
    bg.addColorStop(0,`hsl(${28+h},100%,68%)`); bg.addColorStop(1,`hsl(${20+h},90%,42%)`);
    c.fillStyle=bg; c.beginPath(); c.ellipse(0,0,s,s*.58,0,0,Math.PI*2); c.fill();
    c.fillStyle="rgba(255,255,255,0.88)";
    c.beginPath(); c.ellipse(s*.42,0,s*.09,s*.5,0,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(0,0,s*.09,s*.5,0,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(-s*.4,0,s*.07,s*.42,0,0,Math.PI*2); c.fill();
    c.strokeStyle="rgba(0,0,0,0.35)"; c.lineWidth=s*0.06;
    c.beginPath(); c.ellipse(0,0,s,s*.58,0,0,Math.PI*2); c.stroke();
    c.fillStyle=`hsl(${25+h},80%,40%)`;
    c.beginPath(); c.moveTo(s*.1,s*.52); c.lineTo(-s*.2,s*.85); c.lineTo(-s*.45,s*.55); c.fill();
    _previewEye(c,s,s*.6,-s*.12,s*.1);
}
function _pButterfly(c,s,tw,h){
    c.save(); c.translate(-s*.75,0); c.rotate(tw*1.2);
    c.fillStyle=`hsl(${48+h},95%,62%)`;
    c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-s*.4,-s*.5,-s*.7,-s*.4,-s*.65,0); c.bezierCurveTo(-s*.7,s*.4,-s*.4,s*.5,0,0); c.fill();
    c.restore();
    c.strokeStyle=`hsl(${48+h},90%,55%)`; c.lineWidth=s*0.06;
    c.beginPath(); c.moveTo(s*.3,-s*.5); c.bezierCurveTo(s*.1,-s*1.2,-s*.3,-s*1.1,-s*.5,-s*.5); c.stroke();
    c.fillStyle=`hsl(${48+h},85%,58%)`;
    c.beginPath(); c.moveTo(s*.3,-s*.45); c.bezierCurveTo(s*.1,-s*.9,-s*.3,-s*.85,-s*.5,-s*.45); c.lineTo(-s*.5,-s*.45); c.fill();
    let bg=c.createRadialGradient(0,0,s*.05,0,0,s*.65);
    bg.addColorStop(0,`hsl(${52+h},100%,75%)`); bg.addColorStop(1,`hsl(${44+h},90%,50%)`);
    c.fillStyle=bg; c.beginPath(); c.ellipse(0,0,s*.85,s*.55,0,0,Math.PI*2); c.fill();
    c.fillStyle="rgba(0,0,0,0.7)"; c.beginPath(); c.ellipse(s*.55,-s*.08,s*.18,s*.28,-0.3,0,Math.PI*2); c.fill();
    c.strokeStyle="rgba(0,0,0,0.45)"; c.lineWidth=s*0.09;
    for(let xi of [-s*.35,-s*.05,s*.25]){ c.beginPath(); c.moveTo(xi,-s*.5); c.lineTo(xi,s*.5); c.stroke(); }
    c.strokeStyle="rgba(0,0,0,0.3)"; c.lineWidth=s*0.055;
    c.beginPath(); c.ellipse(0,0,s*.85,s*.55,0,0,Math.PI*2); c.stroke();
    _previewEye(c,s,s*.58,-s*.08,s*.09);
}
function _pAngelfish(c,s,tw,h){
    c.save(); c.translate(-s*.7,0); c.rotate(tw);
    c.fillStyle=`hsl(${210+h},80%,55%)`;
    c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-s*.3,-s*.7,-s*.7,-s*.65,-s*.75,0); c.bezierCurveTo(-s*.7,s*.65,-s*.3,s*.7,0,0); c.fill();
    c.restore();
    c.fillStyle=`hsl(${210+h},75%,48%)`;
    c.beginPath(); c.moveTo(-s*.1,s*.5); c.bezierCurveTo(-s*.2,s*1.1,-s*.5,s*1.2,-s*.7,s*.9); c.bezierCurveTo(-s*.6,s*.6,-s*.3,s*.55,-s*.1,s*.5); c.fill();
    c.fillStyle=`hsl(${215+h},80%,52%)`;
    c.beginPath(); c.moveTo(-s*.1,-s*.5); c.bezierCurveTo(-s*.1,-s*1.15,s*.2,-s*1.2,s*.4,-s*.9); c.bezierCurveTo(s*.5,-s*.7,s*.4,-s*.5,s*.3,-s*.5); c.closePath(); c.fill();
    let bg=c.createRadialGradient(0,-s*.1,s*.05,0,0,s*.75);
    bg.addColorStop(0,`hsl(${218+h},90%,72%)`); bg.addColorStop(0.6,`hsl(${212+h},85%,52%)`); bg.addColorStop(1,`hsl(${205+h},80%,38%)`);
    c.fillStyle=bg; c.beginPath(); c.ellipse(0,0,s*.7,s*.62,0,0,Math.PI*2); c.fill();
    c.strokeStyle="rgba(255,255,255,0.25)"; c.lineWidth=s*.08;
    for(let xi of [-s*.25,0,s*.25]){ c.beginPath(); c.moveTo(xi,-s*.55); c.lineTo(xi,s*.55); c.stroke(); }
    c.strokeStyle="rgba(0,0,0,0.2)"; c.lineWidth=s*.05;
    c.beginPath(); c.ellipse(0,0,s*.7,s*.62,0,0,Math.PI*2); c.stroke();
    _previewEye(c,s,s*.52,-s*.1,s*.11);
}
function _pTang(c,s,tw,h){
    c.save(); c.translate(-s*.8,0); c.rotate(tw*1.1);
    c.fillStyle=`hsl(${215+h},85%,55%)`;
    c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-s*.2,-s*.6,-s*.6,-s*.55,-s*.7,-s*.1); c.bezierCurveTo(-s*.6,s*.55,-s*.2,s*.6,0,0); c.bezierCurveTo(-s*.3,s*.35,-s*.3,-s*.35,0,0); c.fill();
    c.restore();
    c.fillStyle=`hsl(${210+h},80%,48%)`;
    c.beginPath(); c.moveTo(-s*.4,-s*.48); c.bezierCurveTo(-s*.2,-s*.85,s*.3,-s*.8,s*.45,-s*.48); c.lineTo(-s*.4,-s*.48); c.fill();
    let bg=c.createRadialGradient(s*.1,-s*.1,s*.04,0,0,s*.65);
    bg.addColorStop(0,`hsl(${220+h},95%,72%)`); bg.addColorStop(0.5,`hsl(${218+h},90%,55%)`); bg.addColorStop(1,`hsl(${210+h},85%,35%)`);
    c.fillStyle=bg; c.beginPath(); c.ellipse(0,0,s,s*.62,0,0,Math.PI*2); c.fill();
    c.fillStyle=`hsl(${55+h},100%,60%)`;
    c.beginPath(); c.ellipse(-s*.72,0,s*.12,s*.18,0,0,Math.PI*2); c.fill();
    c.strokeStyle="rgba(0,0,0,0.5)"; c.lineWidth=s*.06;
    c.beginPath(); c.moveTo(s*.55,-s*.35); c.lineTo(s*.55,s*.25); c.stroke();
    c.strokeStyle="rgba(0,0,0,0.18)"; c.lineWidth=s*.05;
    c.beginPath(); c.ellipse(0,0,s,s*.62,0,0,Math.PI*2); c.stroke();
    _previewEye(c,s,s*.62,-s*.1,s*.11);
}
function _pPuffer(c,s,tw,h){
    c.save(); c.translate(-s*.75,0); c.rotate(tw*0.9);
    c.fillStyle=`hsl(${45+h},80%,52%)`;
    c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-s*.25,-s*.4,-s*.5,-s*.35,-s*.48,0); c.bezierCurveTo(-s*.5,s*.35,-s*.25,s*.4,0,0); c.fill();
    c.restore();
    c.fillStyle=`hsl(${42+h},75%,50%)`;
    c.beginPath(); c.moveTo(-s*.1,-s*.58); c.lineTo(s*.25,-s*.9); c.lineTo(s*.4,-s*.58); c.fill();
    c.beginPath(); c.moveTo(-s*.1,s*.58); c.lineTo(s*.2,s*.85); c.lineTo(s*.4,s*.58); c.fill();
    let bg=c.createRadialGradient(-s*.05,-s*.1,s*.04,0,0,s*.72);
    bg.addColorStop(0,`hsl(${50+h},95%,78%)`); bg.addColorStop(0.5,`hsl(${45+h},88%,58%)`); bg.addColorStop(1,`hsl(${38+h},80%,40%)`);
    c.fillStyle=bg; c.beginPath(); c.ellipse(0,0,s*.92,s*.78,0,0,Math.PI*2); c.fill();
    c.fillStyle="rgba(0,0,0,0.2)";
    for(let px=-s*.5;px<s*.6;px+=s*.22){
        for(let py=-s*.4;py<s*.45;py+=s*.22){
            if(Math.hypot(px,py)<s*.75){ c.beginPath(); c.arc(px,py,s*.04,0,Math.PI*2); c.fill(); }
        }
    }
    c.strokeStyle="rgba(0,0,0,0.2)"; c.lineWidth=s*.05;
    c.beginPath(); c.ellipse(0,0,s*.92,s*.78,0,0,Math.PI*2); c.stroke();
    _previewEye(c,s,s*.55,-s*.08,s*.13);
}
function _pWrasse(c,s,tw,h){
    c.save(); c.translate(-s*.8,0); c.rotate(tw*1.3);
    c.fillStyle=`hsl(${145+h},70%,45%)`;
    c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-s*.3,-s*.52,-s*.65,-s*.48,-s*.68,0); c.bezierCurveTo(-s*.65,s*.48,-s*.3,s*.52,0,0); c.fill();
    c.restore();
    c.fillStyle=`hsl(${150+h},65%,42%)`;
    c.beginPath(); c.moveTo(-s*.5,-s*.45); c.bezierCurveTo(-s*.3,-s*.78,s*.3,-s*.75,s*.5,-s*.45); c.fill();
    let bg=c.createLinearGradient(-s,-s*.3,s,s*.3);
    bg.addColorStop(0,`hsl(${152+h},80%,58%)`); bg.addColorStop(0.4,`hsl(${145+h},75%,48%)`); bg.addColorStop(1,`hsl(${135+h},70%,38%)`);
    c.fillStyle=bg; c.beginPath(); c.ellipse(0,0,s,s*.5,0,0,Math.PI*2); c.fill();
    c.strokeStyle="rgba(255,255,255,0.22)"; c.lineWidth=s*.06;
    for(let yi of [-s*.18,0,s*.18]){ c.beginPath(); c.moveTo(-s*.8,yi); c.lineTo(s*.8,yi); c.stroke(); }
    c.fillStyle=`hsl(${155+h},78%,35%)`;
    c.beginPath(); c.ellipse(s*.6,0,s*.38,s*.46,0,0,Math.PI*2); c.fill();
    c.strokeStyle="rgba(0,0,0,0.18)"; c.lineWidth=s*.05;
    c.beginPath(); c.ellipse(0,0,s,s*.5,0,0,Math.PI*2); c.stroke();
    _previewEye(c,s,s*.68,-s*.1,s*.1);
}

function _pTurtle(c,s,tw,h){
    // 뒷다리
    c.save(); c.translate(-s*.55, s*.42); c.rotate(tw*0.5);
    c.fillStyle=`hsl(${15+h},45%,32%)`;
    c.beginPath(); c.ellipse(0,0,s*.28,s*.14,0.3,0,Math.PI*2); c.fill();
    c.restore();
    c.save(); c.translate(-s*.55, -s*.42); c.rotate(-tw*0.5);
    c.fillStyle=`hsl(${15+h},45%,32%)`;
    c.beginPath(); c.ellipse(0,0,s*.28,s*.14,-0.3,0,Math.PI*2); c.fill();
    c.restore();
    // 앞다리
    c.save(); c.translate(s*.25, s*.55); c.rotate(tw*1.6+0.5);
    c.fillStyle=`hsl(${18+h},50%,33%)`;
    c.beginPath(); c.ellipse(0,0,s*.5,s*.2,0.4,0,Math.PI*2); c.fill();
    c.strokeStyle="rgba(0,0,0,0.15)"; c.lineWidth=s*.03; c.stroke();
    c.restore();
    c.save(); c.translate(s*.25, -s*.55); c.rotate(-tw*1.6-0.5);
    c.fillStyle=`hsl(${18+h},50%,33%)`;
    c.beginPath(); c.ellipse(0,0,s*.5,s*.2,-0.4,0,Math.PI*2); c.fill();
    c.strokeStyle="rgba(0,0,0,0.15)"; c.lineWidth=s*.03; c.stroke();
    c.restore();
    // 머리+목
    c.fillStyle=`hsl(${22+h},48%,55%)`;
    c.beginPath(); c.ellipse(s*.95,0,s*.32,s*.24,0,0,Math.PI*2); c.fill();
    c.strokeStyle="rgba(0,0,0,0.2)"; c.lineWidth=s*.04; c.stroke();
    // 등껍질
    let bg=c.createRadialGradient(-s*.1,-s*.15,s*.1,0,0,s*.95);
    bg.addColorStop(0,`hsl(${18+h},65%,52%)`); bg.addColorStop(0.55,`hsl(${12+h},60%,40%)`); bg.addColorStop(1,`hsl(${8+h},55%,24%)`);
    c.fillStyle=bg; c.beginPath(); c.ellipse(-s*.08,0,s*.78,s*.62,0,0,Math.PI*2); c.fill();
    c.strokeStyle="rgba(0,0,0,0.3)"; c.lineWidth=s*.05;
    c.beginPath(); c.ellipse(-s*.08,0,s*.78,s*.62,0,0,Math.PI*2); c.stroke();
    // 육각 스큐트 무늬
    c.strokeStyle="rgba(0,0,0,0.25)"; c.lineWidth=s*.035;
    const scutes=[[-s*.08,-s*.32,s*.18],[-s*.08,0,s*.2],[-s*.08,s*.32,s*.18],
                  [-s*.42,-s*.18,s*.14],[-s*.42,s*.18,s*.14],
                  [s*.28,-s*.2,s*.14],[s*.28,s*.2,s*.14],[s*.5,0,s*.13]];
    for(let [sx,sy,sr] of scutes){
        c.beginPath(); c.moveTo(sx+sr,sy);
        for(let i=1;i<=6;i++){ const ang=i*Math.PI/3; c.lineTo(sx+Math.cos(ang)*sr, sy+Math.sin(ang)*sr*0.85); }
        c.closePath(); c.stroke();
    }
    // 하이라이트
    c.fillStyle="rgba(255,255,255,0.08)";
    c.beginPath(); c.ellipse(-s*.2,-s*.2,s*.35,s*.2,-0.3,0,Math.PI*2); c.fill();
    // 짧은 꼬리
    c.fillStyle=`hsl(${15+h},45%,28%)`;
    c.beginPath(); c.moveTo(-s*.78,-s*.08); c.lineTo(-s*.95,0); c.lineTo(-s*.78,s*.08); c.fill();
    _previewEye(c,s,s*1.02,-s*.05,s*.065);
}

function _pWhale(c,s,tw,h){
    // 1) 꼬리 (몸통보다 먼저 - 타원 하나를 기울여서 부채꼴 꼬리)
    c.save(); c.translate(-s*.82, 0); c.rotate(tw*1.4);
    c.fillStyle=`hsl(${215+h},55%,32%)`;
    c.beginPath(); c.ellipse(-s*.18, 0, s*.38, s*.22, Math.PI*0.18, 0, Math.PI*2); c.fill();
    c.restore();

    // 2) 가슴지느러미 (몸통 옆, 약간 아래 — 몸통보다 먼저)
    c.save(); c.translate(s*.15, s*.28); c.rotate(tw*0.7 + 0.45);
    c.fillStyle=`hsl(${218+h},52%,30%)`;
    c.beginPath(); c.ellipse(0, 0, s*.38, s*.12, 0, 0, Math.PI*2); c.fill();
    c.restore();

    // 3) 몸통
    let bg=c.createLinearGradient(0,-s*.5,0,s*.5);
    bg.addColorStop(0,   `hsl(${218+h},65%,25%)`);
    bg.addColorStop(0.5, `hsl(${215+h},55%,36%)`);
    bg.addColorStop(1,   `hsl(${205+h},18%,90%)`);
    c.fillStyle=bg; c.beginPath(); c.ellipse(0,0,s*.92,s*.48,0,0,Math.PI*2); c.fill();

    // 4) 배 흰색 패치
    c.fillStyle="rgba(235,245,255,0.70)";
    c.beginPath(); c.ellipse(s*.08, s*.18, s*.55, s*.2, 0, 0, Math.PI*2); c.fill();

    // 5) 등지느러미 (몸통 위에)
    c.fillStyle=`hsl(${215+h},50%,28%)`;
    c.beginPath();
    c.moveTo(s*.1, -s*.46);
    c.bezierCurveTo(s*.18,-s*.78, s*.38,-s*.75, s*.42,-s*.46);
    c.closePath(); c.fill();

    // 6) 테두리
    c.strokeStyle="rgba(10,20,60,0.20)"; c.lineWidth=s*.04;
    c.beginPath(); c.ellipse(0,0,s*.92,s*.48,0,0,Math.PI*2); c.stroke();

    _previewEye(c,s, s*.62,-s*.09, s*.08);
}

function _pRay(c,s,tw,h){
    // 꼬리 (길고 얇은 채찍형)
    c.save(); c.translate(-s*1.0, 0); c.rotate(tw*0.6);
    c.strokeStyle=`hsl(${200+h},45%,28%)`; c.lineWidth=s*0.07;
    c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-s*.5,-s*.1,-s*.9,s*.05,-s*1.2,0); c.stroke();
    c.restore();
    // 날개 (마름모형 가슴지느러미)
    let wg = c.createRadialGradient(0,0,s*.1,0,0,s*1.1);
    wg.addColorStop(0,`hsl(${205+h},55%,42%)`); wg.addColorStop(1,`hsl(${198+h},50%,22%)`);
    c.fillStyle=wg;
    c.beginPath();
    c.moveTo(s*.55, 0);
    c.bezierCurveTo(s*.3,-s*.55, -s*.4,-s*.75, -s*.7,0);
    c.bezierCurveTo(-s*.4,s*.75, s*.3,s*.55, s*.55,0);
    c.closePath(); c.fill();
    // 날개 하이라이트
    c.fillStyle="rgba(255,255,255,0.10)";
    c.beginPath();
    c.moveTo(s*.5,0);
    c.bezierCurveTo(s*.25,-s*.45,-s*.3,-s*.6,-s*.55,0);
    c.bezierCurveTo(-s*.3,s*.08,s*.25,s*.08,s*.5,0);
    c.closePath(); c.fill();
    // 몸통 중앙 융기
    let bg2 = c.createLinearGradient(0,-s*.15,0,s*.15);
    bg2.addColorStop(0,`hsl(${208+h},52%,48%)`); bg2.addColorStop(1,`hsl(${200+h},48%,28%)`);
    c.fillStyle=bg2;
    c.beginPath(); c.ellipse(0,0,s*.45,s*.18,0,0,Math.PI*2); c.fill();
    // 날개 끝 포인트 강조
    c.strokeStyle=`hsl(${200+h},45%,20%)`; c.lineWidth=s*0.04;
    c.beginPath();
    c.moveTo(s*.55,0);
    c.bezierCurveTo(s*.3,-s*.55,-s*.4,-s*.75,-s*.7,0);
    c.bezierCurveTo(-s*.4,s*.75,s*.3,s*.55,s*.55,0);
    c.closePath(); c.stroke();
    // 무늬 점
    c.fillStyle="rgba(255,255,255,0.18)";
    for(let [px,py,pr] of [[s*.1,-s*.2,s*.04],[-s*.1,-s*.1,s*.03],[s*.2,-s*.12,s*.035]]){
        c.beginPath(); c.arc(px,py,pr,0,Math.PI*2); c.fill();
    }
    _previewEye(c,s, s*.38,-s*.06, s*.07);
}

let _previewAnimId = null;
let _previewCanvases = [];

function buildMainScreen(){
    // 누적 수익 로드
    totalEarnings = loadEarnings();

    // 이전 애니메이션 중단
    if(_previewAnimId){ cancelAnimationFrame(_previewAnimId); _previewAnimId=null; }
    _previewCanvases = [];

    const container = document.getElementById("fish-buttons");
    container.innerHTML = "";
    for(let type of FISH_TYPES){
        const btn = document.createElement("div");
        btn.className = "fish-btn";
        btn.dataset.type = type;

        const d = loadData(type);
        const totalFry = d.fryGroups.reduce((s,g)=>s+g.fishes.length,0) + (d.pendingFryCount||0);

        btn.innerHTML = `
            <canvas width="160" height="100"></canvas>
            <div class="fish-name">${FISH_NAMES[type]}</div>
            <div class="fish-count">치어 ${totalFry}마리</div>
        `;
        if(totalFry>0 || d.male.foodEaten>0 || d.female.foodEaten>0){
            const badge = document.createElement("div");
            badge.style.cssText="position:absolute;top:6px;left:8px;width:10px;height:10px;border-radius:50%;background:#4af;box-shadow:0 0 6px #4af;";
            btn.appendChild(badge);
        }
        container.appendChild(btn);

        const cvs = btn.querySelector("canvas");
        _previewCanvases.push({cvs, type});
        btn.addEventListener("click", ()=>{ startGame(type); });
    }

    // 누적 수익 표시
    let earningsEl = document.getElementById("main-earnings");
    if(!earningsEl){
        earningsEl = document.createElement("div");
        earningsEl.id = "main-earnings";
        earningsEl.style.cssText = [
            "margin-top:clamp(18px,4vw,36px)",
            "font-size:clamp(18px,4.5vw,34px)",
            "font-family:'Segoe UI',sans-serif",
            "font-weight:700",
            "letter-spacing:1px",
            "color:#ffd700",
            "text-shadow:0 0 18px rgba(255,200,0,0.8),0 0 6px rgba(255,160,0,0.5)",
            "text-align:center",
            "pointer-events:none"
        ].join(";");
        document.getElementById("main-screen").appendChild(earningsEl);
    }
    earningsEl.textContent = "💰 누적 수익: " + fmtMoney(totalEarnings);

    // 미리보기 물고기 애니메이션 루프
    function previewLoop(){
        const mainScreen = document.getElementById("main-screen");
        if(mainScreen.style.display === "none"){ _previewAnimId=null; return; }
        for(let {cvs,type} of _previewCanvases) drawPreviewFish(cvs, type);
        _previewAnimId = requestAnimationFrame(previewLoop);
    }
    _previewAnimId = requestAnimationFrame(previewLoop);
}

// ═══════════════════════════════════════════════════════
// 물고기 클래스
// ═══════════════════════════════════════════════════════
class Fish {
    constructor(opts={}){
        // opts: {type, gender:'male'|'female'|'fry', batch, x, y, size, foodEaten, baseSize}
        this.type = opts.type || "clownfish";
        this.gender = opts.gender || "male";   // male / female / fry
        this.batch = opts.batch || 1;
        this.foodEaten = opts.foodEaten || 0;
        this.hueShift = (Math.random()-0.5)*18;
        this.tailSpeed = 160 + Math.random()*220;
        this.turnSpeed = 0.012 + Math.random()*0.035;
        this.wanderAngle = Math.random()*Math.PI*2;
        this.wanderTimer = 0;
        this.wanderPeriod = 120 + Math.random()*200;
        this.speedChangeTimer = Math.random()*300;
        this.speedChangePeriod = 180 + Math.random()*320;
        this.angle = Math.random()*Math.PI*2;
        if(Math.random()<0.5) this.angle = Math.PI + (Math.random()-0.5)*0.5;

        // 크기 설정
        const base = BASE_SIZE_MAP[this.type] || 26;
        if(this.gender === 'male'){
            this.baseSize = opts.baseSize || base;
            // 성어는 크기 고정: 50개 먹었을 때(1.25배) 크기로 고정
            this.size = this.baseSize * 1.25;
        } else if(this.gender === 'female'){
            this.baseSize = opts.baseSize || base * FEMALE_SIZE_RATIO;
            // 암컷도 동일 비율로 고정
            this.size = this.baseSize * 1.25;
        } else { // fry
            this.baseSize = opts.baseSize || base * FRY_SIZE_RATIO;
            // 치어는 먹이에 따라 성장
            this.size = opts.size || this.baseSize;
            if(!opts.size) this._applyGrowth();
        }

        this.baseSpeed = (this.gender==='fry') ? 0.182 + Math.random()*0.364 : 0.2 + Math.random()*0.6;
        this.speed = this.baseSpeed;

        // 위치
        this.tankTop = opts.tankTop || 0;
        this.tankBottom = opts.tankBottom || canvas.height;
        const margin = this.size + 20;
        this.x = opts.x !== undefined ? opts.x : margin + Math.random()*(canvas.width - margin*2);
        this.y = opts.y !== undefined ? opts.y : this.tankTop + margin + Math.random()*(this.tankBottom - this.tankTop - margin*2);

        // 산란 중 슬로우
        this.spawningSlowdown = 1.0;
    }

    _applyGrowth(){
        if(this.gender !== 'fry') return;
        // 20개마다 스테이지 증가, 10스테이지(200개)에서 최대
        // 최대 크기 = 성어 baseSize * 0.80
        // 치어 baseSize = 성어 * 0.27, 최대배율 = 0.80/0.27 ≈ 2.96
        const stage = Math.min(Math.floor(this.foodEaten / 20), 10);
        const maxRatio = (BASE_SIZE_MAP[this.type] || 26) * 0.80 / this.baseSize;
        const grow = 1 + (stage / 10) * (maxRatio - 1);
        this.size = this.baseSize * grow;
    }

    eatFood(){
        this.foodEaten++;
        if(this.gender === 'fry') this._applyGrowth();
        // 성어는 크기 고정, foodEaten만 카운트 (산란 게이지용)
    }

    // 성어 사이즈에 도달했는지 (치어 전용)
    isAdultSized(){
        if(this.gender !== 'fry') return false;
        const adultBase = BASE_SIZE_MAP[this.type] || 26;
        return this.size >= adultBase * 0.95;
    }

    update(foods, tankTop, tankBottom){
        this.speedChangeTimer++;
        if(this.speedChangeTimer >= this.speedChangePeriod){
            this.baseSpeed = (this.gender==='fry') ? 0.156+Math.random()*0.325 : 0.15+Math.random()*0.65;
            this.speedChangeTimer = 0;
            this.speedChangePeriod = 180 + Math.random()*320;
        }

        // 산란 슬로우 처리
        const slowFactor = this.spawningSlowdown;

        let target = null, shortest = Infinity;
        for(let food of foods){
            let d = Math.hypot(food.x-this.x, food.y-this.y);
            if(d < shortest){ shortest=d; target=food; }
        }

        let targetAngle;
        if(target){
            this.wanderTimer = this.wanderPeriod;
            this.speed = this.baseSpeed * 1.4 * slowFactor;
            targetAngle = Math.atan2(target.y-this.y, target.x-this.x);
            if(shortest < this.size*0.8){
                let idx = foods.indexOf(target);
                if(idx !== -1){
                    foods.splice(idx,1);
                    this.eatFood();
                    return true; // ate food
                }
            }
        } else {
            this.wanderTimer++;
            if(this.wanderTimer >= this.wanderPeriod){
                this.wanderAngle = Math.random()*Math.PI*2;
                this.wanderTimer = 0;
                this.wanderPeriod = 120 + Math.random()*200;
            }
            this.speed = this.baseSpeed * slowFactor;
            targetAngle = this.wanderAngle;
        }

        let diff = targetAngle - this.angle;
        while(diff > Math.PI) diff -= Math.PI*2;
        while(diff < -Math.PI) diff += Math.PI*2;
        const activeTurn = target ? this.turnSpeed : this.turnSpeed*0.4;
        this.angle += diff * activeTurn;

        this.x += Math.cos(this.angle)*this.speed;
        this.y += Math.sin(this.angle)*this.speed;

        const margin = this.size + 20;
        // 4면 모두 어항 안에 가두기 (wraparound 제거)
        if(this.x < margin){
            this.x = margin;
            // 오른쪽 방향으로 꺾기
            this.angle = (Math.random()-0.5)*Math.PI;
            this.wanderAngle = this.angle;
        }
        if(this.x > canvas.width - margin){
            this.x = canvas.width - margin;
            this.angle = Math.PI + (Math.random()-0.5)*Math.PI;
            this.wanderAngle = this.angle;
        }
        if(this.y < tankTop + margin){
            this.y = tankTop + margin;
            this.angle = Math.random()*Math.PI;
            this.wanderAngle = this.angle;
        }
        if(this.y > tankBottom - margin){
            this.y = tankBottom - margin;
            this.angle = -Math.random()*Math.PI;
            this.wanderAngle = this.angle;
        }

        return false;
    }

    draw(){
        ctx.save();
        ctx.translate(this.x, this.y);
        const facingLeft = Math.cos(this.angle) < 0;
        const tiltAngle = facingLeft ? -(Math.PI - this.angle) : this.angle;
        ctx.rotate(tiltAngle);
        if(facingLeft){ ctx.scale(-1, 1); }
        const t = Date.now();
        const s = this.size;
        const tw = Math.sin(t/this.tailSpeed)*0.28;
        this._drawFish(s, tw);
        ctx.restore();

        // 성별 표시 (성어만)
        if(this.gender !== 'fry'){
            ctx.save();
            ctx.font = `${Math.max(8,s*0.35)}px sans-serif`;
            ctx.fillStyle = this.gender==='male' ? 'rgba(100,180,255,0.8)' : 'rgba(255,120,160,0.8)';
            ctx.textAlign = 'center';
            ctx.fillText(this.gender==='male'?'♂':'♀', this.x, this.y - s - 4);
            ctx.restore();
        }
        // 치어 차수 표시 없음
    }

    // ── 물고기 그리기 (원본 로직 그대로) ──
    _drawFish(s, tw){
        switch(this.type){
            case "clownfish":  this._drawClownfish(s,tw); break;
            case "butterfly":  this._drawButterfly(s,tw); break;
            case "angelfish":  this._drawAngelfish(s,tw); break;
            case "tang":       this._drawTang(s,tw);      break;
            case "puffer":     this._drawPuffer(s,tw);    break;
            case "wrasse":     this._drawWrasse(s,tw);    break;
            case "turtle":     this._drawTurtle(s,tw);    break;
            case "whale":      this._drawWhale(s,tw);     break;
            case "ray":        this._drawRay(s,tw);       break;
        }
    }

    _drawClownfish(s, tw){
        const h = this.hueShift;
        ctx.save();
        ctx.translate(-s, 0);
        ctx.rotate(tw * 1.4);
        ctx.fillStyle = `hsl(${25+h},90%,55%)`;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.bezierCurveTo(-s*.5,-s*.55, -s*.9,-s*.5, -s*.85,0);
        ctx.bezierCurveTo(-s*.9, s*.5,  -s*.5, s*.55, 0,0);
        ctx.fill();
        ctx.strokeStyle="rgba(255,255,255,0.7)"; ctx.lineWidth=s*0.07;
        ctx.beginPath(); ctx.moveTo(-s*.2,-s*.4); ctx.lineTo(-s*.6,0); ctx.lineTo(-s*.2,s*.4); ctx.stroke();
        ctx.restore();
        ctx.fillStyle=`hsl(${25+h},85%,45%)`;
        ctx.beginPath(); ctx.moveTo(-s*.3,-s*.45); ctx.bezierCurveTo(-s*.1,-s*.9,s*.4,-s*.85,s*.5,-s*.45); ctx.lineTo(-s*.3,-s*.45); ctx.fill();
        let bg = ctx.createRadialGradient(0,-s*.1,s*.05,0,-s*.1,s*.6);
        bg.addColorStop(0,`hsl(${28+h},100%,68%)`); bg.addColorStop(1,`hsl(${20+h},90%,42%)`);
        ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(0,0,s,s*.58,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,0.88)";
        ctx.beginPath(); ctx.ellipse(s*.42,0,s*.09,s*.5,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0,0,s*.09,s*.5,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-s*.4,0,s*.07,s*.42,0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle="rgba(0,0,0,0.35)"; ctx.lineWidth=s*0.06;
        ctx.beginPath(); ctx.ellipse(0,0,s,s*.58,0,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle=`hsl(${25+h},80%,40%)`;
        ctx.beginPath(); ctx.moveTo(s*.1,s*.52); ctx.lineTo(-s*.2,s*.85); ctx.lineTo(-s*.45,s*.55); ctx.fill();
        this._drawEye(s*.6,-s*.12,s*.1);
    }

    _drawButterfly(s, tw){
        const h = this.hueShift;
        ctx.save(); ctx.translate(-s*.75,0); ctx.rotate(tw*1.2);
        ctx.fillStyle=`hsl(${48+h},95%,62%)`;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-s*.4,-s*.5,-s*.7,-s*.4,-s*.65,0); ctx.bezierCurveTo(-s*.7,s*.4,-s*.4,s*.5,0,0); ctx.fill();
        ctx.restore();
        ctx.strokeStyle=`hsl(${48+h},90%,55%)`; ctx.lineWidth=s*0.06;
        ctx.beginPath(); ctx.moveTo(s*.3,-s*.5); ctx.bezierCurveTo(s*.1,-s*1.2,-s*.3,-s*1.1,-s*.5,-s*.5); ctx.stroke();
        ctx.fillStyle=`hsl(${48+h},85%,58%)`;
        ctx.beginPath(); ctx.moveTo(s*.3,-s*.45); ctx.bezierCurveTo(s*.1,-s*.9,-s*.3,-s*.85,-s*.5,-s*.45); ctx.lineTo(-s*.5,-s*.45); ctx.fill();
        let bg = ctx.createRadialGradient(0,0,s*.05,0,0,s*.65);
        bg.addColorStop(0,`hsl(${52+h},100%,75%)`); bg.addColorStop(1,`hsl(${44+h},90%,50%)`);
        ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(0,0,s*.85,s*.55,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="rgba(0,0,0,0.7)"; ctx.beginPath(); ctx.ellipse(s*.55,-s*.08,s*.18,s*.28,-0.3,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle="rgba(0,0,0,0.45)"; ctx.lineWidth=s*0.09;
        for(let xi of [-s*.35,-s*.05,s*.25]){ ctx.beginPath(); ctx.moveTo(xi,-s*.5); ctx.lineTo(xi,s*.5); ctx.stroke(); }
        ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.lineWidth=s*0.055;
        ctx.beginPath(); ctx.ellipse(0,0,s*.85,s*.55,0,0,Math.PI*2); ctx.stroke();
        this._drawEye(s*.58,-s*.08,s*.09);
    }

    _drawAngelfish(s, tw){
        const h = this.hueShift;
        ctx.save(); ctx.translate(-s*.7,0); ctx.rotate(tw);
        ctx.fillStyle=`hsl(${210+h},80%,55%)`;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-s*.3,-s*.7,-s*.7,-s*.65,-s*.75,0); ctx.bezierCurveTo(-s*.7,s*.65,-s*.3,s*.7,0,0); ctx.fill();
        ctx.restore();
        ctx.fillStyle=`hsl(${210+h},75%,48%)`;
        ctx.beginPath(); ctx.moveTo(-s*.1,s*.5); ctx.bezierCurveTo(-s*.2,s*1.1,-s*.5,s*1.2,-s*.7,s*.9); ctx.bezierCurveTo(-s*.6,s*.6,-s*.3,s*.55,-s*.1,s*.5); ctx.fill();
        ctx.fillStyle=`hsl(${215+h},80%,52%)`;
        ctx.beginPath(); ctx.moveTo(-s*.1,-s*.5); ctx.bezierCurveTo(-s*.1,-s*1.15,s*.2,-s*1.2,s*.4,-s*.9); ctx.bezierCurveTo(s*.5,-s*.7,s*.4,-s*.5,s*.3,-s*.5); ctx.closePath(); ctx.fill();
        let bg = ctx.createRadialGradient(0,-s*.1,s*.05,0,0,s*.75);
        bg.addColorStop(0,`hsl(${218+h},90%,72%)`); bg.addColorStop(0.6,`hsl(${212+h},85%,52%)`); bg.addColorStop(1,`hsl(${205+h},80%,38%)`);
        ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(0,0,s*.7,s*.62,0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle="rgba(255,255,255,0.25)"; ctx.lineWidth=s*.08;
        for(let xi of [-s*.25,0,s*.25]){ ctx.beginPath(); ctx.moveTo(xi,-s*.55); ctx.lineTo(xi,s*.55); ctx.stroke(); }
        ctx.strokeStyle="rgba(0,0,0,0.2)"; ctx.lineWidth=s*.05;
        ctx.beginPath(); ctx.ellipse(0,0,s*.7,s*.62,0,0,Math.PI*2); ctx.stroke();
        this._drawEye(s*.52,-s*.1,s*.11);
    }

    _drawTang(s, tw){
        const h = this.hueShift;
        ctx.save(); ctx.translate(-s*.8,0); ctx.rotate(tw*1.1);
        ctx.fillStyle=`hsl(${215+h},85%,55%)`;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-s*.2,-s*.6,-s*.6,-s*.55,-s*.7,-s*.1); ctx.bezierCurveTo(-s*.6,s*.55,-s*.2,s*.6,0,0); ctx.bezierCurveTo(-s*.3,s*.35,-s*.3,-s*.35,0,0); ctx.fill();
        ctx.restore();
        ctx.fillStyle=`hsl(${210+h},80%,48%)`;
        ctx.beginPath(); ctx.moveTo(-s*.4,-s*.48); ctx.bezierCurveTo(-s*.2,-s*.85,s*.3,-s*.8,s*.45,-s*.48); ctx.lineTo(-s*.4,-s*.48); ctx.fill();
        let bg = ctx.createRadialGradient(s*.1,-s*.1,s*.04,0,0,s*.65);
        bg.addColorStop(0,`hsl(${220+h},95%,72%)`); bg.addColorStop(0.5,`hsl(${218+h},90%,55%)`); bg.addColorStop(1,`hsl(${210+h},85%,35%)`);
        ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(0,0,s,s*.62,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=`hsl(${55+h},100%,60%)`;
        ctx.beginPath(); ctx.ellipse(-s*.72,0,s*.12,s*.18,0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle="rgba(0,0,0,0.5)"; ctx.lineWidth=s*.06;
        ctx.beginPath(); ctx.moveTo(s*.55,-s*.35); ctx.lineTo(s*.55,s*.25); ctx.stroke();
        ctx.strokeStyle="rgba(0,0,0,0.18)"; ctx.lineWidth=s*.05;
        ctx.beginPath(); ctx.ellipse(0,0,s,s*.62,0,0,Math.PI*2); ctx.stroke();
        this._drawEye(s*.62,-s*.1,s*.11);
    }

    _drawPuffer(s, tw){
        const h = this.hueShift;
        ctx.save(); ctx.translate(-s*.75,0); ctx.rotate(tw*0.9);
        ctx.fillStyle=`hsl(${45+h},80%,52%)`;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-s*.25,-s*.4,-s*.5,-s*.35,-s*.48,0); ctx.bezierCurveTo(-s*.5,s*.35,-s*.25,s*.4,0,0); ctx.fill();
        ctx.restore();
        ctx.fillStyle=`hsl(${42+h},75%,50%)`;
        ctx.beginPath(); ctx.moveTo(-s*.1,-s*.58); ctx.lineTo(s*.25,-s*.9); ctx.lineTo(s*.4,-s*.58); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-s*.1,s*.58); ctx.lineTo(s*.2,s*.85); ctx.lineTo(s*.4,s*.58); ctx.fill();
        let bg = ctx.createRadialGradient(-s*.05,-s*.1,s*.04,0,0,s*.72);
        bg.addColorStop(0,`hsl(${50+h},95%,78%)`); bg.addColorStop(0.5,`hsl(${45+h},88%,58%)`); bg.addColorStop(1,`hsl(${38+h},80%,40%)`);
        ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(0,0,s*.92,s*.78,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="rgba(0,0,0,0.2)";
        for(let px=-s*.5;px<s*.6;px+=s*.22){
            for(let py=-s*.4;py<s*.45;py+=s*.22){
                if(Math.hypot(px,py)<s*.75){ ctx.beginPath(); ctx.arc(px,py,s*.04,0,Math.PI*2); ctx.fill(); }
            }
        }
        ctx.fillStyle="rgba(255,255,255,0.18)"; ctx.beginPath(); ctx.ellipse(s*.05,s*.2,s*.6,s*.35,0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle="rgba(0,0,0,0.2)"; ctx.lineWidth=s*.05;
        ctx.beginPath(); ctx.ellipse(0,0,s*.92,s*.78,0,0,Math.PI*2); ctx.stroke();
        this._drawEye(s*.55,-s*.08,s*.13);
    }

    _drawWrasse(s, tw){
        const h = this.hueShift;
        ctx.save(); ctx.translate(-s*.8,0); ctx.rotate(tw*1.3);
        ctx.fillStyle=`hsl(${145+h},70%,45%)`;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-s*.3,-s*.52,-s*.65,-s*.48,-s*.68,0); ctx.bezierCurveTo(-s*.65,s*.48,-s*.3,s*.52,0,0); ctx.fill();
        ctx.restore();
        ctx.fillStyle=`hsl(${150+h},65%,42%)`;
        ctx.beginPath(); ctx.moveTo(-s*.5,-s*.45); ctx.bezierCurveTo(-s*.3,-s*.78,s*.3,-s*.75,s*.5,-s*.45); ctx.fill();
        let bg = ctx.createLinearGradient(-s,-s*.3,s,s*.3);
        bg.addColorStop(0,`hsl(${152+h},80%,58%)`); bg.addColorStop(0.4,`hsl(${145+h},75%,48%)`); bg.addColorStop(1,`hsl(${135+h},70%,38%)`);
        ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(0,0,s,s*.5,0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle="rgba(255,255,255,0.22)"; ctx.lineWidth=s*.06;
        for(let yi of [-s*.18,0,s*.18]){ ctx.beginPath(); ctx.moveTo(-s*.8,yi); ctx.lineTo(s*.8,yi); ctx.stroke(); }
        ctx.fillStyle=`hsl(${155+h},78%,35%)`;
        ctx.beginPath(); ctx.ellipse(s*.6,0,s*.38,s*.46,0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle="rgba(0,0,0,0.18)"; ctx.lineWidth=s*.05;
        ctx.beginPath(); ctx.ellipse(0,0,s,s*.5,0,0,Math.PI*2); ctx.stroke();
        this._drawEye(s*.68,-s*.1,s*.1);
    }

    _drawTurtle(s, tw){
        const h = this.hueShift;

        // 뒷다리
        ctx.save();
        ctx.translate(-s*.55, s*.42);
        ctx.rotate(tw*0.5);
        ctx.fillStyle = `hsl(${15+h},45%,32%)`;
        ctx.beginPath();
        ctx.ellipse(0,0, s*.28, s*.14, 0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(-s*.55, -s*.42);
        ctx.rotate(-tw*0.5);
        ctx.fillStyle = `hsl(${15+h},45%,32%)`;
        ctx.beginPath();
        ctx.ellipse(0,0, s*.28, s*.14, -0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();

        // 앞다리
        ctx.save();
        ctx.translate(s*.25, s*.55);
        ctx.rotate(tw*1.6 + 0.5);
        ctx.fillStyle = `hsl(${18+h},50%,33%)`;
        ctx.beginPath();
        ctx.ellipse(0,0, s*.5, s*.2, 0.4, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.15)";
        ctx.lineWidth = s*.03;
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.translate(s*.25, -s*.55);
        ctx.rotate(-tw*1.6 - 0.5);
        ctx.fillStyle = `hsl(${18+h},50%,33%)`;
        ctx.beginPath();
        ctx.ellipse(0,0, s*.5, s*.2, -0.4, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.15)";
        ctx.lineWidth = s*.03;
        ctx.stroke();
        ctx.restore();

        // 머리 + 목
        ctx.fillStyle = `hsl(${22+h},48%,55%)`;
        ctx.beginPath();
        ctx.ellipse(s*.95, 0, s*.32, s*.24, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.2)";
        ctx.lineWidth = s*.04;
        ctx.stroke();

        // 등껍질 (둥근 돔형, 그라디언트)
        let bg = ctx.createRadialGradient(-s*.1,-s*.15,s*.1, 0,0,s*.95);
        bg.addColorStop(0, `hsl(${18+h},65%,52%)`);
        bg.addColorStop(0.55, `hsl(${12+h},60%,40%)`);
        bg.addColorStop(1, `hsl(${8+h},55%,24%)`);
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.ellipse(-s*.08, 0, s*.78, s*.62, 0, 0, Math.PI*2);
        ctx.fill();

        // 등껍질 테두리
        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.lineWidth = s*.05;
        ctx.beginPath();
        ctx.ellipse(-s*.08, 0, s*.78, s*.62, 0, 0, Math.PI*2);
        ctx.stroke();

        // 육각 스큐트 무늬
        ctx.strokeStyle = "rgba(0,0,0,0.25)";
        ctx.lineWidth = s*.035;
        const scutes = [
            [-s*.08, -s*.32, s*.18],
            [-s*.08, 0,       s*.2 ],
            [-s*.08,  s*.32, s*.18],
            [-s*.42, -s*.18, s*.14],
            [-s*.42,  s*.18, s*.14],
            [ s*.28, -s*.2,  s*.14],
            [ s*.28,  s*.2,  s*.14],
            [ s*.5,   0,     s*.13]
        ];
        for(let [sx, sy, sr] of scutes){
            ctx.beginPath();
            ctx.moveTo(sx+sr, sy);
            for(let i=1;i<=6;i++){
                const ang = i * Math.PI/3;
                ctx.lineTo(sx+Math.cos(ang)*sr, sy+Math.sin(ang)*sr*0.85);
            }
            ctx.closePath();
            ctx.stroke();
        }

        // 등껍질 하이라이트
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.beginPath();
        ctx.ellipse(-s*.2,-s*.2, s*.35, s*.2, -0.3, 0, Math.PI*2);
        ctx.fill();

        // 짧은 꼬리
        ctx.fillStyle = `hsl(${15+h},45%,28%)`;
        ctx.beginPath();
        ctx.moveTo(-s*.78, -s*.08);
        ctx.lineTo(-s*.95, 0);
        ctx.lineTo(-s*.78, s*.08);
        ctx.fill();

        this._drawEye(s*1.02, -s*.05, s*.065);
    }

    _drawWhale(s, tw){
        const h = this.hueShift;

        // 1) 꼬리 (몸통보다 먼저 - 타원 하나를 기울여서 부채꼴 꼬리)
        ctx.save(); ctx.translate(-s*.82, 0); ctx.rotate(tw*1.4);
        ctx.fillStyle = `hsl(${215+h},55%,32%)`;
        ctx.beginPath(); ctx.ellipse(-s*.18, 0, s*.38, s*.22, Math.PI*0.18, 0, Math.PI*2); ctx.fill();
        ctx.restore();

        // 2) 가슴지느러미 (몸통 옆, 약간 아래 — 몸통보다 먼저)
        ctx.save(); ctx.translate(s*.15, s*.28); ctx.rotate(tw*0.7 + 0.45);
        ctx.fillStyle = `hsl(${218+h},52%,30%)`;
        ctx.beginPath(); ctx.ellipse(0, 0, s*.38, s*.12, 0, 0, Math.PI*2); ctx.fill();
        ctx.restore();

        // 3) 몸통
        let bg = ctx.createLinearGradient(0,-s*.5, 0,s*.5);
        bg.addColorStop(0,   `hsl(${218+h},65%,25%)`);
        bg.addColorStop(0.5, `hsl(${215+h},55%,36%)`);
        bg.addColorStop(1,   `hsl(${205+h},18%,90%)`);
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.ellipse(0,0, s*.92,s*.48, 0,0,Math.PI*2); ctx.fill();

        // 4) 배 흰색 패치
        ctx.fillStyle = "rgba(235,245,255,0.70)";
        ctx.beginPath(); ctx.ellipse(s*.08,s*.18, s*.55,s*.2, 0,0,Math.PI*2); ctx.fill();

        // 5) 등지느러미 (몸통 위에)
        ctx.fillStyle = `hsl(${215+h},50%,28%)`;
        ctx.beginPath();
        ctx.moveTo(s*.1, -s*.46);
        ctx.bezierCurveTo(s*.18,-s*.78, s*.38,-s*.75, s*.42,-s*.46);
        ctx.closePath(); ctx.fill();

        // 6) 테두리
        ctx.strokeStyle = "rgba(10,20,60,0.20)"; ctx.lineWidth = s*.04;
        ctx.beginPath(); ctx.ellipse(0,0, s*.92,s*.48, 0,0,Math.PI*2); ctx.stroke();

        this._drawEye(s*.62, -s*.09, s*.08);
    }

    _drawRay(s, tw){
        const h = this.hueShift;

        // 1) 꼬리 (긴 채찍형, 꼬리 흔들림)
        ctx.save(); ctx.translate(-s*1.05, 0); ctx.rotate(tw*0.7);
        ctx.strokeStyle = `hsl(${200+h},45%,26%)`;
        ctx.lineWidth = s*0.07;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.bezierCurveTo(-s*.5,-s*.08,-s*.9,s*.06,-s*1.3,0);
        ctx.stroke();
        ctx.restore();

        // 2) 날개 (가슴지느러미 - 마름모형)
        let wg = ctx.createRadialGradient(0,0,s*.08,0,0,s*1.15);
        wg.addColorStop(0,`hsl(${205+h},58%,44%)`);
        wg.addColorStop(0.6,`hsl(${202+h},52%,32%)`);
        wg.addColorStop(1,`hsl(${198+h},48%,20%)`);
        ctx.fillStyle = wg;
        ctx.beginPath();
        ctx.moveTo(s*.58, 0);
        ctx.bezierCurveTo(s*.32,-s*.58, -s*.42,-s*.80, -s*.75,0);
        ctx.bezierCurveTo(-s*.42,s*.80,  s*.32, s*.58,  s*.58,0);
        ctx.closePath(); ctx.fill();

        // 3) 날개 하이라이트 (위쪽 면 광택)
        ctx.fillStyle = "rgba(255,255,255,0.11)";
        ctx.beginPath();
        ctx.moveTo(s*.52,0);
        ctx.bezierCurveTo(s*.28,-s*.48,-s*.36,-s*.66,-s*.62,0);
        ctx.bezierCurveTo(-s*.36,s*.06, s*.28,s*.06, s*.52,0);
        ctx.closePath(); ctx.fill();

        // 4) 몸통 중앙 돌기 (등면)
        let bg2 = ctx.createLinearGradient(0,-s*.18,0,s*.18);
        bg2.addColorStop(0,`hsl(${210+h},55%,52%)`);
        bg2.addColorStop(1,`hsl(${202+h},50%,30%)`);
        ctx.fillStyle = bg2;
        ctx.beginPath(); ctx.ellipse(0,0, s*.48,s*.20, 0,0,Math.PI*2); ctx.fill();

        // 5) 날개 테두리
        ctx.strokeStyle = `hsl(${198+h},44%,18%)`;
        ctx.lineWidth = s*.04;
        ctx.beginPath();
        ctx.moveTo(s*.58,0);
        ctx.bezierCurveTo(s*.32,-s*.58,-s*.42,-s*.80,-s*.75,0);
        ctx.bezierCurveTo(-s*.42,s*.80,s*.32,s*.58,s*.58,0);
        ctx.closePath(); ctx.stroke();

        // 6) 반점 무늬
        ctx.fillStyle = "rgba(255,255,255,0.20)";
        for(let [px,py,pr] of [
            [s*.12,-s*.22,s*.045],[s*.30,-s*.12,s*.035],
            [-s*.08,-s*.18,s*.04],[s*.18,-s*.06,s*.03]
        ]){
            ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.fill();
        }

        this._drawEye(s*.40, -s*.07, s*.075);
    }

    _drawEye(ex, ey, r){
        ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(ex,ey,r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="rgba(0,0,0,0.85)"; ctx.beginPath(); ctx.arc(ex+r*0.15,ey,r*0.6,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,0.9)"; ctx.beginPath(); ctx.arc(ex+r*0.25,ey-r*0.25,r*0.25,0,Math.PI*2); ctx.fill();
    }
}

// ═══════════════════════════════════════════════════════
// 게임 시작
// ═══════════════════════════════════════════════════════
function startGame(type){
    // 메인화면 미리보기 애니메이션 중단
    if(_previewAnimId){ cancelAnimationFrame(_previewAnimId); _previewAnimId=null; }

    currentType = type;
    gameRunning = true;

    // 게임화면: viewport 원본 배율 (확대 없음)
    document.getElementById("vp").content = "width=980, user-scalable=no";
    document.getElementById("main-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 저장 데이터 로드
    const saved = loadData(type);

    // 어항 경계 계산
    const divY = Math.floor(canvas.height / 2);
    document.getElementById("tank-divider").style.top = divY + "px";
    document.getElementById("label-adult").style.top = (divY-22)+"px";
    document.getElementById("label-fry").style.top = (divY+6)+"px";
    // 치어 UI: 치어항 상단에 위치
    document.getElementById("fry-ui").style.top = (divY+12)+"px";
    document.getElementById("fry-counter-wrap").style.top = (divY+12)+"px";
    // 치어분리 버튼: top-bar 바로 아래
    setTimeout(()=>{
        const tbH = document.getElementById("top-bar").offsetHeight || 56;
        document.getElementById("adult-ui").style.top = (12 + tbH + 8) + "px";
    }, 30);

    const adultTop = 0, adultBottom = divY;
    const fryTop = divY, fryBottom = canvas.height;

    adultFishes = [];
    fryFishes = [];
    adultFoods = [];
    fryFoods = [];
    bubbles = [];
    pendingFries = [];
    spawningActive = false;
    spawningTimer = 0;

    // 성어 생성 (수컷)
    const male = new Fish({
        type, gender:'male',
        foodEaten: saved.male.foodEaten,
        tankTop: adultTop, tankBottom: adultBottom
    });
    male.tankTop = adultTop; male.tankBottom = adultBottom;

    // 성어 생성 (암컷)
    const female = new Fish({
        type, gender:'female',
        foodEaten: saved.female.foodEaten,
        tankTop: adultTop, tankBottom: adultBottom
    });
    female.tankTop = adultTop; female.tankBottom = adultBottom;

    adultFishes = [male, female];

    // 치어 복원
    let nextBatch = 1;
    for(let grp of saved.fryGroups){
        if(grp.batch >= nextBatch) nextBatch = grp.batch + 1;
        for(let fd of grp.fishes){
            const fry = new Fish({
                type, gender:'fry', batch: grp.batch,
                foodEaten: fd.foodEaten,
                size: fd.size,
                baseSize: fd.baseSize,
                tankTop: fryTop, tankBottom: fryBottom
            });
            fry.tankTop = fryTop; fry.tankBottom = fryBottom;
            fryFishes.push(fry);
        }
    }
    window._nextBatch = nextBatch;

    // pending 치어 (위 어항 대기 중)
    const pendingBatch = saved.pendingBatch || nextBatch;
    if(saved.pendingFryCount > 0){
        for(let i=0;i<saved.pendingFryCount;i++){
            const pf = new Fish({
                type, gender:'fry', batch:pendingBatch,
                tankTop: adultTop, tankBottom: adultBottom
            });
            pf.tankTop = adultTop; pf.tankBottom = adultBottom;
            pendingFries.push(pf);
        }
        if(pendingBatch >= nextBatch) window._nextBatch = pendingBatch + 1;
    }

    // 네비게이션 스택 푸시
    pushGameHistory();

    // UI 초기화
    initGameUI(type, adultTop, adultBottom, fryTop, fryBottom);

    // 산란 중 상태 복원
    if(saved.spawning && saved.spawning.active){
        const sp = saved.spawning;
        spawningActive = true;
        spawningBorn = sp.born;
        spawningTotal = sp.total;
        window._nextBatch = sp.batch;
        // 암컷 슬로우다운 복원
        if(adultFishes[1]) adultFishes[1].spawningSlowdown = 0.06;
        // 남은 산란 이어서 진행
        const remaining = sp.total - sp.born;
        if(remaining > 0){
            window._spawnInterval = setInterval(()=>{
                spawnOneFry(adultTop, adultBottom);
            }, 5000);
            showToast(`🐟 산란 재개! (${sp.born}/${sp.total} 완료)`);
        } else {
            spawningActive = false;
        }
        updateSpawnUI();
    }

    // 기포 시작
    startBubbles();

    // 애니메이션
    if(!window._animRunning){
        window._animRunning = true;
        animate();
    }
}

// ═══════════════════════════════════════════════════════
// 게임 UI
// ═══════════════════════════════════════════════════════
function initGameUI(type, adultTop, adultBottom, fryTop, fryBottom){
    // 먹이 버튼 초기화
    adultFeedStep = 0; fryFeedStep = 0;
    document.getElementById("adult-feed-count").textContent = FEED_STEPS[adultFeedStep];
    document.getElementById("fry-feed-count").textContent = FRY_FEED_STEPS[fryFeedStep];

    const adultFeedBtn = document.getElementById("adult-feed-btn");
    const fryFeedBtn = document.getElementById("fry-feed-btn");
    const adultFeedCount = document.getElementById("adult-feed-count");
    const fryFeedCount = document.getElementById("fry-feed-count");

    // 먹이 수량 변경
    adultFeedBtn.onclick = (e)=>{
        e.stopPropagation();
        adultFeedStep = (adultFeedStep+1)%FEED_STEPS.length;
        adultFeedCount.textContent = FEED_STEPS[adultFeedStep];
    };
    fryFeedBtn.onclick = (e)=>{
        e.stopPropagation();
        fryFeedStep = (fryFeedStep+1)%FRY_FEED_STEPS.length;
        fryFeedCount.textContent = FRY_FEED_STEPS[fryFeedStep];
    };

    // 캔버스 클릭 → 먹이 추가
    let lastClick = 0;
    window._canvasClickFn && canvas.removeEventListener("click", window._canvasClickFn);
    window._canvasClickFn = canvasClick;
    canvas.addEventListener("click", canvasClick);
    function canvasClick(e){
        const now = Date.now();
        if(now - lastClick < 300){ lastClick=now; return; }
        lastClick = now;
        const cy = e.clientY;
        const divY = Math.floor(canvas.height/2);
        if(cy < divY){
            // 성어 어항
            const n = FEED_STEPS[adultFeedStep];
            spawnFoods(adultFoods, e.clientX, cy, n);
        } else {
            // 치어 어항 - 성어 크기 도달 치어가 있으면 큰 먹이도 섞기
            const n = FRY_FEED_STEPS[fryFeedStep];
            const hasAdultFry = fryFishes.some(f=>f.isAdultSized());
            spawnFoods(fryFoods, e.clientX, cy, n, !hasAdultFry);
        }
    }

    // 산란 버튼
    const spawnWrap = document.getElementById("spawn-btn-wrap");
    spawnWrap.onclick = ()=>{
        if(spawningActive) return;
        const male = adultFishes[0], female = adultFishes[1];
        if(!male||!female) return;
        if(male.foodEaten >= FOOD_TO_SPAWN && female.foodEaten >= FOOD_TO_SPAWN){
            startSpawning(adultTop, adultBottom);
        }
    };

    // 치어 분리 버튼
    const sepBtn = document.getElementById("separate-btn");
    sepBtn.onclick = ()=>{
        if(pendingFries.length === 0) return;
        const fryTop = Math.floor(canvas.height/2);
        const fryBottom = canvas.height;
        for(let pf of pendingFries){
            pf.x = 50 + Math.random()*(canvas.width-100);
            pf.y = fryTop + 40 + Math.random()*(fryBottom-fryTop-80);
            pf.tankTop = fryTop;
            pf.tankBottom = fryBottom;
            fryFishes.push(pf);
        }
        pendingFries = [];
        sepBtn.classList.remove("visible");
        buildSaveSnapshot();
        updateFryCounter();
    };

    // 분양 버튼
    document.getElementById("adopt-btn").onclick = openAdoptModal;

    // 리셋 버튼 - 커스텀 확인 오버레이 사용 (confirm() 미사용)
    const resetBtn = document.getElementById("reset-btn");
    // 기존 이벤트 완전 제거 후 재등록
    const newResetBtn = resetBtn.cloneNode(true);
    resetBtn.parentNode.replaceChild(newResetBtn, resetBtn);

    newResetBtn.addEventListener("click", (e)=>{
        e.preventDefault();
        e.stopPropagation();
        const overlay = document.getElementById("reset-confirm-overlay");
        document.getElementById("reset-confirm-msg").textContent =
            `${FISH_NAMES[type] || type}의 모든 데이터를 초기화합니다.\n성어 먹이 기록, 치어, 산란 기록이 모두 삭제됩니다.`;
        overlay.classList.add("open");
    }, {capture:true});

    document.getElementById("reset-cancel-btn").onclick = (e)=>{
        e.stopPropagation();
        document.getElementById("reset-confirm-overlay").classList.remove("open");
    };
    document.getElementById("reset-ok-btn").onclick = (e)=>{
        e.stopPropagation();
        document.getElementById("reset-confirm-overlay").classList.remove("open");

        // 산란 중이면 중단
        if(window._spawnInterval){ clearInterval(window._spawnInterval); window._spawnInterval=null; }
        spawningActive = false;
        spawningBorn = 0;
        spawningTotal = 0;

        // localStorage 완전 초기화
        localStorage.removeItem(saveKey(type));

        // 메모리 초기화
        if(adultFishes[0]) adultFishes[0].foodEaten = 0;
        if(adultFishes[1]){ adultFishes[1].foodEaten = 0; adultFishes[1].spawningSlowdown = 1.0; }
        fryFishes = [];
        pendingFries = [];
        adultFoods = [];
        fryFoods = [];
        window._nextBatch = 1;

        document.getElementById("separate-btn").classList.remove("visible");
        updateSpawnUI();
        updateFryCounter();
        showToast("↺ 데이터가 초기화되었습니다.");
    };

    // 뒤로가기 (목록 버튼)
    document.getElementById("back-btn").onclick = ()=>{
        history.back(); // popstate → goBackFromGame()
    };

    updateSpawnUI();
    updateFryCounter();
}

function spawnFoods(arr, cx, cy, count, small=false){
    const big = !small;
    if(count === 1){
        arr.push({x:cx, y:cy, small, big});
        return;
    }
    for(let i=0;i<count;i++){
        const angle = Math.random()*Math.PI*2;
        const r = 10 + Math.random()*28;
        arr.push({x:cx+Math.cos(angle)*r, y:cy+Math.sin(angle)*r, small, big});
    }
}

// ═══════════════════════════════════════════════════════
// 산란
// ═══════════════════════════════════════════════════════
function startSpawning(tankTop, tankBottom){
    if(spawningActive) return;
    spawningActive = true;
    spawningTimer = 0;
    spawningTotal = FRY_PER_SPAWN_MIN + Math.floor(Math.random()*(FRY_PER_SPAWN_MAX-FRY_PER_SPAWN_MIN+1));
    spawningBorn = 0;
    document.getElementById("separate-btn").classList.remove("visible");

    // 암컷 슬로우다운
    const female = adultFishes[1];
    if(female) female.spawningSlowdown = 0.06;

    // 토스트
    showToast(`🐟 산란 시작! (${spawningTotal}마리 예정)`);

    // 10초마다 1마리 생성 인터벌
    window._spawnInterval = setInterval(()=>{
        spawnOneFry(tankTop, tankBottom);
    }, 5000);
}

function spawnOneFry(tankTop, tankBottom){
    if(!spawningActive) return;
    const female = adultFishes[1];
    if(!female) return;

    const batch = window._nextBatch || 1;
    const fry = new Fish({
        type: currentType,
        gender: 'fry',
        batch: batch,
        tankTop, tankBottom,
        x: female.x + (Math.random()-0.5)*30,
        y: female.y + female.size*0.5 + Math.random()*10
    });
    fry.tankTop = tankTop;
    fry.tankBottom = tankBottom;
    pendingFries.push(fry);
    spawningBorn++;

    showToast(`🥚 치어 탄생! (${spawningBorn}/${spawningTotal})`);
    updateSpawnUI();

    if(spawningBorn >= spawningTotal){
        // 산란 완료
        clearInterval(window._spawnInterval);
        spawningActive = false;
        window._nextBatch = (window._nextBatch||1) + 1;

        // 성어 먹이 카운터 리셋 (크기는 고정이므로 _applyGrowth 불필요)
        adultFishes[0].foodEaten = 0;
        adultFishes[1].foodEaten = 0;
        adultFishes[1].spawningSlowdown = 1.0;

        document.getElementById("separate-btn").classList.add("visible");
        showToast(`✅ 산란 완료! 치어 분리 버튼을 눌러주세요.`);
        updateSpawnUI();
        buildSaveSnapshot();
    }
    updateFryCounter();
    buildSaveSnapshot();
}

// ═══════════════════════════════════════════════════════
// UI 업데이트
// ═══════════════════════════════════════════════════════
function updateSpawnUI(){
    if(!adultFishes[0]||!adultFishes[1]) return;
    const mEat = adultFishes[0].foodEaten;
    const fEat = adultFishes[1].foodEaten;
    const mPct = Math.min(100, (mEat/FOOD_TO_SPAWN)*100);
    const fPct = Math.min(100, (fEat/FOOD_TO_SPAWN)*100);

    document.getElementById("spawn-fill-m").style.height = mPct+"%";
    document.getElementById("spawn-fill-f").style.height = fPct+"%";

    const ready = mEat >= FOOD_TO_SPAWN && fEat >= FOOD_TO_SPAWN && !spawningActive;
    const wrap = document.getElementById("spawn-btn-wrap");
    const lbl = document.getElementById("spawn-btn-label");

    if(spawningActive){
        wrap.className = "not-ready";
        lbl.textContent = `산란중 ${spawningBorn}/${spawningTotal}`;
    } else if(ready){
        wrap.className = "ready";
        lbl.textContent = "🐣 산란!";
    } else {
        wrap.className = "not-ready";
        lbl.textContent = `♀${Math.round(fPct)}% ♂${Math.round(mPct)}%`;
    }
}

function updateFryCounter(){
    const total = fryFishes.length;
    document.getElementById("fry-counter").textContent =
        total > 0 ? `치어 ${total}마리` : "";

    // 분리 대기 표시
    const sepBtn = document.getElementById("separate-btn");
    if(pendingFries.length > 0){
        sepBtn.classList.add("visible");
        sepBtn.textContent = `🐟 치어 분리 (${pendingFries.length}마리)`;
    } else {
        sepBtn.classList.remove("visible");
    }
}

// ═══════════════════════════════════════════════════════
// 분양 모달
// ═══════════════════════════════════════════════════════
function openAdoptModal(){
    if(fryFishes.length === 0){ showToast("치어 어항이 비어있습니다."); return; }

    const groups = {};
    for(let f of fryFishes){ groups[f.batch]=(groups[f.batch]||0)+1; }

    const content = document.getElementById("modal-content");
    content.innerHTML = "";
    const inputs = {};

    for(let [batch, count] of Object.entries(groups)){
        const row = document.createElement("div");
        row.className = "modal-row";
        row.innerHTML = `<span>${batch}차 치어 (${count}마리)</span><input type="number" min="0" max="${count}" placeholder="0" data-batch="${batch}" data-max="${count}">`;
        content.appendChild(row);
        inputs[batch] = row.querySelector("input");
    }

    function updateTotal(){
        let t = 0;
        for(let inp of Object.values(inputs)) t += parseInt(inp.value||0);
        const price = FISH_PRICES[currentType] || 0;
        const money = t * price;
        document.getElementById("modal-total").textContent =
            `총 ${t}마리 · ${fmtMoney(money)}` + (t > 0 ? ` (마리당 ${fmtMoney(price)})` : "");
    }
    for(let inp of Object.values(inputs)) inp.addEventListener("input", updateTotal);
    updateTotal();

    document.getElementById("modal-overlay").classList.add("open");
    pushModalHistory();

    document.getElementById("modal-cancel").onclick = ()=>{
        closeModalByButton();
    };
    document.getElementById("modal-confirm").onclick = ()=>{
        let earned = 0;
        for(let [batch, inp] of Object.entries(inputs)){
            let n = parseInt(inp.value||0);
            if(n <= 0) continue;
            const max = parseInt(inp.dataset.max);
            n = Math.min(n, max);
            earned += n * (FISH_PRICES[currentType] || 0);
            // 해당 batch 치어를 크기 내림차순 정렬 → 큰 것부터 분양
            const batchFish = fryFishes
                .map((f, i) => ({f, i}))
                .filter(({f}) => f.batch == batch)
                .sort((a, b) => (b.f.size ?? b.f.baseSize ?? 0) - (a.f.size ?? a.f.baseSize ?? 0));
            // 상위 n마리의 원본 인덱스를 내림차순으로 수집해 splice
            const toRemove = batchFish.slice(0, n).map(({i}) => i).sort((a,b)=>b-a);
            for(const idx of toRemove) fryFishes.splice(idx, 1);
        }
        if(earned > 0){
            totalEarnings += earned;
            saveEarnings();
        }
        closeModalByButton();
        updateFryCounter();
        buildSaveSnapshot();
        showToast(earned > 0 ? `✅ 분양 완료! +${fmtMoney(earned)}` : "✅ 분양 완료!");
    };
}

// ═══════════════════════════════════════════════════════
// 토스트
// ═══════════════════════════════════════════════════════
function showToast(msg, duration=2800){
    const t = document.getElementById("spawn-toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(()=>t.classList.remove("show"), duration);
}

// ═══════════════════════════════════════════════════════
// 기포
// ═══════════════════════════════════════════════════════
let bubbleInterval = null;
function startBubbles(){
    stopBubbles();
    bubbleInterval = setInterval(()=>{
        if(!gameRunning) return;
        bubbles.push({
            x: Math.random()*canvas.width,
            y: canvas.height+20,
            r: 2+Math.random()*7,
            speed: 0.3+Math.random()*1.0
        });
    }, 600);
}
function stopBubbles(){ if(bubbleInterval){ clearInterval(bubbleInterval); bubbleInterval=null; } }

// ═══════════════════════════════════════════════════════
// 배경 / 어항 그리기
// ═══════════════════════════════════════════════════════
function drawTank(){
    const divY = Math.floor(canvas.height/2);

    // 성어 어항 배경
    let g = ctx.createLinearGradient(0,0,0,divY);
    g.addColorStop(0,"#0d4a8a"); g.addColorStop(1,"#001a30");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,canvas.width,divY);

    // 치어 어항 배경 (약간 더 밝고 따뜻)
    let g2 = ctx.createLinearGradient(0,divY,0,canvas.height);
    g2.addColorStop(0,"#002540"); g2.addColorStop(1,"#001018");
    ctx.fillStyle = g2;
    ctx.fillRect(0,divY,canvas.width,canvas.height-divY);

    // 햇살 (성어)
    ctx.fillStyle="rgba(255,255,255,0.025)";
    for(let i=0;i<7;i++){
        ctx.beginPath();
        ctx.moveTo(i*250,0); ctx.lineTo(i*250+100,divY); ctx.lineTo(i*250+180,divY); ctx.fill();
    }

    // 해초 (성어 어항)
    const t = Date.now();
    for(let i=0;i<25;i++){
        const x = i*70;
        ctx.strokeStyle="#00aa55"; ctx.lineWidth=4;
        ctx.beginPath();
        ctx.moveTo(x,divY);
        ctx.quadraticCurveTo(x+Math.sin(t/800+i)*22, divY-90, x, divY-160);
        ctx.stroke();
    }

    // 해초 (치어 어항 - 작은)
    for(let i=0;i<20;i++){
        const x = i*80 + 30;
        ctx.strokeStyle="#00bb66"; ctx.lineWidth=2.5;
        ctx.beginPath();
        ctx.moveTo(x,canvas.height);
        ctx.quadraticCurveTo(x+Math.sin(t/900+i)*15, canvas.height-60, x, canvas.height-100);
        ctx.stroke();
    }

    // 구분선 (물결 효과)
    ctx.strokeStyle="rgba(80,180,255,0.4)";
    ctx.lineWidth=2;
    ctx.beginPath();
    for(let x=0;x<=canvas.width;x+=4){
        const wave = Math.sin(x/60 + t/1000)*2;
        if(x===0) ctx.moveTo(x,divY+wave);
        else ctx.lineTo(x,divY+wave);
    }
    ctx.stroke();
}

// ═══════════════════════════════════════════════════════
// 메인 애니메이션 루프
// ═══════════════════════════════════════════════════════
let lastSave = 0;

function animate(){
    if(!gameRunning){ window._animRunning=false; return; }
    requestAnimationFrame(animate);

    const divY = Math.floor(canvas.height/2);

    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawTank();

    // 기포
    for(let i=bubbles.length-1;i>=0;i--){
        const b=bubbles[i];
        b.y -= b.speed;
        ctx.strokeStyle="rgba(255,255,255,0.4)"; ctx.lineWidth=0.6;
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke();
        if(b.y < -20) bubbles.splice(i,1);
    }

    // 성어 먹이
    for(let f of adultFoods){
        ctx.fillStyle="gold";
        ctx.beginPath(); ctx.arc(f.x,f.y,4,0,Math.PI*2); ctx.fill();
    }

    // 치어 먹이 (크기 구분)
    for(let f of fryFoods){
        const r = f.big ? 4 : 1.5;
        ctx.fillStyle = f.big ? "gold" : "rgba(255,220,80,0.9)";
        ctx.beginPath(); ctx.arc(f.x,f.y,r,0,Math.PI*2); ctx.fill();
    }

    // 성어 업데이트 & 그리기
    let ateFood = false;
    for(let fish of adultFishes){
        const ate = fish.update(adultFoods, 0, divY);
        if(ate) ateFood = true;
        fish.draw();
    }
    // pending 치어 (위 어항)
    for(let fish of pendingFries){
        fish.update([], 0, divY);
        fish.draw();
    }
    if(ateFood) updateSpawnUI();

    // 치어 업데이트 & 그리기
    for(let fish of fryFishes){
        // 치어가 성어 크기 도달 시 - 같은 fryFoods지만 먹이 크기는 성어용으로 표시됨
        fish.update(fryFoods, divY, canvas.height);
        fish.draw();
    }

    // 산란 진행 중 타이머 표시
    if(spawningActive){
        ctx.save();
        ctx.fillStyle="rgba(255,220,100,0.8)";
        ctx.font="bold 13px sans-serif";
        ctx.textAlign="left";
        ctx.fillText(`🥚 산란중 ${spawningBorn}/${spawningTotal}`, 14, divY-8);
        ctx.restore();
    }

    // 주기적 저장 (5초마다)
    const now = Date.now();
    if(now - lastSave > 5000){
        lastSave = now;
        buildSaveSnapshot();
        updateFryCounter();
    }
}

const bgm = document.getElementById("bgm");

// ═══════════════════════════════════════════════════════
// 뒤로가기 스택 관리
// 레벨: 0=메인(사이트 떠남), 1=게임, 2=모달
// 스택 구조: 메인 진입 시 스택 비어있음.
//   게임 진입 → pushState x1 (게임 엔트리)
//   모달 열기 → pushState x1 (모달 엔트리)
//   모달 닫기(코드) → history.back() 으로 모달 엔트리 소비
//   게임 닫기(코드) → history.back() 으로 게임 엔트리 소비 → 메인(reload)
// 결과: 메인에서 뒤로가기 1번 = 사이트 탈출
// ═══════════════════════════════════════════════════════
let navLevel = 0; // 0:메인, 1:게임, 2:모달

function closeModal(){
    // 모달 UI만 닫기. 히스토리 소비는 호출한 쪽에서 처리.
    document.getElementById("modal-overlay").classList.remove("open");
    navLevel = 1;
}

// 버튼으로 모달을 닫을 때, 직후 popstate가 navLevel=1로
// goBackFromGame()을 호출하지 않도록 보호하는 플래그
let _modalClosingByButton = false;

function closeModalByButton(){
    closeModal();
    _modalClosingByButton = true;
    history.back();
    // popstate는 비동기이므로 짧은 시간 후 플래그 해제
    setTimeout(()=>{ _modalClosingByButton = false; }, 300);
}

function goBackFromGame(){
    if(window._spawnInterval){ clearInterval(window._spawnInterval); window._spawnInterval=null; }
    buildSaveSnapshot();
    // 게임 히스토리 엔트리를 소비한 뒤 메인화면 재구성
    // popstate 이벤트가 이미 발동한 경우(뒤로가기)와
    // 직접 호출(목록 버튼)을 구분하여 처리
    gameRunning = false;
    document.getElementById("game-screen").style.display = "none";
    document.getElementById("main-screen").style.display = "";
    document.getElementById("vp").content = "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no";
    // 선택화면으로 나가면 BGM 정지 (사육장 진입 시에만 재생)
    if(bgm){ bgm.pause(); bgm.currentTime = 0; }
    buildMainScreen();
}

// 기기 뒤로가기 버튼 처리 (Escape/BrowserBack 키)
document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape" || e.key === "BrowserBack"){
        if(navLevel === 2){
            closeModal();
            // 모달 히스토리 엔트리 소비
            history.back();
        } else if(navLevel === 1){
            // 게임 히스토리 엔트리 소비 → popstate에서 goBackFromGame 호출
            history.back();
        }
    }
});

// 게임 진입: 정확히 1개의 히스토리 엔트리 push
function pushGameHistory(){
    history.pushState({nav:'game'}, '');
    navLevel = 1;
}
// 모달 진입: 정확히 1개의 히스토리 엔트리 push
function pushModalHistory(){
    history.pushState({nav:'modal'}, '');
    navLevel = 2;
}

window.addEventListener("popstate", (e)=>{
    if(_modalClosingByButton){
        // 버튼으로 모달 닫는 중 발동된 popstate: 무시 (이미 UI 처리됨)
        _modalClosingByButton = false;
        return;
    }
    if(navLevel === 2){
        // 모달 뒤로가기: 모달만 닫고 게임 레벨로 복귀
        closeModal();
    } else if(navLevel === 1){
        // 게임 뒤로가기: 게임 종료 후 메인화면
        goBackFromGame();
    }
    // navLevel === 0 이면 브라우저가 자연스럽게 뒤로 감 (사이트 탈출)
});

// ═══════════════════════════════════════════════════════
// 초기 진입
// ═══════════════════════════════════════════════════════
buildMainScreen();
