<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘의 행운 양궁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-1:#22304a; --night-2:#33507a;
    --gold:#ffd24a; --gold-deep:#f5a623;
    --cream:#fff6e6; --mint:#4ecdc4; --sky-1:#bfe3ff; --sky-2:#7fb8e8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    font-family:'Fredoka','Jua',system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% -10%, var(--night-2) 0%, var(--night-1) 70%, #16203a 100%);
    color:var(--cream);
    height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:12px 14px; user-select:none;
  }
  .app{ width:100%; max-width:420px; height:100%; display:flex; flex-direction:column; gap:8px; }

  .topbar{ flex:0 0 auto; text-align:center; position:relative; }
  .title{
    font-family:'Jua',sans-serif; font-size:clamp(20px,6.5vw,28px); line-height:1; margin:0;
    color:var(--gold); text-shadow:0 2px 0 #b9791a, 0 0 22px rgba(255,210,74,.35); letter-spacing:.5px;
  }
  .mute{ position:absolute; right:0; top:50%; transform:translateY(-50%); width:38px; height:38px; border-radius:50%;
    border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); cursor:pointer; display:grid; place-items:center; }
  .mute svg{ width:18px; height:18px; }

  .hud{
    flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;
  }
  .chip{
    background:linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.08));
    border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:7px 6px; text-align:center;
  }
  .chip .k{ font-size:11px; color:#bcd0ec; letter-spacing:1px; }
  .chip .v{ font-family:'Jua',sans-serif; font-size:18px; color:var(--cream); }
  .chip .v.gold{ color:var(--gold); }
  .chip .v.best{ color:#4ecdc4; font-size:18px; }
  .wind-arrow{ display:inline-block; transition:transform .3s; }

  .wind-hud{
    position:absolute; top:8px; left:10px; z-index:6; pointer-events:none;
    background:rgba(0,0,0,.35); border-radius:10px; padding:3px 8px;
    font-family:'Jua',sans-serif; font-size:13px; color:#bfe3ff;
    display:flex; align-items:center; gap:5px; white-space:nowrap;
  }
  .wind-hud .wind-hud-arrow{ display:inline-block; transition:transform .3s; font-size:14px; }
  .wind-hud .wind-hud-spd{ color:var(--gold); font-size:14px; font-family:'Jua',sans-serif; }

  .stage{ flex:1 1 auto; min-height:0; position:relative; border-radius:18px; overflow:hidden;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.35); }
  #field{ width:100%; height:100%; display:block; touch-action:none; }
  .timer{ position:absolute; top:8px; right:12px; z-index:6; pointer-events:none; display:none;
    font-family:'Jua',sans-serif; font-size:32px; line-height:1; color:#ff2b2b;
    text-shadow:0 2px 4px rgba(0,0,0,.5), 0 0 12px rgba(255,40,40,.55); }
  .timer.warn{ animation:tick .5s steps(1) infinite; }
  @keyframes tick{ 50%{ opacity:.3; } }

  .result{ flex:0 0 26px; height:26px; line-height:26px; overflow:hidden; white-space:nowrap;
    text-align:center; padding:0 8px; font-family:'Jua',sans-serif; font-size:17px;
    transition:opacity .2s; text-overflow:ellipsis; }
  .result.big{ color:var(--gold); text-shadow:0 0 18px rgba(255,210,74,.5); }

  .shoot{
    flex:0 0 72px; border:none; cursor:pointer; width:100%; padding:0 16px; border-radius:18px;
    font-family:'Jua',sans-serif; font-size:21px; color:#5a2a00; letter-spacing:2px;
    background:linear-gradient(180deg, #ffe27a, var(--gold) 45%, var(--gold-deep));
    box-shadow: 0 6px 0 #b9791a, 0 12px 24px rgba(245,166,35,.35);
    transition:transform .08s ease, box-shadow .08s ease;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .shoot:active{ transform:translateY(5px); box-shadow:0 1px 0 #b9791a, 0 6px 14px rgba(245,166,35,.3); }
  .shoot:disabled{ filter:saturate(.55) brightness(.93); cursor:default; }
  .shoot .sub{ display:block; font-size:11px; font-family:'Fredoka',sans-serif; color:#7a4d12; margin-top:2px; letter-spacing:1px; }

  #confetti{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50; }
</style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <main class="app">
    <div class="topbar">
      <button class="mute" id="muteBtn" aria-label="소리"></button>
      <h1 class="title">오늘의 행운 양궁</h1>
    </div>

    <div class="hud">
      <div class="chip"><div class="k">남은 화살</div><div class="v" id="arrowsV">10</div></div>
      <div class="chip"><div class="k">점수</div><div class="v gold" id="scoreV">0</div></div>
      <div class="chip"><div class="k">최고 점수</div><div class="v best" id="bestV">0</div></div>
    </div>

    <div class="stage">
      <canvas id="field" width="800" height="900"></canvas>
      <div class="wind-hud" id="windHud">
        <span>바람</span>
        <span class="wind-hud-arrow" id="windArrow">→</span>
        <span class="wind-hud-spd" id="windSpd">0</span>
      </div>
      <div class="timer" id="timer"></div>
    </div>

    <div class="result" id="result">조준점이 멈출 때 쏘면 명중률이 올라가요</div>

    <button class="shoot" id="shootBtn">
      발사
      <span class="sub">탭 · 화면을 눌러도 발사</span>
    </button>
  </main>

<script>
(function(){
  var field = document.getElementById('field');
  var ctx = field.getContext('2d');
  var windArrow = document.getElementById('windArrow');
  var windSpd = document.getElementById('windSpd');
  var arrowsV = document.getElementById('arrowsV');
  var scoreV = document.getElementById('scoreV');
  var bestV = document.getElementById('bestV');
  var resultEl = document.getElementById('result');
  var shootBtn = document.getElementById('shootBtn');
  var muteBtn = document.getElementById('muteBtn');
  var timerEl = document.getElementById('timer');

  var W=800, H=900;                  // logical canvas units (scaled to device)
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // target center & ring radii (logical units)
  var TX=W/2, TY=H*0.30, R10=44;     // bullseye radius; rings scale from this
  var RINGS = [
    {score:9,  r:R10*1.0, color:'#ffe24a'},
    {score:8,  r:R10*1.7, color:'#ffe24a'},
    {score:7,  r:R10*2.4, color:'#ff6f6f'},
    {score:6,  r:R10*3.1, color:'#ff6f6f'},
    {score:5,  r:R10*3.8, color:'#7fc8ff'},
    {score:4,  r:R10*4.5, color:'#7fc8ff'},
    {score:3,  r:R10*5.3, color:'#f3f3f3'},
    {score:2,  r:R10*6.2, color:'#f3f3f3'}
  ];
  var TARGET_R = RINGS[RINGS.length-1].r;
  var GROUND = H*0.82;

  var arrows = 10, score = 0, busy=false, muted=false;
  var bestScore = 0;
  var wind = { dx:1, dy:0, spd:0 };   // dx,dy: unit direction (screen coords, y down), spd 0..10
  var t0 = performance.now();
  var holes = [];                     // landed arrows {x,y,wob,ang}
  var flying = null;                  // current arrow in flight
  var splits = [];                    // robin-hood split shard effects
  var fx = [];                        // robin-hood celebration (golden ring + sparkles)

  // ---------- per-shot time limit ----------
  var TIME_LIMIT = 7.0;               // seconds to take each shot
  var shotDeadline = 0;
  var timerActive = false;
  function startTimer(){ shotDeadline = performance.now() + TIME_LIMIT*1000; timerActive = true; }
  function stopTimer(){ timerActive = false; timerEl.style.display='none'; timerEl.classList.remove('warn'); }

  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function newWind(){
    wind.spd = Math.round(Math.random()*8 + (Math.random()<.3?2:0)); // 0..10, gentle
    var ang = Math.random()*Math.PI*2;                  // any direction (up/down/left/right)
    wind.dx = Math.cos(ang);
    wind.dy = Math.sin(ang);
    windSpd.textContent = wind.spd;
    windArrow.style.transform = 'rotate('+(ang*180/Math.PI)+'deg)';
    windArrow.textContent = '→';
    windArrow.style.opacity = wind.spd===0 ? .4 : 1;
    startTimer();                                       // each available shot is time-limited
  }

  // ---------- aiming reticle: wobbles with breath + wind ----------
  function reticlePos(now){
    var t=(now - t0)/1000;
    var u = R10;                                 // scale wobble to bullseye size
    var breatheX = (Math.sin(t*1.7)*0.55 + Math.sin(t*0.6+1)*0.32)*u;
    var breatheY = (Math.cos(t*1.3)*0.50 + Math.sin(t*0.45)*0.30)*u;
    var windBiasX = wind.dx * wind.spd * u * 0.09;   // wind nudges aim in its direction
    var windBiasY = wind.dy * wind.spd * u * 0.09;
    return { x: TX + breatheX + windBiasX, y: TY + breatheY + windBiasY };
  }

  // ---------- audio ----------
  var actx=null;
  function audio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function beep(freq,dur,type,vol){ if(muted) return; dur=dur||0.06; type=type||'square'; vol=vol||0.14;
    try{ var c=audio(),o=c.createOscillator(),g=c.createGain(); o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(vol,c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
      o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);}catch(e){} }
  function twangS(){ beep(330,0.10,'sawtooth',0.16); setTimeout(function(){beep(180,0.12,'sine',0.12);},20); }
  function thunkS(){ beep(120,0.10,'square',0.20); setTimeout(function(){beep(80,0.12,'sine',0.14);},30); }
  function jingle(ns){ ns.forEach(function(f,i){ setTimeout(function(){ beep(f,0.14,'triangle',0.2); }, i*100); }); }
  function bullsS(){ jingle([523,659,784,1046,1318]); }
  function goodS(){ jingle([523,659,784]); }
  function splitS(){ jingle([523,659,784,1046,1318,1568,2093]); setTimeout(function(){ beep(1760,0.20,'triangle',0.18); },130); }

  // ---------- confetti ----------
  var cc=document.getElementById('confetti'), cx=cc.getContext('2d'); var parts=[];
  function rs(){ cc.width=innerWidth*devicePixelRatio; cc.height=innerHeight*devicePixelRatio; }
  rs(); addEventListener('resize', function(){ rs(); fit(); });
  var COLORS=['#ffd24a','#ff5470','#4ecdc4','#fff6e6','#a06bff'];
  function confetti(n){ if(reduceMotion) return; var fresh=parts.length===0;
    for(var i=0;i<n;i++) parts.push({x:Math.random()*cc.width,y:-20*devicePixelRatio,
      vx:(Math.random()-0.5)*6*devicePixelRatio,vy:(Math.random()*4+3)*devicePixelRatio,
      r:(Math.random()*6+4)*devicePixelRatio,color:pick(COLORS),rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.3,life:1});
    if(fresh) requestAnimationFrame(drawC); }
  function drawC(){ cx.clearRect(0,0,cc.width,cc.height);
    parts.forEach(function(p){ p.vy+=0.12*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr; if(p.y>cc.height*0.85)p.life-=0.03;
      cx.save();cx.globalAlpha=Math.max(0,p.life);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.color;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);cx.restore();});
    parts=parts.filter(function(p){return p.life>0&&p.y<cc.height+40;});
    if(parts.length) requestAnimationFrame(drawC); else cx.clearRect(0,0,cc.width,cc.height); }

  function flash(txt,big){ resultEl.style.opacity=0;
    setTimeout(function(){ resultEl.textContent=txt; resultEl.classList.toggle('big',!!big); resultEl.style.opacity=1; },110); }

  // ---------- drawing ----------
  function drawTarget(){
    // grass
    ctx.fillStyle='#9fd9a0';
    ctx.fillRect(0,0,W,GROUND);
    ctx.fillStyle='#7cc47e';
    ctx.fillRect(0,GROUND,W,H*0.025);
    ctx.fillStyle='#a98b5a';                 // ground (thin strip at bottom)
    ctx.fillRect(0,GROUND+H*0.025,W,H);
    // stand pole
    ctx.fillStyle='#6b4a2a';
    ctx.fillRect(TX-7, TY, 14, GROUND-TY);
    // rings (outer to inner)
    for(var i=RINGS.length-1;i>=0;i--){
      ctx.beginPath(); ctx.arc(TX,TY,RINGS[i].r,0,Math.PI*2);
      ctx.fillStyle=RINGS[i].color; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(TX,TY,R10*0.45,0,Math.PI*2); ctx.fillStyle='#3a2a1a'; ctx.fill();
    // dead-center red dot — perfect hit (10.1)
    ctx.beginPath(); ctx.arc(TX,TY,R10*0.14,0,Math.PI*2); ctx.fillStyle='#ff2e2e'; ctx.fill();
  }
  function drawHole(h){
    // arrow shaft sticking out + fletching, with little wobble timer
    var wob = h.wob>0 ? Math.sin(h.wob*1.2)*h.wob*0.6 : 0;
    h.wob = h.wob>0 ? h.wob-0.6 : 0;
    ctx.save(); ctx.translate(h.x,h.y); ctx.rotate((wob + (h.ang||0))*Math.PI/180); ctx.scale(R10/44, R10/44);
    ctx.strokeStyle='#caa15a'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(34,-44); ctx.stroke();
    // fletching
    ctx.fillStyle='#ff5470'; ctx.beginPath(); ctx.moveTo(34,-44); ctx.lineTo(40,-34); ctx.lineTo(28,-38); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#4ecdc4'; ctx.beginPath(); ctx.moveTo(31,-49); ctx.lineTo(41,-46); ctx.lineTo(32,-40); ctx.closePath(); ctx.fill();
    // tip dot
    ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(0,0,2.5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawReticle(p){
    ctx.save(); ctx.translate(p.x,p.y); ctx.scale(R10/44, R10/44);
    ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-12,0); ctx.moveTo(12,0); ctx.lineTo(28,0);
    ctx.moveTo(0,-28); ctx.lineTo(0,-12); ctx.moveTo(0,12); ctx.lineTo(0,28); ctx.stroke();
    ctx.fillStyle='#ff2e2e'; ctx.beginPath(); ctx.arc(0,0,2.5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawFlying(a){
    ctx.save(); ctx.translate(a.x,a.y);
    var ang=Math.atan2(a.vy,a.vx);
    ctx.rotate(ang); ctx.scale(R10/44, R10/44);
    ctx.strokeStyle='#caa15a'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-26,0); ctx.lineTo(10,0); ctx.stroke();
    ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(2,-4); ctx.lineTo(2,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ff5470'; ctx.beginPath(); ctx.moveTo(-26,0); ctx.lineTo(-20,-6); ctx.lineTo(-16,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#4ecdc4'; ctx.beginPath(); ctx.moveTo(-26,0); ctx.lineTo(-20,6); ctx.lineTo(-16,0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ---------- robin-hood split shards ----------
  function spawnSplit(x,y){
    var frags=[];
    for(var i=0;i<7;i++){
      var a=Math.random()*Math.PI*2, sp=2+Math.random()*3.5;
      frags.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1.5,
        rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.5, len:7+Math.random()*9, life:1 });
    }
    splits.push({ frags:frags });
  }
  function drawSplits(){
    var s=R10/44;
    for(var k=splits.length-1;k>=0;k--){
      var sp=splits[k], alive=false;
      for(var i=0;i<sp.frags.length;i++){
        var f=sp.frags[i];
        f.vy+=0.16; f.x+=f.vx; f.y+=f.vy; f.rot+=f.vr; f.life-=0.026;
        if(f.life>0){
          alive=true;
          ctx.save(); ctx.globalAlpha=Math.max(0,f.life); ctx.translate(f.x,f.y); ctx.rotate(f.rot);
          ctx.strokeStyle='#caa15a'; ctx.lineWidth=3*s; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(-f.len*s,0); ctx.lineTo(f.len*s,0); ctx.stroke();
          ctx.restore();
        }
      }
      if(!alive) splits.splice(k,1);
    }
  }

  // ---------- robin-hood celebration: golden expanding rings + sparkles ----------
  function spawnCelebrate(x,y){
    fx.push({type:'ring', x:x, y:y, r:R10*0.3, vr:R10*0.11,  life:1, col:'#ffd24a', lw:4});
    fx.push({type:'ring', x:x, y:y, r:R10*0.3, vr:R10*0.075, life:1, col:'#fff6e6', lw:2.5});
    for(var i=0;i<16;i++){
      var a=Math.random()*Math.PI*2, sp=R10*(0.05+Math.random()*0.07);
      fx.push({type:'spark', x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1,
        col:pick(['#ffd24a','#ff5470','#4ecdc4','#fff6e6','#a06bff']), sz:R10*(0.045+Math.random()*0.05)});
    }
  }
  function drawFx(){
    var s=R10/44;
    for(var i=fx.length-1;i>=0;i--){
      var e=fx[i];
      if(e.type==='ring'){
        e.r+=e.vr; e.life-=0.04;
        if(e.life>0){
          ctx.save(); ctx.globalAlpha=Math.max(0,e.life); ctx.strokeStyle=e.col; ctx.lineWidth=e.lw*s;
          ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.stroke(); ctx.restore();
        } else fx.splice(i,1);
      } else {
        e.vx*=0.96; e.vy=e.vy*0.96+R10*0.012; e.x+=e.vx; e.y+=e.vy; e.life-=0.03;
        if(e.life>0){
          ctx.save(); ctx.globalAlpha=Math.max(0,e.life); ctx.fillStyle=e.col;
          ctx.beginPath(); ctx.arc(e.x,e.y,Math.max(0.5,e.sz*e.life),0,Math.PI*2); ctx.fill(); ctx.restore();
        } else fx.splice(i,1);
      }
    }
  }

  function render(now){
    ctx.clearRect(0,0,W,H);
    drawTarget();
    for(var i=0;i<holes.length;i++) drawHole(holes[i]);
    drawSplits();
    drawFx();
    if(flying){ drawFlying(flying); }
    else if(!busy && arrows>0){ drawReticle(reticlePos(now)); updateTimer(now); }
    else { timerEl.style.display='none'; }
    requestAnimationFrame(render);
  }

  function updateTimer(now){
    if(!timerActive){ timerEl.style.display='none'; return; }
    var remain=(shotDeadline-now)/1000;
    if(remain<=0){
      timerEl.textContent='0.0';
      timerActive=false; timerEl.style.display='none'; timerEl.classList.remove('warn');
      shoot();                       // time's up — auto-release wherever the reticle is now
      return;
    }
    timerEl.style.display='block';
    timerEl.textContent=remain.toFixed(1);
    timerEl.classList.toggle('warn', remain<=3);
  }

  // ---------- scoring ----------
  function fmt(n){ return (Math.round(n*10)/10).toString(); }
  function scoreAt(x,y){
    var d=Math.hypot(x-TX, y-TY);
    if(d<=R10*0.14) return 10.1;        // dead-center red dot — perfect
    if(d<=R10*0.45) return 10;          // brown bullseye dot
    for(var i=0;i<RINGS.length;i++){ if(d<=RINGS[i].r) return RINGS[i].score; }
    return 0;
  }

  // ---------- shoot ----------
  function shoot(){
    if(busy || arrows<=0) return;
    busy=true; shootBtn.disabled=true; stopTimer();
    try{ if(audio().resume) audio().resume(); }catch(e){}

    var aim = reticlePos(performance.now());   // reticle at release = exact impact point
    arrows--; arrowsV.textContent=arrows;
    twangS();
    flash('슈웅...', false);

    // arrow flies from bottom center to EXACTLY the aim point (lands where you aimed)
    var start={ x:W*0.5, y:H*0.96 };
    var steps = reduceMotion?4:34;
    var i=0;
    flying={ x:start.x, y:start.y, vx:0, vy:0 };

    function step(){
      i++;
      var p = i/steps;
      var e = 1 - Math.pow(1-p, 2);            // ease-out: quick then settle
      var nx = start.x + (aim.x-start.x)*e;
      var ny = start.y + (aim.y-start.y)*e;
      flying.vx = nx-flying.x; flying.vy = ny-flying.y;  // for arrow angle only
      flying.x = nx; flying.y = ny;
      if(i>=steps){
        flying=null;
        land(aim.x, aim.y);                    // impact is the aimed point, period
        return;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function findSplit(x,y){
    for(var i=0;i<holes.length;i++){
      if(Math.hypot(x-holes[i].x, y-holes[i].y) <= R10*0.16) return holes[i];
    }
    return null;
  }

  function land(x,y){
    var pts = scoreAt(x,y);
    var hit = findSplit(x,y);                    // landed on a previous arrow's spot?
    holes.push({ x:x, y:y, wob:12, ang:(Math.random()*70-35) });   // random stick angle
    thunkS();

    var bonus = 0;
    if(hit){ bonus = 5; spawnSplit(hit.x, hit.y); spawnCelebrate(hit.x, hit.y); }   // robin hood — arrow splits

    var gain = pts + bonus;
    if(gain>0){ score = Math.round((score+gain)*10)/10; scoreV.textContent = fmt(score); }

    if(hit){ flash('로빈훗! 화살 명중 보너스 +'+bonus, true); confetti(340); splitS(); }
    else if(pts===10.1){ flash('퍼펙트! 정중앙 10.1점!', true); confetti(220); bullsS(); }
    else if(pts===10){ flash('명중! 정중앙 10점!', true); confetti(150); bullsS(); }
    else if(pts>=8){ flash(fmt(pts)+'점! 아주 좋아요', true); confetti(70); goodS(); }
    else if(pts>=5){ flash(fmt(pts)+'점! 나이스', false); confetti(25); goodS(); }
    else if(pts>0){ flash(fmt(pts)+'점 획득!', false); beep(440,0.1,'triangle',0.16); }
    else { flash('아쉽다! 바람을 읽어봐요', false); beep(200,0.16,'sine',0.13); }

    setTimeout(function(){
      busy=false;
      if(arrows>0){ newWind(); shootBtn.disabled=false; }
      else { endRound(); }
    }, 650);
  }

  function endRound(){
    stopTimer();
    shootBtn.innerHTML='다시 도전<span class="sub">&nbsp;</span>';
    shootBtn.disabled=false; busy=false;
    var isNewBest = score > bestScore;
    if(isNewBest){ bestScore = score; bestV.textContent = fmt(bestScore); }
    var baseMsg = score>=70 ? '대단해요! 최종 '+fmt(score)+'점 🏆' : '최종 '+fmt(score)+'점! 한 판 더?';
    var msg = isNewBest ? '🏅 최고 점수 갱신! '+fmt(score)+'점' : baseMsg;
    flash(msg, score>=70 || isNewBest);
    shootBtn.onclick = function(){ resetRound(); shootBtn.onclick=null; shootBtn.addEventListener('click',shoot); };
  }
  function resetRound(){
    arrows=10; score=0; holes=[]; flying=null; splits=[]; fx=[];
    arrowsV.textContent=arrows; scoreV.textContent=score;
    shootBtn.innerHTML='발사<span class="sub">탭 · 화면을 눌러도 발사</span>';
    newWind(); flash('조준점이 멈출 때 쏘면 명중률이 올라가요', false);
  }

  // ---------- fit canvas to displayed size (crisp, keep logical W/H aspect by letterbox-free scaling) ----------
  function fit(){
    var box=field.getBoundingClientRect();
    var w=Math.max(1,Math.round(box.width*devicePixelRatio));
    var h=Math.max(1,Math.round(box.height*devicePixelRatio));
    if(w!==field.width || h!==field.height){ field.width=w; field.height=h; }
    W=field.width; H=field.height;

    GROUND = H*0.82;                              // grass fills most; ground is a thin bottom strip
    // target as big as fits by width, but capped so it sits within the grass with margins
    TARGET_R = Math.min(W*0.44, GROUND*0.40);
    R10 = TARGET_R/6.2;
    TX = W/2;
    TY = Math.max(TARGET_R + H*0.02, GROUND*0.50);   // centered in the grass, not glued to top
    RINGS[0].r=R10*1.0; RINGS[1].r=R10*1.7; RINGS[2].r=R10*2.4; RINGS[3].r=R10*3.1;
    RINGS[4].r=R10*3.8; RINGS[5].r=R10*4.5; RINGS[6].r=R10*5.3; RINGS[7].r=R10*6.2;
  }

  // ---------- mute ----------
  var SPK_ON='<svg viewBox="0 0 100 100" fill="#fff6e6"><path d="M20 38 H38 L58 20 V80 L38 62 H20 Z"/><path d="M68 36 a20 20 0 0 1 0 28" fill="none" stroke="#fff6e6" stroke-width="6" stroke-linecap="round"/><path d="M76 28 a32 32 0 0 1 0 44" fill="none" stroke="#fff6e6" stroke-width="6" stroke-linecap="round"/></svg>';
  var SPK_OFF='<svg viewBox="0 0 100 100" fill="#fff6e6"><path d="M20 38 H38 L58 20 V80 L38 62 H20 Z"/><path d="M66 38 L86 62 M86 38 L66 62" stroke="#fff6e6" stroke-width="6" stroke-linecap="round"/></svg>';

  // ---------- init ----------
  muteBtn.innerHTML=SPK_ON;
  shootBtn.addEventListener('click', shoot);
  field.addEventListener('pointerdown', function(e){ e.preventDefault(); shoot(); });
  muteBtn.addEventListener('click', function(){ muted=!muted; muteBtn.innerHTML=muted?SPK_OFF:SPK_ON; if(!muted) beep(523,0.08,'triangle',0.15); });

  fit(); newWind();
  requestAnimationFrame(render);
  requestAnimationFrame(fit);
  setTimeout(fit,150);
  window.addEventListener('load', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit,200); });
})();
</script>
</body>
</html>
