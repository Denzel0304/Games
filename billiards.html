<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>4구 당구</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&family=Bebas+Neue&display=swap');

  :root {
    --felt: #1a6b3a;
    --felt-light: #1e7d44;
    --felt-dark: #144f2c;
    --cushion: #5c3317;
    --cushion-light: #7a4420;
    --rail: #3d2007;
    --ball-white: #f5f0e8;
    --ball-red: #e02020;
    --ball-yellow: #f5c500;
    --ball-red2: #c01818;
    --gold: #d4a843;
    --gold-light: #f0c855;
    --ui-bg: #0d0d0d;
    --ui-card: #1a1a1a;
    --ui-border: #2a2a2a;
    --text: #f0ead8;
    --text-dim: #8a8070;
    --accent: #d4a843;
    --danger: #e02020;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--ui-bg);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* ── SCREENS ── */
  .screen { display: none; flex-direction: column; height: 100dvh; }
  .screen.active { display: flex; }

  /* ── START SCREEN ── */
  #startScreen {
    align-items: center;
    justify-content: center;
    gap: 0;
    background: radial-gradient(ellipse at 30% 20%, #1e4a28 0%, #0d1a10 60%, #050805 100%);
  }

  .start-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 16vw, 96px);
    letter-spacing: 0.08em;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(212,168,67,0.4), 0 4px 0 rgba(0,0,0,0.5);
    line-height: 1;
    margin-bottom: 4px;
  }
  .start-sub {
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 48px;
  }

  .ball-preview {
    display: flex;
    gap: 16px;
    margin-bottom: 48px;
  }
  .ball-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    box-shadow: inset -4px -4px 8px rgba(0,0,0,0.4), inset 2px 2px 6px rgba(255,255,255,0.3);
  }
  .bd-white { background: radial-gradient(circle at 35% 35%, #fff 0%, #d8d0be 100%); }
  .bd-yellow { background: radial-gradient(circle at 35% 35%, #ffd93d 0%, #c8a000 100%); }
  .bd-red1 { background: radial-gradient(circle at 35% 35%, #ff5555 0%, #aa0000 100%); }
  .bd-red2 { background: radial-gradient(circle at 35% 35%, #ff4444 0%, #880000 100%); }

  .score-select-label {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-bottom: 14px;
    text-align: center;
  }
  .score-options {
    display: flex;
    gap: 10px;
    margin-bottom: 40px;
  }
  .score-btn {
    width: 60px; height: 60px;
    border-radius: 12px;
    border: 2px solid var(--ui-border);
    background: var(--ui-card);
    color: var(--text-dim);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .score-btn.selected {
    border-color: var(--gold);
    background: rgba(212,168,67,0.12);
    color: var(--gold);
    box-shadow: 0 0 16px rgba(212,168,67,0.2);
  }

  .start-play-btn {
    width: 200px; height: 56px;
    border-radius: 28px;
    border: none;
    background: linear-gradient(135deg, var(--gold) 0%, #b8891e 100%);
    color: #1a0f00;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.1em;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(212,168,67,0.35);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .start-play-btn:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(212,168,67,0.25); }

  /* ── GAME SCREEN ── */
  #gameScreen { background: var(--ui-bg); }

  /* Top HUD */
  .hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px 8px;
    background: var(--ui-card);
    border-bottom: 1px solid var(--ui-border);
    flex-shrink: 0;
  }
  .hud-player {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 80px;
  }
  .hud-player-name {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .hud-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    line-height: 1;
    color: var(--text);
    letter-spacing: 0.05em;
  }
  .hud-score-target {
    font-size: 11px;
    color: var(--text-dim);
  }
  .hud-player.active .hud-score { color: var(--gold); }
  .hud-player.active .hud-player-name { color: var(--gold); }

  .hud-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .hud-turn-badge {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .hud-turn-indicator {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
    transition: background 0.3s;
  }
  .hud-menu-btn {
    background: none;
    border: 1px solid var(--ui-border);
    color: var(--text-dim);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }

  /* Canvas area */
  .canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  #gameCanvas { touch-action: none; display: block; }

  /* Bottom controls */
  .controls {
    flex-shrink: 0;
    background: var(--ui-card);
    border-top: 1px solid var(--ui-border);
    padding: 10px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Spin selector */
  .spin-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .spin-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    min-width: 28px;
  }
  .spin-pad-wrap {
    position: relative;
    width: 56px; height: 56px;
    flex-shrink: 0;
  }
  .spin-pad {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f0e8d0 0%, #c8bc98 40%, #a09070 100%);
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.2);
    cursor: crosshair;
    position: relative;
    touch-action: none;
  }
  .spin-dot {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(30,200,100,0.9);
    box-shadow: 0 0 6px rgba(30,200,100,0.8);
    transform: translate(-50%,-50%);
    pointer-events: none;
    transition: left 0.05s, top 0.05s;
  }
  .spin-cross-h, .spin-cross-v {
    position: absolute;
    background: rgba(255,255,255,0.15);
    pointer-events: none;
  }
  .spin-cross-h { width: 100%; height: 1px; top: 50%; left: 0; transform: translateY(-50%); }
  .spin-cross-v { height: 100%; width: 1px; left: 50%; top: 0; transform: translateX(-50%); }

  .spin-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .spin-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .spin-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .spin-badge.active {
    background: rgba(212,168,67,0.15);
    color: var(--gold);
  }

  /* Angle + Power row */
  .aim-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .angle-ctrl {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .angle-btns {
    display: flex;
    gap: 4px;
  }
  .angle-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--ui-border);
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s;
  }
  .angle-btn:active { background: rgba(212,168,67,0.15); color: var(--gold); }
  .angle-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .angle-label { font-size: 9px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }

  /* Power slider */
  .power-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .power-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .power-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.15em; }
  .power-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    color: var(--gold);
    letter-spacing: 0.05em;
  }
  .power-track {
    height: 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    position: relative;
    cursor: pointer;
    touch-action: none;
  }
  .power-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #2ecc71, #f39c12, #e74c3c);
    transition: width 0.05s;
    pointer-events: none;
  }
  .power-thumb {
    position: absolute;
    top: 50%;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* Shoot button */
  .shoot-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--gold) 0%, #9a6a10 100%);
    color: #1a0f00;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(212,168,67,0.4);
    transition: transform 0.1s;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .shoot-btn:active { transform: scale(0.93); }
  .shoot-btn:disabled { opacity: 0.4; transform: none; }

  /* Toast */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(15,15,15,0.95);
    border: 1px solid var(--ui-border);
    border-radius: 16px;
    padding: 20px 32px;
    text-align: center;
    z-index: 100;
    opacity: 0;
    transition: all 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .toast-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--gold);
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 4px;
  }
  .toast-msg { font-size: 13px; color: var(--text-dim); }

  /* Win Screen */
  #winScreen {
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: radial-gradient(ellipse at 50% 40%, #2a1a00 0%, #0d0d0d 100%);
  }
  .win-trophy { font-size: 72px; }
  .win-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .win-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    color: var(--gold);
    letter-spacing: 0.1em;
    line-height: 1;
  }
  .win-score {
    font-size: 13px;
    color: var(--text-dim);
  }
  .win-btns { display: flex; gap: 12px; margin-top: 10px; }
  .win-btn {
    padding: 14px 28px;
    border-radius: 24px;
    border: 1px solid var(--ui-border);
    background: var(--ui-card);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .win-btn.primary {
    background: linear-gradient(135deg, var(--gold) 0%, #b8891e 100%);
    color: #1a0f00;
    border: none;
    font-weight: 700;
  }

  /* Overlay menu */
  #menuOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  #menuOverlay.show { display: flex; }
  .menu-card {
    background: var(--ui-card);
    border: 1px solid var(--ui-border);
    border-radius: 20px;
    padding: 28px 24px;
    min-width: 240px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .menu-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: var(--gold);
    letter-spacing: 0.1em;
    text-align: center;
    margin-bottom: 4px;
  }
  .menu-item {
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--ui-border);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s;
  }
  .menu-item:active { background: rgba(212,168,67,0.1); }
  .menu-item.danger { color: var(--danger); }
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen" class="screen active">
  <div class="start-logo">4구</div>
  <div class="start-sub">Carom Billiards</div>
  <div class="ball-preview">
    <div class="ball-dot bd-white"></div>
    <div class="ball-dot bd-yellow"></div>
    <div class="ball-dot bd-red1"></div>
    <div class="ball-dot bd-red2"></div>
  </div>
  <div class="score-select-label">목표 점수</div>
  <div class="score-options">
    <button class="score-btn" data-score="10">10</button>
    <button class="score-btn selected" data-score="20">20</button>
    <button class="score-btn" data-score="30">30</button>
    <button class="score-btn" data-score="50">50</button>
    <button class="score-btn" data-score="100">100</button>
  </div>
  <button class="start-play-btn" id="startBtn">게임 시작</button>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="screen">
  <div class="hud">
    <div class="hud-player active" id="hudP1">
      <div class="hud-player-name">🔵 플레이어 1</div>
      <div class="hud-score" id="score1">0</div>
      <div class="hud-score-target" id="target1">/ 20</div>
    </div>
    <div class="hud-center">
      <div class="hud-turn-badge">차례</div>
      <div class="hud-turn-indicator" id="turnIndicator"></div>
      <button class="hud-menu-btn" id="menuBtn">☰</button>
    </div>
    <div class="hud-player" id="hudP2">
      <div class="hud-player-name">🔴 플레이어 2</div>
      <div class="hud-score" id="score2">0</div>
      <div class="hud-score-target" id="target2">/ 20</div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div class="controls">
    <!-- Spin + Angle row -->
    <div class="spin-row">
      <div class="spin-label">스핀</div>
      <div class="spin-pad-wrap">
        <div class="spin-pad" id="spinPad">
          <div class="spin-cross-h"></div>
          <div class="spin-cross-v"></div>
          <div class="spin-dot" id="spinDot" style="left:50%;top:50%"></div>
        </div>
      </div>
      <div class="spin-info">
        <div class="spin-badges">
          <span class="spin-badge" id="badgeTop">톱스핀</span>
          <span class="spin-badge" id="badgeBack">백스핀</span>
          <span class="spin-badge" id="badgeLeft">좌회전</span>
          <span class="spin-badge" id="badgeRight">우회전</span>
        </div>
      </div>

      <div class="angle-ctrl">
        <div class="angle-label">각도</div>
        <div class="angle-btns">
          <button class="angle-btn" id="angleCCW">◀</button>
          <button class="angle-btn" id="angleCW">▶</button>
        </div>
        <div class="angle-display" id="angleDisplay">0°</div>
      </div>
    </div>

    <!-- Power + Shoot row -->
    <div class="aim-row">
      <div class="power-wrap">
        <div class="power-top">
          <span class="power-label">파워</span>
          <span class="power-value" id="powerValue">50%</span>
        </div>
        <div class="power-track" id="powerTrack">
          <div class="power-fill" id="powerFill" style="width:50%"></div>
          <div class="power-thumb" id="powerThumb" style="left:50%"></div>
        </div>
      </div>
      <button class="shoot-btn" id="shootBtn">🎱</button>
    </div>
  </div>
</div>

<!-- WIN SCREEN -->
<div id="winScreen" class="screen">
  <div class="win-trophy">🏆</div>
  <div class="win-title">승리!</div>
  <div class="win-name" id="winName">플레이어 1</div>
  <div class="win-score" id="winScore"></div>
  <div class="win-btns">
    <button class="win-btn" id="winMenuBtn">메인으로</button>
    <button class="win-btn primary" id="winRetryBtn">다시하기</button>
  </div>
</div>

<!-- MENU OVERLAY -->
<div id="menuOverlay">
  <div class="menu-card">
    <div class="menu-title">메뉴</div>
    <button class="menu-item" id="menuResume">계속하기</button>
    <button class="menu-item" id="menuRestart">다시 시작</button>
    <button class="menu-item danger" id="menuMain">메인으로</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <span class="toast-title" id="toastTitle"></span>
  <span class="toast-msg" id="toastMsg"></span>
</div>

<script>
// ════════════════════════════════════════════════
//  CONSTANTS & STATE
// ════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const FRICTION = 0.987;
const SPIN_DECAY = 0.92;
const MIN_SPEED = 0.15;
const MAX_POWER = 22;

let targetScore = 20;
let scores = [0, 0];
let currentPlayer = 0; // 0 or 1
let balls = [];
let shooting = false;
let gameActive = false;
let animId = null;
let cueAngle = 0; // radians
let power = 50;   // 0-100
let spinX = 0;    // -1 to 1 (left/right)
let spinY = 0;    // -1 to 1 (top/back)

// Table dimensions (set on resize)
let TW, TH, CUSHION, BALL_R;

// Drag state
let isDraggingCanvas = false;
let dragStartX, dragStartY;
let dragStartAngle;

// ════════════════════════════════════════════════
//  RESIZE
// ════════════════════════════════════════════════
function resize() {
  const wrap = document.querySelector('.canvas-wrap');
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;

  // 4구 table ratio ≈ 2:1 (length:width)
  const tableRatio = 2.0;
  let tW, tH;
  if (W / H > tableRatio) {
    tH = H * 0.96;
    tW = tH * tableRatio;
  } else {
    tW = W * 0.96;
    tH = tW / tableRatio;
  }

  CUSHION = Math.round(tW * 0.04);
  BALL_R = Math.round(tW * 0.028);

  canvas.width = Math.round(tW);
  canvas.height = Math.round(tH);
  TW = canvas.width;
  TH = canvas.height;
}

// ════════════════════════════════════════════════
//  BALL SETUP
// ════════════════════════════════════════════════
function makeBall(x, y, color, label) {
  return { x, y, vx: 0, vy: 0, sx: 0, sy: 0, color, label, pocketed: false };
}

function initBalls() {
  const cx = TW / 2, cy = TH / 2;
  const qx = TW / 4, qy = TH / 4;
  balls = [
    makeBall(cx,        cy,         'white',  'white'),   // 수구 (P1)
    makeBall(TW*0.75,   cy,         'yellow', 'yellow'),  // 수구 (P2)
    makeBall(cx,        cy - TH*0.2,'red',    'red1'),    // 목적구 1
    makeBall(cx,        cy + TH*0.2,'red2',   'red2'),    // 목적구 2
  ];
}

function getCueBall() {
  return balls[currentPlayer === 0 ? 0 : 1];
}

// ════════════════════════════════════════════════
//  PHYSICS
// ════════════════════════════════════════════════
function step() {
  let moving = false;

  balls.forEach(b => {
    if (!b.vx && !b.vy) return;
    moving = true;

    // Spin effect on velocity
    b.vx += b.sx * 0.04;
    b.vy += b.sy * 0.04;

    b.x += b.vx;
    b.y += b.vy;

    // Friction
    b.vx *= FRICTION;
    b.vy *= FRICTION;
    b.sx *= SPIN_DECAY;
    b.sy *= SPIN_DECAY;

    // Stop below threshold
    if (Math.abs(b.vx) < MIN_SPEED) b.vx = 0;
    if (Math.abs(b.vy) < MIN_SPEED) b.vy = 0;

    // Cushion bounce
    if (b.x - BALL_R < CUSHION) { b.x = CUSHION + BALL_R; b.vx = Math.abs(b.vx) * 0.82; b.sx *= -0.4; }
    if (b.x + BALL_R > TW - CUSHION) { b.x = TW - CUSHION - BALL_R; b.vx = -Math.abs(b.vx) * 0.82; b.sx *= -0.4; }
    if (b.y - BALL_R < CUSHION) { b.y = CUSHION + BALL_R; b.vy = Math.abs(b.vy) * 0.82; b.sy *= -0.4; }
    if (b.y + BALL_R > TH - CUSHION) { b.y = TH - CUSHION - BALL_R; b.vy = -Math.abs(b.vy) * 0.82; b.sy *= -0.4; }
  });

  // Ball collisions
  for (let i = 0; i < balls.length; i++) {
    for (let j = i+1; j < balls.length; j++) {
      collide(balls[i], balls[j]);
    }
  }

  return moving;
}

function collide(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const minDist = BALL_R * 2;
  if (dist >= minDist || dist < 0.01) return;

  const nx = dx/dist, ny = dy/dist;

  // Separate
  const overlap = (minDist - dist) * 0.51;
  a.x -= nx * overlap; a.y -= ny * overlap;
  b.x += nx * overlap; b.y += ny * overlap;

  // Elastic collision
  const dvx = b.vx - a.vx, dvy = b.vy - a.vy;
  const dot = dvx*nx + dvy*ny;
  if (dot >= 0) return;

  const restitution = 0.92;
  const impulse = dot * restitution;
  a.vx += impulse * nx; a.vy += impulse * ny;
  b.vx -= impulse * nx; b.vy -= impulse * ny;
}

// ════════════════════════════════════════════════
//  SCORING
// ════════════════════════════════════════════════
let hitCount = 0;
let lastCueBall = null;
let hitBalls = new Set();

function checkScore() {
  // Count collisions with non-cue balls during this shot
  // We track hits via collision detection during animation
  if (hitBalls.size >= 2) {
    scores[currentPlayer]++;
    document.getElementById(`score${currentPlayer+1}`).textContent = scores[currentPlayer];
    showToast('득점!', `${currentPlayer===0?'플레이어 1':'플레이어 2'} — ${scores[currentPlayer]}점`);
    if (scores[currentPlayer] >= targetScore) {
      setTimeout(showWin, 800);
      return;
    }
    // Continue same player's turn
  } else {
    // Switch turn
    currentPlayer = 1 - currentPlayer;
    updateHUD();
    if (hitBalls.size === 0) {
      showToast('노 히트', '상대방 차례');
    } else {
      showToast('1개 히트', '상대방 차례');
    }
  }
}

// ════════════════════════════════════════════════
//  SHOOT
// ════════════════════════════════════════════════
function shoot() {
  if (shooting) return;
  const cue = getCueBall();
  const spd = (power / 100) * MAX_POWER;
  cue.vx = Math.cos(cueAngle) * spd;
  cue.vy = Math.sin(cueAngle) * spd;

  // Apply spin
  cue.sx = spinX * spd * 0.35;
  cue.sy = spinY * spd * 0.35;

  shooting = true;
  hitBalls = new Set();
  document.getElementById('shootBtn').disabled = true;
  runPhysics();
}

function runPhysics() {
  let prevPositions = balls.map(b => ({x: b.x, y: b.y}));
  const cueIdx = currentPlayer === 0 ? 0 : 1;

  function detectHits() {
    balls.forEach((b, i) => {
      if (i === cueIdx) return;
      const cue = balls[cueIdx];
      const dx = b.x - cue.x, dy = b.y - cue.y;
      if (Math.sqrt(dx*dx+dy*dy) < BALL_R * 2.2) hitBalls.add(i);
    });
  }

  function loop() {
    for (let s = 0; s < 3; s++) {
      const moved = step();
      detectHits();
      if (!moved && s === 0) {
        endShot();
        return;
      }
    }
    draw();
    animId = requestAnimationFrame(loop);
  }

  function endShot() {
    shooting = false;
    document.getElementById('shootBtn').disabled = false;
    checkScore();
    draw();
  }

  loop();
}

// ════════════════════════════════════════════════
//  DRAW
// ════════════════════════════════════════════════
function draw() {
  const W = TW, H = TH;
  ctx.clearRect(0, 0, W, H);

  // Table background with wooden frame
  // Rail
  ctx.fillStyle = '#3d2007';
  ctx.fillRect(0, 0, W, H);

  // Rail inner highlight
  ctx.fillStyle = '#5c3317';
  ctx.fillRect(3, 3, W-6, H-6);

  // Felt
  const feltX = CUSHION, feltY = CUSHION;
  const feltW = W - CUSHION*2, feltH = H - CUSHION*2;

  // Felt gradient
  const feltGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.6);
  feltGrad.addColorStop(0, '#1e7d44');
  feltGrad.addColorStop(1, '#144f2c');
  ctx.fillStyle = feltGrad;
  ctx.fillRect(feltX, feltY, feltW, feltH);

  // Felt grid texture
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 1;
  const gridSize = BALL_R * 3;
  for (let x = feltX; x < feltX + feltW; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, feltY); ctx.lineTo(x, feltY+feltH); ctx.stroke();
  }
  for (let y = feltY; y < feltY + feltH; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(feltX, y); ctx.lineTo(feltX+feltW, y); ctx.stroke();
  }

  // Center dot
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath(); ctx.arc(W/2, H/2, 3, 0, Math.PI*2); ctx.fill();

  // Cushion lines (inner edge)
  ctx.strokeStyle = '#2d8a4e';
  ctx.lineWidth = 2;
  ctx.strokeRect(feltX + 2, feltY + 2, feltW - 4, feltH - 4);

  // Corner diamonds
  const dSize = CUSHION * 0.35;
  const corners = [[feltX, feltY],[feltX+feltW, feltY],[feltX, feltY+feltH],[feltX+feltW, feltY+feltH]];
  ctx.fillStyle = 'rgba(212,168,67,0.4)';
  corners.forEach(([cx, cy]) => {
    ctx.beginPath();
    ctx.arc(cx, cy, dSize, 0, Math.PI*2);
    ctx.fill();
  });

  // Mid diamonds
  ctx.fillStyle = 'rgba(212,168,67,0.25)';
  [[W/2, feltY],[W/2, feltY+feltH],[feltX, H/2],[feltX+feltW, H/2]].forEach(([cx,cy]) => {
    ctx.beginPath(); ctx.arc(cx, cy, dSize*0.7, 0, Math.PI*2); ctx.fill();
  });

  // Aim line (when not shooting)
  if (!shooting) {
    drawAimLine();
  }

  // Balls
  balls.forEach(b => drawBall(b));

  // Cue stick
  if (!shooting) {
    drawCue();
  }
}

function drawAimLine() {
  const cue = getCueBall();
  const len = Math.max(TW, TH) * 1.5;
  const ex = cue.x + Math.cos(cueAngle) * len;
  const ey = cue.y + Math.sin(cueAngle) * len;

  // Raytrace for reflection
  const lines = traceRay(cue.x, cue.y, cueAngle, 2);

  ctx.setLineDash([6, 8]);
  ctx.lineWidth = 1.5;

  lines.forEach((seg, i) => {
    const alpha = i === 0 ? 0.7 : 0.35;
    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.moveTo(seg.x1, seg.y1);
    ctx.lineTo(seg.x2, seg.y2);
    ctx.stroke();
  });
  ctx.setLineDash([]);
}

function traceRay(ox, oy, angle, bounces) {
  const segs = [];
  let x = ox, y = oy, a = angle;
  const minX = CUSHION + BALL_R, maxX = TW - CUSHION - BALL_R;
  const minY = CUSHION + BALL_R, maxY = TH - CUSHION - BALL_R;

  for (let b = 0; b <= bounces; b++) {
    const dx = Math.cos(a), dy = Math.sin(a);
    let tMin = Infinity, hitAxis = null;

    if (dx > 0) { const t = (maxX - x) / dx; if (t > 0 && t < tMin) { tMin = t; hitAxis = 'x'; } }
    else if (dx < 0) { const t = (minX - x) / dx; if (t > 0 && t < tMin) { tMin = t; hitAxis = 'x'; } }
    if (dy > 0) { const t = (maxY - y) / dy; if (t > 0 && t < tMin) { tMin = t; hitAxis = 'y'; } }
    else if (dy < 0) { const t = (minY - y) / dy; if (t > 0 && t < tMin) { tMin = t; hitAxis = 'y'; } }

    const nx = x + dx * tMin, ny = y + dy * tMin;
    segs.push({x1:x, y1:y, x2:nx, y2:ny});
    x = nx; y = ny;
    if (hitAxis === 'x') a = Math.PI - a;
    else a = -a;
  }
  return segs;
}

function drawCue() {
  const cue = getCueBall();
  const tipDist = BALL_R + 6;
  const cueLen = TW * 0.38;

  const tx = cue.x + Math.cos(cueAngle) * tipDist;
  const ty = cue.y + Math.sin(cueAngle) * tipDist;
  const bx = tx + Math.cos(cueAngle) * cueLen;
  const by = ty + Math.sin(cueAngle) * cueLen;

  // Shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 6;

  const grad = ctx.createLinearGradient(tx, ty, bx, by);
  grad.addColorStop(0, '#f0e8d0');
  grad.addColorStop(0.05, '#c8aa70');
  grad.addColorStop(0.5, '#8B6914');
  grad.addColorStop(1, '#5a4010');

  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(bx, by);
  ctx.lineWidth = 6;
  ctx.strokeStyle = grad;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Tip
  ctx.beginPath();
  ctx.arc(tx, ty, 4, 0, Math.PI*2);
  ctx.fillStyle = '#4a90d9';
  ctx.fill();
  ctx.restore();
}

function drawBall(b) {
  if (b.pocketed) return;

  const colors = {
    white:  { main: '#f5f0e8', hi: '#ffffff', sh: '#c8bca8' },
    yellow: { main: '#e8b800', hi: '#ffd93d', sh: '#9a7a00' },
    red:    { main: '#cc1a1a', hi: '#ff5555', sh: '#880000' },
    red2:   { main: '#cc1a1a', hi: '#ff4444', sh: '#770000' },
  };
  const c = colors[b.color] || colors.white;

  // Shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = BALL_R * 0.8;
  ctx.shadowOffsetY = BALL_R * 0.3;

  // Main ball
  const grad = ctx.createRadialGradient(
    b.x - BALL_R*0.3, b.y - BALL_R*0.3, BALL_R*0.05,
    b.x, b.y, BALL_R
  );
  grad.addColorStop(0, c.hi);
  grad.addColorStop(0.4, c.main);
  grad.addColorStop(1, c.sh);

  ctx.beginPath();
  ctx.arc(b.x, b.y, BALL_R, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  // Highlight
  ctx.beginPath();
  ctx.arc(b.x - BALL_R*0.3, b.y - BALL_R*0.32, BALL_R*0.28, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fill();

  // Label ring for red2 (distinguish)
  if (b.color === 'red2') {
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_R * 0.65, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Cue ball indicator
  if ((b.color === 'white' && currentPlayer === 0) ||
      (b.color === 'yellow' && currentPlayer === 1)) {
    if (!shooting) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R + 4, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(212,168,67,0.7)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

// ════════════════════════════════════════════════
//  CANVAS DRAG (angle control)
// ════════════════════════════════════════════════
canvas.addEventListener('pointerdown', e => {
  if (shooting) return;
  isDraggingCanvas = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragStartAngle = cueAngle;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (!isDraggingCanvas || shooting) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  // Use dx to rotate angle (touch drag → fine angle control)
  cueAngle = dragStartAngle + dx * 0.008;
  updateAngleDisplay();
  draw();
});

canvas.addEventListener('pointerup', () => { isDraggingCanvas = false; });

// ════════════════════════════════════════════════
//  ANGLE BUTTONS (fine control)
// ════════════════════════════════════════════════
let angleInterval = null;

function startAngle(delta) {
  cueAngle += delta;
  updateAngleDisplay();
  draw();
  angleInterval = setInterval(() => {
    cueAngle += delta;
    updateAngleDisplay();
    draw();
  }, 80);
}

document.getElementById('angleCCW').addEventListener('pointerdown', e => { e.preventDefault(); startAngle(-0.025); });
document.getElementById('angleCW').addEventListener('pointerdown', e => { e.preventDefault(); startAngle(0.025); });
['pointerup','pointerleave','pointercancel'].forEach(ev => {
  document.getElementById('angleCCW').addEventListener(ev, () => clearInterval(angleInterval));
  document.getElementById('angleCW').addEventListener(ev, () => clearInterval(angleInterval));
});

function updateAngleDisplay() {
  let deg = ((cueAngle * 180 / Math.PI) % 360 + 360) % 360;
  document.getElementById('angleDisplay').textContent = Math.round(deg) + '°';
}

// ════════════════════════════════════════════════
//  SPIN PAD
// ════════════════════════════════════════════════
const spinPad = document.getElementById('spinPad');
const spinDot = document.getElementById('spinDot');

function updateSpin(cx, cy) {
  const rect = spinPad.getBoundingClientRect();
  const px = (cx - rect.left) / rect.width;
  const py = (cy - rect.top) / rect.height;
  const sx = Math.max(0, Math.min(1, px));
  const sy = Math.max(0, Math.min(1, py));

  // Center → -1 to 1
  spinX = (sx - 0.5) * 2;
  spinY = (sy - 0.5) * 2;

  // Clamp to circle
  const mag = Math.sqrt(spinX*spinX + spinY*spinY);
  if (mag > 1) { spinX /= mag; spinY /= mag; }

  const dotX = 50 + spinX * 46 + '%';
  const dotY = 50 + spinY * 46 + '%';
  spinDot.style.left = dotX;
  spinDot.style.top = dotY;

  updateSpinBadges();
}

function updateSpinBadges() {
  const threshold = 0.25;
  document.getElementById('badgeTop').classList.toggle('active', spinY < -threshold);
  document.getElementById('badgeBack').classList.toggle('active', spinY > threshold);
  document.getElementById('badgeLeft').classList.toggle('active', spinX < -threshold);
  document.getElementById('badgeRight').classList.toggle('active', spinX > threshold);
}

spinPad.addEventListener('pointerdown', e => {
  spinPad.setPointerCapture(e.pointerId);
  updateSpin(e.clientX, e.clientY);
});
spinPad.addEventListener('pointermove', e => {
  if (e.buttons === 0) return;
  updateSpin(e.clientX, e.clientY);
});
spinPad.addEventListener('pointerup', () => {});

// Double tap to reset spin
spinPad.addEventListener('dblclick', () => {
  spinX = 0; spinY = 0;
  spinDot.style.left = '50%'; spinDot.style.top = '50%';
  updateSpinBadges();
});

// ════════════════════════════════════════════════
//  POWER SLIDER
// ════════════════════════════════════════════════
const powerTrack = document.getElementById('powerTrack');
const powerFill = document.getElementById('powerFill');
const powerThumb = document.getElementById('powerThumb');
const powerValue = document.getElementById('powerValue');

function updatePowerUI() {
  powerFill.style.width = power + '%';
  powerThumb.style.left = power + '%';
  powerValue.textContent = Math.round(power) + '%';
}

function setPowerFromEvent(e) {
  const rect = powerTrack.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  power = Math.max(5, Math.min(100, x * 100));
  updatePowerUI();
}

powerTrack.addEventListener('pointerdown', e => {
  powerTrack.setPointerCapture(e.pointerId);
  setPowerFromEvent(e);
});
powerTrack.addEventListener('pointermove', e => {
  if (e.buttons === 0) return;
  setPowerFromEvent(e);
});

// ════════════════════════════════════════════════
//  SHOOT BUTTON
// ════════════════════════════════════════════════
document.getElementById('shootBtn').addEventListener('click', () => {
  if (!shooting && gameActive) shoot();
});

// ════════════════════════════════════════════════
//  HUD UPDATE
// ════════════════════════════════════════════════
function updateHUD() {
  document.getElementById('hudP1').classList.toggle('active', currentPlayer === 0);
  document.getElementById('hudP2').classList.toggle('active', currentPlayer === 1);
  const ind = document.getElementById('turnIndicator');
  ind.style.background = currentPlayer === 0 ? '#4a90d9' : '#e8b800';
  ind.style.boxShadow = currentPlayer === 0 ? '0 0 8px #4a90d9' : '0 0 8px #e8b800';
}

// ════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════
let toastTimer = null;
function showToast(title, msg, duration = 1800) {
  const el = document.getElementById('toast');
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastMsg').textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

// ════════════════════════════════════════════════
//  WIN
// ════════════════════════════════════════════════
function showWin() {
  const name = currentPlayer === 0 ? '플레이어 1' : '플레이어 2';
  document.getElementById('winName').textContent = name;
  document.getElementById('winScore').textContent =
    `${scores[0]}점 : ${scores[1]}점 (목표: ${targetScore}점)`;
  showScreen('winScreen');
}

// ════════════════════════════════════════════════
//  SCREEN MANAGEMENT
// ════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame() {
  scores = [0, 0];
  currentPlayer = 0;
  shooting = false;
  gameActive = true;
  cueAngle = Math.PI; // point left initially
  power = 50;
  spinX = 0; spinY = 0;
  spinDot.style.left = '50%'; spinDot.style.top = '50%';
  updateSpinBadges();

  document.getElementById('score1').textContent = '0';
  document.getElementById('score2').textContent = '0';
  document.getElementById('target1').textContent = '/ ' + targetScore;
  document.getElementById('target2').textContent = '/ ' + targetScore;

  showScreen('gameScreen');
  resize();
  initBalls();
  updateHUD();
  updateAngleDisplay();
  updatePowerUI();
  draw();
}

// ════════════════════════════════════════════════
//  MENU
// ════════════════════════════════════════════════
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('menuOverlay').classList.add('show');
});
document.getElementById('menuResume').addEventListener('click', () => {
  document.getElementById('menuOverlay').classList.remove('show');
});
document.getElementById('menuRestart').addEventListener('click', () => {
  document.getElementById('menuOverlay').classList.remove('show');
  startGame();
});
document.getElementById('menuMain').addEventListener('click', () => {
  document.getElementById('menuOverlay').classList.remove('show');
  gameActive = false;
  showScreen('startScreen');
});
document.getElementById('menuOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('menuOverlay'))
    document.getElementById('menuOverlay').classList.remove('show');
});

// WIN screen buttons
document.getElementById('winRetryBtn').addEventListener('click', startGame);
document.getElementById('winMenuBtn').addEventListener('click', () => showScreen('startScreen'));

// ════════════════════════════════════════════════
//  START SCREEN
// ════════════════════════════════════════════════
document.querySelectorAll('.score-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.score-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    targetScore = parseInt(btn.dataset.score);
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);

// ════════════════════════════════════════════════
//  RESIZE HANDLER
// ════════════════════════════════════════════════
window.addEventListener('resize', () => {
  if (gameActive) { resize(); initBalls(); draw(); }
});

// Initial draw of start screen background
window.addEventListener('load', () => {
  // pre-select 20
  document.querySelectorAll('.score-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.score === '20');
  });
});
