<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>꼬마 곰의 창고 🐻</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #fdf6ee;
  --bg2:     #fff8f2;
  --accent:  #ff9a7b;
  --text:    #5a3e28;
  --text2:   #8a6a50;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  touch-action: none;
}
#app {
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100dvh;
  padding: 10px 12px 10px;
  gap: 8px;
}

/* header */
.header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.header h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.3px; }
.header h1 span { color: var(--accent); }
.chips { display: flex; gap: 6px; }
.chip {
  background: var(--bg2);
  border: 1.5px solid #e8d8c8;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; gap: 4px;
}
.chip .lbl { font-weight: 400; color: var(--text2); font-size: 11px; }

/* board */
#board-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  position: relative;
  min-height: 0;
}
#game-canvas {
  border-radius: 14px;
  box-shadow: 0 6px 24px rgba(90,62,40,0.14);
  display: block;
  touch-action: none;
}

/* overlay */
.overlay {
  position: absolute; inset: 0; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(253,246,238,0.94);
  opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 10;
}
.overlay.show { opacity: 1; pointer-events: all; }
.ov-emoji { font-size: 52px; animation: pop 0.4s ease-out; }
@keyframes pop { 0%{transform:scale(0.4)} 75%{transform:scale(1.15)} 100%{transform:scale(1)} }
.ov-title { font-size: 22px; font-weight: 900; margin-top: 8px; }
.ov-msg   { font-size: 13px; color: var(--text2); margin-top: 4px; }
.ov-btn {
  margin-top: 18px; background: var(--accent); color: #fff;
  border: none; border-radius: 50px;
  font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800;
  padding: 13px 34px; cursor: pointer;
  box-shadow: 0 4px 0 #c96a40;
}
.ov-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c96a40; }

/* dots */
.dots {
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; flex-shrink: 0;
}
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: #e8d8c8;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s;
}
.dot.done    { background: #88c98a; }
.dot.current { background: var(--accent); transform: scale(1.5); }

/* action row */
.action-row {
  display: flex; gap: 6px; width: 100%; flex-shrink: 0;
}
.act-btn {
  flex: 1; font-family: 'Nunito', sans-serif;
  font-size: 12px; font-weight: 800;
  padding: 10px 0; border: none; border-radius: 14px;
  cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.10);
}
.act-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.10); }
.btn-prev  { background: #d8eeff; color: #205080; }
.btn-undo  { background: #f5e6d0; color: #7a4a20; }
.btn-reset { background: #ffd0c0; color: #a03010; }
.btn-next  { background: #d0f0d8; color: #206030; }

/* dpad */
.dpad { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
.dpad-row { display: flex; gap: 4px; }
.dp {
  width: 74px; height: 58px;
  background: var(--bg2);
  border: 1.5px solid #e8d8c8;
  border-radius: 16px;
  font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 #e0cbb8;
  cursor: pointer; user-select: none; -webkit-user-select: none;
}
.dp:active { transform: translateY(3px); box-shadow: 0 1px 0 #e0cbb8; }
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <h1>꼬마 곰의 창고 <span>🐻</span></h1>
    <div class="chips">
      <div class="chip"><span class="lbl">Lv</span><span id="lv-disp">1</span><span class="lbl">/10</span></div>
      <div class="chip"><span class="lbl">이동</span><span id="mv-disp">0</span></div>
    </div>
  </div>

  <div id="board-wrap">
    <canvas id="game-canvas"></canvas>
    <div class="overlay" id="overlay">
      <div class="ov-emoji" id="ov-emoji">🎉</div>
      <div class="ov-title" id="ov-title">클리어!</div>
      <div class="ov-msg"   id="ov-msg"></div>
      <button class="ov-btn" id="ov-btn">다음 레벨 →</button>
    </div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="action-row">
    <button class="act-btn btn-prev"  onclick="changeLevel(-1)">◀ 이전</button>
    <button class="act-btn btn-undo"  onclick="undo()">↩ 되돌리기</button>
    <button class="act-btn btn-reset" onclick="↺ 다시시작" onclick="resetLevel()">↺ 다시</button>
    <button class="act-btn btn-next"  onclick="changeLevel(1)">다음 ▶</button>
  </div>

  <div class="dpad">
    <div class="dpad-row"><div class="dp" id="dp-up">▲</div></div>
    <div class="dpad-row">
      <div class="dp" id="dp-left">◀</div>
      <div class="dp" id="dp-down">▼</div>
      <div class="dp" id="dp-right">▶</div>
    </div>
  </div>

</div>
<script>
const LEVELS=[
  ["#####","#@$.#","#   #","#   #","#####"],
  ["#####","# @ #","# $ #","# . #","#####"],
  ["######","#    #","# $@ #","# $  #","# .. #","######"],
  ["#######","#     #","# .$. #","# $@$ #","# .$. #","#     #","#######"],
  ["#######","#  @  #","# $ $ #","#  .  #","# $ $ #","#  .  #","#     #","#######"],
  ["  #####","  #   #","  # $ #","### $ ##","#  . .##","## ##  #"," #@    #"," #  ####"," ####   "],
  ["#####  ","#   ## ","# $  # ","## $ # "," #@. ##"," # .  #"," #    #"," ######"],
  ["########","#      #","# $ $  #","#  $   #","## ...##"," #  @  #"," #     #"," #######"],
  [" ########"," #  @   #","## $$$  #","#  ...  #","#       #","#########"],
  ["  ######","  #    #","### $$ #","#  .$. #","#  .@$ #","### $. #","  #    #","  ######"],
];

let bests={},cleared=new Set();
try{bests=JSON.parse(localStorage.getItem('sb_best'))||{};}catch(e){}
try{cleared=new Set(JSON.parse(localStorage.getItem('sb_clr'))||[]);}catch(e){}

let curLevel=0,state={},history=[],moves=0,parsed={};

function parseLevel(raw){
  let walls=[],floors=[],goals=[],boxes=[],player={x:0,y:0};
  raw.forEach((row,y)=>{
    [...row].forEach((ch,x)=>{
      if(ch===' ')return;
      if(ch==='#'){walls.push({x,y});return;}
      floors.push({x,y});
      if('.*+'.includes(ch))goals.push({x,y});
      if('$*'.includes(ch))boxes.push({x,y});
      if('@+'.includes(ch))player={x,y};
    });
  });
  return{walls,floors,goals,boxes,player};
}

function initLevel(lv){
  curLevel=lv;
  parsed=parseLevel(LEVELS[lv]);
  state={player:{...parsed.player},boxes:parsed.boxes.map(b=>({...b}))};
  history=[];moves=0;
  document.getElementById('overlay').classList.remove('show');
  updateUI();render();
}

function isFloor(x,y){
  if(parsed.walls.some(w=>w.x===x&&w.y===y))return false;
  const row=LEVELS[curLevel][y];
  return row!==undefined&&x>=0&&x<row.length&&row[x]!==' ';
}

function move(dx,dy){
  if(document.getElementById('overlay').classList.contains('show'))return;
  const{player,boxes}=state;
  const nx=player.x+dx,ny=player.y+dy;
  if(!isFloor(nx,ny))return;
  const bi=boxes.findIndex(b=>b.x===nx&&b.y===ny);
  if(bi>=0){
    const bx2=nx+dx,by2=ny+dy;
    if(!isFloor(bx2,by2)||boxes.some(b=>b.x===bx2&&b.y===by2))return;
    history.push({player:{...player},boxes:boxes.map(b=>({...b})),moves});
    boxes[bi]={x:bx2,y:by2};
  }else{
    history.push({player:{...player},boxes:boxes.map(b=>({...b})),moves});
  }
  state.player={x:nx,y:ny};moves++;
  updateUI();render();checkWin();
}

function undo(){
  if(!history.length)return;
  const p=history.pop();
  state={player:p.player,boxes:p.boxes};moves=p.moves;
  document.getElementById('overlay').classList.remove('show');
  updateUI();render();
}
function resetLevel(){initLevel(curLevel);}
function changeLevel(d){let n=curLevel+d;if(n<0)n=0;if(n>=LEVELS.length)n=LEVELS.length-1;initLevel(n);}
function nextLevel(){if(curLevel+1<LEVELS.length)initLevel(curLevel+1);else document.getElementById('overlay').classList.remove('show');}

function checkWin(){
  if(!parsed.goals.every(g=>state.boxes.some(b=>b.x===g.x&&b.y===g.y)))return;
  cleared.add(curLevel);
  try{localStorage.setItem('sb_clr',JSON.stringify([...cleared]));}catch(e){}
  if(!bests[curLevel]||moves<bests[curLevel]){bests[curLevel]=moves;try{localStorage.setItem('sb_best',JSON.stringify(bests));}catch(e){}}
  const isLast=curLevel===LEVELS.length-1;
  document.getElementById('ov-emoji').textContent=isLast?'🏆':'🎉';
  document.getElementById('ov-title').textContent=isLast?'전부 클리어! 🎊':`레벨 ${curLevel+1} 클리어!`;
  document.getElementById('ov-msg').textContent=`이동 ${moves}번 / 최소 ${bests[curLevel]}번`;
  const btn=document.getElementById('ov-btn');
  if(isLast){btn.textContent='처음부터 다시 🔄';btn.onclick=()=>initLevel(0);}
  else{btn.textContent='다음 레벨 →';btn.onclick=nextLevel;}
  document.getElementById('overlay').classList.add('show');
  buildDots();
}

function updateUI(){
  document.getElementById('lv-disp').textContent=curLevel+1;
  document.getElementById('mv-disp').textContent=moves;
  buildDots();
}
function buildDots(){
  const el=document.getElementById('dots');el.innerHTML='';
  LEVELS.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(cleared.has(i)?' done':'')+(i===curLevel?' current':'');
    d.onclick=()=>initLevel(i);
    el.appendChild(d);
  });
}

/* render */
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');

function calcCell(){
  const bw=document.getElementById('board-wrap');
  const W=bw.clientWidth, H=bw.clientHeight;
  const rows=LEVELS[curLevel], cols=Math.max(...rows.map(r=>r.length)), rc=rows.length;
  return Math.floor(Math.min(W/cols, H/rc, 64));
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function render(){
  const rows=LEVELS[curLevel];
  const cols=Math.max(...rows.map(r=>r.length));
  const rc=rows.length;
  const C=calcCell();
  canvas.width=cols*C; canvas.height=rc*C;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const{player,boxes}=state;
  const{walls,floors,goals}=parsed;

  floors.forEach(({x,y})=>{
    ctx.fillStyle='#f0e2c8';rr(x*C+1,y*C+1,C-2,C-2,6);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.38)';rr(x*C+3,y*C+3,C-10,C-10,4);ctx.fill();
  });

  goals.forEach(({x,y})=>{
    const cx=x*C+C/2,cy=y*C+C/2,r1=C*0.22,r2=C*0.10;
    ctx.fillStyle='rgba(255,150,130,0.65)';
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=Math.PI/180*(i*72-90),a2=Math.PI/180*(i*72-90+36);
      i===0?ctx.moveTo(cx+r1*Math.cos(a),cy+r1*Math.sin(a)):ctx.lineTo(cx+r1*Math.cos(a),cy+r1*Math.sin(a));
      ctx.lineTo(cx+r2*Math.cos(a2),cy+r2*Math.sin(a2));
    }
    ctx.closePath();ctx.fill();
  });

  walls.forEach(({x,y})=>{
    const gx=x*C,gy=y*C;
    ctx.fillStyle='#c8a98a';rr(gx,gy,C,C,5);ctx.fill();
    ctx.fillStyle='#b8997a';rr(gx+2,gy+2,C-4,C-4,4);ctx.fill();
    ctx.fillStyle='rgba(90,60,30,0.09)';
    ctx.fillRect(gx+4,gy+C/2-1,C-8,2);
    ctx.fillRect(gx+4,gy+4,C/2-6,2);
    ctx.fillRect(gx+C/2,gy+4,C/2-6,2);
  });

  boxes.forEach(({x,y})=>{
    const onGoal=goals.some(g=>g.x===x&&g.y===y);
    const gx=x*C,gy=y*C,p=4;
    ctx.fillStyle=onGoal?'#5aaa5c':'#d4843a';rr(gx+p,gy+p,C-p*2,C-p*2,8);ctx.fill();
    ctx.fillStyle=onGoal?'#88c98a':'#f4a460';rr(gx+p+2,gy+p+2,C-p*2-4,C-p*2-4,6);ctx.fill();
    if(onGoal){
      ctx.strokeStyle='rgba(30,90,30,0.65)';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(gx+C*0.30,gy+C*0.52);ctx.lineTo(gx+C*0.46,gy+C*0.66);ctx.lineTo(gx+C*0.70,gy+C*0.34);ctx.stroke();
    } else {
      const bx=gx+C/2,by=gy+C/2,bs=C*0.16;
      ctx.strokeStyle='rgba(140,80,20,0.35)';ctx.lineWidth=1.5;
      ctx.strokeRect(bx-bs,by-bs,bs*2,bs*2);
      ctx.beginPath();ctx.moveTo(bx-bs,by);ctx.lineTo(bx+bs,by);ctx.moveTo(bx,by-bs);ctx.lineTo(bx,by+bs);ctx.stroke();
    }
  });

  // bear face
  {
    const gx=player.x*C,gy=player.y*C,cx=gx+C/2,cy=gy+C/2,r=C*0.32;
    ctx.fillStyle='rgba(74,153,212,0.15)';
    ctx.beginPath();ctx.ellipse(cx,cy+r+3,r*0.7,r*0.22,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#7bbfea';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#9fd2f5';ctx.beginPath();ctx.arc(cx-r*0.12,cy-r*0.08,r*0.72,0,Math.PI*2);ctx.fill();
    [-1,1].forEach(s=>{
      ctx.fillStyle='#7bbfea';ctx.beginPath();ctx.arc(cx+s*r*0.65,cy-r*0.65,r*0.28,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#f4c0d0';ctx.beginPath();ctx.arc(cx+s*r*0.65,cy-r*0.65,r*0.15,0,Math.PI*2);ctx.fill();
    });
    ctx.fillStyle='#fff0f5';ctx.beginPath();ctx.ellipse(cx,cy+r*0.14,r*0.37,r*0.27,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3a5a80';
    ctx.beginPath();ctx.arc(cx-r*0.3,cy-r*0.1,r*0.1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+r*0.3,cy-r*0.1,r*0.1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(cx-r*0.25,cy-r*0.16,r*0.042,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+r*0.35,cy-r*0.16,r*0.042,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5a3e7a';ctx.beginPath();ctx.ellipse(cx,cy+r*0.05,r*0.1,r*0.07,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#5a3e7a';ctx.lineWidth=1.2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(cx-r*0.14,cy+r*0.22);ctx.quadraticCurveTo(cx,cy+r*0.36,cx+r*0.14,cy+r*0.22);ctx.stroke();
  }
}

/* dpad */
[['dp-up',0,-1],['dp-down',0,1],['dp-left',-1,0],['dp-right',1,0]].forEach(([id,dx,dy])=>{
  document.getElementById(id).addEventListener('touchstart',e=>{e.preventDefault();move(dx,dy);},{passive:false});
});

/* swipe */
let tx=0,ty=0;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<14&&Math.abs(dy)<14)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);
},{passive:true});

window.addEventListener('resize',()=>render());
initLevel(0);
</script>
</body>
</html>
