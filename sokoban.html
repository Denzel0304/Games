<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sokoban Master 50 Pro</title>
    <style>
        :root {
            --bg: #1a1a2e; --wall: #4a4e69; --floor: #242444;
            --target: #ff7043; --box: #edc22e; --box-done: #8bc34a;
            --player: #378ADD; --text: #e0e0e0;
        }
        html, body {
            overflow: hidden; position: fixed; width: 100%; height: 100%;
            margin: 0; padding: 0; background: var(--bg);
            font-family: 'Pretendard', sans-serif; touch-action: none;
            display: flex; flex-direction: column; align-items: center;
        }
        header { 
            width: 100%; padding: 15px 0; display: flex; 
            justify-content: space-around; align-items: center; background: rgba(0,0,0,0.2);
        }
        .nav-btn {
            background: none; border: 1px solid #7ab8f5; color: #7ab8f5;
            padding: 5px 15px; border-radius: 10px; font-size: 18px;
        }
        header div h1 { font-size: 16px; color: #7ab8f5; margin: 0; text-align: center; }
        
        #info-bar { color: var(--text); font-size: 13px; margin: 5px 0; }

        #game-container {
            position: relative; background: var(--floor); border: 3px solid var(--wall);
            border-radius: 12px; display: grid; margin: auto;
        }
        /* 잠긴 스테이지 효과 */
        #game-container.locked { opacity: 0.4; filter: grayscale(0.5); }
        #lock-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ff5252; font-weight: 800; font-size: 20px; z-index: 100; display: none;
            text-shadow: 0 0 10px black;
        }
        #game-container.locked #lock-msg { display: block; }

        .tile { width: 42px; height: 42px; position: relative; display: flex; align-items: center; justify-content: center; }
        .wall { background: var(--wall); border-radius: 4px; }
        .target::after { content: ''; width: 10px; height: 10px; background: var(--target); border-radius: 50%; opacity: 0.6; }
        .obj {
            position: absolute; width: 36px; height: 36px; border-radius: 8px; z-index: 10;
            transition: all 0.12s ease; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .player { background: var(--player); z-index: 20; }
        .box { background: var(--box); box-shadow: 0 3px 0 #b8960b; }
        .box.done { background: var(--box-done); box-shadow: 0 3px 0 #689f38; }

        /* 컨트롤 영역 */
        #controls-wrapper {
            margin-bottom: 30px; position: relative;
            display: grid; grid-template-areas: ". up save" "left down right" ". . reset"; gap: 12px;
        }
        .ctrl-btn { width: 65px; height: 65px; background: #2e2e4e; border: 1px solid #444; border-radius: 15px; color: white; font-size: 26px; display: flex; align-items: center; justify-content: center; }
        .ctrl-btn:active { background: #378ADD; transform: scale(0.9); }

        /* 특수 기능 버튼 (대각선 배치) */
        .sub-btn { width: 55px; height: 55px; border-radius: 50%; border: none; color: white; font-size: 18px; }
        #btn-save { grid-area: save; background: #27ae60; margin-left: -5px; margin-top: 5px; }
        #btn-reset { grid-area: reset; background: #e74c3c; margin-top: -15px; margin-left: -5px; }

        #clear-banner {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            background: #378ADD; color: white; padding: 15px 40px; border-radius: 50px;
            font-weight: 800; font-size: 22px; z-index: 200; opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #clear-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body onclick="unlockAudio()">

<header>
    <button class="nav-btn" onclick="navStage(-1)">◀</button>
    <div>
        <h1 id="stage-title">STAGE 1</h1>
        <div id="info-bar">Moves: <span id="move-count">0</span></div>
    </div>
    <button class="nav-btn" onclick="navStage(1)">▶</button>
</header>

<div id="game-container">
    <div id="lock-msg">LOCKED 🔒</div>
</div>
<div id="clear-banner">STAGE CLEAR! ✨</div>

<div id="controls-wrapper">
    <div class="ctrl-btn" style="grid-area: up" onclick="move(0, -1)">▲</div>
    <div class="ctrl-btn" style="grid-area: left" onclick="move(-1, 0)">◀</div>
    <div class="ctrl-btn" style="grid-area: down" onclick="move(0, 1)">▼</div>
    <div class="ctrl-btn" style="grid-area: right" onclick="move(1, 0)">▶</div>
    
    <button id="btn-save" class="sub-btn" onclick="saveGame()">💾</button>
    <button id="btn-reset" class="sub-btn" onclick="resetLevel()">↺</button>
</div>

<script>
    const RAW_LEVELS = [
        "11111,14001,10321,11111", "111111,100011,103201,104001,111111", "1111111,1001001,1032301,1024201,1111111", "0111110,1100011,1021201,1034301,1000001,1111111", "111111,122001,133401,100001,111111",
        "111111,143001,103201,102001,111111", "111111,102201,103301,100401,111111", "111111,140001,103301,122001,111111", "111111,102001,134301,102001,111111", "1111111,1222221,1333331,1004001,1111111",
        "11111,14321,11111", "11111,12341,11111", "11111,12301,10041,11111", "111111,100201,103401,100001,111111", "111111,122001,103301,140001,111111",
        "111111,100221,100331,100041,111111", "111111,143021,103021,111111", "111111,102301,103201,100401,111111", "111111,140001,103322,111111", "111111,120301,120301,100401,111111",
        "1111111,1002001,1003001,1043201,1111111", "1111111,1200021,1034301,1111111", "1111111,1220331,1004001,1111111", "111111,140201,103301,100201,111111", "11111,12211,13341,10001,11111",
        "111111,140021,103321,111111", "111111,102021,103431,111111", "111111,143301,102201,111111", "111111,103001,123241,111111", "111111,100221,133401,111111",
        "11111,12321,13431,12321,11111", "111111,143001,103221,111111", "111111,120301,104301,120001,111111", "11111,14321,10321,11111", "111111,140321,103201,111111",
        "111111,102201,134301,100001,111111", "111111,103301,124201,111111", "11111,14001,123321,11111", "111111,143001,100322,111111", "11111,14321,10001,11111",
        "11111,14001,12301,11111", "11111,12341,11111", "111111,140001,103201,100001,111111", "111111,102201,133401,111111", "111111,140321,100001,111111",
        "111111,122334,111111", "11111,14321,11111", "11111,10234,11111", "11111,14320,11111", "111111,143322,111111"
    ];

    const LEVELS = RAW_LEVELS.map(s => s.split(',').map(r => r.split('').map(Number)));
    let maxStageCleared = parseInt(localStorage.getItem('sokoban_max_stage')) || 0;
    let viewingLevel = maxStageCleared; // 현재 보고 있는 판
    let playingLevel = viewingLevel;   // 실제 플레이 중인 판
    
    let moves = 0, map = [], playerPos = {x: 0, y: 0};
    const TILE_SIZE = 42; const sfxMove = new Audio('effect 19.mp3');
    let audioUnlocked = false;

    function unlockAudio() { if(!audioUnlocked) { sfxMove.play().then(()=> { sfxMove.pause(); audioUnlocked=true; }); } }

    function initGame(lvIndex) {
        moves = 0; 
        viewingLevel = lvIndex;
        document.getElementById('move-count').innerText = moves;
        document.getElementById('stage-title').innerText = `STAGE ${viewingLevel + 1}`;
        
        // 잠금 처리
        const container = document.getElementById('game-container');
        if (viewingLevel > maxStageCleared) {
            container.classList.add('locked');
        } else {
            container.classList.remove('locked');
        }

        map = JSON.parse(JSON.stringify(LEVELS[viewingLevel]));
        renderMap();
    }

    function renderMap() {
        const container = document.getElementById('game-container');
        // 기존 오브젝트들만 제거 (lock-msg 유지)
        const objs = container.querySelectorAll('.obj, .tile');
        objs.forEach(o => o.remove());

        container.style.gridTemplateColumns = `repeat(${map[0].length}, ${TILE_SIZE}px)`;
        for (let y = 0; y < map.length; y++) {
            for (let x = 0; x < map[y].length; x++) {
                const tile = document.createElement('div'); tile.className = 'tile';
                const type = map[y][x];
                if (type === 1) tile.classList.add('wall');
                if (type === 2 || type === 5) tile.classList.add('target');
                if (type === 3 || type === 5) {
                    const box = createObj('box' + (type === 5 ? ' done' : ''), x, y);
                    box.innerText = '📦'; container.appendChild(box);
                }
                if (type === 4) {
                    playerPos = {x, y};
                    const player = createObj('player', x, y);
                    player.innerText = '👤'; player.id = 'player-obj'; container.appendChild(player);
                }
                container.appendChild(tile);
            }
        }
    }

    function createObj(className, x, y) {
        const div = document.createElement('div'); div.className = 'obj ' + className;
        div.style.left = (x * TILE_SIZE + 3) + 'px'; div.style.top = (y * TILE_SIZE + 3) + 'px';
        return div;
    }

    function move(dx, dy) {
        if (viewingLevel > maxStageCleared) return; // 잠긴 판은 이동 불가

        const nx = playerPos.x + dx, ny = playerPos.y + dy;
        const targetTile = map[ny][nx];
        if (targetTile === 1) return;

        if (targetTile === 3 || targetTile === 5) {
            const bx = nx + dx, by = ny + dy;
            if (map[by][bx] === 0 || map[by][bx] === 2) {
                map[ny][nx] = (targetTile === 5) ? 2 : 0;
                map[by][bx] = (map[by][bx] === 2) ? 5 : 3;
                processMove(nx, ny); renderMap(); checkWin();
            }
        } else { processMove(nx, ny); }
    }

    function processMove(nx, ny) {
        moves++; sfxMove.currentTime = 0; sfxMove.play().catch(()=>{});
        map[playerPos.y][playerPos.x] = (LEVELS[viewingLevel][playerPos.y][playerPos.x] === 2) ? 2 : 0;
        playerPos = {x: nx, y: ny}; map[ny][nx] = 4;
        document.getElementById('move-count').innerText = moves;
        const pObj = document.getElementById('player-obj');
        pObj.style.left = (nx * TILE_SIZE + 3) + 'px'; pObj.style.top = (ny * TILE_SIZE + 3) + 'px';
    }

    function checkWin() {
        if (!map.some(row => row.includes(3))) {
            if (viewingLevel === maxStageCleared) {
                maxStageCleared++;
                localStorage.setItem('sokoban_max_stage', maxStageCleared);
            }
            document.getElementById('clear-banner').classList.add('show');
            setTimeout(() => {
                document.getElementById('clear-banner').classList.remove('show');
                navStage(1);
            }, 1000);
        }
    }

    function navStage(step) {
        let next = viewingLevel + step;
        if (next >= 0 && next < LEVELS.length) {
            initGame(next);
        }
    }

    function saveGame() {
        localStorage.setItem('sokoban_max_stage', maxStageCleared);
        alert('진행 데이터가 저장되었습니다!');
    }

    function resetLevel() { initGame(viewingLevel); }

    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') move(0, -1); if (e.key === 'ArrowDown') move(0, 1);
        if (e.key === 'ArrowLeft') move(-1, 0); if (e.key === 'ArrowRight') move(1, 0);
    });

    initGame(maxStageCleared);
</script>
</body>
</html>
