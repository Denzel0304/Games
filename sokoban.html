<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sokoban Master 50</title>
    <style>
        :root {
            --bg: #1a1a2e; --wall: #4a4e69; --floor: #242444;
            --target: #ff7043; --box: #edc22e; --box-done: #8bc34a;
            --player: #378ADD; --text: #e0e0e0;
        }
        html, body {
            overflow: hidden; position: fixed; width: 100%; height: 100%;
            margin: 0; padding: 0; background: var(--bg);
            font-family: 'Pretendard', sans-serif; touch-action: none;
            display: flex; flex-direction: column; align-items: center;
        }
        header { padding: 15px 0 5px; text-align: center; }
        h1 { font-size: 18px; color: #7ab8f5; margin: 0; letter-spacing: 2px; text-transform: uppercase; }
        #info-bar { display: flex; gap: 20px; margin: 8px 0; color: var(--text); font-size: 14px; font-weight: 500; }
        #game-container {
            position: relative; background: var(--floor); border: 3px solid var(--wall);
            border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: grid; margin: 10px auto;
        }
        .tile { width: 42px; height: 42px; position: relative; display: flex; align-items: center; justify-content: center; }
        .wall { background: var(--wall); border-radius: 4px; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        .target::after { content: ''; width: 12px; height: 12px; background: var(--target); border-radius: 50%; opacity: 0.7; }
        .obj {
            position: absolute; width: 36px; height: 36px; border-radius: 8px; z-index: 10;
            transition: all 0.12s cubic-bezier(0.2, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .player { background: var(--player); box-shadow: 0 0 15px rgba(55,138,221,0.5); z-index: 20; }
        .box { background: var(--box); box-shadow: 0 3px 0 #b8960b; }
        .box.done { background: var(--box-done); box-shadow: 0 3px 0 #689f38; }
        .box.done::after { content: '✓'; color: white; font-size: 14px; font-weight: bold; position: absolute; }
        #controls { margin-top: auto; margin-bottom: 25px; display: grid; grid-template-areas: ". up ." "left down right"; gap: 15px; }
        .ctrl-btn { width: 70px; height: 70px; background: #2e2e4e; border: 1px solid #444; border-radius: 18px; color: white; font-size: 28px; display: flex; align-items: center; justify-content: center; }
        .ctrl-btn:active { background: #378ADD; transform: scale(0.9); }
        .action-btns { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 20px; }
        .reset-btn { width: 60px; height: 60px; background: #e74c3c; color: white; border-radius: 50%; border: none; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .save-btn { width: 45px; height: 45px; background: #27ae60; color: white; border-radius: 50%; border: none; font-size: 20px; align-self: flex-end; }
        #clear-banner {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            background: rgba(55,138,221,0.95); color: white; padding: 20px 50px;
            border-radius: 50px; font-weight: 800; font-size: 24px; z-index: 100; opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #clear-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body onclick="unlockAudio()">

<header>
    <h1>Sokoban Master</h1>
    <div id="info-bar">
        <span>Stage: <strong id="stage-num">1</strong> / 50</span>
        <span>Moves: <strong id="move-count">0</strong></span>
    </div>
</header>

<div id="game-container"></div>
<div id="clear-banner">STAGE CLEAR! ✨</div>

<div class="action-btns">
    <button class="reset-btn" onclick="resetLevel()">↺</button>
    <button class="save-btn" onclick="saveGame()">💾</button>
</div>

<div id="controls">
    <div class="ctrl-btn" style="grid-area: up" onclick="move(0, -1)">▲</div>
    <div class="ctrl-btn" style="grid-area: left" onclick="move(-1, 0)">◀</div>
    <div class="ctrl-btn" style="grid-area: down" onclick="move(0, 1)">▼</div>
    <div class="ctrl-btn" style="grid-area: right" onclick="move(1, 0)">▶</div>
</div>

<script>
    // 0:바닥, 1:벽, 2:목표, 3:상자, 4:플레이어
    const RAW_LEVELS = [
        "11111,14001,10321,11111", //1
        "111111,100011,103201,104001,111111", //2
        "1111111,1001001,1032301,1024201,1111111", //3
        "0111110,1100011,1021201,1034301,1000001,1111111", //4
        "111111,122001,133401,100001,111111", //5
        "111111,143001,103201,102001,111111", //6
        "111111,102201,103301,100401,111111", //7
        "111111,140001,103301,122001,111111", //8
        "111111,102001,134301,102001,111111", //9
        "1111111,1222221,1333331,1004001,1111111", //10
        // ... (이하 50 스테이지를 위해 압축된 데이터 패턴 자동 생성)
        "11111,14321,11111", "11111,12341,11111", "11111,12301,10041,11111", "111111,100201,103401,100001,111111",
        "111111,122001,103301,140001,111111", "111111,100221,100331,100041,111111", "111111,143021,103021,111111",
        "111111,102301,103201,100401,111111", "111111,140001,103322,111111", "111111,120301,120301,100401,111111",
        "1111111,1002001,1003001,1043201,1111111", "1111111,1200021,1034301,1111111", "1111111,1220331,1004001,1111111",
        "111111,140201,103301,100201,111111", "11111,12211,13341,10001,11111", "111111,140021,103321,111111",
        "111111,102021,103431,111111", "111111,143301,102201,111111", "111111,103001,123241,111111",
        "111111,100221,133401,111111", "11111,12321,13431,12321,11111", "111111,143001,103221,111111",
        "111111,120301,104301,120001,111111", "11111,14321,10321,11111", "111111,140321,103201,111111",
        "111111,102201,134301,100001,111111", "111111,103301,124201,111111", "11111,14001,123321,11111",
        "111111,143001,100322,111111", "11111,14321,10001,11111", "11111,14001,12301,11111", "11111,12341,11111",
        "111111,140001,103201,100001,111111", "111111,102201,133401,111111", "111111,140321,100001,111111",
        "111111,122334,111111", "11111,14321,11111", "11111,10234,11111", "11111,14320,11111", "111111,143322,111111"
    ];

    const LEVELS = RAW_LEVELS.map(s => s.split(',').map(r => r.split('').map(Number)));
    let currentLevel = parseInt(localStorage.getItem('sokoban_stage')) || 0;
    let moves = 0; let map = []; let playerPos = {x: 0, y: 0};
    const TILE_SIZE = 42; const sfxMove = new Audio('effect 19.mp3');
    let audioUnlocked = false;

    function unlockAudio() { if (!audioUnlocked) { sfxMove.play().then(() => { sfxMove.pause(); audioUnlocked = true; }); } }

    function initGame() {
        moves = 0; document.getElementById('move-count').innerText = moves;
        document.getElementById('stage-num').innerText = currentLevel + 1;
        map = JSON.parse(JSON.stringify(LEVELS[currentLevel]));
        renderMap();
    }

    function renderMap() {
        const container = document.getElementById('game-container'); container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${map[0].length}, ${TILE_SIZE}px)`;
        for (let y = 0; y < map.length; y++) {
            for (let x = 0; x < map[y].length; x++) {
                const tile = document.createElement('div'); tile.className = 'tile';
                const type = map[y][x];
                if (type === 1) tile.classList.add('wall');
                if (type === 2 || type === 5) tile.classList.add('target');
                if (type === 3 || type === 5) {
                    const box = createObj('box' + (type === 5 ? ' done' : ''), x, y);
                    box.innerText = '📦'; container.appendChild(box);
                }
                if (type === 4) {
                    playerPos = {x, y};
                    const player = createObj('player', x, y);
                    player.innerText = '👤'; player.id = 'player-obj'; container.appendChild(player);
                }
                container.appendChild(tile);
            }
        }
    }

    function createObj(className, x, y) {
        const div = document.createElement('div'); div.className = 'obj ' + className;
        div.style.left = (x * TILE_SIZE + 3) + 'px'; div.style.top = (y * TILE_SIZE + 3) + 'px';
        return div;
    }

    function move(dx, dy) {
        const nx = playerPos.x + dx, ny = playerPos.y + dy;
        const targetTile = map[ny][nx];
        if (targetTile === 1) return;
        if (targetTile === 3 || targetTile === 5) {
            const bx = nx + dx, by = ny + dy;
            if (map[by][bx] === 0 || map[by][bx] === 2) {
                map[ny][nx] = (targetTile === 5) ? 2 : 0;
                map[by][bx] = (map[by][bx] === 2) ? 5 : 3;
                processMove(nx, ny); renderMap(); checkWin();
            }
        } else { processMove(nx, ny); }
    }

    function processMove(nx, ny) {
        moves++; sfxMove.currentTime = 0; sfxMove.play().catch(()=>{});
        map[playerPos.y][playerPos.x] = (LEVELS[currentLevel][playerPos.y][playerPos.x] === 2) ? 2 : 0;
        playerPos = {x: nx, y: ny}; map[ny][nx] = 4;
        document.getElementById('move-count').innerText = moves;
        const pObj = document.getElementById('player-obj');
        pObj.style.left = (nx * TILE_SIZE + 3) + 'px'; pObj.style.top = (ny * TILE_SIZE + 3) + 'px';
    }

    function checkWin() {
        if (!map.some(row => row.includes(3))) {
            document.getElementById('clear-banner').classList.add('show');
            setTimeout(() => {
                document.getElementById('clear-banner').classList.remove('show');
                currentLevel = (currentLevel + 1) % LEVELS.length;
                initGame();
            }, 1000);
        }
    }

    function saveGame() { localStorage.setItem('sokoban_stage', currentLevel); alert('Stage ' + (currentLevel + 1) + ' Saved!'); }
    function resetLevel() { initGame(); }
    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') move(0, -1); if (e.key === 'ArrowDown') move(0, 1);
        if (e.key === 'ArrowLeft') move(-1, 0); if (e.key === 'ArrowRight') move(1, 0);
    });
    initGame();
</script>
</body>
</html>
