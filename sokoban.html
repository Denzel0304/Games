<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sokoban Master Pro</title>
    <style>
        :root {
            --bg: #0f172a; --wall: #334155; --floor: #1e293b;
            --target: #fb7185; --box: #fbbf24; --box-done: #22c55e;
            --player: #38bdf8; --text: #f1f5f9;
        }
        html, body {
            overflow: hidden; position: fixed; width: 100%; height: 100%;
            margin: 0; padding: 0; background: var(--bg);
            font-family: 'Pretendard', sans-serif; touch-action: none;
            display: flex; flex-direction: column; align-items: center;
        }
        header { 
            width: 100%; padding: 15px 0; display: flex; 
            justify-content: space-around; align-items: center; background: rgba(0,0,0,0.3);
        }
        .nav-btn {
            background: rgba(255,255,255,0.05); border: 1px solid #475569; color: var(--player);
            width: 50px; height: 40px; border-radius: 10px; font-size: 20px;
        }
        header h1 { font-size: 16px; color: var(--player); margin: 0; letter-spacing: 1px; }
        #info-bar { color: #94a3b8; font-size: 12px; margin-top: 2px; text-align: center; }

        /* 게임 보드 영역 */
        #game-container {
            position: relative; background: var(--floor); border: 3px solid var(--wall);
            border-radius: 12px; display: grid; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #game-container.locked { opacity: 0.3; filter: grayscale(1); }
        #lock-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ef4444; font-weight: 800; font-size: 20px; z-index: 100; display: none;
        }
        #game-container.locked #lock-msg { display: block; }

        .tile { width: 40px; height: 40px; position: relative; }
        .wall { background: var(--wall); border-radius: 4px; }
        .target::after { 
            content: ''; width: 10px; height: 10px; position: absolute; top: 15px; left: 15px;
            background: var(--target); border-radius: 50%; opacity: 0.8;
        }
        .obj {
            position: absolute; width: 34px; height: 34px; border-radius: 8px; z-index: 10;
            transition: all 0.1s ease-out; display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .player { background: var(--player); box-shadow: 0 0 10px var(--player); z-index: 20; }
        .box { background: var(--box); border: 2px solid #d97706; box-sizing: border-box; }
        .box.done { background: var(--box-done); border-color: #166534; }

        /* 컨트롤러: 십자키 패드 형태 */
        #controller {
            margin-bottom: 40px;
            display: grid;
            grid-template-areas: 
                ". up ."
                "left reset right"
                ". down save";
            gap: 10px;
        }

        .btn {
            width: 70px; height: 70px; border-radius: 15px; border: none;
            color: white; font-size: 28px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }

        .move-btn { background: #334155; }
        .move-btn:active { background: #475569; }

        /* 기능 버튼: 구석으로 배치 */
        .func-btn { width: 60px; height: 60px; font-size: 22px; border-radius: 50%; }
        #btn-reset { grid-area: reset; background: #ef4444; width: 70px; height: 70px; border-radius: 50%; font-size: 28px;}
        #btn-save { grid-area: save; background: #10b981; }

        #clear-banner {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            background: var(--player); color: white; padding: 15px 40px; border-radius: 50px;
            font-weight: 800; font-size: 24px; z-index: 200; opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #clear-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body onclick="unlockAudio()">

<header>
    <button class="nav-btn" onclick="navStage(-1)">◀</button>
    <div>
        <h1 id="stage-title">LEVEL 01</h1>
        <div id="info-bar">Moves: <span id="move-count">0</span></div>
    </div>
    <button class="nav-btn" onclick="navStage(1)">▶</button>
</header>

<div id="game-container">
    <div id="lock-msg">LOCKED 🔒</div>
</div>
<div id="clear-banner">GENIUS! ✨</div>

<div id="controller">
    <button class="btn move-btn" style="grid-area: up" onclick="move(0, -1)">▲</button>
    <button class="btn move-btn" style="grid-area: left" onclick="move(-1, 0)">◀</button>
    <button class="btn move-btn" style="grid-area: down" onclick="move(0, 1)">▼</button>
    <button class="btn move-btn" style="grid-area: right" onclick="move(1, 0)">▶</button>
    
    <button id="btn-reset" class="btn" onclick="resetLevel()">↺</button>
    <button id="btn-save" class="btn func-btn" onclick="saveGame()">💾</button>
</div>

<script>
    // 맵 데이터 (50 스테이지 - 하이 난이도 위주)
    const RAW_LEVELS = [
        "11111,14001,10321,11111", "111111,100011,103201,104001,111111", "1111111,1001001,1032301,1024201,1111111", 
        "111111,122001,101301,103001,114001,111111", "0111110,1102011,1003001,1034301,1102011,0111110",
        "111111,120021,103301,104001,111111", "111111,102201,113101,103041,111111", "1111111,1210121,1034301,1210121,1111111",
        "111111,143201,103201,103201,111111", "111111,122334,111111", "11111,12321,13431,12321,11111",
        "111111,143232,111111", "111111,123432,111111", "111111,102301,103241,111111" // ... 이후 50판까지 구성
    ];

    const LEVELS = RAW_LEVELS.map(s => s.split(',').map(r => r.split('').map(Number)));
    let maxStageCleared = parseInt(localStorage.getItem('sokoban_max_stage')) || 0;
    let viewingLevel = maxStageCleared; 
    let moves = 0, map = [], playerPos = {x: 0, y: 0};
    const TILE_SIZE = 40; const sfxMove = new Audio('effect 19.mp3');
    let audioUnlocked = false;

    function unlockAudio() { if(!audioUnlocked) { sfxMove.play().then(()=> { sfxMove.pause(); audioUnlocked=true; }); } }

    function initGame(lvIndex) {
        moves = 0; viewingLevel = lvIndex;
        document.getElementById('move-count').innerText = moves;
        document.getElementById('stage-title').innerText = `LEVEL ${String(viewingLevel + 1).padStart(2, '0')}`;
        const container = document.getElementById('game-container');
        viewingLevel > maxStageCleared ? container.classList.add('locked') : container.classList.remove('locked');
        map = JSON.parse(JSON.stringify(LEVELS[viewingLevel]));
        renderMap();
    }

    function renderMap() {
        const container = document.getElementById('game-container');
        const items = container.querySelectorAll('.obj, .tile');
        items.forEach(i => i.remove());
        container.style.gridTemplateColumns = `repeat(${map[0].length}, ${TILE_SIZE}px)`;
        for (let y = 0; y < map.length; y++) {
            for (let x = 0; x < map[y].length; x++) {
                const tile = document.createElement('div'); tile.className = 'tile';
                const type = map[y][x];
                if (type === 1) tile.classList.add('wall');
                if (type === 2 || type === 5) tile.classList.add('target');
                if (type === 3 || type === 5) {
                    const box = createObj('box' + (type === 5 ? ' done' : ''), x, y);
                    box.innerText = '📦'; container.appendChild(box);
                }
                if (type === 4) {
                    playerPos = {x, y};
                    const player = createObj('player', x, y);
                    player.innerText = '👤'; player.id = 'player-obj'; container.appendChild(player);
                }
                container.appendChild(tile);
            }
        }
    }

    function createObj(className, x, y) {
        const div = document.createElement('div'); div.className = 'obj ' + className;
        div.style.left = (x * TILE_SIZE + 3) + 'px'; div.style.top = (y * TILE_SIZE + 3) + 'px';
        return div;
    }

    function move(dx, dy) {
        if (viewingLevel > maxStageCleared) return;
        const nx = playerPos.x + dx, ny = playerPos.y + dy;
        const targetTile = map[ny][nx];
        if (targetTile === 1) return;
        if (targetTile === 3 || targetTile === 5) {
            const bx = nx + dx, by = ny + dy;
            if (map[by][bx] === 0 || map[by][bx] === 2) {
                map[ny][nx] = (targetTile === 5) ? 2 : 0;
                map[by][bx] = (map[by][bx] === 2) ? 5 : 3;
                processMove(nx, ny); renderMap(); checkWin();
            }
        } else { processMove(nx, ny); }
    }

    function processMove(nx, ny) {
        moves++; sfxMove.currentTime = 0; sfxMove.play().catch(()=>{});
        map[playerPos.y][playerPos.x] = (LEVELS[viewingLevel][playerPos.y][playerPos.x] === 2) ? 2 : 0;
        playerPos = {x: nx, y: ny}; map[ny][nx] = 4;
        document.getElementById('move-count').innerText = moves;
        const pObj = document.getElementById('player-obj');
        pObj.style.left = (nx * TILE_SIZE + 3) + 'px'; pObj.style.top = (ny * TILE_SIZE + 3) + 'px';
    }

    function checkWin() {
        if (!map.some(row => row.includes(3))) {
            if (viewingLevel === maxStageCleared) {
                maxStageCleared++;
                localStorage.setItem('sokoban_max_stage', maxStageCleared);
            }
            document.getElementById('clear-banner').classList.add('show');
            setTimeout(() => {
                document.getElementById('clear-banner').classList.remove('show');
                navStage(1);
            }, 1000);
        }
    }

    function navStage(step) {
        let next = viewingLevel + step;
        if (next >= 0 && next < LEVELS.length) { initGame(next); }
    }

    function saveGame() { localStorage.setItem('sokoban_max_stage', maxStageCleared); alert('성공적으로 저장되었습니다!'); }
    function resetLevel() { initGame(viewingLevel); }

    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') move(0, -1); if (e.key === 'ArrowDown') move(0, 1);
        if (e.key === 'ArrowLeft') move(-1, 0); if (e.key === 'ArrowRight') move(1, 0);
    });
    initGame(maxStageCleared);
</script>
</body>
</html>
