<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Battle</title>
    <style>
        :root {
            --bg-color: #e0f2f1; 
            --shadow-light: #f5ffff;
            --shadow-dark: #c1d5d4;
            --accent-color: #4db6ac;
            --text-color: #445a58;
            /* 구역 경계선 색상을 조금 더 선명하게 변경 */
            --border-line: #7c9896; 
        }

        * { 
            box-sizing: border-box; 
            -webkit-touch-callout: none; 
            -webkit-user-select: none; 
            user-select: none; 
            touch-action: none; 
        }

        body {
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center;
            /* 요소를 화면 중앙에 안정적으로 정렬 */
            justify-content: center; 
            min-height: 100vh;
            background-color: var(--bg-color); 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            color: var(--text-color); 
            overflow: hidden;
        }

        .header { 
            display: flex; align-items: center; justify-content: space-between; 
            width: 85%; max-width: 360px; 
            margin-bottom: 15px; /* 간격 축소 */
            margin-top: 15px; /* 헤더 잘림 방지 */
        }

        .nav-btn {
            width: 42px; height: 42px; border-radius: 12px; background: var(--bg-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            border: none; font-size: 18px; color: var(--text-color); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:active { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light); }

        .title { font-size: 24px; font-weight: bold; }
        .status-msg { font-size: 14px; margin-bottom: 20px; height: 20px; color: var(--accent-color); font-weight: 600; }

        .board-container {
            width: 88vw; max-width: 380px; aspect-ratio: 1 / 1; padding: 12px;
            border-radius: 20px; background: var(--bg-color);
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
            margin-bottom: 30px; display: flex; align-items: center; justify-content: center;
        }

        /* [수정] 깔끔한 격자를 위한 CSS 설정 */
        #game-board { 
            display: grid; 
            width: 100%; height: 100%; 
            /* 기본 격자 무늬 제거, 구역 경계선만 JS에서 표현 */
            background-color: rgba(0,0,0,0.01);
            border: 0.5px solid rgba(0,0,0,0.05); /* 아주 연한 전체 테두리 */
        }

        .cell {
            width: 100%; height: 100%; 
            background: var(--bg-color);
            /* 기본 칸 경계선은 아주 연하게 설정 */
            border: 0.5px solid rgba(0,0,0,0.03);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; font-weight: bold;
        }

        /* [수정] 구역 경계선 스타일 최적화 (굵기를 살짝 줄여 깔끔하게) */
        .b-top { border-top: 2.5px solid var(--border-line) !important; }
        .b-left { border-left: 2.5px solid var(--border-line) !important; }

        .controls { display: flex; flex-direction: column; gap: 12px; width: 140px; }
        .action-btn {
            padding: 12px; border-radius: 20px; background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            border: none; color: var(--text-color); font-weight: bold; font-size: 15px;
            cursor: pointer;
        }
        .action-btn:active { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light); }
    </style>
</head>
<body>

    <div class="header">
        <button class="nav-btn" onclick="changeMode(-1)">〈</button>
        <div class="title" id="mode-display">6x6</div>
        <button class="nav-btn" onclick="changeMode(1)">〉</button>
    </div>

    <div class="status-msg" id="status-text">6x6 진행 중...</div>

    <div class="board-container">
        <div id="game-board"></div>
    </div>

    <div class="controls">
        <button class="action-btn" onclick="resetGame()">새 게임</button>
    </div>

    <audio id="sfx-click" src="effect 1.mp3" preload="auto"></audio>
    <audio id="sfx-clear" src="effect 2.mp3" preload="auto"></audio>

    <script>
        const modes = [6, 8, 10];
        let currentModeIdx = 0;
        let boardState = [];
        let regionMap = [];
        let isCleared = false;

        function generateRegions(size) {
            const map = new Array(size * size);
            if (size === 6) {
                const data = [0,0,0,1,1,1,0,0,0,1,1,1,2,2,2,3,3,3,2,2,2,3,3,3,4,4,4,5,5,5,4,4,4,5,5,5];
                for(let i=0; i<36; i++) map[i] = data[i];
            } else {
                for(let i=0; i<size*size; i++) map[i] = Math.floor(i/size);
            }
            return map;
        }

        function initGame() {
            isCleared = false;
            const size = modes[currentModeIdx];
            document.getElementById('mode-display').innerText = `${size}x${size}`;
            document.getElementById('status-text').innerText = `${size}x${size} 진행 중...`;
            document.getElementById('status-text').style.color = 'var(--accent-color)';
            
            const board = document.getElementById('game-board');
            board.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            board.innerHTML = '';
            
            boardState = Array(size * size).fill(0);
            regionMap = generateRegions(size);

            for (let i = 0; i < size * size; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const r = i % size, c = Math.floor(i / size);
                
                // [수정] 경계선 적용 로직 개선 (더 깔끔하게)
                if (r > 0 && regionMap[i] !== regionMap[i-1]) cell.classList.add('b-left');
                if (c > 0 && regionMap[i] !== regionMap[i-size]) cell.classList.add('b-top');

                cell.addEventListener('mousedown', (e) => { if(e.button === 0) handleCellClick(i); });
                cell.addEventListener('touchstart', (e) => { e.preventDefault(); handleCellClick(i); });
                board.appendChild(cell);
            }
        }

        function handleCellClick(index) {
            if(isCleared) return;
            const clickSound = document.getElementById('sfx-click');
            clickSound.currentTime = 0;
            clickSound.play().catch(()=>{});

            boardState[index] = (boardState[index] + 1) % 3;
            updateUI();
            checkWin();
        }

        function updateUI() {
            const cells = document.querySelectorAll('.cell');
            const size = modes[currentModeIdx];
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i] === 1 ? '★' : (boardState[i] === 2 ? '✕' : '');
                cell.style.color = boardState[i] === 1 ? '#fbc02d' : '#9eaead';
                // 글자 크기도 미세 조정
                cell.style.fontSize = `${Math.min(30, 260/size)}px`;
            });
        }

        function checkWin() {
            const size = modes[currentModeIdx];
            const n = size === 10 ? 2 : 1; 
            const stars = boardState.reduce((acc, s, i) => s === 1 ? [...acc, i] : acc, []);

            if (stars.length !== size * n) return;

            // 규칙 검증
            for (let i = 0; i < stars.length; i++) {
                for (let j = i + 1; j < stars.length; j++) {
                    const x1 = stars[i] % size, y1 = Math.floor(stars[i] / size);
                    const x2 = stars[j] % size, y2 = Math.floor(stars[j] / size);
                    if (Math.abs(x1 - x2) <= 1 && Math.abs(y1 - y2) <= 1) return;
                }
            }

            const rowC = new Array(size).fill(0), colC = new Array(size).fill(0), regC = {};
            stars.forEach(idx => {
                rowC[Math.floor(idx/size)]++;
                colC[idx%size]++;
                regC[regionMap[idx]] = (regC[regionMap[idx]] || 0) + 1;
            });

            if (rowC.every(c => c === n) && colC.every(c => c === n)) {
                let allRegsOk = true;
                for(let i=0; i<size; i++) if((regC[i] || 0) !== n) allRegsOk = false;

                if (allRegsOk) {
                    isCleared = true;
                    document.getElementById('status-text').innerText = "★ 클리어! 축하합니다! ★";
                    document.getElementById('status-text').style.color = "#d32f2f";
                    const clearSound = document.getElementById('sfx-clear');
                    clearSound.currentTime = 0;
                    clearSound.play().catch(()=>{});
                }
            }
        }

        function changeMode(dir) { currentModeIdx = (currentModeIdx + dir + modes.length) % modes.length; initGame(); }
        function resetGame() { initGame(); }
        
        initGame();
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
