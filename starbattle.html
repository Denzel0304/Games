<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Battle - Real Game</title>
    <style>
        :root {
            --bg-color: #f0f7f2;
            --surface-color: #f0f7f2;
            --accent-color: #88b09b;
            --shadow-light: #ffffff;
            --shadow-dark: #d1d9d3;
            --text-color: #5a6e63;
            --border-thick: 3px solid #5a6e63;
            --border-thin: 1px solid #d1d9d3;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; position: fixed;
            background-color: var(--bg-color);
            font-family: sans-serif; color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
        }

        .header { margin-top: 40px; text-align: center; width: 100%; }
        .title-container { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .nav-btn {
            width: 44px; height: 44px; border-radius: 12px; border: none;
            background: var(--surface-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            cursor: pointer; font-size: 18px;
        }
        .nav-btn:active { box-shadow: inset 2px 2px 5px var(--shadow-dark); }
        .status-msg { font-size: 16px; font-weight: bold; margin-top: 10px; height: 20px; color: var(--accent-color); }

        .board-container {
            margin-top: 20px; padding: 10px; border-radius: 20px;
            background: var(--surface-color);
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            display: grid; border: 1px solid var(--shadow-dark);
        }

        .cell {
            background: var(--surface-color);
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer; user-select: none;
            box-sizing: border-box; border: 0.5px solid #e0e0e0;
        }

        /* 구역 구분을 위한 굵은 선 스타일 */
        .border-top { border-top: var(--border-thick) !important; }
        .border-bottom { border-bottom: var(--border-thick) !important; }
        .border-left { border-left: var(--border-thick) !important; }
        .border-right { border-right: var(--border-thick) !important; }

        .footer { margin-top: auto; margin-bottom: 50px; }
        .main-btn {
            padding: 15px 40px; border-radius: 20px; border: none;
            background: var(--surface-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            font-weight: bold; color: var(--text-color);
        }
        .star { color: #f1c40f; line-height: 1; }
        .cross { color: #e74c3c; font-size: 16px; opacity: 0.6; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-container">
            <button class="nav-btn" onclick="changeSize(-2)">◀</button>
            <h1 style="margin:0">Star Battle</h1>
            <button class="nav-btn" onclick="changeSize(2)">▶</button>
        </div>
        <div id="status" class="status-msg"></div>
    </div>

    <div id="board" class="board-container"></div>

    <div class="footer">
        <button class="main-btn" onclick="initGame()">새 게임</button>
    </div>

    <script>
        let currentSize = 6;
        let regions = []; 
        const effectClick = new Audio('effect 19.mp3');
        const effectClear = new Audio('effect 1.mp3');

        function changeSize(delta) {
            let next = currentSize + delta;
            if (next >= 6 && next <= 10) { currentSize = next; initGame(); }
        }

        // 아주 간단한 구역 생성 알고리즘 (랜덤하게 칸들을 묶음)
        function generateRegions(size) {
            let grid = Array.from({length: size}, () => Array(size).fill(-1));
            let regionId = 0;
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    if(grid[r][c] === -1) {
                        fillRegion(r, c, regionId++, grid, size);
                    }
                }
            }
            return grid;
        }

        function fillRegion(r, c, id, grid, size) {
            let count = 0;
            let max = size; // 한 구역당 평균 size개 칸 할당
            let queue = [[r, c]];
            while(queue.length > 0 && count < max) {
                let [currR, currC] = queue.shift();
                if(grid[currR][currC] !== -1) continue;
                grid[currR][currC] = id;
                count++;
                [[0,1],[1,0],[0,-1],[-1,0]].forEach(([dr, dc]) => {
                    let nr = currR+dr, nc = currC+dc;
                    if(nr>=0 && nr<size && nc>=0 && nc<size && grid[nr][nc] === -1) {
                        queue.push([nr, nc]);
                    }
                });
            }
        }

        function initGame() {
            const boardEl = document.getElementById('board');
            const statusEl = document.getElementById('status');
            statusEl.innerText = `${currentSize}X${currentSize} 진행 중...`;
            statusEl.style.color = 'var(--accent-color)';

            const cellSize = Math.min((window.innerWidth - 60) / currentSize, 55);
            boardEl.style.gridTemplateColumns = `repeat(${currentSize}, ${cellSize}px)`;
            
            regions = generateRegions(currentSize);
            boardEl.innerHTML = '';

            for(let r=0; r<currentSize; r++) {
                for(let c=0; c<currentSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.width = cell.style.height = `${cellSize}px`;
                    
                    // 구역 경계선 그리기 (굵은 선 힌트)
                    let id = regions[r][c];
                    if(r === 0 || regions[r-1][c] !== id) cell.classList.add('border-top');
                    if(r === currentSize-1 || regions[r+1][c] !== id) cell.classList.add('border-bottom');
                    if(c === 0 || regions[r][c-1] !== id) cell.classList.add('border-left');
                    if(c === currentSize-1 || regions[r][nc=c+1] !== id) cell.classList.add('border-right');

                    cell.onclick = function() {
                        effectClick.play();
                        if (!this.innerHTML) this.innerHTML = '<span class="star">★</span>';
                        else if (this.querySelector('.star')) this.innerHTML = '<span class="cross">✕</span>';
                        else this.innerHTML = '';
                        checkWin();
                    };
                    boardEl.appendChild(cell);
                }
            }
        }

        function checkWin() {
            const cells = document.querySelectorAll('.cell');
            let stars = [];
            cells.forEach((cell, idx) => {
                if(cell.querySelector('.star')) {
                    stars.push({r: Math.floor(idx/currentSize), c: idx%currentSize, rid: regions[Math.floor(idx/currentSize)][idx%currentSize]});
                }
            });

            if(stars.length !== currentSize) return;

            // 규칙 검증 (행, 열, 구역, 인접)
            let rows = new Set(), cols = new Set(), rids = new Set();
            for(let s of stars) {
                if(rows.has(s.r) || cols.has(s.c) || rids.has(s.rid)) return;
                rows.add(s.r); cols.add(s.c); rids.add(s.rid);
                for(let other of stars) {
                    if(s === other) continue;
                    if(Math.abs(s.r - other.r) <= 1 && Math.abs(s.c - other.c) <= 1) return;
                }
            }

            document.getElementById('status').innerText = 'Clear!';
            document.getElementById('status').style.color = '#2ecc71';
            effectClear.play();
        }

        initGame();
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
