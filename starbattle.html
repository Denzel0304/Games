<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Battle - Pastel Green</title>
    <style>
        :root {
            --bg-color: #f0f7f2;
            --surface-color: #f0f7f2;
            --accent-color: #88b09b;
            --shadow-light: #ffffff;
            --shadow-dark: #d1d9d3;
            --text-color: #5a6e63;
        }

        /* 화면 드래그 및 스크롤 방지 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background-color: var(--bg-color);
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 헤더 영역 */
        .header {
            margin-top: 40px;
            text-align: center;
            width: 100%;
        }

        .title-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            background: var(--surface-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            color: var(--text-color);
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .nav-btn:active {
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }

        .game-title {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
        }

        .status-msg {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-color);
            height: 20px;
        }

        /* 게임 보드 */
        .board-container {
            margin-top: 30px;
            padding: 15px;
            border-radius: 25px;
            background: var(--surface-color);
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            display: grid;
            gap: 2px; /* 경계선 표현 */
            background-color: var(--shadow-dark); /* 보드 그리드 선 */
        }

        .cell {
            background: var(--surface-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 하단 버튼 */
        .footer {
            margin-top: auto;
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .main-btn {
            padding: 15px 40px;
            border-radius: 20px;
            border: none;
            background: var(--surface-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            color: var(--text-color);
            font-weight: bold;
            font-size: 16px;
        }

        .main-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        /* 별(Star) 아이콘 스타일 */
        .star { color: #f1c40f; }
        .cross { color: #e74c3c; font-size: 14px; opacity: 0.5; }

    </style>
</head>
<body>

    <div class="header">
        <div class="title-container">
            <button class="nav-btn" onclick="changeSize(-2)">◀</button>
            <h1 class="game-title">Star Battle</h1>
            <button class="nav-btn" onclick="changeSize(2)">▶</button>
        </div>
        <div id="status" class="status-msg">6X6 진행 중...</div>
    </div>

    <div id="board" class="board-container">
        </div>

    <div class="footer">
        <button class="main-btn" onclick="initGame()">새 게임</button>
    </div>

    <script>
        let currentSize = 6;
        const statusEl = document.getElementById('status');
        const boardEl = document.getElementById('board');

        // 오디오 객체 설정
        const effectClick = new Audio('effect 19.mp3');
        const effectClear = new Audio('effect 1.mp3');

        function playSound(audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio play failed"));
        }

        function changeSize(delta) {
            playSound(effectClick);
            const newSize = currentSize + delta;
            if (newSize >= 6 && newSize <= 10) {
                currentSize = newSize;
                initGame();
            }
        }

        function initGame() {
            statusEl.innerText = `${currentSize}X${currentSize} 진행 중...`;
            statusEl.style.color = 'var(--accent-color)';
            
            // 보드 크기 설정
            const cellSize = Math.min((window.innerWidth - 80) / currentSize, 50);
            boardEl.style.gridTemplateColumns = `repeat(${currentSize}, ${cellSize}px)`;
            boardEl.style.gridTemplateRows = `repeat(${currentSize}, ${cellSize}px)`;
            
            boardEl.innerHTML = '';
            for (let i = 0; i < currentSize * currentSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.style.width = `${cellSize}px`;
                cell.style.height = `${cellSize}px`;
                
                // 클릭 이벤트 (임시 로직: 빈칸 -> 별 -> X 순환)
                cell.onclick = function() {
                    playSound(effectClick);
                    if (this.innerHTML === '') {
                        this.innerHTML = '<span class="star">★</span>';
                    } else if (this.querySelector('.star')) {
                        this.innerHTML = '<span class="cross">✕</span>';
                    } else {
                        this.innerHTML = '';
                    }
                    checkClear(); // 클릭할 때마다 클리어 체크
                };
                boardEl.appendChild(cell);
            }
        }

        // 클리어 테스트용 (실제 로직은 Star Battle 규칙 검증 필요)
        function checkClear() {
            // 예시로 모든 칸이 채워지면 클리어라고 가정 (실제 구현시 규칙 엔진 추가)
            const stars = document.querySelectorAll('.star').length;
            if (stars === currentSize) { // 간단한 예시 규칙
                statusEl.innerText = 'Clear!';
                statusEl.style.color = '#2ecc71';
                playSound(effectClear);
            }
        }

        // 초기 실행
        initGame();

        // 모바일 터치 이동 방지
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

    </script>
</body>
</html>
