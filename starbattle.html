<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Battle</title>
    <style>
        :root {
            --bg-color: #e0f2f1; /* 연한 파스텔 그린 */
            --shadow-light: #f5ffff;
            --shadow-dark: #c1d5d4;
            --accent-color: #4db6ac;
            --text-color: #445a58;
        }

        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none; /* 화면 드래그 방지 */
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: var(--text-color);
            overflow: hidden;
        }

        /* 헤더 영역 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            max-width: 400px;
            margin-bottom: 10px;
        }

        .nav-btn {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }

        .nav-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        .title {
            font-size: 24px;
            font-weight: bold;
        }

        .status-msg {
            font-size: 14px;
            margin-bottom: 20px;
            height: 20px;
            color: var(--accent-color);
        }

        /* 게임 보드 */
        .board-container {
            padding: 15px;
            border-radius: 25px;
            background: var(--bg-color);
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
            margin-bottom: 40px;
        }

        #game-board {
            display: grid;
            gap: 4px;
        }

        .cell {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: var(--bg-color);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        /* 구역 구분을 위한 테두리 예시 (JS에서 추가) */
        .cell.border-right { border-right: 2px solid #a1b5b4; }
        .cell.border-bottom { border-bottom: 2px solid #a1b5b4; }

        /* 하단 버튼 */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 150px;
        }

        .action-btn {
            padding: 12px;
            border-radius: 20px;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            border: none;
            color: var(--text-color);
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .action-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="nav-btn" onclick="changeMode(-1)">〈</button>
        <div class="title" id="mode-display">6x6</div>
        <button class="nav-btn" onclick="changeMode(1)">〉</button>
    </div>

    <div class="status-msg" id="status-text">6x6 진행 중...</div>

    <div class="board-container">
        <div id="game-board"></div>
    </div>

    <div class="controls">
        <button class="action-btn" onclick="resetGame()">새 게임</button>
    </div>

    <audio id="sfx-click" src="effect 1.mp3"></audio>
    <audio id="sfx-clear" src="effect 2.mp3"></audio>

    <script>
        const modes = [6, 8, 10];
        let currentModeIdx = 0;
        let boardSize = modes[currentModeIdx];
        let boardState = []; // 0: 빈칸, 1: 별, 2: X
        
        // 사운드 재생 함수
        function playSound(id) {
            const sound = document.getElementById(id);
            sound.currentTime = 0;
            sound.play().catch(() => {}); // 유저 인터랙션 전 재생 방지
        }

        function initGame() {
            boardSize = modes[currentModeIdx];
            document.getElementById('mode-display').innerText = `${boardSize}x${boardSize}`;
            document.getElementById('status-text').innerText = `${boardSize}x${boardSize} 진행 중...`;
            
            const board = document.getElementById('game-board');
            board.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
            board.innerHTML = '';
            
            boardState = Array(boardSize * boardSize).fill(0);

            for (let i = 0; i < boardSize * boardSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    handleCellClick(i);
                });
                cell.addEventListener('mousedown', () => handleCellClick(i));
                board.appendChild(cell);
            }
        }

        function handleCellClick(index) {
            playSound('sfx-click');
            
            // 상태 순환: 빈칸(0) -> 별(1) -> X(2) -> 빈칸(0)
            boardState[index] = (boardState[index] + 1) % 3;
            updateBoard();
            checkWin();
        }

        function updateBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                if (boardState[i] === 1) {
                    cell.innerText = '★';
                    cell.style.color = '#fbc02d';
                } else if (boardState[i] === 2) {
                    cell.innerText = '✕';
                    cell.style.color = '#999';
                } else {
                    cell.innerText = '';
                }
            });
        }

        function changeMode(dir) {
            currentModeIdx = (currentModeIdx + dir + modes.length) % modes.length;
            initGame();
        }

        function resetGame() {
            initGame();
        }

        function checkWin() {
            // 여기에 스타배틀 로직(행, 열, 구역, 인접체크)이 들어가야 합니다.
            // 데모를 위해 모든 조건을 통과했다고 가정하는 로직을 짤 수 있으나 
            // 실제 구현시에는 구역(Region) 데이터가 필수적입니다.
            
            // 승리 조건 예시 (임시):
            // if (validateStarBattle()) { 
            //    document.getElementById('status-text').innerText = "CLEAR! 축하합니다!";
            //    playSound('sfx-clear');
            // }
        }

        // 초기화 실행
        initGame();

        // 화면 스크롤 방지 (iOS 등 대응)
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
