<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Battle</title>
    <style>
        :root {
            --bg-color: #e0f2f1; 
            --shadow-light: #f5ffff;
            --shadow-dark: #c1d5d4;
            --accent-color: #4db6ac;
            --text-color: #445a58;
        }

        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 상단 여백을 줄여 전체적으로 위로 배치 */
            justify-content: flex-start; 
            padding-top: 30px; 
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: var(--text-color);
            overflow: hidden;
        }

        /* 헤더 영역 - 간격 축소 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 85%;
            max-width: 360px;
            margin-bottom: 5px;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-color);
            cursor: pointer;
        }

        .nav-btn:active {
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }

        .title {
            font-size: 22px;
            font-weight: bold;
        }

        .status-msg {
            font-size: 13px;
            margin-bottom: 15px;
            height: 18px;
            color: var(--accent-color);
        }

        /* 게임 보드 컨테이너 - 가변 크기 설정 */
        .board-container {
            width: 90%;
            max-width: 380px; /* 화면 너비에 맞게 최대 폭 제한 */
            aspect-ratio: 1 / 1; /* 정사각형 유지 */
            padding: 12px;
            border-radius: 20px;
            background: var(--bg-color);
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-board {
            display: grid;
            gap: 4px;
            width: 100%;
            height: 100%;
        }

        /* 셀 크기가 부모에 맞춰 자동 조절되도록 설정 */
        .cell {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            background: var(--bg-color);
            box-shadow: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(100vw / 18); /* 글자 크기도 유동적으로 */
            cursor: pointer;
            transition: transform 0.1s;
        }

        .cell:active {
            transform: scale(0.95);
        }

        /* 하단 버튼 영역 */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 130px;
        }

        .action-btn {
            padding: 10px;
            border-radius: 18px;
            background: var(--bg-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            border: none;
            color: var(--text-color);
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .action-btn:active {
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="nav-btn" onclick="changeMode(-1)">〈</button>
        <div class="title" id="mode-display">6x6</div>
        <button class="nav-btn" onclick="changeMode(1)">〉</button>
    </div>

    <div class="status-msg" id="status-text">6x6 진행 중...</div>

    <div class="board-container">
        <div id="game-board"></div>
    </div>

    <div class="controls">
        <button class="action-btn" onclick="resetGame()">새 게임</button>
    </div>

    <audio id="sfx-click" src="effect 1.mp3"></audio>
    <audio id="sfx-clear" src="effect 2.mp3"></audio>

    <script>
        const modes = [6, 8, 10];
        let currentModeIdx = 0;
        let boardState = []; 

        function initGame() {
            const boardSize = modes[currentModeIdx];
            document.getElementById('mode-display').innerText = `${boardSize}x${boardSize}`;
            document.getElementById('status-text').innerText = `${boardSize}x${boardSize} 진행 중...`;
            
            const board = document.getElementById('game-board');
            board.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
            board.style.gridTemplateRows = `repeat(${boardSize}, 1fr)`;
            board.innerHTML = '';
            
            boardState = Array(boardSize * boardSize).fill(0);

            // 10x10일 때 글자 크기 조절
            const fontSize = boardSize === 10 ? '16px' : (boardSize === 8 ? '18px' : '22px');

            for (let i = 0; i < boardSize * boardSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.style.fontSize = fontSize;
                cell.dataset.index = i;
                
                // 모바일 터치 이벤트
                cell.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    handleCellClick(i);
                });
                // 데스크톱 클릭 이벤트
                cell.addEventListener('mousedown', (e) => {
                    if(e.button === 0) handleCellClick(i);
                });
                board.appendChild(cell);
            }
        }

        function handleCellClick(index) {
            const clickSound = document.getElementById('sfx-click');
            clickSound.currentTime = 0;
            clickSound.play().catch(()=>{});

            boardState[index] = (boardState[index] + 1) % 3;
            updateBoard();
            
            // 임시 클리어 로직 (예시: 별을 하나라도 찍으면 검사 함수 호출 가능)
            if (boardState.includes(1)) checkWin();
        }

        function updateBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                if (boardState[i] === 1) {
                    cell.innerText = '★';
                    cell.style.color = '#fbc02d';
                } else if (boardState[i] === 2) {
                    cell.innerText = '✕';
                    cell.style.color = '#999';
                } else {
                    cell.innerText = '';
                }
            });
        }

        function changeMode(dir) {
            currentModeIdx = (currentModeIdx + dir + modes.length) % modes.length;
            initGame();
        }

        function resetGame() {
            initGame();
        }

        function checkWin() {
            // 실제 스타배틀 승리 검증 로직이 들어갈 자리입니다.
        }

        initGame();

        // 전체 화면 스크롤 금지
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
