<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Battle</title>
    <style>
        :root {
            --bg-color: #e0f2f1; 
            --shadow-light: #f5ffff;
            --shadow-dark: #c1d5d4;
            --accent-color: #4db6ac;
            --text-color: #445a58;
            --border-line: #88a4a2; /* 구역 선 색상 */
        }

        * { 
            box-sizing: border-box; 
            -webkit-touch-callout: none; 
            -webkit-user-select: none; 
            user-select: none; 
            touch-action: none; 
        }

        body {
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; 
            min-height: 100vh;
            background-color: var(--bg-color); 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            color: var(--text-color); 
            overflow: hidden;
        }

        /* 헤더 디자인 */
        .header { 
            display: flex; align-items: center; justify-content: space-between; 
            width: 85%; max-width: 360px; 
            margin-bottom: 10px;
        }

        .nav-btn {
            width: 44px; height: 44px; border-radius: 12px; background: var(--bg-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            border: none; font-size: 18px; color: var(--text-color); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:active { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light); }

        .title { font-size: 24px; font-weight: bold; letter-spacing: -0.5px; }
        .status-msg { font-size: 14px; margin-bottom: 20px; height: 20px; color: var(--accent-color); font-weight: 600; }

        /* 게임 보드: 뉴모피즘 스타일 복구 */
        .board-container {
            width: 90vw; max-width: 380px; aspect-ratio: 1 / 1; padding: 12px;
            border-radius: 24px; background: var(--bg-color);
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            margin-bottom: 30px; display: flex; align-items: center; justify-content: center;
        }

        #game-board { 
            display: grid; width: 100%; height: 100%; 
            border: 1.5px solid var(--border-line); /* 바깥 테두리 */
            background-color: transparent;
        }

        .cell {
            width: 100%; height: 100%; 
            background: var(--bg-color);
            border: 0.2px solid rgba(0,0,0,0.05); /* 기본 얇은 선 */
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; font-weight: bold;
            transition: background 0.1s;
        }

        /* 구역 경계선 굵게 표시 (이 부분이 이뻐야 함) */
        .b-top { border-top: 3px solid var(--border-line) !important; }
        .b-left { border-left: 3px solid var(--border-line) !important; }

        .controls { display: flex; flex-direction: column; gap: 15px; width: 150px; }
        .action-btn {
            padding: 12px; border-radius: 20px; background: var(--bg-color);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            border: none; color: var(--text-color); font-weight: bold; font-size: 15px;
            cursor: pointer;
        }
        .action-btn:active { box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); }
    </style>
</head>
<body>

    <div class="header">
        <button class="nav-btn" onclick="changeMode(-1)">〈</button>
        <div class="title">Star Battle</div>
        <button class="nav-btn" onclick="changeMode(1)">〉</button>
    </div>

    <div class="status-msg" id="status-text">6x6 진행 중...</div>

    <div class="board-container">
        <div id="game-board"></div>
    </div>

    <div class="controls">
        <button class="action-btn" onclick="resetGame()">새 게임</button>
    </div>

    <audio id="sound-tap" src="effect 1.mp3" preload="auto"></audio>
    <audio id="sound-win" src="effect 2.mp3" preload="auto"></audio>

    <script>
        const modes = [6, 8, 10];
        let currentModeIdx = 0;
        let boardState = [];
        let regionMap = [];
        let isCleared = false;

        function getRegionMap(size) {
            // 6x6 샘플 맵 (구역 데이터를 명확히 정의해야 격자가 이쁘게 나옴)
            if(size === 6) return [0,0,1,1,1,1,0,0,1,1,1,1,2,2,2,3,3,3,2,2,2,3,3,3,4,4,4,4,5,5,4,4,4,4,5,5];
            // 8x8, 10x10은 테스트용 가로줄 구역
            return new Array(size * size).fill(0).map((_, i) => Math.floor(i/size));
        }

        function initGame() {
            isCleared = false;
            const size = modes[currentModeIdx];
            document.getElementById('status-text').innerText = `${size}x${size} 진행 중...`;
            document.getElementById('status-text').style.color = 'var(--accent-color)';
            
            const board = document.getElementById('game-board');
            board.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            board.innerHTML = '';
            
            boardState = Array(size * size).fill(0);
            regionMap = getRegionMap(size);

            for (let i = 0; i < size * size; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                const r = i % size, c = Math.floor(i / size);
                // 구역이 바뀔 때만 두꺼운 선 추가
                if (r > 0 && regionMap[i] !== regionMap[i-1]) cell.classList.add('b-left');
                if (c > 0 && regionMap[i] !== regionMap[i-size]) cell.classList.add('b-top');

                cell.addEventListener('mousedown', (e) => { if(e.button === 0) handleTap(i); });
                cell.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(i); });
                board.appendChild(cell);
            }
        }

        function handleTap(index) {
            if(isCleared) return;

            // 클릭 효과음 (effect 1) 강제 재생
            const tapSfx = document.getElementById('sound-tap');
            tapSfx.currentTime = 0;
            tapSfx.play().catch(()=>{});

            boardState[index] = (boardState[index] + 1) % 3;
            render();
            checkWin();
        }

        function render() {
            const cells = document.querySelectorAll('.cell');
            const size = modes[currentModeIdx];
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i] === 1 ? '★' : (boardState[i] === 2 ? '✕' : '');
                cell.style.color = boardState[i] === 1 ? '#fbc02d' : '#9eaead';
                cell.style.fontSize = `${Math.min(28, 250/size)}px`;
            });
        }

        function checkWin() {
            const size = modes[currentModeIdx];
            const n = size === 10 ? 2 : 1; 
            const stars = boardState.reduce((acc, s, i) => s === 1 ? [...acc, i] : acc, []);

            if (stars.length !== size * n) return;

            // 1. 인접성 검사
            for (let i = 0; i < stars.length; i++) {
                for (let j = i + 1; j < stars.length; j++) {
                    const x1 = stars[i] % size, y1 = Math.floor(stars[i] / size);
                    const x2 = stars[j] % size, y2 = Math.floor(stars[j] / size);
                    if (Math.abs(x1 - x2) <= 1 && Math.abs(y1 - y2) <= 1) return;
                }
            }

            // 2. 행, 열, 구역 카운트
            const rowC = new Array(size).fill(0), colC = new Array(size).fill(0), regC = {};
            stars.forEach(idx => {
                rowC[Math.floor(idx/size)]++;
                colC[idx%size]++;
                regC[regionMap[idx]] = (regC[regionMap[idx]] || 0) + 1;
            });

            if (rowC.every(c => c === n) && colC.every(c => c === n)) {
                let regsOk = true;
                for(let i=0; i<size; i++) if((regC[i] || 0) !== n) regsOk = false;

                if (regsOk) {
                    isCleared = true;
                    document.getElementById('status-text').innerText = "★ CLEAR! ★";
                    document.getElementById('status-text').style.color = "#d32f2f";
                    
                    // 클리어 효과음 (effect 2) 재생
                    const winSfx = document.getElementById('sound-win');
                    winSfx.currentTime = 0;
                    winSfx.play().catch(()=>{});
                }
            }
        }

        function changeMode(dir) { currentModeIdx = (currentModeIdx + dir + modes.length) % modes.length; initGame(); }
        function resetGame() { initGame(); }
        
        initGame();
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
