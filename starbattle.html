<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Battle - Fixed Border</title>
    <style>
        :root {
            --bg-color: #f0f7f2;
            --surface-color: #f0f7f2;
            --accent-color: #88b09b; /* 짙은 파스텔 그린 */
            --shadow-light: #ffffff;
            --shadow-dark: #d1d9d3;
            --text-color: #5a6e63;
            
            --border-width: 2px;
            /* [핵심 수정 2] 내부 구역 선: 점선(dotted) 딱 한 줄 정의 */
            --region-border: var(--border-width) dotted var(--accent-color);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; position: fixed;
            background-color: var(--bg-color);
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
        }

        .header { margin-top: 40px; text-align: center; width: 100%; }
        .title-container { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 10px; }
        
        .nav-btn {
            width: 40px; height: 40px; border-radius: 12px; border: none;
            background: var(--surface-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            color: var(--text-color); font-weight: bold; cursor: pointer;
        }
        .nav-btn:active { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light); }

        .game-title { font-size: 28px; font-weight: 800; margin: 0; }
        .status-msg { font-size: 14px; font-weight: 600; color: var(--text-color); height: 20px; }

        .board-container {
            margin-top: 30px; padding: 15px; border-radius: 25px;
            background: var(--surface-color);
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            display: grid;
            
            /* [핵심 수정 1] 바깥 테두리: 실선(solid)으로 확실하게 유지 */
            border: var(--border-width) solid var(--accent-color); 
        }

        .cell {
            background: var(--surface-color);
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; cursor: pointer; user-select: none;
            box-sizing: border-box; 
            /* 기본 칸 경계선은 아주 연하게 */
            border: 0.5px solid rgba(0,0,0,0.03);
            -webkit-tap-highlight-color: transparent;
        }

        /* 구역 경계선을 점선 한 줄로 적용 */
        .b-t { border-top: var(--region-border) !important; }
        .b-b { border-bottom: var(--region-border) !important; }
        .b-l { border-left: var(--region-border) !important; }
        .b-r { border-right: var(--region-border) !important; }

        .footer { margin-top: auto; margin-bottom: 50px; }
        .main-btn {
            padding: 15px 40px; border-radius: 20px; border: none;
            background: var(--surface-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            color: var(--text-color); font-weight: bold; font-size: 16px; cursor: pointer;
        }
        .main-btn:active { box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); }

        .star { color: #f1c40f; }
        .cross { color: #e74c3c; font-size: 14px; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-container">
            <button class="nav-btn" onclick="changeSize(-2)">◀</button>
            <h1 class="game-title">Star Battle</h1>
            <button class="nav-btn" onclick="changeSize(2)">▶</button>
        </div>
        <div id="status" class="status-msg"></div>
    </div>

    <div id="board" class="board-container"></div>

    <div class="footer">
        <button class="main-btn" onclick="handleNewGame()">새 게임</button>
    </div>

    <script>
        let currentSize = 6;
        let regions = [];
        const effectClick = new Audio('effect 19.mp3');
        const effectClear = new Audio('effect 1.mp3');

        function playSound(audio) {
            audio.currentTime = 0;
            audio.play().catch(e => {});
        }

        function changeSize(delta) {
            playSound(effectClick);
            const newSize = currentSize + delta;
            if (newSize >= 6 && newSize <= 10) {
                currentSize = newSize;
                initGame();
            }
        }

        function handleNewGame() {
            playSound(effectClick);
            initGame();
        }

        function generateRegions(size) {
            let grid = Array.from({length: size}, () => Array(size).fill(-1));
            let regionId = 0;
            let cells = [];
            for(let r=0; r<size; r++) for(let c=0; c<size; c++) cells.push([r,c]);
            cells.sort(() => Math.random() - 0.5);

            for(let [r, c] of cells) {
                if(grid[r][c] === -1) {
                    let queue = [[r, c]];
                    let count = 0;
                    while(queue.length > 0 && count < size) {
                        let idx = Math.floor(Math.random() * queue.length);
                        let [currR, currC] = queue.splice(idx, 1)[0];
                        if(grid[currR][currC] !== -1) continue;
                        grid[currR][currC] = regionId;
                        count++;
                        [[0,1],[1,0],[0,-1],[-1,0]].forEach(([dr, dc]) => {
                            let nr = currR+dr, nc = currC+dc;
                            if(nr>=0 && nr<size && nc>=0 && nc<size && grid[nr][nc] === -1) queue.push([nr, nc]);
                        });
                    }
                    regionId++;
                }
            }
            return grid;
        }

        function initGame() {
            const boardEl = document.getElementById('board');
            const statusEl = document.getElementById('status');
            
            statusEl.innerText = `${currentSize}X${currentSize} 진행 중...`;
            statusEl.style.color = 'var(--text-color)';

            const cellSize = Math.min((window.innerWidth - 80) / currentSize, 50);
            boardEl.style.gridTemplateColumns = `repeat(${currentSize}, ${cellSize}px)`;
            boardEl.innerHTML = '';
            
            regions = generateRegions(currentSize);

            for(let r=0; r<currentSize; r++) {
                for(let c=0; c<currentSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.width = cell.style.height = `${cellSize}px`;
                    
                    let id = regions[r][c];
                    
                    /* [핵심 수정] 내부 경계선 판별 로직 수정 */
                    // 바깥 테두리(0행, 마지막행, 0열, 마지막열)는 점선 경계선을 그리지 않음 (실선 테두리와 겹치지 않게)
                    if(r > 0 && regions[r-1][c] !== id) cell.classList.add('b-t');
                    if(r < currentSize-1 && regions[r+1][c] !== id) cell.classList.add('b-b');
                    if(c > 0 && regions[r][c-1] !== id) cell.classList.add('b-l');
                    if(c < currentSize-1 && regions[r][c+1] !== id) cell.classList.add('b-r');

                    cell.onclick = function() {
                        playSound(effectClick);
                        if (this.innerHTML === '') this.innerHTML = '<span class="star">★</span>';
                        else if (this.querySelector('.star')) this.innerHTML = '<span class="cross">✕</span>';
                        else this.innerHTML = '';
                        checkWin();
                    };
                    boardEl.appendChild(cell);
                }
            }
        }

        function checkWin() {
            const cells = document.querySelectorAll('.cell');
            let stars = [];
            cells.forEach((cell, idx) => {
                if(cell.querySelector('.star')) {
                    let r = Math.floor(idx/currentSize), c = idx%currentSize;
                    stars.push({r, c, rid: regions[r][c]});
                }
            });

            if(stars.length !== currentSize) return;

            let rowSet = new Set(), colSet = new Set(), ridSet = new Set();
            for(let s of stars) {
                if(rowSet.has(s.r) || colSet.has(s.c) || ridSet.has(s.rid)) return;
                rowSet.add(s.r); colSet.add(s.c); ridSet.add(s.rid);
                for(let other of stars) {
                    if(s === other) continue;
                    if(Math.abs(s.r - other.r) <= 1 && Math.abs(s.c - other.c) <= 1) return;
                }
            }
            document.getElementById('status').innerText = 'Clear!';
            document.getElementById('status').style.color = '#2ecc71';
            playSound(effectClear);
        }

        initGame();
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
