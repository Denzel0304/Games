<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ten Pair - Healing Games</title>
    <style>
        :root {
            --bg-color: #f0ede5;
            --text-color: #5d5a52;
            --shadow-dark: rgba(188, 185, 178, 0.8);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --accent-color: #8e9775;
            --selected-bg: #e8e4da;
            --cleared-color: #d1ccc0;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body { display: flex; flex-direction: column; align-items: center; }

        .header {
            height: 20%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .size-btn {
            width: 55px;
            height: 55px;
            border: none;
            border-radius: 15px;
            background: var(--bg-color);
            color: var(--text-color);
            font-weight: 800;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            cursor: pointer;
        }

        .size-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        h1 { margin: 0; font-size: 1.6rem; font-weight: 800; }
        #status { margin-top: 10px; font-size: 0.9rem; color: var(--accent-color); font-weight: 600; height: 1.2rem; }

        /* 게임 영역 */
        .game-area {
            height: 50%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid-container {
            width: 85vw;
            height: 85vw;
            max-width: 360px;
            max-height: 360px;
            background: var(--bg-color);
            border-radius: 30px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
            padding: 15px;
            box-sizing: border-box;
            display: grid;
            gap: 8px;
            overflow-y: auto;
        }

        /* 스크롤바 숨기기 */
        .grid-container::-webkit-scrollbar { display: none; }

        .cell {
            aspect-ratio: 1 / 1;
            background: var(--bg-color);
            border-radius: 10px;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            transition: all 0.2s;
            cursor: pointer;
        }

        .cell.selected {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            background-color: var(--selected-bg);
            color: var(--accent-color);
        }

        .cell.cleared {
            box-shadow: none;
            color: var(--cleared-color);
            background: transparent;
            opacity: 0.2;
            pointer-events: none;
        }

        /* 하단 영역 */
        .footer {
            height: 30%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 15px 35px;
            border: none;
            border-radius: 20px;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            font-weight: 700;
            color: var(--text-color);
            font-size: 1rem;
        }

        .btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        .btn-accent { color: var(--accent-color); }
    </style>
</head>
<body>

    <audio id="click-sound" src="effect 19.mp3" preload="auto"></audio>

    <div class="header">
        <div class="title-row">
            <button class="size-btn" onclick="changeLevel(6)">6x6</button>
            <h1>Ten Pair</h1>
            <button class="size-btn" onclick="changeLevel(8)">8x8</button>
        </div>
        <div id="status">5x5 모드로 시작합니다!</div>
    </div>

    <div class="game-area">
        <div id="grid" class="grid-container"></div>
    </div>

    <div class="footer">
        <button class="btn" onclick="addNumbers()">숫자 추가</button>
        <button class="btn btn-accent" onclick="resetGame()">새 게임</button>
    </div>

    <script>
        let currentSize = 5;
        let numbers = [];
        let selectedIdx = null;
        let audioUnlocked = false;

        function playClickSound() {
            const sound = document.getElementById('click-sound');
            if (!audioUnlocked) {
                sound.play().then(() => {
                    audioUnlocked = true;
                    sound.currentTime = 0;
                }).catch(e => console.log("Audio waiting..."));
            } else {
                sound.currentTime = 0;
                sound.play();
            }
        }

        function changeLevel(size) {
            playClickSound();
            currentSize = size;
            document.getElementById('status').innerText = `${size}x${size} 모드 시작!`;
            resetGame();
        }

        function resetGame() {
            if (event) playClickSound();
            const initialCount = currentSize * currentSize;
            numbers = Array.from({length: initialCount}, () => Math.floor(Math.random() * 9) + 1);
            selectedIdx = null;
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            // 난이도에 따른 폰트 크기 및 그리드 설정
            grid.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
            const fontSize = currentSize === 8 ? '0.9rem' : (currentSize === 6 ? '1.1rem' : '1.2rem');

            numbers.forEach((num, idx) => {
                const cell = document.createElement('div');
                cell.className = 'cell' + (num === 0 ? ' cleared' : '');
                if (idx === selectedIdx) cell.classList.add('selected');
                cell.style.fontSize = fontSize;
                cell.innerText = num === 0 ? '' : num;
                cell.onclick = () => handleSelect(idx);
                grid.appendChild(cell);
            });
        }

        function handleSelect(idx) {
            if (numbers[idx] === 0) return;
            playClickSound();

            if (selectedIdx === null) {
                selectedIdx = idx;
            } else if (selectedIdx === idx) {
                selectedIdx = null;
            } else {
                if (canMatch(selectedIdx, idx)) {
                    numbers[selectedIdx] = 0;
                    numbers[idx] = 0;
                    selectedIdx = null;
                    checkWin();
                } else {
                    selectedIdx = idx;
                }
            }
            render();
        }

        function canMatch(i, j) {
            const n1 = numbers[i];
            const n2 = numbers[j];
            if (!(n1 + n2 === 10 || n1 === n2)) return false;

            const min = Math.min(i, j);
            const max = Math.max(i, j);
            
            // 가로 줄 확인 (currentSize 변수 활용)
            if (Math.floor(i / currentSize) === Math.floor(j / currentSize)) {
                for (let k = min + 1; k < max; k++) if (numbers[k] !== 0) return false;
                return true;
            }
            
            // 세로 열 확인 (currentSize 변수 활용)
            if (i % currentSize === j % currentSize) {
                for (let k = min + currentSize; k < max; k += currentSize) if (numbers[k] !== 0) return false;
                return true;
            }

            // 전체 흐름 (줄바꿈 포함)
            let isContinuous = true;
            for (let k = min + 1; k < max; k++) {
                if (numbers[k] !== 0) { isContinuous = false; break; }
            }
            if (isContinuous) return true;

            return false;
        }

        function addNumbers() {
            playClickSound();
            const currentNums = numbers.filter(n => n !== 0);
            if (currentNums.length === 0) return;
            numbers = [...numbers, ...currentNums];
            render();
            
            // 추가 시 하단으로 자동 스크롤
            setTimeout(() => {
                const grid = document.getElementById('grid');
                grid.scrollTo({ top: grid.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        function checkWin() {
            if (numbers.every(n => n === 0)) {
                document.getElementById('status').innerText = "🎉 미션 클리어!";
                document.getElementById('status').style.color = "#27ae60";
            }
        }

        window.onload = () => {
            resetGame();
        };
    </script>
</body>
</html>
