<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작은 정원 🌱</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Gaegu:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-dark: #2e7d32;
    --green-mid: #388e3c;
    --green-light: #66bb6a;
    --brown: #795548;
    --brown-dark: #5d4037;
    --sky-top: #bbdefb;
    --sky-bottom: #c8e6c9;
  }

  body {
    font-family: 'Nanum Gothic', sans-serif;
    background: #e8f5e9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  #garden-app {
    width: 100%;
    max-width: 480px;
    min-height: 580px;
    position: relative;
    overflow: hidden;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 20px 60px rgba(46,125,50,0.25);
  }

  .sky {
    width: 100%;
    height: 150px;
    background: linear-gradient(180deg, #bbdefb 0%, #c8e6c9 100%);
    position: relative;
    flex-shrink: 0;
  }

  .sun {
    position: absolute;
    top: 20px; right: 60px;
    width: 48px; height: 48px;
    background: #fff9c4;
    border-radius: 50%;
    box-shadow: 0 0 0 10px rgba(255,245,157,0.35), 0 0 0 22px rgba(255,245,157,0.12);
    animation: sunpulse 3s ease-in-out infinite;
  }

  @keyframes sunpulse {
    0%, 100% { box-shadow: 0 0 0 10px rgba(255,245,157,0.35), 0 0 0 22px rgba(255,245,157,0.12); }
    50% { box-shadow: 0 0 0 16px rgba(255,245,157,0.3), 0 0 0 34px rgba(255,245,157,0.08); }
  }

  .sun-rays {
    position: absolute;
    top: 50%; left: 50%;
    width: 70px; height: 70px;
    transform: translate(-50%, -50%);
    animation: spin 12s linear infinite;
  }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  .ray {
    position: absolute;
    width: 3px; height: 12px;
    background: rgba(255,245,100,0.5);
    border-radius: 2px;
    left: 50%; transform-origin: bottom center;
    margin-left: -1.5px;
  }

  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.82);
    border-radius: 20px;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.82);
    border-radius: 50%;
  }
  .cloud1 { width:80px;height:26px;top:32px;left:36px;animation:floatL 9s ease-in-out infinite; }
  .cloud1::before { width:36px;height:36px;top:-16px;left:10px; }
  .cloud1::after { width:24px;height:24px;top:-10px;left:36px; }
  .cloud2 { width:56px;height:18px;top:58px;left:130px;animation:floatL 13s ease-in-out infinite reverse; }
  .cloud2::before { width:26px;height:26px;top:-12px;left:8px; }
  .cloud2::after { width:18px;height:18px;top:-8px;left:26px; }

  @keyframes floatL {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(14px); }
  }

  .ground {
    width: 100%;
    flex: 1;
    background: linear-gradient(180deg, #81c784 0%, #6dbf7e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 16px 22px;
    position: relative;
  }

  .title-bar {
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    font-weight: 700;
    color: #1b5e20;
    margin-bottom: 6px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
    letter-spacing: 1px;
  }

  .score-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .score-item {
    font-size: 11px;
    color: #1b5e20;
    background: rgba(255,255,255,0.35);
    border-radius: 12px;
    padding: 3px 10px;
  }

  .plots-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .plot {
    width: 96px;
    background: linear-gradient(180deg, #8d6e63 0%, #6d4c41 100%);
    border-radius: 12px;
    padding: 10px 8px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    border: 2.5px solid #5d4037;
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s;
    position: relative;
    min-height: 118px;
    justify-content: flex-end;
  }
  .plot:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 10px 28px rgba(0,0,0,0.18); }
  .plot.selected { box-shadow: 0 0 0 3px #fff, 0 0 0 5px #fdd835, 0 8px 24px rgba(0,0,0,0.15); border-color: #fdd835; }

  .plot-label {
    font-size: 10px;
    color: #d7ccc8;
    text-align: center;
    margin-top: 5px;
    font-family: 'Gaegu', cursive;
  }

  .plant-area {
    width: 100%;
    height: 70px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
  }

  .plant-empty::after {
    content: '';
    display: block;
    width: 30px; height: 5px;
    background: #6d4c41;
    border-radius: 3px;
  }

  .plant-seed {
    width: 14px; height: 14px;
    background: #a1887f;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    margin-bottom: 2px;
    animation: seedbob 2s ease-in-out infinite;
  }
  @keyframes seedbob {
    0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)}
  }

  .plant-sprout { position:relative;width:22px;height:42px;display:flex;flex-direction:column;align-items:center; }
  .stem { width:3px;height:28px;background:#388e3c;border-radius:2px;margin-top:auto; }
  .leaf-l { position:absolute;bottom:14px;left:-11px;width:18px;height:11px;background:#66bb6a;border-radius:80% 0 80% 0;transform:rotate(-20deg); }
  .leaf-r { position:absolute;bottom:14px;right:-11px;width:18px;height:11px;background:#66bb6a;border-radius:0 80% 0 80%;transform:rotate(20deg); }

  .plant-bud { position:relative;width:26px;height:56px;display:flex;flex-direction:column;align-items:center; }
  .bud-stem { width:3px;height:34px;background:#388e3c;border-radius:2px;margin-top:auto; }
  .bud-leaf-l { position:absolute;bottom:18px;left:-13px;width:20px;height:13px;background:#66bb6a;border-radius:80% 0 80% 0;transform:rotate(-25deg); }
  .bud-leaf-r { position:absolute;bottom:18px;right:-13px;width:20px;height:13px;background:#66bb6a;border-radius:0 80% 0 80%;transform:rotate(25deg); }
  .bud-head { width:15px;height:15px;background:#f48fb1;border-radius:50% 50% 50% 50% / 40% 40% 60% 60%;margin-bottom:2px; }

  .plant-bloom {
    position:relative;width:38px;height:66px;display:flex;flex-direction:column;align-items:center;
    animation: sway 3.5s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes sway { 0%,100%{transform:rotate(0deg)}50%{transform:rotate(4deg)} }
  .bloom-stem { width:3px;height:34px;background:#388e3c;border-radius:2px;margin-top:auto; }
  .bloom-leaf-l { position:absolute;bottom:20px;left:-14px;width:22px;height:14px;background:#66bb6a;border-radius:80% 0 80% 0;transform:rotate(-25deg); }
  .bloom-leaf-r { position:absolute;bottom:20px;right:-14px;width:22px;height:14px;background:#66bb6a;border-radius:0 80% 0 80%;transform:rotate(25deg); }
  .petal-ring { position:absolute;top:0;width:38px;height:38px; }
  .petal { position:absolute;width:14px;height:21px;border-radius:50%;opacity:0.93; }
  .center-dot { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:13px;height:13px;background:#fdd835;border-radius:50%; }

  .status-bar {
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: #1b5e20;
    background: rgba(255,255,255,0.45);
    border-radius: 10px;
    padding: 5px 14px;
    min-height: 26px;
    margin-bottom: 8px;
    font-family: 'Gaegu', cursive;
    font-size: 14px;
  }

  .action-btns {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .action-btn {
    padding: 8px 15px;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Gaegu', cursive;
    border: 2px solid;
    border-radius: 20px;
    cursor: pointer;
    background: rgba(255,255,255,0.7);
    transition: all 0.15s;
    backdrop-filter: blur(4px);
  }
  .action-btn:hover { transform: scale(1.06); }
  .action-btn:active { transform: scale(0.97); }
  .btn-seed { border-color: #795548; color: #4e342e; }
  .btn-seed:hover { background: rgba(161,136,127,0.25); }
  .btn-water { border-color: #1565c0; color: #0d47a1; }
  .btn-water:hover { background: rgba(100,181,246,0.25); }
  .btn-harvest { border-color: #e65100; color: #bf360c; }
  .btn-harvest:hover { background: rgba(255,204,128,0.35); }

  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: rise 1.5s ease-out forwards;
    z-index: 10;
  }
  @keyframes rise {
    0%  { opacity:1; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(-70px) scale(0.2); }
  }

  .water-flash {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    pointer-events: none;
    animation: wflash 0.5s ease-out forwards;
    z-index: 5;
  }
  @keyframes wflash {
    0%  { background: rgba(100,181,246,0.5); }
    100%{ background: rgba(100,181,246,0); }
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(255,255,255,0.95);
    color: #1b5e20;
    padding: 10px 22px;
    border-radius: 24px;
    font-family: 'Gaegu', cursive;
    font-size: 15px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="garden-app">
  <div class="sky">
    <div class="sun">
      <div class="sun-rays" id="sun-rays"></div>
    </div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
  </div>
  <div class="ground">
    <div class="title-bar">🌱 작은 정원</div>
    <div class="score-row">
      <div class="score-item">🌸 수확 <span id="harvest-count">0</span>회</div>
      <div class="score-item">💧 물주기 <span id="water-count">0</span>회</div>
      <div class="score-item">🌞 방문 <span id="today-count">0</span>번</div>
    </div>
    <div class="plots-row" id="plots-row"></div>
    <div class="status-bar" id="status-bar">화분을 선택하세요 🌿</div>
    <div class="action-btns">
      <button class="action-btn btn-seed" onclick="plantSeed()">🌰 씨앗 심기</button>
      <button class="action-btn btn-water" onclick="waterPlant()">💧 물 주기</button>
      <button class="action-btn btn-harvest" onclick="harvestPlant()">🌸 수확하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- sun rays ----
(function(){
  const rays = document.getElementById('sun-rays');
  for(let i=0;i<8;i++){
    const r=document.createElement('div');
    r.className='ray';
    r.style.transform=`translateX(-50%) rotate(${i*45}deg) translateY(-28px)`;
    r.style.left='50%';
    rays.appendChild(r);
  }
})();

const STAGES=['empty','seed','sprout','bud','bloom'];
const STAGE_NAMES={empty:'빈 화분',seed:'씨앗',sprout:'새싹',bud:'봉오리',bloom:'활짝 핀 꽃'};
const PETAL_COLORS=['#f48fb1','#ce93d8','#90caf9','#80cbc4','#ffcc80','#ef9a9a','#a5d6a7','#fff176'];

const STORAGE_KEY='garden_v1';

let state={
  plots:[
    {stage:'empty',water:0,color:0},
    {stage:'empty',water:0,color:1},
    {stage:'empty',water:0,color:2},
    {stage:'empty',water:0,color:3},
  ],
  selected:0,
  harvestCount:0,
  waterCount:0,
  todayCount:0,
  lastDate:'',
};

function loadState(){
  try{
    const s=localStorage.getItem(STORAGE_KEY);
    if(s){
      const saved=JSON.parse(s);
      Object.assign(state,saved);
      const today=new Date().toDateString();
      if(state.lastDate!==today){ state.todayCount=0; state.lastDate=today; }
    }
  }catch(e){}
  state.todayCount++;
  saveState();
  renderAll();
}

function saveState(){
  try{
    state.lastDate=new Date().toDateString();
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(e){}
}

function makePlantHTML(plot){
  const s=plot.stage;
  const color=PETAL_COLORS[plot.color%PETAL_COLORS.length];
  if(s==='empty') return `<div class="plant-area"><div class="plant-empty"></div></div>`;
  if(s==='seed')  return `<div class="plant-area"><div class="plant-seed"></div></div>`;
  if(s==='sprout') return `<div class="plant-area"><div class="plant-sprout"><div class="leaf-l"></div><div class="leaf-r"></div><div class="stem"></div></div></div>`;
  if(s==='bud')  return `<div class="plant-area"><div class="plant-bud"><div class="bud-leaf-l"></div><div class="bud-leaf-r"></div><div class="bud-stem"></div><div class="bud-head"></div></div></div>`;
  if(s==='bloom'){
    const angles=[0,45,90,135,180,225,270,315];
    const petals=angles.map(a=>{
      const rad=a*Math.PI/180, cx=19,cy=19,r=11;
      const px=cx+r*Math.sin(rad)-7, py=cy-r*Math.cos(rad)-10.5;
      return `<div class="petal" style="background:${color};left:${px}px;top:${py}px;transform:rotate(${a}deg);"></div>`;
    }).join('');
    return `<div class="plant-area"><div class="plant-bloom">
      <div class="bloom-leaf-l"></div><div class="bloom-leaf-r"></div><div class="bloom-stem"></div>
      <div class="petal-ring">${petals}<div class="center-dot"></div></div>
    </div></div>`;
  }
  return '';
}

function renderPlots(){
  const row=document.getElementById('plots-row');
  row.innerHTML='';
  state.plots.forEach((plot,i)=>{
    const div=document.createElement('div');
    div.className='plot'+(i===state.selected?' selected':'');
    div.innerHTML=makePlantHTML(plot)+`<div class="plot-label">화분 ${i+1}</div>`;
    div.onclick=()=>{ state.selected=i; renderAll(); };
    row.appendChild(div);
  });
}

function renderScores(){
  document.getElementById('harvest-count').textContent=state.harvestCount;
  document.getElementById('water-count').textContent=state.waterCount;
  document.getElementById('today-count').textContent=state.todayCount;
}

function renderStatus(){
  const p=state.plots[state.selected];
  const water=p.water>0?` · ${'💧'.repeat(Math.min(p.water,3))}`:'';
  document.getElementById('status-bar').textContent=`화분 ${state.selected+1} · ${STAGE_NAMES[p.stage]}${water}`;
}

function renderAll(){
  renderPlots(); renderScores(); renderStatus();
}

function spawnParticles(color,count,plotIdx){
  const app=document.getElementById('garden-app');
  const plotEls=document.querySelectorAll('.plot');
  const plotEl=plotEls[plotIdx];
  let baseX=200, baseY=300;
  if(plotEl){
    const r=plotEl.getBoundingClientRect();
    const ar=app.getBoundingClientRect();
    baseX=r.left-ar.left+r.width/2;
    baseY=r.top-ar.top+r.height/2;
  }
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='particle';
    const ox=(Math.random()-0.5)*60;
    el.style.cssText=`width:8px;height:8px;background:${color};left:${baseX+ox}px;top:${baseY}px;animation-delay:${Math.random()*0.3}s;`;
    app.appendChild(el);
    setTimeout(()=>el.remove(),1800);
  }
}

function waterFlash(plotIdx){
  const plotEls=document.querySelectorAll('.plot');
  const el=plotEls[plotIdx];
  if(!el) return;
  const ov=document.createElement('div');
  ov.className='water-flash';
  el.appendChild(ov);
  setTimeout(()=>ov.remove(),500);
}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.classList.remove('show'); renderStatus(); },2200);
}

function setMsg(msg){
  document.getElementById('status-bar').textContent=msg;
}

function plantSeed(){
  const p=state.plots[state.selected];
  if(p.stage!=='empty'){ showToast('이미 식물이 있어요! 수확 후 다시 심을 수 있어요.'); return; }
  p.stage='seed'; p.water=0; p.color=Math.floor(Math.random()*PETAL_COLORS.length);
  spawnParticles('#a1887f',6,state.selected);
  showToast('씨앗을 심었어요 🌰 물을 주세요!');
  saveState(); renderAll();
}

function waterPlant(){
  const p=state.plots[state.selected];
  if(p.stage==='empty'){ showToast('먼저 씨앗을 심어주세요 🌱'); return; }
  if(p.stage==='bloom'){ showToast('활짝 핀 꽃이에요! 수확해보세요 🌸'); return; }
  p.water++;
  state.waterCount++;
  spawnParticles('#64b5f6',10,state.selected);
  waterFlash(state.selected);
  const needed=2;
  if(p.water>=needed){
    const idx=STAGES.indexOf(p.stage);
    p.stage=STAGES[idx+1]; p.water=0;
    const msgs={sprout:'새싹이 돋았어요! 🌿',bud:'봉오리가 맺혔어요! 🌷',bloom:'활짝 피었어요! 수확해보세요 🌸'};
    showToast(msgs[p.stage]||'');
    if(p.stage==='bloom') setTimeout(()=>spawnParticles(PETAL_COLORS[p.color],18,state.selected),400);
  } else {
    showToast(`물을 줬어요 💧 (${p.water}/${needed})`);
  }
  saveState(); renderAll();
}

function harvestPlant(){
  const p=state.plots[state.selected];
  if(p.stage!=='bloom'){ showToast('꽃이 활짝 피어야 수확할 수 있어요!'); return; }
  spawnParticles(PETAL_COLORS[p.color],22,state.selected);
  state.harvestCount++;
  p.stage='empty'; p.water=0;
  showToast('수확했어요! 새 씨앗을 심어보세요 🌻');
  saveState(); renderAll();
}

loadState();
</script>
</body>
</html>
