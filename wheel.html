<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘의 행운 룰렛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-1:#2a1a3e; --night-2:#43275f;
    --gold:#ffd24a; --gold-deep:#f5a623;
    --cream:#fff6e6; --mint:#4ecdc4;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    font-family:'Fredoka','Jua',system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% -10%, var(--night-2) 0%, var(--night-1) 60%, #1b1029 100%);
    color:var(--cream);
    height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:14px 16px; user-select:none;
  }
  .app{ width:100%; max-width:400px; height:100%; display:flex; flex-direction:column; gap:10px; }

  .topbar{ flex:0 0 auto; text-align:center; position:relative; }
  .title{
    font-family:'Jua',sans-serif; font-size:clamp(22px,7vw,30px); line-height:1; margin:0;
    color:var(--gold); text-shadow:0 2px 0 #b9791a, 0 0 22px rgba(255,210,74,.35); letter-spacing:.5px;
  }
  .mute{ position:absolute; right:0; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%;
    border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); cursor:pointer; display:grid; place-items:center; }
  .mute svg{ width:18px; height:18px; }

  .coins{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.1));
    border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:8px 16px;
  }
  .coins .label{ font-size:13px; color:#cbb6e8; letter-spacing:1px; }
  .coins .amount{ font-size:24px; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; text-shadow:0 1px 0 #b9791a; min-width:64px; text-align:right; }
  .coins .coinicon{ width:22px; height:22px; }

  /* ----- wheel stage ----- */
  .stage{ flex:1 1 auto; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; }
  .wheel-box{ position:relative; height:100%; aspect-ratio:1; max-width:100%; display:grid; place-items:center; }
  #wheel{ width:100%; height:100%; display:block; }

  /* center hub */
  .hub{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:22%; height:22%; border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #fff3cf, var(--gold) 55%, var(--gold-deep));
    box-shadow:0 4px 10px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.2);
    display:grid; place-items:center; z-index:3; border:3px solid #fff;
  }
  .hub span{ font-family:'Jua',sans-serif; color:#7a4d12; font-size:clamp(11px,3.4vw,15px); letter-spacing:1px; }

  /* fixed pointer at top */
  .pointer{
    position:absolute; left:50%; top:-2%; transform:translateX(-50%); z-index:4;
    width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent;
    border-top:26px solid #fff; filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));
  }
  .pointer::after{ content:""; position:absolute; left:-9px; top:-30px; width:18px; height:18px; border-radius:50%; background:#fff; }

  .result{ flex:0 0 auto; text-align:center; min-height:30px; font-family:'Jua',sans-serif; font-size:19px; transition:opacity .2s; }
  .result.big{ color:var(--gold); font-size:23px; text-shadow:0 0 18px rgba(255,210,74,.5); }

  .spin{
    flex:0 0 auto; border:none; cursor:pointer; width:100%; padding:17px; border-radius:20px;
    font-family:'Jua',sans-serif; font-size:22px; color:#5a2a00; letter-spacing:2px;
    background:linear-gradient(180deg, #ffe27a, var(--gold) 45%, var(--gold-deep));
    box-shadow: 0 6px 0 #b9791a, 0 12px 24px rgba(245,166,35,.35);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .spin:active{ transform:translateY(5px); box-shadow:0 1px 0 #b9791a, 0 6px 14px rgba(245,166,35,.3); }
  .spin:disabled{ filter:saturate(.55) brightness(.93); cursor:default; }
  .spin .sub{ display:block; font-size:11px; font-family:'Fredoka',sans-serif; color:#7a4d12; margin-top:2px; letter-spacing:1px; }

  #confetti{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50; }
</style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <main class="app">
    <div class="topbar">
      <button class="mute" id="muteBtn" aria-label="소리"></button>
      <h1 class="title">오늘의 행운 룰렛</h1>
    </div>

    <div class="coins">
      <span class="label">내 코인</span>
      <span class="amount" id="coins">300</span>
      <svg class="coinicon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#ffd24a" stroke="#d99a18" stroke-width="5"/><circle cx="50" cy="50" r="32" fill="none" stroke="#e8b430" stroke-width="3"/><text x="50" y="66" font-size="44" font-family="Fredoka,Arial,sans-serif" font-weight="700" fill="#b9791a" text-anchor="middle">₩</text></svg>
    </div>

    <div class="stage">
      <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
        <div class="hub"><span>SPIN</span></div>
      </div>
    </div>

    <div class="result" id="result">돌림판을 돌려보세요</div>

    <button class="spin" id="spinBtn">
      돌리기
      <span class="sub">한 번 · 20코인</span>
    </button>
  </main>

<script>
(function(){
  // ---------- wheel segments (label, payout, color) ----------
  var SEG = [
    { label:'+10',   pay:10,  color:'#ff8fae' },
    { label:'+30',   pay:30,  color:'#7ec8ff' },
    { label:'꽝',     pay:0,   color:'#b0a7c0' },
    { label:'+50',   pay:50,  color:'#9be29b' },
    { label:'+20',   pay:20,  color:'#ffd98a' },
    { label:'+100',  pay:100, color:'#c79bff' },
    { label:'+30',   pay:30,  color:'#7be0d6' },
    { label:'꽝',     pay:0,   color:'#b0a7c0' },
    { label:'+50',   pay:50,  color:'#ffb37c' },
    { label:'JACKPOT',pay:300, color:'#ffd24a' },
    { label:'+20',   pay:20,  color:'#8fd0ff' },
    { label:'+40',   pay:40,  color:'#ff9fc0' }
  ];
  var N = SEG.length;
  var SLICE = (Math.PI*2)/N;
  var COST = 20;

  var canvas = document.getElementById('wheel');
  var ctx = canvas.getContext('2d');
  var coinsEl = document.getElementById('coins');
  var resultEl = document.getElementById('result');
  var spinBtn = document.getElementById('spinBtn');
  var muteBtn = document.getElementById('muteBtn');

  var coins=300, spinning=false, muted=false, angle=0; // current rotation (radians)
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  // ---------- draw wheel ----------
  function draw(){
    var W=canvas.width, R=W/2, cxp=R, cyp=R;
    ctx.clearRect(0,0,W,W);
    ctx.save(); ctx.translate(cxp,cyp); ctx.rotate(angle);
    for(var i=0;i<N;i++){
      var a0=i*SLICE, a1=a0+SLICE;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R-10,a0,a1); ctx.closePath();
      ctx.fillStyle=SEG[i].color; ctx.fill();
      ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.stroke();
      // label
      ctx.save(); ctx.rotate(a0+SLICE/2); ctx.translate(R*0.62,0);
      ctx.rotate(Math.PI/2);
      ctx.fillStyle='#3a2a1a'; ctx.textAlign='center'; ctx.textBaseline='middle';
      var jp = SEG[i].label==='JACKPOT';
      ctx.font = (jp?'700 ':'700 ') + (jp?34:42) + 'px Jua, Fredoka, sans-serif';
      ctx.fillText(SEG[i].label, 0, 0);
      ctx.restore();
    }
    // outer ring
    ctx.beginPath(); ctx.arc(0,0,R-6,0,Math.PI*2); ctx.lineWidth=12; ctx.strokeStyle='#ffd24a'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,R-6,0,Math.PI*2); ctx.lineWidth=3; ctx.strokeStyle='#b9791a'; ctx.stroke();
    ctx.restore();
  }

  // ---------- audio ----------
  var actx=null;
  function audio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function beep(freq,dur,type,vol){ if(muted) return; dur=dur||0.06; type=type||'square'; vol=vol||0.13;
    try{ var c=audio(),o=c.createOscillator(),g=c.createGain(); o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(vol,c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
      o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);}catch(e){} }
  function tickS(){ beep(900,0.03,'square',0.10); }
  function jingle(ns){ ns.forEach(function(f,i){ setTimeout(function(){ beep(f,0.14,'triangle',0.2); }, i*100); }); }
  function winS(){ jingle([523,659,784,1046]); }
  function jackpotS(){ jingle([523,659,784,1046,784,1046,1318]); }
  function dudS(){ beep(200,0.18,'sine',0.14); }

  // ---------- confetti ----------
  var cc=document.getElementById('confetti'), cx=cc.getContext('2d'); var parts=[];
  function rs(){ cc.width=innerWidth*devicePixelRatio; cc.height=innerHeight*devicePixelRatio; }
  rs(); addEventListener('resize',function(){ rs(); fit(); });
  var COLORS=['#ffd24a','#ff5470','#4ecdc4','#fff6e6','#a06bff'];
  function confetti(n){ if(reduceMotion) return; var fresh=parts.length===0;
    for(var i=0;i<n;i++) parts.push({x:Math.random()*cc.width,y:-20*devicePixelRatio,
      vx:(Math.random()-0.5)*6*devicePixelRatio,vy:(Math.random()*4+3)*devicePixelRatio,
      r:(Math.random()*6+4)*devicePixelRatio,color:pick(COLORS),rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.3,life:1});
    if(fresh) requestAnimationFrame(drawC); }
  function drawC(){ cx.clearRect(0,0,cc.width,cc.height);
    parts.forEach(function(p){ p.vy+=0.12*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr; if(p.y>cc.height*0.85)p.life-=0.03;
      cx.save();cx.globalAlpha=Math.max(0,p.life);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.color;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);cx.restore();});
    parts=parts.filter(function(p){return p.life>0&&p.y<cc.height+40;});
    if(parts.length) requestAnimationFrame(drawC); else cx.clearRect(0,0,cc.width,cc.height); }

  function setCoins(t){ var s=coins,d=t-s; if(d===0){coinsEl.textContent=t;coins=t;return;}
    var dur=550,t0=performance.now();
    (function fr(now){ var p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3); coinsEl.textContent=Math.round(s+d*e);
      if(p<1)requestAnimationFrame(fr); else{coinsEl.textContent=t;coins=t;} })(performance.now()); }

  function flash(txt,big){ resultEl.style.opacity=0;
    setTimeout(function(){ resultEl.textContent=txt; resultEl.classList.toggle('big',!!big); resultEl.style.opacity=1; },120); }

  // ---------- spin: pick result first, then land exactly on it ----------
  function spin(){
    if(spinning) return;
    if(coins<COST){ setCoins(80); flash('행운 충전! 코인을 채웠어요',false); return; }
    spinning=true; spinBtn.disabled=true;
    try{ if(audio().resume) audio().resume(); }catch(e){}
    setCoins(coins-COST);
    flash('두근두근...',false);

    // choose winning segment (slightly weighted: jackpot rarer)
    var idx;
    var r=Math.random();
    if(r<0.05){ idx = SEG.map(function(s,i){return s.pay>=300?i:-1;}).filter(function(i){return i>=0;})[0]; }
    else { idx = Math.floor(Math.random()*N); }

    // angle so that segment idx's center lands under the top pointer (-90deg)
    var segCenter = idx*SLICE + SLICE/2;
    var pointer = -Math.PI/2;                 // top
    var turns = 5 + Math.floor(Math.random()*2); // 5-6 full spins
    var base = angle % (Math.PI*2);
    // target absolute angle (mod 2pi) so segCenter aligns to pointer
    var targetMod = pointer - segCenter;
    // normalize and add full turns, ensuring forward motion
    var current = base;
    var delta = ((targetMod - current) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
    var total = turns*Math.PI*2 + delta;
    var from = angle, to = angle + total;

    var dur = reduceMotion ? 300 : 4200;
    var t0 = performance.now();
    var lastTick = -1;

    function frame(now){
      var p = Math.min(1,(now-t0)/dur);
      var e = 1 - Math.pow(1-p, 3);          // ease-out cubic (fast -> slow)
      angle = from + total*e;
      draw();
      // tick when crossing segment boundaries
      var seg = Math.floor(((-(angle)-Math.PI/2)/SLICE));
      if(seg!==lastTick){ lastTick=seg; tickS(); }
      if(p<1) requestAnimationFrame(frame);
      else finish(idx);
    }
    requestAnimationFrame(frame);
  }

  function finish(idx){
    angle = angle % (Math.PI*2);
    draw();
    var s = SEG[idx];
    if(s.pay>0) setCoins(coins + s.pay);
    if(s.pay>=300){ flash('🎉 JACKPOT! +'+s.pay+'코인!', true); confetti(220); jackpotS(); }
    else if(s.pay>0){ flash('+'+s.pay+'코인 당첨!', s.pay>=50); confetti(s.pay>=50?90:35); winS(); }
    else { flash('아쉽다! 한 번 더 돌려봐요', false); dudS(); }
    spinning=false; spinBtn.disabled=false;
    if(coins<COST) setTimeout(function(){ setCoins(80); flash('행운 충전! 코인을 채웠어요',false); },900);
  }

  // ---------- fit canvas resolution to its displayed size (crisp) ----------
  function fit(){
    var box = canvas.getBoundingClientRect();
    var size = Math.max(1, Math.round(Math.min(box.width, box.height) * devicePixelRatio));
    if(size && size!==canvas.width){ canvas.width=size; canvas.height=size; }
    draw();
  }

  // ---------- mute ----------
  var SPK_ON='<svg viewBox="0 0 100 100" fill="#fff6e6"><path d="M20 38 H38 L58 20 V80 L38 62 H20 Z"/><path d="M68 36 a20 20 0 0 1 0 28" fill="none" stroke="#fff6e6" stroke-width="6" stroke-linecap="round"/><path d="M76 28 a32 32 0 0 1 0 44" fill="none" stroke="#fff6e6" stroke-width="6" stroke-linecap="round"/></svg>';
  var SPK_OFF='<svg viewBox="0 0 100 100" fill="#fff6e6"><path d="M20 38 H38 L58 20 V80 L38 62 H20 Z"/><path d="M66 38 L86 62 M86 38 L66 62" stroke="#fff6e6" stroke-width="6" stroke-linecap="round"/></svg>';

  // ---------- init ----------
  muteBtn.innerHTML=SPK_ON;
  spinBtn.addEventListener('click', spin);
  document.querySelector('.hub').addEventListener('click', spin);
  muteBtn.addEventListener('click', function(){ muted=!muted; muteBtn.innerHTML=muted?SPK_OFF:SPK_ON; if(!muted) beep(523,0.08,'triangle',0.15); });

  fit();
  requestAnimationFrame(fit);
  setTimeout(fit,150);
  window.addEventListener('load', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit,200); });
})();
</script>
</body>
</html>
